/* ---------- τυχαία επιλογή με διασπορά σε κεφάλαια και ενότητες ----------

const PARTS = {

function buildExam(sel) {

  const sum = o => o.reduce((a, u) => a + u.p, 0);
  // Δ: σενάριο (Θέμα 4ο με κατάσταση στο πλοίο ή στο ραντάρ)· Γ: θέμα εφαρμογής (καθήκοντα, έλεγχοι, λίστες, αληθής διόπτευση

  const t4 = Object.values(DATA.themes).filter(th => th.t === 4 && th.items.every(id => whole(ITEM[id]))).map(th => mkUnit(th.items, sel));

  if (!gp.length) gp = t4;
  gp = gp.filter(u => !P['Δ'].includes(u));
  P['Γ'] = spread(gp, X, { n: 1, avoid: new Set(P['Δ'].flatMap(u => u.secs)) });

  const bp = DATA.items.filter(it => it.k === 'open' && itemOK(it, sel)).map(u1);
  P['Β'] = spread(bp, X, { n: 3, until: o => o.length >= 2 && sum(o) >= 20, w: u => u.p >= 5 ? 1 : .2 });

  const a1 = spread(DATA.items.filter(it => it.k === 'tf' && itemOK(it, sel)).map(u1), X, { n: 5 });

  const a2 = spread(DATA.items.filter(it => CLOSED2.includes(it.k) && itemOK(it, sel)).map(u1), X,

    w.append(el('button', { class: cls, disabled: reveal || mode === 'proj', onclick: () => { st.v = i; if (mode === 'practice') finish(it, st, i === it.a ? 1 : 0); else { st.score = i === it.a ? 1 : 0; st.ans = true; rerender(); } } }, el('b', {}, (i + 1) + '.'), el('span', { html: o })));
  });
  c.append(el('div', { class: 'sub', style: 'margin-top:.7rem' }, 'Διάλεξε τη λέξη που ταιριάζει στο κενό:'), w);

}
function kFillP(it, st, mode, reveal, body, c) {
  st.v = st.v || it.labs.map(() => null);
  if (st.cur == null) st.cur = 0;
  let k = 0;
  const html = it.q.replace(/⟨([^⟩]+)⟩/g, (m, l) => {
    const j = k++; const v = st.v[j];
    if (reveal) { const ok = v === it.a[j]; const show = mode === 'proj' ? it.a[j] : v; return `<span class="gap ${mode === 'proj' || ok ? 'ok' : 'bad'}">(${l}) ${show != null ? it.opts[show] : '…'}</span>` + (!ok && mode !== 'proj' ? ` <span class="gap ok">${it.opts[it.a[j]]}</span>` : ''); }
    return `<span class="gap${st.cur === j ? ' sel' : ''}" data-j="${j}">(${l}) ${v != null ? it.opts[v] : '&nbsp;'}</span>`;
  });
  const t = el('div', { html });
  t.querySelectorAll('.gap[data-j]').forEach(g => g.onclick = () => { st.cur = +g.dataset.j; rerender(); });
  body.append(t);
  const w = el('div', { class: 'words' });
  it.opts.forEach((o, i) => w.append(el('button', { class: 'word' + (st.v.includes(i) && !reveal ? ' used' : ''), disabled: reveal || mode === 'proj', onclick: () => { st.v[st.cur] = i; const nx = st.v.findIndex(x => x == null); st.cur = nx < 0 ? st.cur : nx; if (mode !== 'practice') { st.score = sc(); st.ans = st.v.every(x => x != null); } rerender(); } }, el('b', {}, (i + 1) + '.'), o)));
  const sc = () => st.v.filter((v, j) => v === it.a[j]).length / it.a.length;
  c.append(el('div', { class: 'sub', style: 'margin-top:.7rem' }, 'Πάτα ένα κενό και μετά τη λέξη που ταιριάζει:'), w);
  if (mode === 'practice' && !reveal) c.append(el('div', { style: 'margin-top:.8rem' }, el('button', { class: 'btn', disabled: st.v.some(x => x == null), onclick: () => finish(it, st, sc()) }, 'Έλεγχος')));
  if (reveal && mode !== 'proj') { const s = sc(); c.append(feedback(s === 1 ? 1 : s === 0 ? 0 : .5, `${st.v.filter((v, j) => v === it.a[j]).length} από ${it.a.length} σωστά.`)); }
}
function kMatch(it, st, mode, reveal, body, c) {
  if (it.img) body.append(figure(it.img));

  }

      else if (st.v[j] === i) cls += ' pick';
      L.append(el('button', { class: cls, disabled: reveal || mode === 'proj', title: o, onclick: () => { st.v[j] = i; if (mode !== 'practice') { st.score = sc(); st.ans = st.v.every(x => x != null); } rerender(); } }, isFig ? o : LET[i]));
    });

  if (mode === 'practice' && !reveal) c.append(el('div', {}, el('button', { class: 'btn', disabled: st.v.some(x => x == null), onclick: () => finish(it, st, sc()) }, 'Έλεγχος')));
  if (reveal && mode !== 'proj') { const s = sc(); c.append(feedback(s === 1 ? 1 : s === 0 ? 0 : .5, `${st.v.filter((v, j) => rows[j][0].a.includes(v)).length} από ${rows.length} σωστά.`)); }
}
function kOpen(it, st, mode, reveal, body, c) {
  if (it.img) body.append(figure(it.img));

  const solBox = () => { const s = el('div', { class: 'sol' }, el('div', { class: 'lab' }, 'Ενδεικτική απάντηση της τράπεζας'), el('div', { html: fixImgs(it.sol) })); s.querySelectorAll('img.fig').forEach(i => i.onclick = () => zoom(i.src)); return s; };

  c.append(el('div', { class: 'sub', style: 'margin-top:.8rem;font-weight:600' }, 'Πώς τα πήγες;'));
  const g = el('div', { class: 'self' });
  [[1, 'g1', '✓ Σωστά'], [.5, 'g5', '◐ Μισά'], [0, 'g0', '✗ Λάθος']].forEach(([v, cls, t]) => g.append(el('button', { class: cls + (st.score === v ? ' on' : ''), onclick: () => { if (mode === 'practice') finish(it, st, v); else { st.score = v; st.ans = true; rerender(); } } }, t)));
  c.append(g);

/* ---------- συνεδρία ---------- */
function stopTimer() { if (TIMER) clearInterval(TIMER); TIMER = null; $('#timer').hidden = true; }
function tick() {
  const t = $('#timer');
  if (!SES || !SES.end || SES.done) { stopTimer(); return; }
  const left = Math.max(0, SES.end - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  t.hidden = false; t.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`; t.classList.toggle('low', left < 120000);
  if (!left) { stopTimer(); submitExam(true); }
}
ROUTES.quiz = app => {
  if (!SES || SES.mode === 'proj') return go('home');
  if (SES.mode === 'exam' && SES.end && !SES.done && !TIMER) { TIMER = setInterval(tick, 1000); tick(); }
  const it = ITEM[SES.items[SES.i]];
  const st = SES.ans[it.id] || (SES.ans[it.id] = {});
  if (SES.mode === 'exam') {
    if (SES.grading) return gradeView(app);
    setBar(`${SES.title} · ${SES.i + 1}/${SES.items.length}`);
    const pal = el('div', { class: 'pal' }, SES.items.flatMap((id, j) => [
      SES.part && j && SES.part[id] !== SES.part[SES.items[j - 1]] ? el('span', { class: 'pgap' }) : null,
      el('button', { class: (SES.ans[id] && SES.ans[id].ans ? 'done' : '') + (j === SES.i ? ' cur' : ''), onclick: () => { SES.i = j; render(); } }, SES.lab ? SES.lab[id] : j + 1)]));
    app.append(pal); if (SES.parts) app.append(partBanner(it)); app.append(qcard(it, st, 'exam'));
    const last = SES.i === SES.items.length - 1;
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' },
      el('button', { class: 'btn sec', style: 'flex:none', disabled: SES.i === 0, onclick: () => { SES.i--; render(); } }, '←'),
      last ? el('button', { class: 'btn', onclick: () => submitExam(false) }, 'Παράδοση') : el('button', { class: 'btn', onclick: () => { SES.i++; render(); } }, 'Επόμενη'),
      !last ? el('button', { class: 'btn ghost', style: 'flex:none', onclick: () => submitExam(false) }, 'Παράδοση') : null)));
    return;
  }
  setBar(`${SES.title} · ${SES.i + 1}/${SES.items.length}`);
  app.append(el('div', { class: 'prog' }, el('div', { style: `width:${(SES.i + (st.done ? 1 : 0)) / SES.items.length * 100}%` })));
  app.append(qcard(it, st, 'practice'));
  if (st.done) {
    const last = SES.i === SES.items.length - 1;
    const next = () => { if (last) { SES.done = true; go('results'); } else { SES.i++; render(); } };
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' }, el('button', { class: 'btn', onclick: next }, last ? 'Αποτελέσματα' : 'Επόμενη →'))));
    document.onkeydown = e => { if (e.key === 'Enter') next(); };
    const fb = $('.fb', app); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    document.onkeydown = e => {
      const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 9)) return;
      const b = it.k === 'tf' ? $$('.tf .opt')[n - 1] : it.k === 'mc' ? $$('.opts .opt')[n - 1] : it.k === 'fill' ? $$('.words .word')[n - 1] : null;
      if (b) b.click();
    };
    app.append(el('div', { class: 'navq' }, el('div', { class: 'in' },
      el('button', { class: 'btn ghost', onclick: () => { st.skip = true; if (SES.i < SES.items.length - 1) { SES.i++; render(); } else { SES.done = true; go('results'); } } }, 'Παράλειψη'))));
  }
};
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function submitExam(timeUp) {

  const go2 = () => {
    stopTimer(); SES.done = true;
    const open = SES.items.filter(id => ['open', 'calc'].includes(ITEM[id].k));
    if (open.length) { SES.grading = { list: open, j: 0 }; SES.i = SES.items.indexOf(open[0]); render(); }

  if (timeUp) return dialog('Ο χρόνος τελείωσε', 'Το διαγώνισμα παραδόθηκε.', [['Συνέχεια', go2]]);
  dialog('Παράδοση διαγωνίσματος;', n ? `Έχεις ${n} ${n === 1 ? 'ερώτηση κλειστού τύπου χωρίς απάντηση' : 'ερωτήσεις χωρίς απάντηση'} (οι απαντήσεις στο χαρτί μετράνε ως αναπάντητες εδώ).` : 'Μετά την παράδοση δεν αλλάζουν οι απαντήσεις.', [['Συνέχεια', null, 'sec'], ['Παράδοση', go2]]);

function gradeView(app) {
  const g = SES.grading, id = g.list[g.j], it = ITEM[id];
  const st = SES.ans[id] || (SES.ans[id] = {});
  setBar(`Βαθμολόγηση ${g.j + 1}/${g.list.length}`);
  app.append(el('div', { class: 'card sub' }, 'Σύγκρινε αυτό που έγραψες στο χαρτί με την ενδεικτική απάντηση της τράπεζας και βαθμολόγησε τον εαυτό σου τίμια.'));

    el('button', { class: 'btn sec', disabled: g.j === 0, onclick: () => { g.j--; render(); } }, '←'),
    el('button', { class: 'btn', disabled: st.score == null, onclick: () => { if (last) finishExam(); else { g.j++; render(); } } }, last ? 'Αποτελέσματα' : 'Επόμενη →'))));
}
function finishExam() {
  SES.grading = null;
  for (const id of SES.items) { const st = SES.ans[id] || {}; record(id, st.score || 0); }
  go('results');
}

/* ---------- αποτελέσματα ---------- */
ROUTES.results = app => {
  if (!SES) return go('home');
  setBar('Αποτελέσματα');
  const ids = SES.items.filter(id => SES.mode === 'exam' || (SES.ans[id] && (SES.ans[id].done || SES.ans[id].skip)));
  const sc = id => (SES.ans[id] && SES.ans[id].score) || 0;
  const answered = ids.filter(id => SES.ans[id] && SES.ans[id].score != null);
  const W = id => SES.w ? SES.w[id] : ITEM[id].p;
  const pts = ids.reduce((a, id) => a + W(id) * sc(id), 0), tot = ids.reduce((a, id) => a + W(id), 0);
  const ok = ids.filter(id => sc(id) >= 1).length;
  const pc = tot ? pts / tot : 0;
  const R = 52, C = 2 * Math.PI * R;
  const ring = `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#e4e9ee" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${pc >= .5 ? '#2e8b57' : '#c0392b'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C * pc} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="68" text-anchor="middle" font-size="26" font-weight="800" fill="#0d2b45">${Math.round(pc * 100)}%</text></svg>`;

    const rows = SES.parts.map(P => el('tr', {}, el('td', {}, el('b', {}, 'Θέμα ' + P.key)), el('td', {}, P.name), el('td', {}, fmt(P.ids.reduce((a, id) => a + W(id) * sc(id), 0)) + ' / ' + P.total)));
    const chs = [...new Set(ids.flatMap(id => unitSecs(ITEM[id], SES.sel).map(s => SEC[s].ch)))].sort((a, b) => CH.findIndex(c => c.id === a) - CH.findIndex(c => c.id === b));
    const chName = c => c.startsWith('Β') ? 'Μέρος Β΄ Κεφ. ' + c.slice(1) : 'Κεφ. ' + c;
    box.append(el('div', { class: 'big' }, fmt(pts) + ' / ' + tot + ' μονάδες'), el('div', { class: 'sub' }, 'Βαθμός στα 20: ' + fmt(pts / tot * 20)),
      el('table', { class: 'parts' }, rows), el('div', { class: 'sub', style: 'margin-top:.7rem' }, 'Ερωτήσεις από: ' + chs.map(chName).join(', ')));
  } else {
    box.append(el('div', { class: 'big' }, ok + ' / ' + ids.length), el('div', { class: 'sub' }, `σωστές απαντήσεις · ${fmt(pts)} από ${tot} μονάδες`));
  }
  box.append(el('div', { class: 'who' }, AUTHOR));
  app.append(box);
  const wrong = ids.filter(id => sc(id) < 1);
  const row = el('div', { class: 'row', style: 'margin-bottom:.8rem' });
  if (wrong.length) row.append(el('button', { class: 'btn grow', onclick: () => { SES = { mode: 'practice', items: wrong, i: 0, ans: {}, sel: SES.sel, title: 'Ξανά τα λάθη' }; go('quiz'); } }, 'Ξανά τα λάθη (' + wrong.length + ')'));
  row.append(el('button', { class: 'btn sec grow', onclick: () => go('home') }, 'Αρχική'));
  app.append(row);
  const list = el('div', { class: 'card list' });
  ids.forEach((id, j) => {
    const s = SES.ans[id] || {}; const it = ITEM[id];
    const cls = s.score == null ? 'no' : s.score >= 1 ? 'ok' : s.score > 0 ? 'half' : 'bad';
    const txt = (it.q || '').replace(/<[^>]+>/g, ' ').replace(/⟨[^⟩]*⟩/g, '___').replace(/\s+/g, ' ').trim();
    list.append(el('div', { class: 'li', onclick: () => reviewOne(id) }, el('span', { class: 'd ' + cls }, cls === 'ok' ? '✓' : cls === 'bad' ? '✗' : cls === 'half' ? '½' : '–'), el('span', { class: 'x' }, el('b', {}, (SES.lab ? SES.lab[id] + ' · ' : '') + it.th + ' '), txt)));
  });
  app.append(el('h2', {}, 'Οι απαντήσεις σου'), el('div', { class: 'sub', style: 'margin-bottom:.4rem' }, 'Πάτα μια ερώτηση για να δεις τη σωστή απάντηση.'), list);
};
function reviewOne(id) {
  const m = $('#modal'); m.innerHTML = '';
  const st = Object.assign({}, SES.ans[id] || {});
  const d = el('div', { class: 'dlg', style: 'max-width:44rem;max-height:90vh;overflow:auto' }, qcard(ITEM[id], st, 'review'), el('div', { class: 'row' }, el('button', { class: 'btn', onclick: () => m.hidden = true }, 'Κλείσιμο')));
  m.append(d); m.hidden = false;
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.target.hidden = true; });

render();
