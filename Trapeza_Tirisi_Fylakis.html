<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2b45">
<title>Τράπεζα θεμάτων · Τήρηση Φυλακής Γέφυρας</title>
<style>
:root{
  --navy:#0d2b45; --navy2:#173e5f; --sea:#1b6f8a; --foam:#e8f1f5; --sand:#f5f2ea;
  --ink:#1d2733; --mute:#5d6b78; --line:#d9dee3; --card:#fff;
  --ok:#2e8b57; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbeaea; --half:#c98a00; --halfbg:#fdf3dc;
  --ab:#4e7a3f; --gold:#e3b23c;
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;min-height:3.1rem;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#bar .t{flex:1;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:transparent;border:0;color:#fff;min-width:2.4rem;height:2.4rem;border-radius:.5rem;cursor:pointer;font-size:1.05rem}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .tm{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:.15rem .55rem;border-radius:1rem;font-size:.9rem}
#bar .tm.low{background:var(--bad)}
main{max-width:46rem;margin:0 auto;padding:1rem .8rem 5rem}
h1{font-size:1.45rem;margin:.2rem 0 .1rem;line-height:1.25}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem}
.sub{color:var(--mute);font-size:.92rem}
.hero{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff;border-radius:1rem;padding:1.2rem 1.1rem 1rem;margin-bottom:1rem;position:relative;overflow:hidden}
.hero .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{color:#fff;font-size:1.6rem}
.hero .who{margin-top:.6rem;font-weight:700;color:#bfe3ff;font-size:.95rem}
.hero svg{position:absolute;right:-.6rem;bottom:-.8rem;opacity:.16;width:7.5rem;height:7.5rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.9rem .85rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;min-height:5.6rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:hover{border-color:var(--sea)}
.tile b{font-size:1.02rem}
.tile span{color:var(--mute);font-size:.83rem;line-height:1.35}
.tile i{font-style:normal;font-size:1.35rem}
.tile .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:1rem;padding:0 .5rem;font-size:.8rem;font-weight:700}
.foot{color:var(--mute);font-size:.82rem;text-align:center;margin-top:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin-bottom:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:.7rem;padding:.75rem 1.1rem;min-height:3rem;font-weight:600;cursor:pointer;background:var(--sea);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--foam);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--sea);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:#fff;border-radius:2rem;padding:.45rem .85rem;cursor:pointer;font-size:.92rem;min-height:2.5rem}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* επιλογή ενοτήτων */
.chap{border:1px solid var(--line);border-radius:.8rem;background:#fff;margin-bottom:.5rem;overflow:hidden}
.chap>.h{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;cursor:pointer}
.chap>.h .n{flex:1;font-weight:600}
.chap>.h .c{color:var(--mute);font-size:.85rem}
.chap .secs{border-top:1px solid var(--line);padding:.3rem .5rem .5rem}
.sec{display:flex;align-items:center;gap:.6rem;padding:.45rem .3rem;border-radius:.5rem;cursor:pointer}
.sec:hover{background:var(--foam)}
.sec .n{flex:1;font-size:.93rem}
.sec .n b{font-weight:600;margin-right:.35rem}
.sec .c{color:var(--mute);font-size:.82rem;white-space:nowrap}
.box{width:1.35rem;height:1.35rem;border:2px solid var(--sea);border-radius:.35rem;flex:none;display:grid;place-items:center;color:#fff;font-size:.85rem;line-height:1}
.box.on{background:var(--sea)}
.box.part{background:linear-gradient(var(--sea),var(--sea)) center/60% 3px no-repeat}
.arrow{transition:transform .15s;color:var(--mute)}
.open .arrow{transform:rotate(90deg)}
/* ερώτηση */
.qhead{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.6rem}
.tag{font-size:.78rem;border-radius:1rem;padding:.12rem .55rem;background:var(--foam);color:var(--navy);font-weight:600}
.tag.code{background:#eef0f2;color:var(--mute);font-weight:500}
.tag.pt{background:#fff6dd;color:#7a5600}
.prog{height:.35rem;background:#dfe5ea;border-radius:1rem;overflow:hidden;margin:.2rem 0 .8rem}
.prog>div{height:100%;background:var(--sea)}
.kind{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.3rem}
.ctx{color:var(--mute);font-size:.93rem;margin-bottom:.5rem}
.q{font-size:1.06rem}
.q p{margin:.35rem 0}
.q p.in{padding-left:1.1rem}
.q .pt,.sol .pt{color:var(--mute);font-size:.85em;white-space:nowrap}
.gap{display:inline-block;min-width:5.5rem;border-bottom:2px solid var(--sea);margin:0 .15rem;padding:0 .3rem;text-align:center;color:var(--sea);font-weight:600;cursor:pointer;line-height:1.3}
.gap.sel{background:var(--foam);border-radius:.3rem .3rem 0 0}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.fig{display:block;max-width:100%;height:auto;margin:.6rem auto;border-radius:.4rem;background:#fff;cursor:zoom-in}
img.eq{max-width:100%;height:auto;display:block;margin:.2rem 0}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.opt{display:flex;gap:.65rem;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:.75rem;padding:.7rem .8rem;cursor:pointer;min-height:3rem}
.opt:hover{border-color:var(--sea)}
.opt .l{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--foam);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.pick{border-color:var(--sea);background:#f2f8fb}
.opt.pick .l{background:var(--sea);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem}
.words{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.9rem}
.word{border:1.5px solid var(--line);background:#fff;border-radius:.6rem;padding:.45rem .7rem;cursor:pointer;min-height:2.6rem}
.word b{color:var(--sea);margin-right:.25rem}
.word.used{opacity:.45}
.word.ok{border-color:var(--ok);background:var(--okbg)}
.word.bad{border-color:var(--bad);background:var(--badbg)}
/* αντιστοίχιση */
.colb{background:#f7f9fa;border:1px solid var(--line);border-radius:.7rem;padding:.6rem .75rem;margin:.7rem 0;font-size:.93rem}
.colb div{padding:.18rem 0;display:flex;gap:.5rem}
.colb div b{flex:none;width:1.7rem;color:var(--sea)}
.mrow{border:1px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-bottom:.5rem;background:#fff}
.mrow .lt{font-weight:600;margin-bottom:.35rem}
.mrow .lt b{color:var(--sea);margin-right:.35rem}
.letters{display:flex;flex-wrap:wrap;gap:.35rem}
.letter{min-width:2.6rem;height:2.6rem;border:1.5px solid var(--line);background:#fff;border-radius:.55rem;cursor:pointer;font-weight:700;padding:0 .5rem}
.letter.pick{background:var(--sea);color:#fff;border-color:var(--sea)}
.letter.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.letter.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.letter.want{border:2px dashed var(--ok);color:var(--ok)}
.mrow.ok{border-color:var(--ok)}
.mrow.bad{border-color:var(--bad)}
/* απαντήσεις */
.fb{border-radius:.8rem;padding:.75rem .9rem;margin-top:.9rem;font-size:.97rem}
.fb.ok{background:var(--okbg);border:1px solid #b9dfc9}
.fb.bad{background:var(--badbg);border:1px solid #efc4c0}
.fb.half{background:var(--halfbg);border:1px solid #efd9a0}
.fb.info{background:#f2f6f9;border:1px solid var(--line)}
.fb .h{font-weight:700;margin-bottom:.15rem}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)} .fb.half .h{color:var(--half)}
.sol{background:#fbfcfd;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:.6rem;padding:.7rem .85rem;margin-top:.9rem}
.sol .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.25rem}
.sol p{margin:.25rem 0}
.sol p.in{padding-left:1.1rem}
.note{font-size:.88rem;color:#7a5600;background:#fff8e6;border-radius:.5rem;padding:.45rem .65rem;margin-top:.6rem}
.self{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-top:.8rem}
.self button{border:1.5px solid var(--line);background:#fff;border-radius:.7rem;padding:.6rem .3rem;cursor:pointer;font-weight:600;font-size:.9rem;min-height:3.2rem}
.self .g1{border-color:#9fd3b5;color:var(--ok)} .self .g5{border-color:#ecd18f;color:var(--half)} .self .g0{border-color:#eab2ac;color:var(--bad)}
.self button.on{color:#fff}
.self .g1.on{background:var(--ok)} .self .g5.on{background:var(--half)} .self .g0.on{background:var(--bad)}
.ask{color:var(--mute);font-size:.88rem;margin-top:.5rem}
.navq{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom));z-index:15}
.navq .in{max-width:46rem;margin:0 auto;display:flex;gap:.5rem}
.navq .btn{flex:1}
.ab{color:var(--ab);font-size:.82em;font-weight:400}
.pal{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0 .8rem}
.pal button{min-width:2.2rem;height:2.2rem;padding:0 .3rem;border-radius:.45rem;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.8rem}
.pal .pgap{width:.7rem}
.thm{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline;background:var(--navy);color:#fff;border-radius:.6rem;padding:.45rem .8rem;margin-bottom:.6rem;font-size:.9rem}
.thm b{letter-spacing:.06em}
.thm .pts{margin-left:auto;opacity:.85;font-size:.82rem}
.tag.lab{background:var(--navy);color:#fff}
.struct{margin:.2rem 0 0;padding-left:1.1rem}
.struct li{margin:.25rem 0}
table.parts{margin:.9rem auto 0;border-collapse:collapse;font-size:.92rem;text-align:left}
table.parts td{padding:.25rem .6rem;border-bottom:1px solid var(--line)}
table.parts td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.parts td:first-child{white-space:nowrap}
table.tb{border-collapse:collapse;margin:.6rem 0;font-size:.82em;max-width:100%;display:block;overflow-x:auto}
table.tb th,table.tb td{border:1px solid var(--line);padding:.25rem .35rem;text-align:center}
table.tb td:first-child{text-align:left;font-weight:600}
.sol table.tb{font-size:.72em}
.pal button.done{background:var(--foam);border-color:var(--sea)}
.pal button.cur{outline:2px solid var(--navy)}
.pal button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pal button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.pal button.half{background:var(--half);color:#fff;border-color:var(--half)}
/* αποτελέσματα */
.score{text-align:center;padding:1.2rem 1rem}
.score .big{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1.1}
.score .who{margin-top:.9rem;font-weight:700;color:var(--sea)}
.ring{width:8.5rem;height:8.5rem;margin:0 auto .6rem}
.list .li{display:flex;gap:.6rem;align-items:center;padding:.55rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li .d{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none;font-weight:700}
.d.ok{background:var(--ok)} .d.bad{background:var(--bad)} .d.half{background:var(--half)} .d.no{background:#b8c2cb}
.list .li .x{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:.55rem;border-radius:1rem;background:#e4e9ee;overflow:hidden;display:flex}
.bar .a{background:var(--ok)} .bar .b{background:var(--gold)}
.pr{padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .r{display:flex;justify-content:space-between;gap:.5rem;font-size:.92rem;margin-bottom:.25rem}
.pr .r span{color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:1rem;font-size:.82rem;color:var(--mute);margin:.3rem 0 .6rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem}
input[type=search]{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:.7rem;font:inherit;background:#fff}
.th{display:flex;gap:.6rem;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.th:last-child{border-bottom:0}
.th .cd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);min-width:3.6rem}
.th .ss{flex:1;display:flex;flex-wrap:wrap;gap:.25rem}
.th .ss .tag{font-weight:500;font-size:.74rem}
.th .pc{font-size:.8rem;color:var(--mute);white-space:nowrap}
/* παράθυρα */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
#modal[hidden]{display:none}
#modal .dlg{background:#fff;border-radius:1rem;max-width:26rem;width:100%;padding:1.1rem}
#modal .dlg h3{margin:.1rem 0 .4rem}
#modal .dlg .row{justify-content:flex-end;margin-top:1rem}
#zoom{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto}
#zoom[hidden]{display:none}
#zoom img{display:block;margin:auto;transform-origin:0 0}
#zoom .zb{position:fixed;right:.7rem;top:.7rem;display:flex;gap:.4rem;z-index:61}
#zoom .zb button{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;cursor:pointer}
/* προβολέας */
body.proj{background:#fff}
body.proj main{max-width:52rem;padding:1rem 2vw 5rem}
body.proj .card{border:0;padding:0}
body.proj .q{font-size:1.15rem}
body.proj.dark{background:#0b1621;color:#eef3f7}
body.proj.dark .card,body.proj.dark .opt,body.proj.dark .mrow,body.proj.dark .colb,body.proj.dark .sol,body.proj.dark .word,body.proj.dark .letter{background:#13222f;color:#eef3f7;border-color:#2b4255}
body.proj.dark .fig{background:#fff}
body.proj.dark .navq{background:#0b1621;border-color:#2b4255}
body.proj.dark .ctx,body.proj.dark .sub{color:#a9b9c6}
body.proj.dark .ab{color:#9fd08a}
body.proj.dark .tag{background:#1d3448;color:#cfe3f1}
.kbd{font-size:.8rem;color:var(--mute);text-align:center;margin-top:.6rem}
@media (max-width:420px){ .tiles{grid-template-columns:1fr 1fr} .tile{min-height:5.2rem;padding:.75rem .7rem} h1{font-size:1.3rem} }
@media print{ #bar,.navq{display:none} }
</style>
</head>

.","a":true},{"id":"26648-2.1δ","th":"26648","part":"2.1","lab":"δ","k":"tf","secs":["5β"],"p":3,"q":"Η ακρίβεια της διοπτεύσεως του ραντάρ εξαρτάται από το μέγεθος της κεραίας του.","a":true},{"id":"26648-2.1ε","th":"26648","part":"2.1","lab":"ε","k":"tf","secs":["3β"],"p":3,"q":"Τα καθήκοντα του οπτήρα και του πηδαλιούχου είναι διαφορετικά.","a":true},{"id":"26648-2.2","th":"26648","part":"2.2","k":"open","secs":["2α"],"p":10,"q":"Να ορίσετε πέντε (5) αντικειμενικούς στόχους των συστημάτων πορειογραφήσεως πλοίων.","sol":"1)Διαχωρισμός των αντίθετων ρευμάτων κυκλοφορίας<br>2)Μείωση των κίνδυνων συγκρούσεων των πλοίων<br>3)Απλοποίηση των διαφόρων κατευθύνσεων των κυκλοφοριακών ροών<br>4)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές εκτελέσεως έρευνας ή εκμεταλλεύσεως των υποθαλασσίων πηγών έρευνας<br>5)Οργάνωση ασφαλούς κυκλοφοριακής ροής όντος ή γύρω από τις περιοχές<br>6)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές που είναι ευαίσθητες περιβαλλοντολογικά ή γύρω σε ασφαλή απόσταση απ’ αυτές<br>7)Μείωση του κίνδυνου προσαράξεως<br>8)Καθοδήγηση της κυκλοφορίας μακριά από περιοχές αλιείας"},{"id":"26649-2.1α","th":"26649","part":"2.1","lab":"α","k":"tf","secs":["2β"],"p":3,"q":"Κατά τη χρησιμοποίηση των συστημάτων πορειογραφήσεως, ο ναυτιλλόμενος πρέπει να έχει κατά νου την απαίτηση ύπαρξης επαρκούς βάθους ώστε κάτω από τα έξαλλα των πλοίων το βάθος να είναι επαρκές.","a":false,"why":"Το επαρκές βάθος ζητείται κάτω από την <b>τρόπιδα</b> των πλοίων, όχι κάτω από τα έξαλα (2.6)."},{"id":"26649-2.1β","th":"26649","part":"2.1","lab":"β","k":"tf","secs":["4"],"p":3,"q":"Στη περίπτωση που παρίσταται ο πλοίαρχος και επ’ αυτής βρίσκεται πλοηγός, η ευθύνη για την ασφάλεια του πλοίου παραμένει στον πλοίαρχο.","a":true},{"id":"26649-2.1γ","th":"26649","part":"2.1","lab":"γ","k":"tf","secs":["5β"],"p":3,"q":"Το πλεονέκτημα του προσανατολισμού head-up είναι ότι η εικόνα του ραντάρ ταυτίζεται με την εικόνα την οποία βλέπει ο παρατηρητής έξω από τα παράθυρα της γέφυρας.","a":true},{"id":"26649-2.1δ","th":"26649","part":"2.1","lab":"δ","k":"tf","secs":["3α"],"p":3,"q":"Σε όλους τους αξιωματικούς του πλοίου, στους οποίους ανατίθενται καθήκοντα ΑΦ, απαιτείται να παρέχεται ελάχιστη περίοδος αναπαύσεως 10 ωρών σε κάθε 24 ώρες.","a":true},{"id":"26649-2.1ε","th":"26649","part":"2.1","lab":"ε","k":"tf","secs":["2β"],"p":3,"q":"Οι θαλάσσιοι διάδρομοι-οδοί βαθέων υδάτων προορίζονται κυρίως για τη χρήση από πλοία των οποίων η δυνατότητα πλου περιορίζεται από το ύψος τους.","a":false,"why":"Οι διάδρομοι βαθέων υδάτων προορίζονται κυρίως για πλοία που περιορίζονται από το <b>βύθισμά</b> τους, όχι από το ύψος τους (2.6)."},{"id":"26649-2.2","th":"26649","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να αναφέρετε τι περιλαμβάνονται στα καθήκοντα τηρήσεως φυλακής του ΑΦ.","sol":"Η διατήρηση κατάλληλης επιτηρήσεως της περιοχής πλου του πλοίου, η γενική επιτήρηση του πλοίου, η αποφυγή παραπλεόντων στόχων σύμφωνα με τους ΔΚΑΣ 72, η καταγραφή των δραστηριοτήτων της γέφυρας και ο περιοδικός έλεγχος της λειτουργικής καταστάσεως του ναυτιλιακού εξοπλισμού της γέφυρας."},{"id":"26650-2.1α","th":"26650","part":"2.1","lab":"α","k":"tf","secs":["5β"],"p":3,"q":"Η μεταβολή της διοπτεύσεως των στόχων με το ραντάρ γίνεται άμεσα αντιληπτή.","a":false,"why":"Λόγω του εύρους του λοβού του παλμού, η μεταβολή της διοπτεύσεως με το ραντάρ <b>δεν</b> γίνεται άμεσα αντιληπτή· άμεσα αντιληπτή γίνεται με τη διοπτήρα πυξίδα (5.3)."},{"id":"26650-2.1β","th":"26650","part":"2.1","lab":"β","k":"tf","secs":["3γ"],"p":3,"q":"Όταν το πλοίο βρίσκεται σε λιμάνι πρέπει να τηρούνται οι διεθνείς, εθνικοί και τοπικοί κανόνες.","a":true},{"id":"26650-2.1γ","th":"26650","part":"2.1","lab":"γ","k":"tf","secs":["2α"],"p":3,"q":"Το βέλος με συνεχή γραμμή ορίζει τη θεσπισμένη κατεύθυνση της κυκλοφοριακής ροής.","a":true},{"id":"26650-2.1δ","th":"26650","part":"2.1","lab":"δ","k":"tf","secs":["3γ"],"p":3,"q":"Η παρουσία πλοηγού επί του πλοίου απαλλάσσει τον πλοίαρχο ή τον ΑΦ από τα καθήκοντα και τις υποχρεώσεις τους για την ασφάλεια του πλοίου.","a":false,"why":"Η παρουσία πλοηγού <b>δεν</b> απαλλάσσει τον πλοίαρχο ή τον ΑΦ από τα καθήκοντα και τις υποχρεώσεις τους για την ασφάλεια του πλοίου (3.1.4)."},{"id":"26650-2.1ε","th":"26650","part":"2.1","lab":"ε","k":"tf","secs":["4"],"p":3,"q":"Σύμφωνα με τον κώδικα STCW, ο ΑΦ απαιτείται να έχει επαρκείς γνώσεις στο γραπτό και τον προφορικό λόγο της γαλλικής γλώσσας.","a":false,"why":"Ο Κώδικας STCW απαιτεί επαρκείς γνώσεις γραπτού και προφορικού λόγου της <b>αγγλικής</b> γλώσσας (4.1)."},{"id":"26650-2.2","th":"26650","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να καταγράψετε πέντε (5) βασικές αρχές-διαδικασίες για την αποτελεσματική λειτουργία της ομάδας γέφυρας.","sol":"1)Σύσταση ομάδας γέφυρας<br>2)Καθορισμός των καθηκόντων της ομάδας γέφυρας<br>3)Συντονισμός και επικοινωνία της ομάδας γέφυρας<br>4)Εξοικείωση των νέων μελών στην ομάδα γέφυρας<br>5)Σχέση του πλοιάρχου και της ομάδας γέφυρας<br>6)Χρήση αγγλικών<br>7)Ομάδα γέφυρας και πλοηγός<br>8)Πολιτική της εταιρείας για τη ναυσιπλοΐα και τις διαφορές λειτουργιές-διαδικασίες του πλοίου"},{"id":"26651-2.1","th":"26651","part":"2.1","k":"match","secs":["2α","2β"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε ένα από αυτούς.","rows":[{"t":"Περιοχή που πρέπει να αποφεύγεται","s":"2α","a":[3]},{"t":"Σύστημα διαχωρισμού θαλάσσιας κυκλοφορίας (ΣΔΘΚ)","s":"2α","a":[0]},{"t":"Διάδρομος κυκλοφορίας διπλής κατευθύνσεως","s":"2α","a":[1]},{"t":"Διαχωρισμός λωρίδων κυκλοφορίας ενός ΣΔΘΚ με φυσικά εμπόδια","s":"2β","a":[4]},{"t":"Θαλάσσιος διάδρομος-οδών βαθέων υδάτων","s":"2α","a":[2]}],"opts":["Α","Β","Γ","Δ","Ε"],"img":"26651_colB","filt":1},{"id":"26651-2.2","th":"26651","part":"2.2","k":"open","secs":["2α"],"p":10,"q":"Τι ονομάζεται σύστημα πορειογραφήσεως;","sol":"Κάθε σύστημα το οποίο καθορίζει σε μια θαλάσσια περιοχή, μία ή περισσότερες πορείες ως προς τον βυθό (COG) κυκλοφοριακής ροής ή μέτρα πορειογραφήσεως, με σκοπό τη μείωση των ναυτικών ατυχημάτων και απωλειών."},{"id":"26652-2.1α","th":"26652","part":"2.1","lab":"α","k":"tf","secs":["5β"],"p":3,"q":"Η λήψη διοπτεύσεως με την πυξίδα πλεονεκτεί σαφώς της διοπτεύσεως του ραντάρ.","a":true},{"id":"26652-2.1β","th":"26652","part":"2.1","lab":"β","k":"tf","secs":["4"],"p":3,"q":"Οι απαιτούμενοι χειρισμοί του πλοίου για την αποφυγή συγκρούσεως με τα παραπλέοντα πλοία πρέπει να είναι έγκαιροι, ασαφείς και διακριτοί.","a":false,"why":"Οι χειρισμοί για την αποφυγή συγκρούσεως πρέπει να είναι έγκαιροι, <b>ουσιώδεις</b> και διακριτοί, όχι ασαφείς (4.5)."},{"id":"26652-2.1γ","th":"26652","part":"2.1","lab":"γ","k":"tf","secs":["3β"],"p":3,"q":"Ο ΑΦ δεν θα παραδίδει τη φυλακή στον παραλαμβάνοντα αξιωματικό, αν έχει λόγο να πιστεύει ότι ο τελευταίος δεν είναι σε θέση να εκτελέσει αποτελεσματικά τα καθήκοντα του.","a":true},{"id":"26652-2.1δ","th":"26652","part":"2.1","lab":"δ","k":"tf","secs":["4"],"p":3,"q":"Ο ΑΦ οφείλει να δίνει ιδιαίτερη προσοχή στην εκτέλεση καθηκόντων των οπτηρών.","a":true},{"id":"26652-2.1ε","th":"26652","part":"2.1","lab":"ε","k":"tf","secs":["4"],"p":3,"q":"Όλες οι θέσεις του πλοίου που υποτυπώνονται στους ναυτιλιακούς χάρτες, θα πρέπει να διατηρούνται μέχρι 2 χρόνια στο αρχείο του πλοίου.","a":false,"why":"Οι θέσεις του πλοίου που υποτυπώνονται στους χάρτες διατηρούνται <b>μέχρι το τέλος του ταξιδιού</b>, όχι 2 χρόνια (4.6)."},{"id":"26652-2.2","th":"26652","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να αναφέρετε τις βασικές αρχές για να είναι αποτελεσματική η επικοινωνία (εξωτερική και εσωτερική) σύμφωνα με τους κανόνες καλής ναυτικής πρακτικής.","sol":"1) Να είναι σύντομη – συνοπτική<br>2) Απλή<br>3) Σαφής – ξεκάθαρη<br>4) Συγκεκριμένη – ακριβής"},{"id":"26653-2.1","th":"26653","part":"2.1","k":"match","secs":["2α"],"p":25,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε ένα από αυτούς.","rows":[{"t":"Ζώνη διαχωρισμού","s":"2α","a":[2]},{"t":"Όρια περιοχής όπου έχουν θεσπιστεί ειδικά περιοριστικά μέτρα","s":"2α","a":[3]},{"t":"Περιοχή προφυλάξεως","s":"2α","a":[1]},{"t":"Συνιστώμενο δρομολόγιο κυκλοφοριακής ροής: απλής & διπλής κατευθύνσεως","s":"2α","a":[4]},{"t":"Συνιστώμενη κατεύθυνση της κυκλοφοριακής ροής","s":"2α","a":[0]}],"opts":["α","β","γ","δ","ε"],"img":"26653_colB","filt":1},{"id":"26711-Θα","th":"26711","part":"","lab":"α","k":"mc","secs":["4"],"p":5,"q":"Τα κύρια καθήκοντα του ΑΦ, για να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας είναι:","opts":["η τήρηση φυλακής.","η ασφαλής ναυσιπλοΐα του πλοίου.","η τήρηση φυλακής επικοινωνιών στο GMDSS.","όλα τα παραπάνω."],"a":3},{"id":"26711-Θβ","th":"26711","part":"","lab":"β","k":"mc","secs":["3β"],"p":5,"q":"Υπεύθυνος για την εκτέλεση της φυλακής στη γέφυρα είναι:","opts":["ο αξιωματικός φυλακής.","ο υποπλοίαρχος.","ο ναύτης.","ο πλοίαρχος."],"a":0},{"id":"26711-Θγ","th":"26711","part":"","lab":"γ","k":"mc","secs":["5β"],"p":5,"q":"Η ακρίβεια της διοπτεύσεως του ραντάρ εξαρτάται από:","opts":["τη γυροπυξίδα.","το μέγεθος της κεραίας του.","το υλικό κατασκευής του πλοίου.","την κίνηση του πλοίου."],"a":1},{"id":"26711-Θδ","th":"26711","part":"","lab":"δ","k":"mc","secs":["2α"],"p":5,"q":"Ένα μέτρο πορειογραφήσεως, αποτελούμενο από μια περιοχή οριζόμενη από συγκεκριμένα όρια, εντός της οποίας η ναυτιλία είναι ιδιαίτερα επικίνδυνη ονομάζεται:","opts":["περιοχή που πρέπει να αποφεύγεται.","περιοχή αγκυροβολίας.","περιοχή προφυλάξεως.","θαλάσσιος διάδρομος."],"a":0},{"id":"26711-Θε","th":"26711","part":"","lab":"ε","k":"mc","secs":["5β"],"p":5,"q":"Η πιστή πραγματοποίηση της αληθούς κινήσεως με σταθεροποίηση ως προς το βυθό, αλλά και ως προς το νερό, εξαρτάται από την κίνηση της αρχής της σαρώσεως:","opts":["της κεραίας.","της οθόνης.","του πλοίου.","του χάρτη."],"a":1},{"id":"26714-2.1","th":"26714","part":"2.1","k":"match","secs":["5α","5β"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε έναν από αυτούς.","rows":[{"t":"RADAR","s":"5α","a":[2]},{"t":"PPI","s":"5α","a":[3]},{"t":"COG","s":"5β","a":[0]},{"t":"STW","s":"5β","a":[5]},{"t":"SOG","s":"5β","a":[1]}],"opts":["Πορεία ως προς το βυθό","Ταχύτητα ως προς τον βυθό","ραδιοεντοπισμός και διαστημομέτρηση","Ο τύπος της οθόνης ο όποιος δείχνει τη θέση των ορατών από το ραντάρ στόχων σε ένα οριζόντιο επίπεδο","διόπτευση","Ταχύτητα διαμέσου του νερού"],"filt":1},{"id":"26714-2.2","th":"26714","part":"2.2","k":"open","secs":["5α"],"p":10,"q":"Να ορίσετε ποια αντικείμενα εμφανίζει το ραντάρ στην οθόνη PPI.","sol":"Το ραντάρ στην οθόνη PPI εμφανίζει μόνο τα αντικείμενα στα οποία αντανακλά η εκπεμπόμενη ηλεκτρομαγνητική ακτινοβολία."},{"id":"26716-2.1","th":"26716","part":"2.1","k":"match","secs":["5β"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε έναν από αυτούς.","rows":[{"t":"TCPA","s":"5β","a":[5]},{"t":"EBL","s":"5β","a":[3]},{"t":"RML","s":"5β","a":[4]},{"t":"CPA","s":"5β","a":[0]},{"t":"VRM","s":"5β","a":[1]}],"opts":["Πλησιέστερη - ελάχιστη απόσταση προσεγγίσεως","Σημειωτής μεταβολής αποστάσεως","σταθεροποίηση ως προς τον βυθό","γραμμή ηλεκτρονικής διοπτεύσεως","γραμμή σχετικής κινήσεως","Χρόνος ελάχιστης αποστάσεως προσεγγίσεως"],"filt":1},{"id":"26716-2.2","th":"26716","part":"2.2","k":"open","secs":["5β"],"p":10,"q":"Να περιγράψετε τον προσανατολισμό της οθόνης του ραντάρ head-up μη σταθεροποιημένος καθώς και το πλεονέκτημα του προσανατολισμού αυτού.","sol":"Στον προσανατολισμό head-up η γραμμή της πλώρης παραμένει πάντοτε αγκιστρωμένη και ευθυγραμμισμένη στο 000° της εξωτερικής σταθερής βαθμολογικής κλίμακας διοπτεύσεως. Το πλεονέκτημα του προσανατολισμού αυτού είναι ότι η εικόνα του ραντάρ άμεσα ταυτίζεται με την εικόνα την οποία βλέπει ο παρατηρητής έξω από τα παράθυρα της γέφυρας."},{"id":"26717-2.1α","th":"26717","part":"2.1","lab":"α","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ μηχανής πρέπει να είναι κατάλληλα ⟨⟩, σύμφωνα με τους κανονισμού, ανάλογα με τα καθήκοντα που αφορούν στη φυλακή μηχανής.","opts":["πλοίαρχο","διαχωρισμού","περιορισμένης","τόπο","παρατηρητή","πιστοποιημένος"],"a":5},{"id":"26717-2.1β","th":"26717","part":"2.1","lab":"β","k":"fill","secs":["5β"],"p":3,"q":"Στην παρουσίαση της σχετικής κινήσεως, το κέντρο της οθόνης είναι σταθερό και είναι το πλοίο του ⟨⟩.","opts":["πλοίαρχο","διαχωρισμού","περιορισμένης","τόπο","παρατηρητή","πιστοποιημένος"],"a":4},{"id":"26717-2.1γ","th":"26717","part":"2.1","lab":"γ","k":"fill","secs":["5α"],"p":3,"q":"Αρχικώς η κύρια χρήση του ραντάρ ήταν για συνθήκες ⟨⟩ ορατότητας.","opts":["πλοίαρχο","διαχωρισμού","περιορισμένης","τόπο","παρατηρητή","πιστοποιημένος"],"a":2},{"id":"26717-2.1δ","th":"26717","part":"2.1","lab":"δ","k":"fill","secs":["4"],"p":3,"q":"Στην περίπτωση που στη γέφυρα παρίσταται ο πλοίαρχος και επ’ αυτής βρίσκεται πλοηγός, η ευθύνη για την ασφάλεια του πλοίου παραμένει στον ⟨⟩, ανεξάρτητα των καθηκόντων και υποχρεώσεων του πλοηγού.","opts":["πλοίαρχο","διαχωρισμού","περιορισμένης","τόπο","παρατηρητή","πιστοποιημένος"],"a":0},{"id":"26717-2.1ε","th":"26717","part":"2.1","lab":"ε","k":"fill","secs":["2α"],"p":3,"q":"Η ζώνη ή γραμμή, που διαχωρίζει τις λωρίδες κυκλοφορίας, στις οποίες τα πλοία πλέουν με αντίθετες ή σχεδόν αντίθετες πορείες ως προς το βυθό (COG) λέγεται ζώνη ή γραμμή ⟨⟩.","opts":["πλοίαρχο","διαχωρισμού","περιορισμένης","τόπο","παρατηρητή","πιστοποιημένος"],"a":1},{"id":"26717-2.2α","th":"26717","part":"2.2","lab":"α","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Ζώνη παράκτιας κυκλοφορίας (inshore traffic zone).","sol":"Ζώνη παράκτιας κυκλοφορίας (inshore traffic zone) ονομάζεται η θαλάσσια περιοχή, που ορίζεται από το όριο του ΣΔΘΚ, το ευρισκόμενο προς την ακτή και τις παρακείμενες ακτές."},{"id":"26717-2.2β","th":"26717","part":"2.2","lab":"β","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Σύστημα πορειογραφήσεως (routeing system).","sol":"Σύστημα πορειογραφήσεως (routeing system) ονομάζεται κάθε σύστημα, το οποίο καθορίζει σε μια θαλάσσια περιοχή, μία ή περισσότερες πορείες ως προς το βυθό(COG) κυκλοφοριακής ροής ή μέτρα πορειογραφήσεως, με σκοπό τη μείωση των ναυτικών ατυχημάτων και απωλειών."},{"id":"26718-2.1","th":"26718","part":"2.1","k":"open","secs":["5β"],"p":15,"q":"Να αναφέρετε από τι εξαρτάται η ακρίβεια της διοπτεύσεως του ραντάρ.","sol":"Η ακρίβεια της διοπτεύσεως του ραντάρ εξαρτάται από το μέγεθος της κεραίας του και σύμφωνα με τις απαιτούμενες προδιαγραφές που έχουν καθιερωθεί με την απόφαση 192 (79) της επιτροπής για τη θαλάσσια ασφάλεια του IMO πρέπει να κυμαίνεται ±1°. (Μονάδες 5)<br>Αυτή η ακρίβεια συναντάται όταν δεν υφίσταται κανένα σφάλμα στη γραμμή της πλώρης, από την οποία μετριέται και η διόπτευση, όπως επίσης και στην εισαγόμενη τιμή της αναπρωρήσεως από τη γυροπυξίδα. Όμως οι προδιαγραφές για τις εν λόγω τιμές σύμφωνα με τον IMO είναι ±1° για τη γραμμή της πλώρης και ±0,5° για την τιμή της αναπρωρήσεως από τη γυροπυξίδα. Έτσι το άθροισμα όλων αυτών των σφαλμάτων αυξάνει την προαναφερόμενη ακρίβεια μέχρι ±2,5°. (Μονάδες 10)"},{"id":"26718-2.2","th":"26718","part":"2.2","k":"open","secs":["5β"],"p":10,"q":"Να καταγράψετε ποια είναι τα χαρακτηριστικά της σχετικής κινήσεως (relative motion).","sol":"Στην παρουσίαση της σχετικής κινήσεως το κέντρο της οθόνης είναι σταθερό και είναι το πλοίο του παρατηρητή και η κίνηση των άλλων πλοίων δεικνύεται σχετικά με το πλοίο του παρατηρητή. Σε αρκετά συστήματα είναι δυνατή η μετακίνηση του κέντρου σε άλλη θέση και τότε η κίνηση των στόχων δεικνύεται ως προς το σταθερό σημείο αυτό, όπου βρίσκεται το πλοίο του παρατηρητή. Το απαραίτητο χαρακτηριστικό στην παρουσίαση αυτή είναι ότι η αρχή (το κέντρο της οθόνης ή κάποιο άλλο σημείο) πρέπει να είναι ένα σταθερό σημείο και ως αποτέλεσμα αυτού, η εμφανιζόμενη κίνηση των στόχων αποτελεί τη σχετική κίνηση αυτών, ως προς το πλοίο του παρατηρητή."},{"id":"26719-2.1α","th":"26719","part":"2.1","lab":"α","k":"fill","secs":["5β"],"p":3,"ctx":"Να συμπληρώσετε στα παρακάτω κενά των προτάσεων που ακολουθούν, τον σωστό προσανατολισμό head-up /north-up /course-up στην κόλλα σας δίπλα στο γράμμα που αντιστοιχεί σε κάθε πρόταση.","q":"Η παρούσα θέση ανά πάσα στιγμή της γραμμής της πλώρης αγκιστρώνεται και ευθυγραμμίζεται στην κορυφή του PPI, που δείχνει την ένδειξη 000° στην σταθερή βαθμολογημένη κλίμακα διοπτεύσεων. ⟨⟩","opts":["head-up","north-up","course-up"],"a":0},{"id":"26719-2.1β","th":"26719","part":"2.1","lab":"β","k":"fill","secs":["5β"],"p":3,"ctx":"Να συμπληρώσετε στα παρακάτω κενά των προτάσεων που ακολουθούν, τον σωστό προσανατολισμό head-up /north-up /course-up στην κόλλα σας δίπλα στο γράμμα που αντιστοιχεί σε κάθε πρόταση.","q":"H παρατιμονιά προκαλεί αντίστοιχη περιστροφή της γραμμής της πλώρης και όχι της εικόνας του ραντάρ και ο προσανατολισμός αυτός ονομάζεται σταθεροποιημένος. ⟨⟩","opts":["head-up","north-up","course-up"],"a":1},{"id":"26719-2.1γ","th":"26719","part":"2.1","lab":"γ","k":"fill","secs":["5β"],"p":3,"ctx":"Να συμπληρώσετε στα παρακάτω κενά των προτάσεων που ακολουθούν, τον σωστό προσανατολισμό head-up /north-up /course-up στην κόλλα σας δίπλα στο γράμμα που αντιστοιχεί σε κάθε πρόταση.","q":"Κάθε αλλαγή αναπρωρήσεως ή παρατιμονιά, προκαλεί και αντίστοιχη περιστροφή της γραμμής της πλώρης ενώ η ένδειξη της προηγούμενης αναπρωρήσεως, η οποία θεωρείται ως αναπρώρηση αναφοράς, παραμένει στην κορυφή της οθόνης και η εικόνα του ραντάρ παραμένει προσανατολισμένη στην αναπρώρηση αναφοράς. ⟨⟩","opts":["head-up","north-up","course-up"],"a":2},{"id":"26719-2.1δ","th":"26719","part":"2.1","lab":"δ","k":"fill","secs":["5β"],"p":3,"ctx":"Να συμπληρώσετε στα παρακάτω κενά των προτάσεων που ακολουθούν, τον σωστό προσανατολισμό head-up /north-up /course-up στην κόλλα σας δίπλα στο γράμμα που αντιστοιχεί σε κάθε πρόταση.","q":"Η γραμμή της πλώρης ευθυγραμμίζεται στην κορυφή της οθόνης του ΡΡΙ (δηλ. στο 000° της σταθερής κλίμακας) και δεικνύει την ένδειξη της αναπρωρήσεως του πλοίου του παρατηρητή στη βαθμολογημένη κλίμακα. ⟨⟩","opts":["head-up","north-up","course-up"],"a":2},{"id":"26719-2.1ε","th":"26719","part":"2.1","lab":"ε","k":"fill","secs":["5β"],"p":3,"ctx":"Να συμπληρώσετε στα παρακάτω κενά των προτάσεων που ακολουθούν, τον σωστό προσανατολισμό head-up /north-up /course-up στην κόλλα σας δίπλα στο γράμμα που αντιστοιχεί σε κάθε πρόταση.","q":"Η γραμμή πλώρης ευθυγραμμίζεται και αγκιστρώνεται στην ένδειξη της κλίμακας διοπτεύσεων που αντιστοιχεί στην αναπρώρηση του πλοίου. Ως εκ τούτου η ένδειξη 000° στη σταθερή κλίμακα διοπτεύσεων στην κορυφή της οθόνης, συμπίπτει με τη διεύθυνση του αληθούς βορρά. ⟨⟩","opts":["head-up","north-up","course-up"],"a":1},{"id":"26719-2.2","th":"26719","part":"2.2","k":"open","secs":["6"],"p":10,"q":"Να αναφέρετε την απαίτηση του κανονισμού (Κανόνας 5 των ΔΚΑΣ) για τη χρήση του RADAR σε συνθήκες καλής ορατότητας.","sol":"Ο κανονισμός απαιτεί τη χρήση του ραντάρ σε συνθήκες καλής ορατότητας προκειμένου να καθίσταται δυνατή η επιτήρηση και διευκρίνιση της τοπικής καταστάσεως όταν υπάρχει πυκνή θαλάσσια κυκλοφορία και ιδιαίτερα το βράδυ."},{"id":"26720-2.1","th":"26720","part":"2.1","k":"match","secs":["2α"],"p":25,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε ένα από αυτούς.","rows":[{"t":"Όρια περιοχής όπου έχουν θεσπισθεί ειδικά περιοριστικά μέτρα","s":"2α","a":[1]},{"t":"Συνιστώμενη κατεύθυνση της κυκλοφοριακής ροής.","s":"2α","a":[3]},{"t":"Ζώνη διαχωρισμού","s":"2α","a":[4]},{"t":"Γραμμή διαχωρισμού","s":"2α","a":[2]},{"t":"Θεσπισμένη κατεύθυνση της κυκλοφοριακής ροής.","s":"2α","a":[0]}],"opts":["α","β","γ","δ","ε","στ"],"img":"26720_colB","filt":1},{"id":"26721-2.1α","th":"26721","part":"2.1","lab":"α","k":"tf","secs":["2α"],"p":3,"q":"Η ανάγκη της εφαρμογής της αρχής πορειογραφήσεως των πλοίων είναι η δραματική αύξηση της πυκνότητας της θαλάσσιας κυκλοφορίας με την πάροδο του χρόνου σε ορισμένες περιοχές όπου παρατηρήθηκε αύξηση των συγκρούσεων και προσαράξεων.","a":true},{"id":"26721-2.1β","th":"26721","part":"2.1","lab":"β","k":"tf","secs":["3α"],"p":3,"q":"Η Διεθνής Συνθήκη SOLAS 74 Chapter V, Regulation 19 περιγράφει τις ελάχιστες απαιτήσεις για την εκπαίδευση, την πιστοποίηση και την εκτέλεση φυλακής των ναυτικών, όλων των κρατών-μελών που υιοθέτησαν και υπέγραψαν την εν λόγω συνθήκη.","a":false,"why":"Τις ελάχιστες απαιτήσεις για την εκπαίδευση, την πιστοποίηση και την τήρηση φυλακής των ναυτικών τις περιγράφει η Διεθνής Συνθήκη <b>STCW</b> (3.1). Ο Κανονισμός 19 του Κεφ. V της SOLAS 74 κάνει υποχρεωτική την εγκατάσταση του ραντάρ σε πλοία άνω των 300 κ.ο.χ. (5.1)."},{"id":"26721-2.1γ","th":"26721","part":"2.1","lab":"γ","k":"tf","secs":["4"],"p":3,"q":"Η ομάδα γεφύρας έχει καλή συνολική ενημέρωση για την επικρατούσα τοπική ναυτιλιακή κατάσταση και κάθε μέλος της είναι ικανό να αντιμετωπίζει οποιοδήποτε παρουσιαζόμενο κίνδυνο και να αντιλαμβάνεται την τυχόν ανάπτυξη της αλυσίδας λαθών.","a":true},{"id":"26721-2.1δ","th":"26721","part":"2.1","lab":"δ","k":"tf","secs":["5β"],"p":3,"q":"Το πλεονέκτημα του προσανατολισμού head-up είναι ότι η εικόνα του ραντάρ άμεσα ταυτίζεται με την εικόνα, την οποία που βλέπει ο παρατηρητής έξω από τα παράθυρα της γεφύρας.","a":true},{"id":"26721-2.1ε","th":"26721","part":"2.1","lab":"ε","k":"tf","secs":["5α"],"p":3,"q":"Το ραντάρ είναι μια ηλεκτρονική συσκευή που επιτρέπει να εντοπίζονται αντικείμενα, πολλές φορές όχι ορατά με γυμνό οφθαλμό, πέραν του οπτικού ορίζοντα και προσδιορίζεται με ακρίβεια η θέση τους.","a":true,"note":"Στην ενδεικτική απάντηση της τράπεζας είναι τυπωμένο «Λάθος». Το βιβλίο (5.1, σελ. 277) γράφει αυτούσια την πρόταση ως ορισμό του ραντάρ, άρα η σωστή απάντηση είναι «Σωστό»."},{"id":"26721-2.2","th":"26721","part":"2.2","k":"open","secs":["6"],"p":10,"q":"Να αναφέρεται τις βασικές αρχές για την εκτέλεση χειρισμού για την αποφυγή συγκρούσεως (Κανόνας 8 των ΔΚΑΣ).","sol":"Οι βασικές αρχές που καθορίζει ο κανόνας 8 για την εκτέλεση των απαιτούμενων χειρισμών προς αποφυγή συγκρούσεως είναι: η εκτέλεση χειρισμών για την αποφυγή συγκρούσεως με ένα άλλο πλοίο, αυτοί θα πρέπει να είναι ουσιώδεις- δραστικοί- σαφείς και διακριτοί σε όλες τις συνθήκες ορατότητας, έτσι ώστε οι προθέσεις του πλοίου που εκτελεί τους χειρισμούς να καθίστανται εύκολα φανερές στα άλλα παραπλέοντα πλοία."},{"id":"26722-Θα","th":"26722","part":"","lab":"α","k":"open","secs":["5β"],"p":10,"ctx":"Να αναφέρετε επιγραμματικά τους ακόλουθους ορισμούς που σχετίζονται με τα ναυτιλιακά ραντάρ:","q":"προσανατολισμός εικόνας (picture orientation).","sol":"Προσανατολισμός εικόνας (picture orientation) για τα ναυτιλιακά ραντάρ, συχνά συναντάται ο όρος προσανατολισμός εικόνας (picture orientation), που αφορά στον προσανατολισμό της εικόνας του ραντάρ χρησιμοποιώντας ως αναφορά (βάση), τη γραμμή της πλώρης του πλοίου (heads-up), τον αληθή βορρά (true-north-up) και την αναπρώρηση του πλοίου (course-up)."},{"id":"26722-Θβ","th":"26722","part":"","lab":"β","k":"open","secs":["5β"],"p":15,"ctx":"Να αναφέρετε επιγραμματικά τους ακόλουθους ορισμούς που σχετίζονται με τα ναυτιλιακά ραντάρ:","q":"παρουσίαση της εικόνας (picture presentation).","sol":"Ο όρος παρουσίαση της εικόνας (picture presentation) χρησιμοποιείται για την παρουσίαση της κινήσεως των στόχων και της ξηράς που εμφανίζονται στο PPI, έχοντας ως αναφορά το πλοίο του παρατηρητή (σχετική κίνηση – relative motion), το νερό (αληθής κίνηση – true motion sea stabilized) και το βυθό (αληθής κίνηση – true motion ground stabilization)."},{"id":"26812-2.1α","th":"26812","part":"2.1","lab":"α","k":"fill","secs":["4"],"p":3,"q":"Η ομάδα γεφύρας αποτελείται από τον Α/Φ, τον πηδαλιούχο και τον ⟨⟩.","opts":["αγγλικής","ναυτικής ασφάλειας","ναυσιπλοΐας","οπτήρα","STCW","ασφάλειας"],"a":3},{"id":"26812-2.1β","th":"26812","part":"2.1","lab":"β","k":"fill","secs":["4"],"p":3,"q":"Σύμφωνα με τον ISM και την STCW σε νεοεπιβιβαζόμενο προσωπικό θα πρέπει να πραγματοποιείται ειδική ενημέρωση για θέματα ⟨⟩.","opts":["αγγλικής","ναυτικής ασφάλειας","ναυσιπλοΐας","οπτήρα","STCW","ασφάλειας"],"a":1},{"id":"26812-2.1γ","th":"26812","part":"2.1","lab":"γ","k":"fill","secs":["4"],"p":3,"q":"Ο αξιωματικός φυλακής απαιτείται να έχει επαρκείς γνώσεις στον γραπτό και τον προφορικό λόγο της ⟨⟩ γλώσσας.","opts":["αγγλικής","ναυτικής ασφάλειας","ναυσιπλοΐας","οπτήρα","STCW","ασφάλειας"],"a":0},{"id":"26812-2.1δ","th":"26812","part":"2.1","lab":"δ","k":"fill","secs":["4"],"p":3,"q":"Η πολιτική για τη διαχείριση της ⟨⟩ που αναπτύσσει η πλοιοκτήτρια εταιρία θα πρέπει να γνωστοποιείται σε κάθε μέλος της.","opts":["αγγλικής","ναυτικής ασφάλειας","ναυσιπλοΐας","οπτήρα","STCW","ασφάλειας"],"a":5},{"id":"26812-2.1ε","th":"26812","part":"2.1","lab":"ε","k":"fill","secs":["4"],"p":3,"q":"Η παράδοση – παραλαβή γεφύρας θα πρέπει να πραγματοποιείται σύμφωνα με την ⟨⟩.","opts":["αγγλικής","ναυτικής ασφάλειας","ναυσιπλοΐας","οπτήρα","STCW","ασφάλειας"],"a":4},{"id":"26812-2.2α","th":"26812","part":"2.2","lab":"α","k":"open","secs":["4"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Τί περιλαμβάνει η εκπαίδευση κάθε νέου μέλους όσον αφορά στον εξοπλισμό της γέφυρας ενός πλοίου;","sol":"Η εκπαίδευση κάθε νέου μέλους όσον αφορά στον εξοπλισμό της γέφυρας ενός πλοίου περιλαμβάνει τα ναυτιλιακά βοηθήματα, που είναι εγκατεστημένα στην γέφυρα, όπως το σύστημα απεικονίσεως ηλεκτρονικού χάρτη και πληροφοριών, το σύστημα αυτόματης υποτυπώσεως στόχων, το ραντάρ και το ηχοβολιστικό."},{"id":"26812-2.2β","th":"26812","part":"2.2","lab":"β","k":"open","secs":["4"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Ποια είναι τα πλεονεκτήματα της διατηρήσεως της εκτελέσεως της ναυτιλίας που οφείλει να εξετάζει ο πλοίαρχος κατά την ανάληψη ελέγχου του πλοίου;","sol":"Τα πλεονεκτήματα της διατηρήσεως της εκτελέσεως της ναυτιλίας που οφείλει να εξετάζει ο πλοίαρχος κατά την ανάληψη ελέγχου του πλοίου είναι η υποτύπωση της θέσεως του πλοίου, ο έλεγχος για ναυτιλιακούς κινδύνους και ο έλεγχος τηρήσεως του προγραμματισθέντος δρομολογίου."},{"id":"26813-2.1","th":"26813","part":"2.1","k":"match","secs":["4"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε έναν από αυτούς.","rows":[{"t":"πλοηγός","s":"4","a":[1]},{"t":"ομάδα γέφυρας","s":"4","a":[5]},{"t":"μόνιμες οδηγίες πλοιάρχου","s":"4","a":[3]},{"t":"αξιωματικός φυλακής","s":"4","a":[4]},{"t":"πλοίαρχος","s":"4","a":[0]}],"opts":["λήψη αποφάσεων για ασφάλεια πλοίου και προστασία περιβάλλοντος","προσωρινό μέλος της γέφυρας","NAVTEX","βασίζονται στην πολιτική της εταιρίας και τον ISM","υπεύθυνος γέφυρας","ΑΦ, πηδαλιούχος, οπτήρας"],"filt":1},{"id":"26813-2.2","th":"26813","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να καταγράψετε ποια είναι τα κύρια καθήκοντα του ΑΦ, προκειμένου να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας.","sol":"Τα κύρια καθήκοντα του ΑΦ , προκειμένου να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας είναι η τήρηση φυλακής, η ασφαλής ναυσιπλοΐα του πλοίου και η τήρηση φυλακής επικοινωνιών στο GMDSS."},{"id":"26814-2.1α","th":"26814","part":"2.1","lab":"α","k":"tf","secs":["4"],"p":3,"q":"Ο πλοίαρχος περιορίζεται από τον πλοιοκτήτη ή τον ναυλωτή στη λήψη οποιασδήποτε απόφασης η οποία είναι απαραίτητη για την ασφάλεια της ναυσιπλοΐας.","a":false,"why":"Ο πλοίαρχος <b>δεν</b> πρέπει να περιορίζεται από τον πλοιοκτήτη ή τον ναυλωτή σε καμία απόφαση που είναι απαραίτητη για την ασφάλεια της ναυσιπλοΐας (4.1)."},{"id":"26814-2.1β","th":"26814","part":"2.1","lab":"β","k":"tf","secs":["4"],"p":3,"q":"Ο πλοίαρχος ενώ παρίσταται στη γέφυρα δύναται κατά τη βούλησή του να αναλάβει τον έλεγχο του πλοίου από τον αξιωματικό φυλακής.","a":true},{"id":"26814-2.1γ","th":"26814","part":"2.1","lab":"γ","k":"tf","secs":["4"],"p":3,"q":"Όταν επί του πλοίου επιβαίνει πλοηγός είναι απαραίτητη η χρήση αγγλικής γλώσσας.","a":true},{"id":"26814-2.1δ","th":"26814","part":"2.1","lab":"δ","k":"tf","secs":["4"],"p":3,"q":"Είναι σημαντικό να πραγματοποιείται επίσημη καταγραφή των σημαντικών ναυτιλιακών δραστηριοτήτων και ατυχημάτων που αφορούν στην ασφάλεια της ναυσιπλοΐας του πλοίου στο επίσημο ημερολόγιο.","a":true},{"id":"26814-2.1ε","th":"26814","part":"2.1","lab":"ε","k":"tf","secs":["4"],"p":3,"q":"Δεν απαιτείται να διατηρούνται μέχρι το τέλος του ταξιδιού όλες οι θέσεις του πλοίου που υπό τυπώνονται στους ναυτιλιακούς χάρτες.","a":false,"why":"Όλες οι θέσεις του πλοίου που υποτυπώνονται στους χάρτες <b>πρέπει</b> να διατηρούνται μέχρι το τέλος του ταξιδιού (4.6)."},{"id":"26814-2.2","th":"26814","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να καταγράψετε τι περιλαμβάνεται στα καθήκοντά τηρήσεως φυλακής του αξιωματικού φυλακής.","sol":"Στα καθήκοντα τηρήσεως φυλακής του αξιωματικού φυλακής περιλαμβάνονται η διατήρηση κατάλληλης επιτηρήσεως της περιοχής πλου του πλοίου, η γενική επιτήρηση του πλοίου, η αποφυγή παραπλεόντων στόχων σύμφωνα με τους ΔΚΑΣ 72, όπως και κάθε ναυτιλιακού κινδύνου- εμποδίου, η καταγραφή των δραστηριοτήτων της γέφυρας και ο περιοδικός έλεγχος της λειτουργικής καταστάσεως του ναυτιλιακού εξοπλισμού της γέφυρας."},{"id":"26816-2.1","th":"26816","part":"2.1","k":"match","secs":["4"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε έναν από αυτούς.","rows":[{"t":"Ο αξιωματικός φυλακής πρέπει συνεχώς να ελέγχει…","s":"4","a":[3]},{"t":"Οι απαιτούμενοι χειρισμοί του πλοίου για την αποφυγή συγκρούσεων…","s":"4","a":[0]},{"t":"Ο Αξιωματικός φυλακής οφείλει να είναι ενημερωμένος για…","s":"4","a":[4]},{"t":"Όλες οι θέσεις του πλοίου που υποτυπώνονται στους ναυτιλιακούς χάρτες…","s":"4","a":[1]},{"t":"Στην περίπτωση που στη γέφυρα βρίσκεται πλοηγός η ευθύνη για…","s":"4","a":[2]}],"opts":["θα πρέπει να είναι έγκαιροι, ουσιώδεις και διακριτοί.","θα πρέπει να διατηρούνται μέχρι το τέλος του ταξιδιού.","την ασφάλεια του πλοίου παραμένει στον αξιωματικό φυλακής.","την υφιστάμενη κυκλοφορία των παραπλεόντων πλοίων ώστε έγκαιρα να διαπιστώσει την ύπαρξη κινδύνου συγκρούσεως.","τις σοβαρές επιπτώσεις στο περιβάλλον στην περίπτωση ρύπανσης από τη λειτουργία του πλοίου ή τυχαία.","θα πρέπει αυτό να αναγράφει επίσημα στο ημερολόγιο"],"filt":1},{"id":"26816-2.2","th":"26816","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να αναφέρετε ποιες είναι οι βασικές αρχές που είναι αναγκαίο να ακολουθούνται προκειμένου να είναι αποτελεσματική η επικοινωνία, σύμφωνα με τους κανόνες της καλής ναυτικής πρακτικής.","sol":"Οι βασικές αρχές που είναι αναγκαίο να ακολουθούνται προκειμένου να είναι αποτελεσματική η επικοινωνία, σύμφωνα με τους κανόνες της καλής ναυτικής πρακτικής, είναι:<br>1. Να είναι σύντομη-συνοπτική<br>2. Απλή<br>3. Σαφής-ξεκάθαρη<br>4. Συγκεκριμένη-ακριβής."},{"id":"26817-2.1α","th":"26817","part":"2.1","lab":"α","k":"tf","secs":["4"],"p":3,"q":"Στα πλαίσια της τηρήσεως ασφαλούς φυλακής γέφυρας είναι απαραίτητο να εξασφαλίζεται η διατήρηση κατάλληλης επιτήρησης έως μόνο όταν απαιτείται λόγω συνθηκών.","a":false,"why":"Η κατάλληλη επιτήρηση εξασφαλίζεται <b>πάντοτε</b>, όχι μόνο όταν το απαιτούν οι συνθήκες (4.3)."},{"id":"26817-2.1β","th":"26817","part":"2.1","lab":"β","k":"tf","secs":["4"],"p":3,"q":"Ο αξιωματικός φυλακής πρέπει να ελέγχει συνεχώς την υφιστάμενη κυκλοφορία των παραπλεόντων πλοίων έτσι ώστε να διαπιστώνει έγκαιρα την ύπαρξη κινδύνου συγκρούσεως.","a":true},{"id":"26817-2.1γ","th":"26817","part":"2.1","lab":"γ","k":"tf","secs":["4"],"p":3,"q":"Οι αποφάσεις για την πραγματοποίηση αλλαγή αναπρωρήσεως είναι αναγκαίο να λαμβάνονται αρκετά έγκαιρα.","a":true},{"id":"26817-2.1δ","th":"26817","part":"2.1","lab":"δ","k":"tf","secs":["4"],"p":3,"q":"Τα ηχητικά σήματα σημαίνονται μόνο όταν τα πλοία βρίσκονται εν όψει αλλήλων και η σήμανσή τους είναι υποχρεωτική.","a":true},{"id":"26817-2.1ε","th":"26817","part":"2.1","lab":"ε","k":"tf","secs":["4"],"p":3,"q":"Ο αξιωματικός φυλακής δεν απαιτείται να είναι πάντα εξοικειωμένος με τα εγκεκριμένα σχέδια ανάγκης του πλοίου σε περίπτωση ρύπανσης από διαρροή πετρελαίου.","a":false,"why":"Ο ΑΦ <b>πρέπει</b> να είναι εξοικειωμένος με τα εγκεκριμένα σχέδια ανάγκης του πλοίου για ρύπανση από διαρροή πετρελαίου (SOPEP) (4.5)."},{"id":"26817-2.2","th":"26817","part":"2.2","k":"open","secs":["5α"],"p":10,"q":"Να προσδιορίσετε σύμφωνα με τη διεθνή συνθήκη SOLAS για ποια πλοία είναι υποχρεωτική η εγκατάσταση του ραντάρ.","sol":"Σύμφωνα με τη διεθνή συνθήκη SOLAS η εγκατάσταση του ραντάρ είναι υποχρεωτική για πλοία άνω των 300 κ.ο.χ.."},{"id":"28567-2.1","th":"28567","part":"2.1","k":"match","secs":["2α"],"p":15,"q":"Να γράψετε στην κόλλα σας τους αριθμούς της Στήλης Α και δίπλα σε κάθε αριθμό να γράψετε το γράμμα της Στήλης Β που ταιριάζει σε κάθε έναν από αυτούς.","rows":[{"t":"Θαλάσσιος διάδρομος διπλής κατευθύνσεως","s":"2α","a":[3]},{"t":"Συνιστώμενες πορείες","s":"2α","a":[0]},{"t":"Περιοχές που πρέπει να αποφεύγονται","s":"2α","a":[5]},{"t":"Κόμβοι διασταυρώσεως κυκλοστρεφούς κυκλοφορίας","s":"2α","a":[1]},{"t":"Αρχιπελαγικές θαλάσσιες λωρίδες","s":"2α","a":[2]}],"opts":["Recommended tracks","Roundabouts","Archipelagic sea lanes","two - way routes","Mandatory routes","Areas to be avoided"],"filt":1},{"id":"28567-2.2","th":"28567","part":"2.2","k":"open","secs":["2α"],"p":10,"q":"Τί είναι το Σύστημα Διαχωρισμού Θαλάσσιας Κυκλοφορίας (ΣΔΘΚ);","sol":"Το σύστημα πορειογραφήσεως, το οποίο διαχωρίζει τη θαλάσσια κυκλοφορία δύο αντίθετων ή σχεδόν αντίθετων κατευθύνσεων, καθιερώνοντας και χρησιμοποιώντας τις λωρίδες θαλάσσιας κυκλοφορίας, τις ζώνες- γραμμές διαχωρισμού και άλλα κατάλληλα μέτρα ονομάζεται σύστημα διαχωρισμού θαλάσσιας κυκλοφορίας (ΣΔΘΚ)."},{"id":"28568-2.1α","th":"28568","part":"2.1","lab":"α","k":"tf","secs":["2α"],"p":3,"q":"Οι αντικειμενικοί στόχοι κάθε συγκεκριμένου συστήματος πορειογραφήσεως πλοίων δεν εξαρτώνται από τις ιδιαίτερες επικίνδυνες περιστάσεις.","a":false,"why":"Οι αντικειμενικοί στόχοι κάθε συστήματος πορειογραφήσεως <b>εξαρτώνται</b> από τις ιδιαίτερες επικίνδυνες περιστάσεις που καλείται να εξομαλύνει (2.2)."},{"id":"28568-2.1β","th":"28568","part":"2.1","lab":"β","k":"tf","secs":["2α"],"p":3,"q":"Με την πορειογράφηση αποφεύγεται ή μειώνεται η μόλυνση του περιβάλλοντος ή η οποιαδήποτε άλλη βλάβη σε αυτό οφειλόμενη σε σύγκρουση ή προσάραξη πλοίων πλησίον ή εντός των περιβαλλοντικά ευαίσθητων περιοχών.","a":true},{"id":"28568-2.1γ","th":"28568","part":"2.1","lab":"γ","k":"tf","secs":["2β"],"p":3,"q":"Η χρήση του συστήματος πορειογράφησης που έχει υιοθετηθεί και θεσπιστεί από τον IMO είναι υποχρεωτική για όλα τα πλοία ή για πλοία συγκεκριμένων κατηγοριών ή για πλοία που μεταφέρουν συγκεκριμένου τύπου φορτία.","a":true},{"id":"28568-2.1δ","th":"28568","part":"2.1","lab":"δ","k":"tf","secs":["2β"],"p":3,"q":"Τα συστήματα πορειογραφήσεως προορίζονται να χρησιμοποιούνται ημέρα και νύχτα σε όλες τις καιρικές συνθήκες.","a":true},{"id":"28568-2.1ε","th":"28568","part":"2.1","lab":"ε","k":"tf","secs":["2β"],"p":3,"q":"Ένα πλοίο δεν οφείλει να συμμορφώνεται με τον Κανόνα 10 των Δ.Κ.Α.Σ.","a":false,"why":"Ένα πλοίο που ναυσιπλοεί εντός ή πλησίον ΣΔΘΚ του ΙΜΟ <b>οφείλει</b> να συμμορφώνεται με τον Κανόνα 10 των ΔΚΑΣ (2.6)."},{"id":"28568-2.2","th":"28568","part":"2.2","k":"open","secs":["2β"],"p":10,"q":"Στο Μέρος Δ΄ της εκδόσεως ενδεδειγμένων πορειών πλοίων (SHIP’S ROUTEING) αναφέρονται οι περιοχές που πρέπει να αποφεύγονται και έχουν υιοθετηθεί από τον Διεθνή Ναυτιλιακό Οργανισμό (ΙΜΟ) σε όλη την υδρόγειο. Να προσδιορίσετε το λόγο για τον οποίο καθιερώθηκαν οι περιοχές αυτές, τόσο για την ασφάλεια της ναυσιπλοΐας, όσο και για την προστασία του περιβάλλοντος.","sol":"Στο Μέρος Δ΄ της εκδόσεως ενδεδειγμένων πορειών πλοίων (SHIP’S ROUTEING) αναφέρονται οι περιοχές που πρέπει να αποφεύγονται και έχουν υιοθετηθεί από τον Διεθνή Ναυτιλιακό Οργανισμό (ΙΜΟ) σε όλη την υδρόγειο. Οι περιοχές αυτές καθιερώθηκαν για τους ακόλουθους λόγους:<br>1) Για την ασφάλεια της ναυσιπλοΐας, διότι δεν έχουν επαρκώς χαρτογραφηθεί ή οι υδρογραφικές πληροφορίες που περιλαμβάνουν δεν είναι πλήρεις ή έχουν ελλιπή και επισφαλή σήμανση. Επίσης, σε άλλες περιοχές ο διάπλους αυτών θεωρείται επικίνδυνος χωρίς τη βοήθεια πλοηγών.<br>2) Για την προστασία του περιβάλλοντος, διότι κάποιες από τις περιοχές είναι ιδιαίτερα ευαίσθητες περιβαλλοντολογικά, όπως αυτές που διαφυλάσσουν μοναδικές ζωικές υπάρξεις, οι οποίες εκτίθενται σε κίνδυνο όταν μολυνθεί η περιοχή μετά από ναυτικό ατύχημα."},{"id":"28570-2.1α","th":"28570","part":"2.1","lab":"α","k":"tf","secs":["3α"],"p":3,"q":"Σε όλους τους αξιωματικούς του πλοίου, στους οποίους ανατίθενται καθήκοντα ΑΦ απαιτείται να παρέχεται ελάχιστη περίοδος αναπαύσεως 70 ωρών σε κάθε χρονική περίοδο επτά ημερών.","a":false,"why":"Η ελάχιστη περίοδος αναπαύσεως είναι 10 ώρες σε κάθε 24 ώρες και <b>77 ώρες</b> σε κάθε περίοδο επτά ημερών. Οι 70 ώρες ισχύουν μόνο ως όριο όταν το κράτος-μέλος επιτρέπει εξαίρεση (3.1.2)."},{"id":"28570-2.1β","th":"28570","part":"2.1","lab":"β","k":"tf","secs":["3β"],"p":3,"q":"Πριν από κάθε ταξίδι ή ο πλοίαρχος οφείλει να εξασφαλίζει ότι το ταξίδι σχεδιάζεται χρησιμοποιώντας επαρκείς και κατάλληλους ναυτικούς χάρτες και οποιεσδήποτε άλλες ναυτιλιακές εκδόσεις οι οποίες περιλαμβάνουν ακριβείς πλήρεις και επικυρωμένες πληροφορίες.","a":true},{"id":"28570-2.1γ","th":"28570","part":"2.1","lab":"γ","k":"tf","secs":["3α"],"p":3,"q":"Κάθε μέλος του πληρώματος πρέπει να λαμβάνει αντίγραφο των αρχείων με τις ώρες εργασίας και αναπαύσεως που το αφορούν, υπογεγραμμένο από τον πλοίαρχο ή εξουσιοδοτημένο από αυτόν πρόσωπο και το ενδιαφερόμενο μέλος.","a":true},{"id":"28570-2.1δ","th":"28570","part":"2.1","lab":"δ","k":"tf","secs":["3α"],"p":3,"q":"Το χρονοδιάγραμμα τηρήσεως φυλακής δεν είναι απαραίτητο να συντάσσεται με την τυποποιημένη μορφή που καθορίζεται από τον Διεθνή Οργανισμό Εργασίας.","a":false,"why":"Το πρόγραμμα τηρήσεως φυλακών <b>πρέπει</b> να συντάσσεται με την τυποποιημένη μορφή του Διεθνούς Οργανισμού Εργασίας (ILO), στη γλώσσα εργασίας του πλοίου και στα αγγλικά (3.1.2)."},{"id":"28570-2.1ε","th":"28570","part":"2.1","lab":"ε","k":"tf","secs":["3α"],"p":3,"q":"Η εκτέλεση συναγερμών - συνάξεων πληρώματος και τα γυμνάσιο πυρόσβεσης και σωστικών μέσων θα πρέπει να διεξάγονται με τέτοιον τρόπο ώστε να ελαχιστοποιείται η διαταραχή των περιόδων αναπαύσεως και να μην προκαλούν κόπωση.","a":true},{"id":"28570-2.2","th":"28570","part":"2.2","k":"open","secs":["3β"],"p":10,"q":"Να αναφέρετε τις προϋποθέσεις υπό τις οποίες μπορούμε να θεωρήσουμε τον ΑΦ ως το μοναδικό οπτήρα κατά τη διάρκεια της ημέρας.","sol":"Ο ΑΦ δεν μπορεί να είναι μοναδικός οπτήρας κατά τη διάρκεια της ημέρας, υπό την προϋπόθεση ότι σε κάθε τέτοια περίπτωση:<br>- Έχει εκτιμηθεί προσεκτικά η κατάσταση και έχει κριθεί χωρίς καμία αμφιβολία ότι είναι ασφαλές να αναλάβει τα καθήκοντα του οπτήρα.<br>- Έχουν ληφθεί υπ’ όψιν όλοι οι σχετικοί παράγοντες, συμπεριλαμβανομένων και των ακολούθων, αλλά μην περιοριζόμενοι μόνο σε αυτούς:<br>• Η κατάσταση του καιρού<br>• Η ορατότητα<br>• Η πυκνότητα της κυκλοφορίας<br>• Η εγγύτητα των ναυτιλιακών κινδύνων<br>• Η απαίτηση επιδείξεως της αναγκαίας προσοχής, όταν το πλοίο πλέει εντός ή πλησίον σε ΣΔΘΚ.<br>- Υπάρχει άμεση διαθέσιμη βοήθεια που δύναται να κληθεί στη γέφυρα, όταν το απαιτήσει οποιαδήποτε αλλαγή της καταστάσεως.","note":"Η ενδεικτική απάντηση (όπως και το βιβλίο, 3.1.3) γράφει «δεν μπορεί». Με τις προϋποθέσεις που ακολουθούν, ο ΑΦ <b>μπορεί</b> να είναι ο μοναδικός οπτήρας την ημέρα: ο Κώδικας STCW (A-VIII/2) γράφει «may be the sole look-out in daylight»."},{"id":"28571-2.1α","th":"28571","part":"2.1","lab":"α","k":"fill","secs":["3β"],"p":3,"q":"Η γέφυρα ουδέποτε επιτρέπεται να μείνει χωρίς ⟨⟩.","opts":["κλίμακα","διόπτευση","επιτήρηση","όρασή του","πλοιάρχου","περιορισμένης ορατότητας"],"a":2},{"id":"28571-2.1β","th":"28571","part":"2.1","lab":"β","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ είναι υπεύθυνος για την ασφαλή ναυσιπλοΐα παρά την παρουσία του ⟨⟩ στη γέφυρα.","opts":["κλίμακα","διόπτευση","επιτήρηση","όρασή του","πλοιάρχου","περιορισμένης ορατότητας"],"a":4},{"id":"28571-2.1γ","th":"28571","part":"2.1","lab":"γ","k":"fill","secs":["3β"],"p":3,"q":"Οποτεδήποτε χρησιμοποιείται το ραντάρ ο αξιωματικός φυλακής οφείλει να επιλέγει την κατάλληλη ⟨⟩ και να παρατηρεί προσεκτικά την οθόνη του.","opts":["κλίμακα","διόπτευση","επιτήρηση","όρασή του","πλοιάρχου","περιορισμένης ορατότητας"],"a":0},{"id":"28571-2.1δ","th":"28571","part":"2.1","lab":"δ","k":"fill","secs":["3γ"],"p":3,"q":"Σε συνθήκες ⟨⟩ ο αξιωματικός φυλακής οφείλει να ανάβει τους φανούς ναυσιπλοΐας.","opts":["κλίμακα","διόπτευση","επιτήρηση","όρασή του","πλοιάρχου","περιορισμένης ορατότητας"],"a":5},{"id":"28571-2.1ε","th":"28571","part":"2.1","lab":"ε","k":"fill","secs":["3β"],"p":3,"q":"Ο παραλαμβάνων αξιωματικός δεν πρέπει να παραλαμβάνει καθήκοντα ΑΦ μέχρι να προσαρμοστεί η ⟨⟩ πλήρως στις νυχτερινές συνθήκες φωτισμού.","opts":["κλίμακα","διόπτευση","επιτήρηση","όρασή του","πλοιάρχου","περιορισμένης ορατότητας"],"a":3},{"id":"28571-2.2","th":"28571","part":"2.2","k":"open","secs":["5α"],"p":10,"q":"Τί είναι ο ενδείκτης πλάνου θέσεων (Plan Position Indicator-PPI) ενός ραντάρ;","sol":"Ο τύπος της οθόνης ο οποίος δεικνύει τη θέση των ορατών από το ραντάρ στόχων σε ένα οριζόντιο επίπεδο (σε ένα χάρτη - σε μία κάτοψη) (plan) ονομάζεται Plan Position Indicator."},{"id":"28572-2.1α","th":"28572","part":"2.1","lab":"α","k":"fill","secs":["4"],"p":3,"q":"Στην περίπτωση που στη γέφυρα παρίστανται ο πλοίαρχος και ο πλοηγός, η ευθύνη για την ασφάλεια του πλοίου παραμένει στον ⟨⟩.","opts":["διαχείριση","αναπρωρήσεως","πλαγιοδέτηση","πλοίαρχο","ημερολόγιο","ναυτιλιακών"],"a":3},{"id":"28572-2.1β","th":"28572","part":"2.1","lab":"β","k":"fill","secs":["4"],"p":3,"q":"Η πολιτική για τη ⟨⟩ της ασφάλειας της εταιρείας θα πρέπει να γνωστοποιείται σε κάθε μέλος των πλοίων.","opts":["διαχείριση","αναπρωρήσεως","πλαγιοδέτηση","πλοίαρχο","ημερολόγιο","ναυτιλιακών"],"a":0},{"id":"28572-2.1γ","th":"28572","part":"2.1","lab":"γ","k":"fill","secs":["5α"],"p":3,"q":"Το ραντάρ είναι απαραίτητο για τον εντοπισμό των ⟨⟩ κινδύνων και ως εκ τούτου για την ασφαλή ναυσιπλοΐα του πλοίου.","opts":["διαχείριση","αναπρωρήσεως","πλαγιοδέτηση","πλοίαρχο","ημερολόγιο","ναυτιλιακών"],"a":5},{"id":"28572-2.1δ","th":"28572","part":"2.1","lab":"δ","k":"fill","secs":["4"],"p":3,"q":"Οι αποφάσεις για την πραγματοποίηση αλλαγής ⟨⟩ είναι αναγκαίο να λαμβάνονται αρκετά έγκαιρα.","opts":["διαχείριση","αναπρωρήσεως","πλαγιοδέτηση","πλοίαρχο","ημερολόγιο","ναυτιλιακών"],"a":1},{"id":"28572-2.1ε","th":"28572","part":"2.1","lab":"ε","k":"fill","secs":["4"],"p":3,"q":"Καθόλη τη διάρκεια του ταξιδιού θα πρέπει να έχουν καταγραφεί απαραίτητες πληροφορίες για τη θέση, την πορεία ως προς το βυθό και την ταχύτητα του στο ⟨⟩ γέφυρας.","opts":["διαχείριση","αναπρωρήσεως","πλαγιοδέτηση","πλοίαρχο","ημερολόγιο","ναυτιλιακών"],"a":4},{"id":"28572-2.2α","th":"28572","part":"2.2","lab":"α","k":"open","secs":["5β"],"p":5,"ctx":"Σύμφωνα με τις απαιτούμενες προδιαγραφές που έχουν καθιερωθεί με την απόφαση 192(79) της Επιτροπής για τη Θαλάσσια Ασφάλεια του Διεθνή Ναυτιλιακού Οργανισμού [ΙΜΟ Resolution MSC 192(19)]:","q":"Από τι εξαρτάται η ακρίβεια της διοπτεύσεως του ραντάρ; (απαιτείται τιμή)","sol":"Η ακρίβεια της διοπτεύσεως του ραντάρ εξαρτάται από το μέγεθος της κεραίας του και πρέπει να κυμαίνεται ±1°."},{"id":"28572-2.2β","th":"28572","part":"2.2","lab":"β","k":"open","secs":["5β"],"p":5,"ctx":"Σύμφωνα με τις απαιτούμενες προδιαγραφές που έχουν καθιερωθεί με την απόφαση 192(79) της Επιτροπής για τη Θαλάσσια Ασφάλεια του Διεθνή Ναυτιλιακού Οργανισμού [ΙΜΟ Resolution MSC 192(19)]:","q":"Ποιες είναι οι αιτίες των σφαλμάτων που αυξάνουν την προαναφερόμενη ακρίβεια; (απαιτούνται τιμές)","sol":"Σφάλμα στη γραμμή της πλώρης που είναι ±1° και σφάλμα στην εισαγώμενη τιμή της αναπρωρήσεως από τη γυροπυξίδα που είναι ±0,5°. Το άθροισμα των σφαλμάτων αυξάνει την προαναφερόμενη ακρίβεια μέχρι ±2,5°."},{"id":"28623-2.1α","th":"28623","part":"2.1","lab":"α","k":"tf","secs":["6"],"p":3,"q":"Οι μικρές διαδοχικές αλλαγές θεωρούνται αρκετές για τη διέλευση των πλοίων σε ασφαλή απόσταση.","a":false,"why":"Ο Κανόνας 8(β) λέει ότι οι μικρές διαδοχικές αλλαγές της αναπρωρήσεως ή της ταχύτητας <b>πρέπει να αποφεύγονται</b>. Στο βιβλίο η φράση της πρότασης είναι μία από τις αιτίες συγκρούσεων: οι αξιωματικοί θεώρησαν λανθασμένα ότι αρκούν (6.4.1).","note":"Στην ενδεικτική απάντηση της τράπεζας είναι τυπωμένο «Σωστό», επειδή η φράση υπάρχει στο βιβλίο (σελ. 357). Εκεί όμως περιγράφει ένα από τα λάθη που οδήγησαν σε συγκρούσεις. Ο κανόνας (8β) είναι ότι οι μικρές διαδοχικές αλλαγές αποφεύγονται, όπως δέχεται και η ίδια η τράπεζα στα θέματα 28624, 33619 και 33688· γι’ αυτό εδώ η απάντηση είναι «Λάθος»."},{"id":"28623-2.1β","th":"28623","part":"2.1","lab":"β","k":"tf","secs":["5β"],"p":3,"q":"Στην παρουσίαση και στην υποτύπωση δημιουργούνται μεγάλα σφάλματα, όταν το πλοίο και οι στόχοι κινούνται με υψηλή ταχύτητα.","a":false,"why":"Μεγάλα σφάλματα στην παρουσίαση και στην υποτύπωση δημιουργούνται όταν το πλοίο και οι στόχοι κινούνται με <b>χαμηλή</b> ταχύτητα, όπως σε περιορισμένη ορατότητα (5.7.5)."},{"id":"28623-2.1γ","th":"28623","part":"2.1","lab":"γ","k":"tf","secs":["5β"],"p":3,"q":"Η ηχώ του πλοίου και των κινούμενων στόχων διαγράφει ίχνος επί της οθόνης.","a":true,"note":"Οι προτάσεις γ, δ και ε του θέματος αφορούν την αληθή κίνηση (5.7)."},{"id":"28623-2.1δ","th":"28623","part":"2.1","lab":"δ","k":"tf","secs":["5β"],"p":3,"q":"Η ηχώ ακίνητων στόχων στο νερό παραμένει σε συνεχής κίνηση στην οθόνη.","a":false,"why":"Στην αληθή κίνηση με σταθεροποίηση ως προς το νερό, η ηχώ των ακίνητων στόχων στο νερό <b>παραμένει ακίνητη</b> στην οθόνη (5.7.1)."},{"id":"28623-2.1ε","th":"28623","part":"2.1","lab":"ε","k":"tf","secs":["5β"],"p":3,"q":"Η κίνηση της ηχούς όλων των στόχων είναι εξαρτωμένη από την κίνηση του πλοίου του παρατηρητή.","a":false,"why":"Στην αληθή κίνηση, με ορθά ρυθμισμένη οθόνη, η κίνηση της ηχούς όλων των στόχων είναι <b>ανεξάρτητη</b> από την κίνηση του πλοίου του παρατηρητή· εξαρτάται από αυτήν μόνο στη σχετική κίνηση (5.7)."},{"id":"28623-2.2","th":"28623","part":"2.2","k":"open","secs":["6"],"p":10,"q":"Να αναπτύξετε τους παράγοντες που πρέπει να ληφθούν υπόψη για να χαρακτηριστεί μια προσέγγιση επικίνδυνη.","sol":"1) Σχετική θέση του στόχου, ως προς το πλοίο<br>2) Γεωγραφική θέση του πλοίου<br>3) Ελκτικά στοιχειά του πλοίου<br>4) Πυκνότητα της θαλασσιάς κυκλοφορίας"},{"id":"28624-Θα","th":"28624","part":"","lab":"α","k":"mc","secs":["6"],"p":5,"q":"Οι μικρές διαδοχικές αλλαγές της αναπρωρήσεως ή και της ταχύτητας είναι αναγκαίο να αποφεύγονται, διότι:","opts":["η εκτίμηση και χρήση των πληροφοριών εμφανίζονται στην οθόνη του ραντάρ.","εξαιτίας αυτού του τρόπου χειρισμού προκαλείται η πλειονότητα των συγκρούσεων πλοίων.","είναι αναγκαίο να μειώνεται η απόσταση διελεύσεως μεταξύ των δυο πλοίων.","κανένα από τα παραπάνω."],"a":1},{"id":"28624-Θβ","th":"28624","part":"","lab":"β","k":"mc","secs":["6"],"p":5,"q":"Κατά την ανάληψη της αρχικής αναπρωρήσεως ή και ταχύτητας δια μέσου του νερού του πλοίου μας απαιτείται να:","opts":["εκτελείται ένα χειρισμός και όχι μικροί διαδοχικοί.","εκτελούνται δυο χειρισμοί.","εκτελούνται πολλαπλοί χειρισμοί.","κανένα από τα παραπάνω."],"a":0},{"id":"28624-Θγ","th":"28624","part":"","lab":"γ","k":"mc","secs":["6"],"p":5,"q":"Η χρησιμοποίηση του ραντάρ πραγματοποιείται σε:","opts":["περίπτωση μόνο κίνδυνου.","περίπτωση μόνο ειδικής ανάγκης.","περίπτωση σφάλματος πυξίδας.","συνθήκες περιορισμένης αλλά και καλής ορατότητας."],"a":3},{"id":"28624-Θδ","th":"28624","part":"","lab":"δ","k":"mc","secs":["6"],"p":5,"q":"Όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου θα πρέπει να είναι:","opts":["ουσιώδες.","δραστικοί, σαφείς.","διακριτοί σε όλες τις συνθήκες ορατότητας.","όλα τα παραπάνω."],"a":3},{"id":"28624-Θε","th":"28624","part":"","lab":"ε","k":"mc","secs":["6"],"p":5,"q":"Είναι σημαντικό ο ΑΦ να έχει κατά νου ότι η αποτελεσματικότητα του χειρισμού του πλοίου ενδέχεται να επηρεαστεί από:","opts":["τον καιρό.","τη θάλασσα.","των μεταβολή των αληθών διανυσμάτων των στόχων.","τη μαγνητική πυξίδα."],"a":2},{"id":"28625-2.1α","th":"28625","part":"2.1","lab":"α","k":"tf","secs":["3β"],"p":3,"q":"Ο ΑΦ δεν θα παραδίδει τη φυλακή στον παραλαμβάνοντα αξιωματικό, αν έχει λόγο να πιστεύει ότι ο τελευταίος δεν είναι σε θέση να εκτελέσει αποτελεσματικά τα καθήκοντα του.","a":true},{"id":"28625-2.1β","th":"28625","part":"2.1","lab":"β","k":"tf","secs":["4"],"p":3,"q":"Κάθε μέλος της ομάδας γέφυρας είναι ικανό να αντιμετωπίζει οποιοδήποτε παρουσιαζόμενο κίνδυνο και να αντιλαμβάνεται την ανάπτυξη της αλυσίδας λαθών.","a":true},{"id":"28625-2.1γ","th":"28625","part":"2.1","lab":"γ","k":"tf","secs":["5α"],"p":3,"q":"Το ραντάρ είναι απαραίτητο για τον εντοπισμό των προσεγγιζόντων πλοίων από την ομάδα γέφυρας και την εκτέλεση της λειτουργιάς της αποφυγής συγκρούσεως.","a":true},{"id":"28625-2.1δ","th":"28625","part":"2.1","lab":"δ","k":"tf","secs":["5α"],"p":3,"q":"Το ραντάρ υποκαθιστά την οπτική επιτήρηση.","a":false,"why":"Το ραντάρ <b>δεν υποκαθιστά</b> την οπτική επιτήρηση, που παραμένει η κύρια μέθοδος επιτηρήσεως· τη συμπληρώνει και την υποβοηθά (5.1)."},{"id":"28625-2.1ε","th":"28625","part":"2.1","lab":"ε","k":"tf","secs":["5β"],"p":3,"q":"Η ταύτιση που έχει ο προσανατολισμός της εικόνας ραντάρ head-up με τον ναυτιλιακό χάρτη είναι τέλεια.","a":false,"why":"Στον προσανατολισμό head-up η ταύτιση με τον ναυτιλιακό χάρτη <b>δεν είναι προφανής</b>. Τέλεια ταύτιση με τον χάρτη δίνει ο true-north-up· ο head-up ταυτίζεται τέλεια με την εικόνα που βλέπει ο παρατηρητής από τη γέφυρα (5.5.2, πίν. 5.1)."},{"id":"28625-2.2","th":"28625","part":"2.2","k":"open","secs":["6"],"p":10,"q":"Να αναφέρετε ποια είναι τα χαρακτηριστικά χειρισμών με βάση τους τρόπους χρησιμοποιήσεως του ραντάρ και του Συστήματος Αυτόματης Υποτυπώσεως Στόχων (Automatic Radar Plotting Aids-ARPA) στην εφαρμογή των κανόνων προς αποφυγή συγκρούσεως.","sol":"Απαιτείται να:<br>α) είναι ουσιώδεις<br>β) αποφεύγονται οι διαδοχικές αλλαγές<br>γ) είναι εύκολα φανεροί και στα άλλα πλοία<br>δ) εκτελούνται έγκαιρα και στον ορθό χρόνο<br>ε) είναι σύμφωνοι με την καλή ναυτική πρακτική"},{"id":"28627-2.1α","th":"28627","part":"2.1","lab":"α","k":"fill","secs":["3α"],"p":3,"q":"Από την ανάλυση των διαφόρων ναυτιλιακών ατυχημάτων έχει εξαχθεί το συμπέρασμα ότι μεγάλο ποσοστό αυτών οφείλονται σε ⟨⟩.","opts":["καθιερωμένη","διόπτευση","περιορισμένη","ανθρώπινα σφάλματα","αληθή","μικρότερος"],"a":3},{"id":"28627-2.1γ","th":"28627","part":"2.1","lab":"γ","k":"fill","secs":["3α"],"p":3,"q":"Ο συνολικός χρόνος αναπαύσεως σε περίοδο επτά ημερών, δεν θα είναι ⟨⟩ από 70 ώρες.","opts":["καθιερωμένη","διόπτευση","περιορισμένη","ανθρώπινα σφάλματα","αληθή","μικρότερος"],"a":5},{"id":"28627-2.1δ","th":"28627","part":"2.1","lab":"δ","k":"fill","secs":["5α"],"p":3,"q":"Οι πληροφορίες που προσδιορίζει το ραντάρ και εμφανίζει στην οθόνη του, με αναλογικό ή ψηφιακό τρόπο, είναι η ⟨⟩ και η απόσταση της ξηράς και των στόχων που αυτό εντοπίζει.","opts":["καθιερωμένη","διόπτευση","περιορισμένη","ανθρώπινα σφάλματα","αληθή","μικρότερος"],"a":1},{"id":"28627-2.1ε","th":"28627","part":"2.1","lab":"ε","k":"fill","secs":["5β"],"p":3,"q":"Στην ⟨⟩ κίνηση, εφόσον η οθόνη είναι ορθά ρυθμισμένη, η κίνηση της ηχούς όλων των στόχων είναι ανεξάρτητη από την κίνηση του πλοίου του παρατηρητή.","opts":["καθιερωμένη","διόπτευση","περιορισμένη","ανθρώπινα σφάλματα","αληθή","μικρότερος"],"a":4},{"id":"28628-Θα","th":"28628","part":"","lab":"α","k":"mc","secs":["3β"],"p":5,"q":"Ο κώδικας που καθορίζει ότι ο ΑΦ είναι ο αντιπρόσωπος του πλοιάρχου και είναι ο κύριος υπεύθυνος σε όλες τις χρονικές στιγμές για την ασφάλεια του πλοίου είναι:","opts":["SOLAS.","STCW.","MARPOL.","όλα τα παραπάνω."],"a":1},{"id":"28628-Θβ","th":"28628","part":"","lab":"β","k":"mc","secs":["3β"],"p":5,"q":"Σε περιπτώσεις ανάγκης, ο ΑΦ δεν θα διστάζει να χρησιμοποιεί:","opts":["το πηδάλιο.","τις μηχανές.","τη συσκευή ηχητικών σημάτων.","όλα τα παραπάνω."],"a":3},{"id":"28628-Θγ","th":"28628","part":"","lab":"γ","k":"mc","secs":["2β"],"p":5,"q":"Τα πλοία που διαπλέουν διαδρόμους διπλής κατευθύνσεως ή θαλάσσιους διαδρόμους-οδούς βαθέων υδάτων διπλής κατευθύνσεως, οφείλουν να τηρούνται:","opts":["στη δεξιά πλευρά αυτών.","στην αριστερή πλευρά αυτών.","στο κέντρο αυτών.","όλα τα παραπάνω."],"a":0},{"id":"28628-Θδ","th":"28628","part":"","lab":"δ","k":"mc","secs":["3β"],"p":5,"q":"Η σχεδίαση – προγραμματισμός του ταξιδίου είναι απαραίτητη για την υποστήριξη της ομάδας γέφυρας και για να εξασφαλισθεί ότι το πλοίο θα ναυσιπλοήσει ασφαλώς μεταξύ των λιμένων, από το σημείο απόπλου στο σημείο:","opts":["της απαγορευμένης περιοχής.","απόπλου.","κατάπλου.","του φάρου."],"a":2},{"id":"28628-Θε","th":"28628","part":"","lab":"ε","k":"mc","secs":["3β"],"p":5,"q":"Ο ΑΦ σε καμιά περίσταση δεν θα εγκαταλείπει τη γέφυρα, αν δεν αντικατασταθεί από κατάλληλο:","opts":["ναύτη.","πηδαλιούχο.","αντικαταστάτη.","οπτήρα."],"a":2},{"id":"33608-2.1","th":"33608","part":"2.1","k":"open","secs":["2α"],"p":10,"q":"Ποιο είναι το μέτρο πορειογράφησης που απεικονίζεται στον αριθμό 4 του παρακάτω σχήματος;<img class=\"fig\" src=\"img/33608_f1.png\" alt=\"\">","sol":"Κόμβος-διασταυρώσεως κυκλοστρεφούς κυκλοφορίας."},{"id":"33608-2.2","th":"33608","part":"2.2","k":"open","secs":["4"],"p":15,"q":"Να αναφέρετε ποιοι είναι οι απαιτούμενοι χειρισμοί για αποφυγή συγκρούσεως σύμφωνα με ΔΚΑΣ 72.","sol":"Οι απαιτούμενοι χειρισμοί του πλοίου για την αποφυγή συγκρούσεως με τα παραπλέοντα πλοία, θα πρέπει να είναι έγκαιροι, ουσιώδεις και διακριτοί, σύμφωνα με τους ΔΚΑΣ 72."},{"id":"33609-2.1","th":"33609","part":"2.1","k":"open","secs":["2α"],"p":10,"q":"Όσον αφορά στα συστήματα πορειoγράφησης (routeing system), να προσδιορίσετε τι απεικονίζεται στο παρακάτω σχήμα.<img class=\"fig\" src=\"img/33609_f1.png\" alt=\"\">","sol":"Διάδρομος κυκλοφορίας διπλής κατευθύνσεως."},{"id":"33609-2.2","th":"33609","part":"2.2","k":"open","secs":["5β"],"p":15,"q":"Ποια είναι η έννοια του προσανατολισμού εικόνας για τη σχετική κίνηση;","sol":"Ο όρος προσανατολισμός εικόνας αφορά στον προσανατολισμό της εικόνας του ραντάρ χρησιμοποιώντας ως αναφορά (βάση), τη γραμμή της πλώρης του πλοίου (heads-up), τον αληθή βορρά (true-north-up) και την αναπρώρηση του πλοίου (course up)."},{"id":"33610-2.1","th":"33610","part":"2.1","k":"open","secs":["2α"],"p":10,"q":"Όσον αφορά στα συστήματα πορειoγράφησης (routeing system), να προσδιορίσετε τι απεικονίζει το παρακάτω σχήμα;<img class=\"fig\" src=\"img/33610_f1.png\" alt=\"\">","sol":"Θαλάσσιος διάδρομος-οδός βαθέων υδάτων."},{"id":"33610-2.2","th":"33610","part":"2.2","k":"open","secs":["5β"],"p":15,"q":"Ποια είναι η έννοια της παρουσίασης της εικόνας για τη σχετική κίνηση;","sol":"Ο όρος παρουσίαση της εικόνας χρησιμοποιείται για την παρουσίαση της κινήσεως των στόχων και της ξηράς που εμφανίζονται στο PPI, έχοντας ως αναφορά το πλοίο του παρατηρητή (σχετική κίνηση-relative motion), το νερό (αληθής κίνηση-true motion sea stabilized) και το βυθό (αληθής κίνηση-true motion ground stabilization)."},{"id":"33611-2.1","th":"33611","part":"2.1","k":"open","secs":["2α"],"p":10,"q":"Ποιο είναι το μέτρο πορειογράφησης που απεικονίζεται στο παρακάτω σχήμα;<img class=\"fig\" src=\"img/33611_f1.png\" alt=\"\">","sol":"Περιοχή που πρέπει να αποφεύγεται."},{"id":"33611-2.2","th":"33611","part":"2.2","k":"open","secs":["4"],"p":15,"q":"Να προσδιορίσετε τα κύρια καθήκοντα του ΑΦ για να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας.","sol":"Για να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας, τα κύρια καθήκοντα του ΑΦ, είναι η τήρηση φυλακής, η ασφαλής ναυσιπλοΐα του πλοίου και η τήρηση φυλακής επικοινωνιών στο GMDSS."},{"id":"33612-2.1","th":"33612","part":"2.1","k":"open","secs":["2α"],"p":10,"q":"Ποιο είναι το μέτρο πορειογράφησης που απεικονίζεται στο παρακάτω σχήμα;<img class=\"fig\" src=\"img/33612_f1.png\" alt=\"\">","sol":"Περιοχή, στην οποία πρέπει να αποφεύγεται η αγκυροβολία."},{"id":"33612-2.2","th":"33612","part":"2.2","k":"open","secs":["2α"],"p":15,"q":"Να ορίσετε το σύστημα πορειογραφήσεως.","sol":"Κάθε σύστημα, το οποίο καθορίζει σε μια θαλάσσια περιοχή, μια η περισσότερες πορείες ως προς το βυθό (COG) κυκλοφοριακής ροής ή μέτρα πορειογραφήσεως, με σκοπό τη μείωση των ναυτικών ατυχημάτων και απωλειών, ονομάζεται σύστημα πορειογραφήσεως."},{"id":"33613-2.1α","th":"33613","part":"2.1","lab":"α","k":"fill","secs":["3β"],"p":3,"q":"Ουδέποτε η γέφυρα επιτρέπεται να μείνει χωρίς ⟨⟩.","opts":["κλίμακα","επιτήρηση","πλαγιοδέτηση","ραντάρ","διατήρηση","ελικτικά"],"a":1},{"id":"33613-2.1β","th":"33613","part":"2.1","lab":"β","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ οφείλει να γνωρίζει τα ⟨⟩ χαρακτηριστικά του πλοίου.","opts":["κλίμακα","επιτήρηση","πλαγιοδέτηση","ραντάρ","διατήρηση","ελικτικά"],"a":5},{"id":"33613-2.1γ","th":"33613","part":"2.1","lab":"γ","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ οφείλει να χρησιμοποιεί το ⟨⟩, οποτεδήποτε επικρατούν συνθήκες περιορισμένης ορατότητας ή αναμένονται τέτοιες συνθήκες.","opts":["κλίμακα","επιτήρηση","πλαγιοδέτηση","ραντάρ","διατήρηση","ελικτικά"],"a":3},{"id":"33613-2.1δ","th":"33613","part":"2.1","lab":"δ","k":"fill","secs":["3β"],"p":3,"q":"Οποτεδήποτε το ραντάρ χρησιμοποιείται, ο ΑΦ οφείλει να επιλέγει κατάλληλη ⟨⟩ και να παρατηρεί προσεκτικά την οθόνη του ραντάρ.","opts":["κλίμακα","επιτήρηση","πλαγιοδέτηση","ραντάρ","διατήρηση","ελικτικά"],"a":0},{"id":"33613-2.1ε","th":"33613","part":"2.1","lab":"ε","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ οφείλει να ειδοποιεί τον πλοίαρχο άμεσα αν αντιμετωπίζει δυσκολίες στη ⟨⟩ της πορείας ως προς το βυθό και της αναπρωρήσεως.","opts":["κλίμακα","επιτήρηση","πλαγιοδέτηση","ραντάρ","διατήρηση","ελικτικά"],"a":4},{"id":"33613-2.2","th":"33613","part":"2.2","k":"open","secs":["2α"],"p":10,"q":"Να αναφέρετε δυο (2) αντικειμενικούς στόχους των συστημάτων πορειογραφήσεως.","sol":"Δυο (2) από:<br>1)Διαχωρισμός των αντίθετων ρευμάτων κυκλοφορίας<br>2)Μείωση των κίνδυνων συγκρούσεων των πλοίων<br>3)Απλοποίηση των διαφόρων κατευθύνσεων των κυκλοφοριακών ροών<br>4)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές εκτελέσεως έρευνας ή εκμεταλλεύσεως των υποθαλασσίων πηγών έρευνας<br>5)Οργάνωση ασφαλούς κυκλοφοριακής ροής όντος ή γύρω από τις περιοχές<br>6)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές που είναι ευαίσθητες περιβαλλοντολογικά ή γύρω σε ασφαλή απόσταση απ’ αυτές<br>7)Μείωση του κίνδυνου προσαράξεως<br>8)Καθοδήγηση της κυκλοφορίας μακριά από περιοχές αλιείας"},{"id":"33614-2.1α","th":"33614","part":"2.1","lab":"α","k":"tf","secs":["3β"],"p":3,"q":"Ο ΑΦ οφείλει να ειδοποιεί τον πλοίαρχο άμεσα σε περίπτωση καλοκαιρίας.","a":false,"why":"Ο ΑΦ ειδοποιεί αμέσως τον πλοίαρχο σε περίπτωση <b>κακοκαιρίας</b>, αν υπάρχουν αμφιβολίες για ζημιές λόγω του καιρού, όχι σε καλοκαιρία (3.1.3)."},{"id":"33614-2.1β","th":"33614","part":"2.1","lab":"β","k":"tf","secs":["2α"],"p":3,"q":"Στο σύστημα πορειογραφήσεως περιλαμβάνονται οι περιοχές προφυλάξεως.","a":true},{"id":"33614-2.1γ","th":"33614","part":"2.1","lab":"γ","k":"tf","secs":["3γ"],"p":3,"q":"Όταν το πλοίο είναι αγκυροβολημένο, ο ΑΦ οφείλει να εξασφαλίζει ότι τηρείται κατάλληλη επιτήρηση.","a":true},{"id":"33614-2.1δ","th":"33614","part":"2.1","lab":"δ","k":"tf","secs":["3γ"],"p":3,"q":"Ο πλοίαρχος και ο πλοηγός οφείλουν να ανταλλάσουν πληροφορίες σχετικά με τις ναυτιλιακές διαδικασίες, τις τοπικές συνθήκες και τα χαρακτηριστικά του πλοίου.","a":true},{"id":"33614-2.1ε","th":"33614","part":"2.1","lab":"ε","k":"tf","secs":["4"],"p":3,"q":"Ο ΑΦ είναι ο υπεύθυνος της γέφυρας και τα μελή της ομάδας γέφυρας είναι υπεύθυνα για την τήρηση φυλακής, μέχρι να αντικατασταθούν.","a":true},{"id":"33614-2.2","th":"33614","part":"2.2","k":"open","secs":["2α"],"p":10,"q":"Κάθε σύστημα, το οποίο καθορίζει σε μια θαλάσσια περιοχή, μία ή περισσότερες πορείες ως προς το βυθό (COG) κυκλοφοριακής ροής ή μέτρα πορειογραφήσεως, με σκοπό τη μείωση των ναυτικών ατυχημάτων και απωλειών, ονομάζεται σύστημα πορειογραφήσεως (routeing system). Να αναφέρετε ονομαστικά τι είναι δυνατόν να περιλαμβάνουν τα συστήματα πορειογραφήσεως (απαιτούνται 4).","sol":"Τέσσερα (4) από:<br>1. Συστήματα διαχωρισμού θαλάσσιας κυκλοφορίας (traffic separation schemes).<br>2. Διάδρομους κυκλοφορίας διπλής κατευθύνσεως (two-way routes).<br>3. Συνιστώμενες πορείες ως προς το βυθό (COG) κυκλοφοριακής ροής(recommended tracks).<br>4. Περιοχές που πρέπει να αποφευχθούν (areas to be avoided).<br>5. Περιοχές, στις οποίες πρέπει να αποφεύγεται η αγκυροβολία (no anchoring areas).<br>6. Ζώνες παράκτιας κυκλοφορίας (inshore traffic zones).<br>7. Κόμβος-διασταυρώσεις κυκλοστρεφούς κυκλοφορίας (roundabouts).<br>8. Περιοχές προφυλάξεως (precautionary areas).<br>9. Θαλάσσιους διαδρόμους-οδούς βαθέων υδάτων (deep water routes)."},{"id":"33615-Θα","th":"33615","part":"","lab":"α","k":"mc","secs":["3γ"],"p":5,"q":"Η παρουσία πλοηγού επί του πλοίου:","opts":["δεν απαλλάσσει τον πλοίαρχο ή τον ΑΦ από τα καθήκοντα.","απαλλάσσει τον πλοίαρχο ή τον ΑΦ από τα καθήκοντα.","απαγορεύει στον πλοίαρχο να ανταλλάζει πληροφορίες σχετικά με το πλοίο.","όλα τα παραπάνω."],"a":0},{"id":"33615-Θβ","th":"33615","part":"","lab":"β","k":"mc","secs":["5α"],"p":5,"q":"Η χρησιμοποίηση του ραντάρ για την αποφυγή συγκρούσεως και για τη ναυτιλία:","opts":["δε συμπληρώνει την οπτική επιτήρηση.","δεν υποβοηθά την οπτική επιτήρηση.","δεν υποκαθιστά την οπτική επιτήρηση.","όλα τα παραπάνω."],"a":2},{"id":"33615-Θγ","th":"33615","part":"","lab":"γ","k":"mc","secs":["5α"],"p":5,"q":"Ο τύπος της οθόνης, ο οποίος δεικνύει τη θέση (position) των ορατών από το ραντάρ στόχων σ’ ένα οριζόντιο επίπεδο,ονομάζεται:","opts":["Γραμμή Ηλεκτρον
