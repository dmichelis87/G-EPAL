χει την ικανότητα","μην έχει την ικανότητα","το 1 και το 3"],"a":1,"note":"Στην ενδεικτική απάντηση της τράπεζας είναι τυπωμένο «δ4» (το 1 και το 3), που λέει το αντίθετο από το βιβλίο. Ο οπτήρας πρέπει να <b>έχει την ικανότητα</b> να επικεντρώνει όλη την προσοχή του στην επιτήρηση (3.1.3)."},{"id":"33687-Θε","th":"33687","part":"","lab":"ε","k":"mc","secs":["3β"],"p":5,"q":"Οι παραλαμβάνοντες αξιωματικοί οφείλουν να ενημερώνονται προσωπικά, για:","opts":["το στίγμα","την πορεία","την ταχύτητα","όλα τα παραπάνω"],"a":3},{"id":"33688-Θα","th":"33688","part":"","lab":"α","k":"mc","secs":["3β"],"p":5,"q":"Το ταξίδι, το οποίο πρόκειται να εκτελεσθεί, πρέπει να σχεδιασθεί <span class=\"gap\"></span> λαμβάνοντας υπόψη τις συναφείς με αυτό πληροφορίες.","opts":["εκ των προτέρων","εκ των υστέρων","αργότερα","κατά τη διάρκεια του ταξιδιού"],"a":0},{"id":"33688-Θβ","th":"33688","part":"","lab":"β","k":"mc","secs":["3γ"],"p":5,"q":"Ο ΑΦ οφείλει <span class=\"gap\"></span> συχνές και ακριβείς διοπτεύσεις των προσεγγιζόντων πλοίων.","opts":["να μη λαμβάνει με την πυξίδα","να λαμβάνει με την πυξίδα","να λαμβάνει με τα κιάλια","όλα τα παραπάνω"],"a":1},{"id":"33688-Θγ","th":"33688","part":"","lab":"γ","k":"mc","secs":["6"],"p":5,"q":"Στην αποφυγή συγκρούσεως, οι μικρές διαδοχικές αλλαγές της αναπρωρήσεως ή και της ταχύτητας (cumulative turn):","opts":["επιβάλλονται.","είναι αναγκαίο να αποφεύγονται.","είναι αναγκαίες.","όλα τα παραπάνω."],"a":1},{"id":"33688-Θδ","th":"33688","part":"","lab":"δ","k":"mc","secs":["2α"],"p":5,"q":"Το βέλος με συνεχή γραμμή ορίζει <span class=\"gap\"></span> κατεύθυνση της κυκλοφοριακής ροής.","opts":["τη θεσπισμένη","τη διπλή","τη συνιστώμενη","τη λάθος"],"a":0},{"id":"33688-Θε","th":"33688","part":"","lab":"ε","k":"mc","secs":["3β"],"p":5,"q":"Ο ΑΦ είναι <span class=\"gap\"></span> του πλοιάρχου και η πρωταρχική του ευθύνη σε κάθε στιγμή είναι η ασφαλής ναυσιπλοΐα του πλοίου και η συμμόρφωσή του με τους ΔΚΑΣ.","opts":["ο αντικαταστάτης","ο διάδοχος","ο αντιπρόσωπος","ο αναπληρωτής"],"a":2},{"id":"33689-2.1α","th":"33689","part":"2.1","lab":"α","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ ⟨⟩ πρέπει να είναι κατάλληλα πιστοποιημένος, σύμφωνα με τους κανονισμού, ανάλογα με τα καθήκοντα που αφορούν στη φυλακή μηχανής.","opts":["μέγιστη","αντίθετες","ορατότητας","τόπο","σταθερό","μηχανής"],"a":5},{"id":"33689-2.1β","th":"33689","part":"2.1","lab":"β","k":"fill","secs":["5β"],"p":3,"q":"Στην παρουσίαση της σχετικής κινήσεως, το κέντρο της οθόνης είναι ⟨⟩ και είναι το πλοίο του παρατηρητή.","opts":["μέγιστη","αντίθετες","ορατότητας","τόπο","σταθερό","μηχανής"],"a":4},{"id":"33689-2.1γ","th":"33689","part":"2.1","lab":"γ","k":"fill","secs":["6"],"p":3,"q":"Όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου, αυτοί θα πρέπει να είναι ουσιώδεις – δραστικοί – σαφείς – διακριτοί σε όλες τις συνθήκες⟨⟩.","opts":["μέγιστη","αντίθετες","ορατότητας","τόπο","σταθερό","μηχανής"],"a":2},{"id":"33689-2.1δ","th":"33689","part":"2.1","lab":"δ","k":"fill","secs":["6"],"p":3,"q":"Οι ΑΦ είναι απαραίτητο να γνωρίζουν να προσδιορίζουν την κατάλληλη για κάθε περίπτωση ασφαλή ταχύτητα, όπως και να ρυθμίζουν το ραντάρ πάντοτε έτσι, ώστε να έχει τη ⟨⟩ απόδοση.","opts":["μέγιστη","αντίθετες","ορατότητας","τόπο","σταθερό","μηχανής"],"a":0},{"id":"33689-2.1ε","th":"33689","part":"2.1","lab":"ε","k":"fill","secs":["2α"],"p":3,"q":"Η ζώνη ή γραμμή, που διαχωρίζει τις λωρίδες κυκλοφορίας, στις οποίες τα πλοία πλέουν με ⟨⟩ ή σχεδόν αντίθετες πορείες ως προς το βυθό (COG) λέγεται ζώνη ή γραμμή διαχωρισμού.","opts":["μέγιστη","αντίθετες","ορατότητας","τόπο","σταθερό","μηχανής"],"a":1},{"id":"33689-2.2α","th":"33689","part":"2.2","lab":"α","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Θαλάσσιος διάδρομος-οδός βαθέων υδάτων (deep-water route).","sol":"Ο θαλάσσιος διάδρομος-οδός, στον οποίο υπάρχουν μεγάλα βάθη και του οποίου τα όρια επακριβώς καθορίζονται στο χάρτη λέγεται θαλάσσιος διάδρομος-οδός βαθέων υδάτων (deep-water route)."},{"id":"33689-2.2β","th":"33689","part":"2.2","lab":"β","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Διάδρομος κυκλοφορίας διπλής κατευθύνσεως (two-way route).","sol":"Ο διάδρομος που ορίζεται από συγκεκριμένα όρια, εντός του οποίου πραγματοποιείται θαλάσσια κυκλοφορία και προς τις δύο κατευθύνσεις, με σκοπό να παρέχει ασφαλή διάπλου, διά μέσου θαλασσίων περιοχών, όπου η ναυσιπλοΐα είναι δύσκολη ή επικίνδυνη λέγεται διάδρομος κυκλοφορίας διπλής κατευθύνσεως (two-way route)."},{"id":"33690-2.1α","th":"33690","part":"2.1","lab":"α","k":"fill","secs":["4"],"p":3,"q":"Για να επιτευχθεί η εκτέλεση ασφαλούς φυλακής γέφυρας, τα κύρια καθήκοντα του ΑΦ, είναι η τήρηση φυλακής, η ασφαλής ⟨⟩ του πλοίου και η τήρηση φυλακής επικοινωνιών στο GMDSS (Global Maritime Distress and Safety System).","opts":["απόσταση","νερό","ναυσιπλοΐα","φυλακή","επιτήρηση","μηχανής"],"a":2},{"id":"33690-2.1β","th":"33690","part":"2.1","lab":"β","k":"fill","secs":["5β"],"p":3,"q":"Η παρουσίαση της αληθούς κινήσεως με σταθεροποίηση ως προς το ⟨⟩ δίνει τη δυνατότητα της απευθείας παρουσιάσεως – ενδείξεως της αναπρωρήσεως των άλλων στόχων, δηλαδή την κατεύθυνση προς την οποία είναι στραμμένη η πλώρη τους.","opts":["απόσταση","νερό","ναυσιπλοΐα","φυλακή","επιτήρηση","μηχανής"],"a":1},{"id":"33690-2.1γ","th":"33690","part":"2.1","lab":"γ","k":"fill","secs":["3γ"],"p":3,"q":"Όταν το πλοίο είναι αγκυροβολημένο και ο πλοίαρχος θεωρεί απαραίτητο ότι θα πρέπει να διατηρηθούνοι φυλακές γέφυρας, ο ΑΦ οφείλει να εξασφαλίζει ότι τηρείται κατάλληλη ⟨⟩.","opts":["απόσταση","νερό","ναυσιπλοΐα","φυλακή","επιτήρηση","μηχανής"],"a":4},{"id":"33690-2.1δ","th":"33690","part":"2.1","lab":"δ","k":"fill","secs":["5α"],"p":3,"q":"Οι πληροφορίες που προσδιορίζει το ραντάρ και εμφανίζει στην οθόνη του, με αναλογικό ή ψηφιακό τρόπο, είναι η διόπτευση και η ⟨⟩ της ξηράς και των στόχων που αυτό εντοπίζει.","opts":["απόσταση","νερό","ναυσιπλοΐα","φυλακή","επιτήρηση","μηχανής"],"a":0},{"id":"33690-2.1ε","th":"33690","part":"2.1","lab":"ε","k":"fill","secs":["3γ"],"p":3,"q":"Ο ΑΦ καταστρώματος ή μηχανής δεν θα παραδίδει τη ⟨⟩ στο παραλαμβάνοντα αξιωματικό, εάν έχει οποιοδήποτε λόγο να πιστεύει ότι ο τελευταίος δεν είναι σε προφανή θέση να εκτελέσειτα καθήκοντά του.","opts":["απόσταση","νερό","ναυσιπλοΐα","φυλακή","επιτήρηση","μηχανής"],"a":3},{"id":"33690-2.2α","th":"33690","part":"2.2","lab":"α","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Σύστημα διαχωρισμού θαλάσσιας κυκλοφορίας (ΣΔΘΚ) (traffic separation scheme).","sol":"Το σύστημα πορειογραφήσεως, το οπoίο διαχωρίζει τη θαλάσσια κυκλοφορία δύο αντιθέτων ή σχεδόν αντιθέτων κατευθύνσεων, καθιερώνοντας και χρησιμοποιώντας τις λωρίδες θαλάσσιας κυκλοφορίας, τις ζώνες-γραμμές διαχωρισμού και άλλα κατάλληλα μέτρα ονομάζεται σύστημα διαχωρισμού θαλάσσιας κυκλοφορίας (ΣΔΘΚ) (traffic separation scheme)."},{"id":"33690-2.2β","th":"33690","part":"2.2","lab":"β","k":"open","secs":["2α"],"p":5,"ctx":"Να καταγράψετε τους παρακάτω ορισμούς:","q":"Περιοχή, στην οποία πρέπει να αποφεύγεται η αγκυροβολία (no anchoring area).","sol":"Ένα μέτρο πορειογραφήσεως, αποτελούμενο από μία περιοχή οριζόμενη από συγκεκριμένα όρια, εντός της οποίας η αγκυροβολία είναι επικίνδυνη ή μπορεί να έχει ως αποτέλεσμα μη αποδεκτές βλάβες στο θαλάσσιο περιβάλλον λέγεται περιοχή, στην οποία πρέπει να αποφεύγεται η αγκυροβολία (no anchoring area). Η αγκυροβολία στις εν λόγω περιοχές θα πρέπει να αποφεύγεται απ’ όλα τα πλοία ή από πλοία συγκεκριμένων κατηγοριών, εκτός της περιπτώσεως άμεσου κινδύνου του πλοίου."},{"id":"33691-2.1α","th":"33691","part":"2.1","lab":"α","k":"fill","secs":["4"],"p":3,"q":"Η ομάδα γέφυρας έχει σημαντικό ρόλο στη διατήρηση της ⟨⟩ με το κέντρο ελέγχου των μηχανών και με τα άλλα διαμερίσματα–θέσεις, που εκτελούνται οι διάφορες λειτουργίες στο πλοίο.","opts":["έγκαιροι","επικοινωνίας","ναυσιπλοΐα","ραντάρ","παραμένει","θαλάσσης"],"a":1},{"id":"33691-2.1β","th":"33691","part":"2.1","lab":"β","k":"fill","secs":["5α"],"p":3,"q":"Ο τύπος της οθόνης, ο οποίος δεικνύει τη θέση (position) των ορατών από το ⟨⟩ στόχων σ’ ένα οριζόντιο επίπεδο (σε ένα χάρτη – σε μια κάτοψη) (plan) ονομάζεται Plan Position Indicator (PPI).","opts":["έγκαιροι","επικοινωνίας","ναυσιπλοΐα","ραντάρ","παραμένει","θαλάσσης"],"a":3},{"id":"33691-2.1γ","th":"33691","part":"2.1","lab":"γ","k":"fill","secs":["4"],"p":3,"q":"Οι απαιτούμενοι χειρισμοί του πλοίου για την αποφυγή συγκρούσεως με τα παραπλέοντα πλοία, θα πρέπει να είναι ⟨⟩, ουσιώδεις και διακριτοί, σύμφωνα με τους ΔΚΑΣ 72.","opts":["έγκαιροι","επικοινωνίας","ναυσιπλοΐα","ραντάρ","παραμένει","θαλάσσης"],"a":0},{"id":"33691-2.1δ","th":"33691","part":"2.1","lab":"δ","k":"fill","secs":["4"],"p":3,"q":"Στην περίπτωση που στη γέφυρα βρίσκεται πλοηγός, η ευθύνη για την ασφάλεια του πλοίου ⟨⟩ στον ΑΦ, ανεξάρτητα από τα καθήκοντα και τις υποχρεώσεις του πλοηγού.","opts":["έγκαιροι","επικοινωνίας","ναυσιπλοΐα","ραντάρ","παραμένει","θαλάσσης"],"a":4},{"id":"33691-2.1ε","th":"33691","part":"2.1","lab":"ε","k":"fill","secs":["3γ"],"p":3,"q":"Ο ΑΦ καταστρώματος οφείλει να δίνει προσοχή στον καιρό και στην κατάσταση ⟨⟩.","opts":["έγκαιροι","επικοινωνίας","ναυσιπλοΐα","ραντάρ","παραμένει","θαλάσσης"],"a":5},{"id":"33691-2.2","th":"33691","part":"2.2","k":"open","secs":["4"],"p":10,"q":"Να αναφέρετε επιγραμματικά ποιες είναι οι βασικές αρχές για να είναι αποτελεσματική η επικοινωνία,σύμφωνα με τους κανόνες της καλής ναυτικής πρακτικής.","sol":"Για να είναι αποτελεσματική η επικοινωνία, είναι αναγκαίο να ακολουθούνται οι παρακάτω βασικές αρχές, σύμφωνα με τους κανόνες της καλής ναυτικής πρακτικής:<br>1) Να είναι σύντομη–συνοπτική.<br>2) Απλή.<br>3) Σαφής–ξεκάθαρη και<br>4) συγκεκριμένη–ακριβής."},{"id":"33692-2.1α","th":"33692","part":"2.1","lab":"α","k":"fill","secs":["2β"],"p":3,"q":"Οι θαλάσσιοι διάδρομοι-οδοί βαθέων υδάτων προορίζονται, κυρίως, για τη χρήση από πλοία, των οποίων η δυνατότητα πλου περιορίζεται απ’ το ⟨⟩ τους στην περιοχή που πλέουν και είναι απαραίτητο να πλεύσουν εντός αυτών.","opts":["ελέγχους","βύθισμά","ναυσιπλοΐα","βυθό","ανεμολόγιο","πλώρης"],"a":1},{"id":"33692-2.1β","th":"33692","part":"2.1","lab":"β","k":"fill","secs":["3β"],"p":3,"q":"Ο ΑΦ οφείλει να προβαίνει σε περιοδικούς ⟨⟩ προκειμένου να εξασφαλίζει, ότι ο πηδαλιούχος ή το αυτόματο πηδάλιο τηρεί την ορθή αναπρώρηση.","opts":["ελέγχους","βύθισμά","ναυσιπλοΐα","βυθό","ανεμολόγιο","πλώρης"],"a":0},{"id":"33692-2.1γ","th":"33692","part":"2.1","lab":"γ","k":"fill","secs":["5β"],"p":3,"q":"Ο σημειωτής – ενδείκτης της γραμμής της πλώρης (heading marker line) είναι η παράλληλη γραμμή προς το διαμήκη άξονα του πλοίου, που ενώνει την πλώρη του πλοίου, με το ⟨⟩ του PPI του ραντάρ.","opts":["ελέγχους","βύθισμά","ναυσιπλοΐα","βυθό","ανεμολόγιο","πλώρης"],"a":4},{"id":"33692-2.1δ","th":"33692","part":"2.1","lab":"δ","k":"fill","secs":["5β"],"p":3,"q":"Η παρουσίαση της αληθούς κινήσεως με σταθεροποίηση ως προς το ⟨⟩ είναι χρήσιμη για την ασφαλή ναυτιλία, διότι είναι εύκολη η αναγνώριση της ξηράς των ναυτιλιακών κινδύνων και των αγκυροβολημένων στόχων.","opts":["ελέγχους","βύθισμά","ναυσιπλοΐα","βυθό","ανεμολόγιο","πλώρης"],"a":3},{"id":"33692-2.1ε","th":"33692","part":"2.1","lab":"ε","k":"fill","secs":["5β"],"p":3,"q":"Ο όρος προσανατολισμός εικόνας, που αφορά στον προσανατολισμό της εικόνας του ραντάρ χρησιμοποιώντας ως αναφορά, τη γραμμή της ⟨⟩ του πλοίου, τον αληθή βορρά και την αναπρώρηση του πλοίου.","opts":["ελέγχους","βύθισμά","ναυσιπλοΐα","βυθό","ανεμολόγιο","πλώρης"],"a":5},{"id":"33692-2.2α","th":"33692","part":"2.2","lab":"α","k":"open","secs":["3α"],"p":5,"ctx":"Να αναφέρετε επιγραμματικά:","q":"Ποια είναι η ελάχιστη περίοδος αναπαύσεως που απαιτείται να παρέχεται σε όλους τους αξιωματικούς του πλοίου, στους οποίους ανατίθενται καθήκοντα ΑΦ και σε όλους τους κατώτερους ναυτικούς που απαρτίζουν το υπόλοιπο τμήμα της φυλακής.","sol":"Σε όλους τους αξιωματικούς του πλοίου, στους οποίους ανατίθενται καθήκοντα ΑΦ και σε όλους τους κατώτερους ναυτικούς που απαρτίζουν το υπόλοιπο τμήμα της φυλακής, απαιτείται να παρέχεται ελάχιστη περίοδος αναπαύσεως 10 ωρών, σε κάθε 24 ώρες και 77 ώρες σε κάθε χρονική περίοδο επτά ημερών."},{"id":"33692-2.2β","th":"33692","part":"2.2","lab":"β","k":"open","secs":["3α"],"p":5,"ctx":"Να αναφέρετε επιγραμματικά:","q":"Πως μπορεί η ελάχιστη περίοδος αναπαύσεως να διαιρεθεί.","sol":"Η περίοδος αναπαύσεως μπορεί να διαιρεθεί σε δύο τμήματα, το ένα εκ των οποίων δεν θα είναι μικρότερο από 6 ώρες και το διάστημα μεταξύ δύο διαδοχικών περιόδων αναπαύσεως δεν θα ξεπερνά τις 14 ώρες."},{"id":"26655-Θ","th":"26655","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Έστω ότι δεξαμενόπλοιο πλέει προς το λιμάνι του Πειραιά με περιορισμένη ορατότητα λόγω ομίχλης και προσεγγίζει στο σημείο επιβίβασης του πλοηγού. Σύμφωνα μ’ αυτά που ορίζονται κατά τη τήρηση φυλακής κάτω από διαφορετικές συνθήκες και σε διαφορετικές περιοχές, να καταγράψετε τις ενέργειες που πρέπει να ακολουθηθούν.</p>","sol":"<p>Όταν το πλοίο συναντάς συνθήκες περιορισμένες ορατότητας η αναμένονται τέτοιες συνθήκες, η αρχική ευθύνη του ΑΦ είναι να συμμορφωθεί με τους σχετικούς κανόνες των ΔΚΑΣ ιδιαίτερα αυτούς που αφορούν σε σήμανση των ηχητικών σημάτων, στην ανάληψη ασφαλούς ταχύτητας και στην ανάληψη ετοιμότητας των μηχανών για άμεσους χειρισμούς. Επιπρόσθετα ο ΑΦ οφείλει να: 1) ενημερώνει τον πλοίαρχο 2) τοποθετεί κατάλληλους οπτήρες 3) ανάβει τους φανούς ναυσιπλοΐας 4) θέτει σε λειτουργία και να χρησιμοποιεί το ραντάρ.</p>\n<p>Ανεξάρτητα με τις υποχρεώσεις και τα καθήκοντά του πλοηγών, η παρουσία αυτών επί του πλοίου δεν απαλλάσσει τον πλοίαρχο ή τον ΑΦ από τα καθήκοντα και τις υποχρεώσεις τους για την ασφάλεια του πλοίου. Ο πλοίαρχος και ο πλοηγός οφείλουν να ανταλλάσσουν πληροφορίες σχετικά με τις ναυτιλιακές διαδικασίες, τις τοπικές συνθήκες και τα χαρακτηριστικά του πλοίου. Επίσης ο πλοίαρχος και ο ΑΦ οφείλει να συνεργάζονται στενά με το πλοηγό και να ελέγχουν συνεχώς και επακριβώς τη θέση και την κίνηση του πλοίου. Αν ο ΑΦ έχει κάποια αμφιβολία όσον αφορά στις ενέργειες ή στις προθέσεις του πλοηγού, οφείλει να ζητά επεξηγήσεις απ’ αυτόν κι αν οι αμφιβολίες του παραμένουν, θα ειδοποιεί τον πλοίαρχο άμεσα και οφείλει να αναλαμβάνει οποιαδήποτε αναγκαία ενέργεια, πριν ο πλοίαρχος αφιχθεί στη γέφυρα.</p>","ty":"pr"},{"id":"26656-Θ","th":"26656","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Να αναφέρετε σε ποιες περιπτώσεις, κατά τη εκτέλεση φυλακής γέφυρας, οφείλει ο ΑΦ να ειδοποιεί τον πλοίαρχο άμεσα.</p>","sol":"<p>- Αν το πλοίο συναντήσει συνθήκες περιορισμένη ορατότητα η όταν αναμένονται τέτοιες συνθήκες</p>\n<p>- Αν η πυκνότητα της κυκλοφορίας ή η κίνηση άλλων παραπλεόντων πλοίων προκαλούν ανησυχία όσον αφορά στην ασφάλεια του πλοίου</p>\n<p>- Αν αντιμετωπίζει δυσκολίες στη διατήρηση της πορείας ως προς το βυθό ή και της αναπρωρήσεως</p>\n<p>- Αν στο προβλεπόμενο χρόνο, δεν εντοπίζει ακτές, ναυτιλιακό σημείο ή ηχητικό σήμα</p>\n<p>- Αν απροσδόκητα εντοπίσει ακτές, ναυτιλιακό σημείο ή μεταβληθούν τα βάθη</p>\n<p>- Σε περίπτωση βλάβης των μηχανών, του συστήματος ελέγχου (χειριστήρα) του προωστήριου σκεύους, του μηχανισμού πηδαλιουχήσεως ή οποιουδήποτε απαραίτητου ναυτιλιακού οργάνου, συστήματος προειδοποιήσεως κινδύνου ή ενδείκτη</p>\n<p>- Αν προξενηθεί βλάβη στον επικοινωνιακό εξοπλισμό του πλοίου</p>\n<p>- Σε περίπτωση κακοκαιρίας αν υπάρχουν αμφιβολίες, όσον αφορά στο ενδεχόμενο προκλήσεως ζημιών λόγω του καιρού</p>\n<p>- Αν το πλοίο συνάντηση οποιοδήποτε κίνδυνο στην ναυσιπλοΐα όπως πάγους ή εγκαταλελειμμένο πλοίο ή συντρίμμια ναυαγίου</p>\n<p>- Σε οποιαδήποτε άλλη περίπτωση ανάγκης η οποτεδήποτε βρίσκεται σε αμφιβολία</p>","ty":"ap"},{"id":"26657-Θ","th":"26657","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Έστω ότι επιβατηγό πλοίο βρίσκεται αγκυροβολημένο στο λιμάνι της Μυκόνου. Σύμφωνα μ’ αυτά που ορίζονται κατά τη τήρηση φυλακής κάτω από διαφορετικές συνθήκες και σε διαφορετικές περιοχές, να καταγράψετε τις ενέργειες που πρέπει να ακολουθηθούν.</p>","sol":"<p>1) προσδιορίζει και να υποτυπώνει τη θέση του πλοίου σε κατάλληλο χάρτη όσο συχνότερα τούτο είναι δυνατό</p>\n<p>2) ελέγχει σε επαρκώς συχνά χρονικά διαστήματα, όσο οι περιστάσεις το επιτρέπουν αν το πλοίο παραμένει ασφαλώς στο αγκυροβόλιο, λαμβάνοντας διοπτεύσεις από σταθερά ναυτιλιακά γεωγραφικά σημεία ή από καταφανή σημεία της ξηράς, εύκολα αναγνωρίσιμα</p>\n<p>3) εξασφαλίζει ότι τηρείται κατάλληλη επιτήρηση</p>\n<p>4) εξασφαλίζει ότι πραγματοποιούνται περιοδικά επιθεωρήσει- εφοδείες από πλώρα μέχρι πρίμα</p>\n<p>5) παρακολουθεί τις μετεωρολογικές και τις παλιρροιακές συνθήκες και την κατάσταση θαλάσσης</p>\n<p>6) ειδοποιεί τον πλοίαρχο και να αναλαμβάνει όλα τα απαραίτητα μέτρα, αν το πλοίο ξεσέρνει</p>\n<p>7) εξασφαλίζει την ετοιμότητα των μηχανών και των άλλων μηχανημάτων, σύμφωνα με τις οδηγίες του πλοιάρχου</p>\n<p>8) ειδοποιεί τον πλοίαρχο, αν η ορατότητα μειώνεται</p>\n<p>9) εξασφαλίζει ότι το πλοίο επιδεικνύει τους προβλεπόμενους φανούς και σχήματα όπως επίσης ότι σημαίνει τα προβλεπόμενα από τους ΔΚΑΣ ηχητικά σήματα</p>\n<p>10) λαμβάνει μέτρα για την προστασία του περιβάλλοντος από ρύπανση εκ του πλοίου και να συμμορφώνεται με τους προβλεπόμενους κανονισμούς αποφυγής ρυπάνσεως</p>","ty":"pr"},{"id":"26686-4.1","th":"26686","part":"4.1","k":"calc","secs":["2β"],"p":15,"q":"<p>Να αναφερθούν οι λόγοι για τους οποίους μπορεί να χαρακτηριστεί μια περιοχή ως περιοχή που πρέπει να αποφεύγεται.</p>","sol":"<p>1)Για την ασφάλεια της ναυσιπλοΐας διότι δεν έχουν επαρκώς χαρτογραφηθεί ή οι υδρογραφικές υπηρεσίες που περιλαμβάνουν δεν είναι πλήρεις ή δεν έχουν ελλιπή και επισφαλή σήμανση. Επίσης, σε άλλες περιοχές, ο διάπλους αυτών θεωρείται επικίνδυνος, χωρίς τη βοήθεια των πλοηγων.</p>\n<p>2)Για την προστασία του περιβάλλοντος, διότι κάποιες από τις περιοχές είναι ιδιαίτερα ευαίσθητες περιβαλλοντολογικά, όπως αυτές που διαφυλάσσουν μοναδικές ζωικές υπάρξεις, οι οποίες εκτίθενται σε κίνδυνο όταν μολυνθεί η περιοχή μετά από ναυτικό ατύχημα.</p>","ty":"ap"},{"id":"26686-4.2","th":"26686","part":"4.2","k":"calc","secs":["2α"],"p":10,"q":"<p>Να ορίσετε τον σκοπό της πορειογραφήσεως των πλοίων.</p>","sol":"<p>Ο σκοπός της πορειογραφήσεως των πλοίων είναι η επαύξηση της ασφάλειας της ναυσιπλοΐας, σε περιοχές όπου συγκλίνει η θαλάσσια κυκλοφορία ή η πυκνότητα της θαλάσσιας κυκλοφορίας είναι μεγάλη ή η ελευθερία κινήσεως εμποδίζεται, λόγω περιορισμένου διαθέσιμου χώρου, υπάρξεως ναυτιλιακών εμποδίων, περιορισμένων βαθών ή δυσμενών καιρικών συνθηκών. Επίσης αποφεύγεται ή μειώνεται η μόλυνση του περιβάλλοντος ή η οποιαδήποτε βλάβη σ ’αυτό, οφειλόμενη σε σύγκρουση ή προσάραξη πλοίων πλησίον ή εντός των περιβαλλοντικά ευαίσθητων περιοχών.</p>","ty":"ap"},{"id":"26724-Θ","th":"26724","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός north-up και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 120° και 8 knots αντίστοιχα. Στη συνέχεια εντοπίζονται οι ακόλουθοι στόχοι, στις κατωτέρω θέσεις - χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th></tr><tr><td>14.50</td><td>120° Τ - 7,6 ν.μ</td><td>355° Τ - 4,6 ν.μ.</td></tr><tr><td>14.57.30&quot;</td><td>120° Τ - 5,8 ν.μ.</td><td>350° Τ - 3,9 ν.μ..</td></tr><tr><td>15.05</td><td>120° Τ - 4 ν.μ</td><td>342° Τ - 3,2 ν.μ.</td></tr></table>\n<p>Από την παρατήρηση και μόνο των θέσεων των στόχων,ζητείται να προσδιορισθεί ποιος από αυτούς είναι ο πλέον επικίνδυνος και να αιτιολογήσετε την απάντησή σας.</p>","sol":"<p>Ο στόχος Α είναι ο πλέον επικίνδυνος, διότι ξέρουμε ότι όταν η διόπτευση (αληθής ή σχετική) του προσεγγίζοντος στόχου παραμένει σταθερή ή δεν μεταβάλλεται αισθητά και η απόσταση πλοίου - στόχου μειώνεται, τότε τα πλοία πλέουν προς σύγκρουση ή πλησιάζουν σε επικίνδυνη απόσταση.</p>","ty":"pr"},{"id":"26726-Θ","th":"26726","part":"","k":"calc","secs":["4"],"p":25,"q":"<p>Να αναφέρετε:</p>\n<p>α) Ποιες αρχές σύμφωνα με τους κανόνες της καλής ναυτικής πρακτικής είναι αναγκαίο να ακολουθηθούν ώστε να είναι αποτελεσματική η επικοινωνία. <span class=pt>(Μονάδες 10)</span></p>\n<p>β)Τι προβλέπεται κατά την απάντηση και επιβεβαίωση μιας εξωτερικής κλήσης επικοινωνίας. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b></p>\n<p>1) Να είναι σύντομη – συνοπτική.</p>\n<p>2) Απλή.</p>\n<p>3) Σαφής – ξεκάθαρη</p>\n<p>4) συγκεκριμένη – ακριβής.</p>\n<p><b>β)</b></p>\n<p>1) Δίδεται προτεραιότητα στην επικοινωνία που αφορά σε σήματα κινδύνου, ασφαλείας και άμεσης προτεραιότητας.</p>\n<p>2) Αποφεύγεται η παρεμβολή και η υπερφόρτωση του δικτύου.</p>\n<p>3) Χρησιμοποιούνται τα κατάλληλα δίκτυα για το σκοπό της επικοινωνίας.</p>\n<p>4) Διαβιβάζονται μόνο οι απαραίτητες να γνωστοποιηθούν πληροφορίες.</p>\n<p>5) Χρησιμοποιούνται οι υιοθετηθείσες από τον ΙΜΟ Πρότυπες Φράσεις για την Επικοινωνία στη Ναυσιπλοΐα (SΜCP)</p>","ty":"ap"},{"id":"26727-Θ","th":"26727","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως και έχει επιλεγεί προσανατολισμός heads-up (μη σταθεροποιημένος). Το πλοίο έχει αναπρώρηση 210° και διατηρεί ταχύτητα διά μέσου του νερού 8 knots. Στη συνέχεια εντοπίζονται οι ακόλουθοι στόχοι:</p>\n<p>α) Προς Δ (διόπτευση) = 127° R (σχετική) και Α (απόσταση) = 7 ν.μ..</p>\n<p>β) Προς Δ = 058° R και Α = 8 ν.μ..</p>\n<p>γ) Προς Δ = 245° R και Α = 8 ν.μ..</p>\n<p>δ) Προς Δ = 029° R και Α = 8 ν.μ..</p>\n<p>ε) Προς Δ = 314° R και A = 9 ν.μ..</p>\n<p>Ζητείται να βρεθεί η αληθής διόπτευση των στόχων.</p>","sol":"<p>α)Δ=127°+210°=337°Τ.</p>\n<p>β)Δ=058°+210°=268°Τ.</p>\n<p>γ)Δ=245°+210°=455° - 360°=095°Τ.</p>\n<p>δ)Δ=029°+210°=239°Τ.</p>\n<p>ε)Δ=314°+210°=524° - 360°=164°Τ.</p>","ty":"ap"},{"id":"26729-4.1","th":"26729","part":"4.1","k":"calc","secs":["5β"],"p":10,"q":"<p>Σύμφωνα με το παρακάτω σχήμα και λόγω των σφαλμάτων που προκαλούνται στην αναπρώρηση του πλοίου και στην ταχύτητα του διαμέσου του νερού, τι σφάλματα δημιουργούνται;</p>\n<img class=\"fig\" src=\"img/26729_f1.png\" alt=\"\">","sol":"<p>Τα σφάλματα που δημιουργούνται είναι αφενός σφάλματα στην παρουσίαση της αληθούς κινήσεως του πλοίου και του στόχου ,και αφετέρου στον υπολογισμό του CPA/TCPA με τη χρησιμοποίηση του Τριγώνου σχετικής κινήσεως.</p>","ty":"ap"},{"id":"26729-4.2","th":"26729","part":"4.2","k":"calc","secs":["5β"],"p":15,"q":"<p>Να αναφέρετε τις δυνατότητες/αδυναμίες ως προς την ευκολία προσδιορισμού του Closest Point of Approach/ Time of Closest Point of Approach (CPA/TCPA), σε όλους τους τρόπους παρουσίασης εικόνας ραντάρ.</p>","sol":"<p>Κατά τη/την</p>\n<p>-<b>σχετική κίνηση</b> εύκολα και άμεσα</p>\n<p>-<b>αληθή κίνηση</b> <b>με σταθεροποίηση ως προς το νερό</b> απαιτείται ανάλυση επίλυση τριγώνου σχετικής κινήσεως</p>\n<p>-<b>αληθή κίνηση με σταθεροποίηση ως προς το βυθό</b> δεν έχει έννοια για στόχους που κινούνται ή ακινητούν στη θάλασσα έχει έννοια μόνο για στόχους σταθερούς ως προς το βυθό (ξηρά, νησάκια, αγκυροβολημένα πλοία, ναύδετα), των οποίων είναι επιθυμητό να βρεθεί το CPA.</p>","ty":"ap"},{"id":"26730-Θ","th":"26730","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός north-up και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 045° και 12 knots αντίστοιχα. Η ορατότητα που επικρατεί στην περιοχή είναι περιορισμένη, εντοπίζονται από το ραντάρ οι ακόλουθοι στόχοι, κατωτέρω θέσεις – χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th><th>Στόχος Γ</th></tr><tr><td>15:10</td><td>055° Τ - 10,7 ν.μ</td><td>043,5° Τ - 10,9 ν.μ.</td><td>034° Τ - 11,4 ν.μ.</td></tr><tr><td>15:15</td><td>055,5° Τ - 9,4 ν.μ.</td><td>044°Τ - 9 ν.μ.</td><td>035° Τ - 10,2 ν.μ.</td></tr><tr><td>15:20</td><td>055° Τ - 8,2 ν.μ.</td><td>044,5° Τ - 7,3 ν.μ.</td><td>036° Τ - 8,9 ν.μ.</td></tr><tr><td>15:25</td><td>055° Τ - 7 ν.μ.</td><td>044,5° Τ - 5,4 ν.μ.</td><td>037° Τ - 7,5 ν.μ.</td></tr></table>\n<p>Στην περιοχή υφίσταται ρεύμα με ανατολική διεύθυνση. Επίσης, ο στόχος Α ενημερώνει από το ραδιοτηλέφωνο ότι είναι αγκυροβολημένος λόγω προβλήματος που παρουσιάζει στις μηχανές. Η πληροφορία αυτή επιβεβαιώνεται από τις εκπεμπόμενες πληροφορίες για το στόχο, μέσω του Automatic Identification System (AIS) . Στις 15:30, ο ΑΦ αποφασίζει να εκτελέσει στροφή προς τα ΔΕ κατά 90° (θεωρείται ότι η αλλαγή αναπρωρήσεως, θα εκτελεσθεί άμεσα). Μετά την αλλαγή της αναπρωρήσεως, οι στόχοι έχουν τις ακόλουθες θέσεις:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th><th>Στόχος Γ</th></tr><tr><td>15:40</td><td>029° Τ – 5,3 ν.μ</td><td>001,5° Τ – 2,8 ν.μ.</td><td>025,5° Τ – 6,1 ν.μ.</td></tr><tr><td>15:45</td><td>016° Τ – 5,4 ν.μ.</td><td>337° Τ – 3,1 ν.μ.</td><td>019,5° Τ – 6,2 ν.μ.</td></tr><tr><td>15:50</td><td>006° Τ - 6 ν.μ.</td><td>320° Τ – 3,8 ν.μ.</td><td>013,5° Τ – 6,3 ν.μ.</td></tr><tr><td>15:55</td><td>358° Τ – 6,8 ν.μ.</td><td>308,5° Τ - 5 ν.μ.</td><td>017° Τ – 6,4 ν.μ.</td></tr></table>\n<p>Να αναφέρετε, αν ο ΑΦ ορθά αποφάσισε τη στροφή προς τα ΔΕ. Να αιτιολογήσετε την απάντησή σας με τις αντίστοιχες διατάξεις των ΔΚΑΣ.</p>","sol":"<p>Ορθά αποφάσισε τη στροφή προς τα ΔΕ ο ΑΦ, ώστε το πλοίο να συμμορφωθεί με τη διάταξη 19(δ)(ι), οπού αναφέρει ότι ο συνιστώμενος χειρισμός είναι η αλλαγή αναπρωρήσεως προς τα δεξιά. σε συνθήκες περιορισμένης ορατότητας, όπως αναλύεται στις παραγράφους 1.19(7) και με τον κανόνα 8 (ενότητα 6.4- Χειρισμός για την αποφυγή συγκρούσεως) όπου αναφέρει ότι όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου, αυτοί θα πρέπει να είναι ουσιώδεις – δραστικοί – σαφείς – διακριτοί σε όλες τις συνθήκες ορατότητας.</p>","ty":"pr"},{"id":"26731-Θ","th":"26731","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Να αναφέρετε:</p>\n<p><b>α)</b>τις παραμέτρους που είναι αναγκαίο να λαμβάνει υπόψη ο ΑΦ κατά την εκτέλεση της λειτουργίας της αποφυγής συγκρούσεων. <span class=pt>(Μονάδες 15)</span></p>\n<p><b>β)</b>με ποιο τρόπο είναι δυνατόν να πραγματοποιηθεί προσδιορισμός αυτών των παραμέτρων. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p><b> α)</b> Η παράμετρος αυτή είναι η ελάχιστη απόσταση, στην οποία θα προσεγγίσουν το πλοίο και ο στόχος και ονομάζεται πλησιέστερη ελάχιστη απόσταση προσεγγίσεως. Εκτός από την πλησιέστερη ελάχιστη απόσταση προσεγγίσεως, μία άλλη παράμετρος αρκετά σημαντική για την εκτίμηση του χρόνου που απομένει για να αναληφθούν οι διάφοροι χειρισμοί προς αποφυγή συγκρούσεως, είναι ο χρόνος κατά τον οποίο το πλοίο και ο στόχος θα βρίσκονται στην πλησιέστερη ελάχιστη απόσταση προσεγγίσεως, ο οποίος ονομάζεται χρόνος στην πλησιέστερη απόσταση προσεγγίσεως.</p>\n<p><b>β)</b> Ο προσδιορισμός αυτών είναι δυνατόν να πραγματοποιηθεί χρησιμοποιώντας</p>\n<p>1. Παρουσίαση σχετικής κινήσεως του στόχου ως προς το πλοίο, με σταθεροποιημένο ή όχι προσανατολισμό στο ραντάρ.</p>\n<p>2. Παρουσίαση αληθούς κινήσεως ως προς το νερό του πλοίου-στόχου στο ραντάρ.</p>","ty":"ap"},{"id":"26733-Θ","th":"26733","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός north-up και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 329° και 10 knots αντίστοιχα. Στη συνέχεια εντοπίζεται ο ακόλουθος στόχος, στις ακόλουθες θέσεις – χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<p>α)20:30: Δ = 356° Τ - Α = 11,2 ν.μ..</p>\n<p>β) 20:36: Δ = 358° Τ - Α = 10,3 ν.μ..</p>\n<p>γ) 20:42: Δ = 001° Τ - Α = 9,4 ν.μ..</p>\n<p>δ) 20:48: Δ = 005° Τ - Α = 8,5 ν.μ..</p>\n<p>ε) 20:54: Δ = 005° Τ - Α = 7,4 ν.μ..</p>\n<p>στ) 21:00: Δ = 005° Τ - Α = 6,1 ν.μ..</p>\n<p>Ο ΑΦ αποφασίζει στις 21:00 να αλλάξει την αναπρώρηση και να στρέψει προς τα ΔΕ μέχρι 030°. Μετά τη στροφή αυτή και στο χρόνο 21:12, αναλαμβάνει ξανά την αρχική αναπρώρηση το πλοίο. Επίσης μετά την ανάληψη της αρχικής αναπρωρήσεως, ο στόχος βρίσκεται επί της γραμμής της πλώρης και σε απόσταση 3,8 ν.μ.. Στην περιοχή υφίστανται συνθήκες περιορισμένης ορατότητας.</p>\n<p>Να αναφέρετε αν συμφωνείτε με την εκτέλεση του χειρισμού. Επεξηγήστε την απάντησή σας.</p>","sol":"<p>Ορθά αποφάσισε τη στροφή προς τα ΔΕ ο ΑΦ, ώστε το πλοίο να συμμορφωθεί με τη διάταξη 19(δ)(ι), οπού αναφέρει ότι ο συνιστώμενος χειρισμός είναι η αλλαγή αναπρωρήσεως προς τα δεξιά, όμως η στροφή θα έπρεπε να είναι μεγαλύτερη και πιο ουσιώδης διότι ο κανόνας 8 (ενότητα 6.4 - Χειρισμός για την αποφυγή συγκρούσεως) αναφέρει ότι όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου, αυτοί θα πρέπει να είναι ουσιώδεις – δραστικοί – σαφείς – διακριτοί σε όλες τις συνθήκες ορατότητας.</p>","ty":"pr"},{"id":"26735-4.1","th":"26735","part":"4.1","k":"calc","secs":["6"],"p":20,"q":"<p>Πλοίο το οποίο πλέει σε περιοχή περιορισμένης ορατότητας διαπιστώνεται από τον ΑΦ ότι στην οθόνη του ραντάρ εμφανίζεται στόχος που δεν μπορεί να εντοπιστεί οπτικά από τον ΑΦ. Ποια είναι η ειδική υποχρέωση που έχει η ομάδα της γέφυρας, έτσι ώστε να προβεί στη διερεύνηση της ύπαρξης ή μη κινδύνου συγκρούσεως.</p>","sol":"<p>Στις περιπτώσεις που ένας στόχος εντοπισθεί μόνο από το ραντάρ, η διάταξη 19(δ) καθορίζει ότι η ομάδα γέφυρας κάθε πλοίου έχει την ειδική υποχρέωση της διερευνήσεως και διαπιστώσεως τις τυχόν αναπτύξεως καταστάσεως επικίνδυνης προσεγγίσεως. Προς εκπλήρωση της εν λόγω υποχρεώσεως, η ομάδα γέφυρας οφείλει να υποτυπώνει το στόχο και να προσδιορίζει με τις κατάλληλες μεθόδους το CPA και το χρόνο TCPA αυτού.</p>","ty":"ap"},{"id":"26735-4.2","th":"26735","part":"4.2","k":"calc","secs":["6"],"p":5,"q":"<p>Να ορίσετε δύο (2) παράγοντες που πρέπει να ληφθούν υπόψη, ώστε να μπορεί να χαρακτηριστεί μία προσέγγιση ως επικίνδυνη.</p>","sol":"<p>1) Σχετική θέση του στόχου, ως προς το πλοίο. 2) Γεωγραφική θέση του πλοίου. 3) Ελικτικά στοιχεία του πλοίου. 4) Πυκνότητα της θαλάσσιας κυκλοφορίας.</p>","ty":"ap"},{"id":"26738-4.1","th":"26738","part":"4.1","k":"calc","secs":["5β"],"p":10,"q":"<p>Να προσδιορίσετε το σημαντικότερο πλεονέκτημα της μετρήσεως αποστάσεως από το ραντάρ όταν δεν υπάρχει δυνατότητα ακριβούς μετρήσεως αυτής οπτικά.</p>","sol":"<p>Το σημαντικότερο πλεονέκτημα της μετρήσεως αποστάσεως από το ραντάρ είναι ότι δεν υπάρχει δυνατότητα ακριβούς μετρήσεως αυτής οπτικά, καθώς η απόσταση οπτικά εκτιμάται από τον παρατηρητή και όπως είναι κατανοητό, διαφέρει από παρατηρητή σε παρατηρητή. Επίσης, η μέτρηση με το ραντάρ πραγματοποιείται και σε συνθήκες περιορισμένης ορατότητας, στο σκοτάδι και εν γένει σε οποιεσδήποτε συνθήκες ορατότητας. Τούτο το πλεονέκτημα καθιστά ιδιαιτέρα σημαντικό το ραντάρ, στην εκτίμηση της υπάρξεως κινδύνου συγκρούσεως.</p>","ty":"ap"},{"id":"26738-4.2","th":"26738","part":"4.2","k":"calc","secs":["5β"],"p":15,"q":"<p>Η ακρίβεια της αποστάσεως στα ραντάρ Ναυτιλίας κυμαίνεται μέχρι 30 m ή δεν υπερβαίνει το 1% της μέγιστης απόστασης της χρησιμοποιούμενης κλίμακας. Πώς μπορεί να μετρηθεί η αναφερόμενη ακρίβεια που απαιτείται να υπάρχει σύμφωνα με τις προδιαγραφές που έχουν υιοθετηθεί από τον ΙΜΟ;</p>","sol":"<p>Η αναφερόμενη ακρίβεια που απαιτείται να υπάρχει μπορεί να μετρηθεί είτε: Με το σημειωτή μεταβολής αποστάσεως (VRM). Με τους κύκλους αποστάσεως. Με τον κέρσορα.</p>","ty":"ap"},{"id":"26741-Θ","th":"26741","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως και έχει επιλεγεί προσανατολισμός heads-up (μη σταθεροποιημένος). Το πλοίο έχει αναπρώρηση 090° και διατηρεί ταχύτητα διά μέσου του νερού 9 knots. Στη συνέχεια εντοπίζονται οι ακόλουθοι στόχοι:</p>\n<p>α) Προς Δ (διόπτευση) = 122° R (σχετική) και Α (απόσταση) = 8 ν.μ..</p>\n<p>β) Προς Δ = 098° R και Α = 7 ν.μ..</p>\n<p>γ) Προς Δ = 215° R και Α = 7 ν.μ..</p>\n<p>δ) Προς Δ = 029° R και Α = 9 ν.μ..</p>\n<p>ε) Προς Δ = 319° R και A = 6 ν.μ..</p>\n<p>Ζητείται να βρεθεί η αληθής διόπτευση των στόχων.</p>","sol":"<p>α)Δ=122°+090°=212°Τ.</p>\n<p>β)Δ=098°+090°=188°Τ.</p>\n<p>γ)Δ=215°+090°=305°Τ.</p>\n<p>δ)Δ=029°+090°=119°Τ.</p>\n<p>ε)Δ=319°+090°=409° - 360°=049°Τ.</p>","ty":"ap"},{"id":"26821-Θ","th":"26821","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Οι παρεχόμενες πληροφορίες από την υποτύπωση είναι απαραίτητες στον ΑΦ, για την συμμόρφωση του πλοίου με τους ΔΚΑΣ 72, την διαμόρφωση της απαιτούμενης στρατηγικής για την αποφυγή συγκρούσεων και την εξασφάλιση της ασφάλειας του πλου και εν γένει της ναυσιπλοΐας.</p>\n<p>Να αναφέρετε τον λόγο που καθορίζει την αναγκαιότητα χρησιμοποίησης του ραντάρ σε συνδυασμό με την συσκευή Automatic Radar Plotting-Aids (ARPA).</p>","sol":"<p>Στους ΔΚΑΣ 72, σε αρκετά σημεία των κανόνων γίνεται μνεία για τη χρησιμοποίηση του ραντάρ στην αποφυγή συγκρούσεως. Απ’ την εν λόγω διαδικασία κατανοείται η αξία της χρήσεως της συσκευής ARPA για την εύκολη παροχή πληροφοριών για την κίνηση των στόχων, διότι αλλιώς απαιτείται η παροχή αυτών μετά από μια επίπονη και χρονοβόρα διαδικασία υποτυπώσεως.</p>","ty":"ap"},{"id":"26825-4.1","th":"26825","part":"4.1","k":"calc","secs":["6"],"p":20,"q":"<p>Να αναφέρετε:</p>\n<p><b>α)</b> Για ποιο λόγο σχεδιάστηκε και χρησιμοποιείται το ραντάρ για την αποφυγή συγκρούσεως.</p>\n<p><b>β)</b> Τους τρόπους χρησιμοποιήσεως του ραντάρ και της Automatic Radar Plotting-Aids (ARPA) σύμφωνα με τις ενέργειες που προβλέπονται από το ΔΚΑΣ.</p>","sol":"<p><b>α)</b>Το ραντάρ σχεδιάστηκε προκειμένου να παρέχει προειδοποίηση στους ναυτιλλόμενους, όσον αφορά στην ύπαρξη στόχων στην επιφάνεια του νερού, όπως επίσης και για παροχή πληροφοριών απαραιτήτων για την αποφυγή συγκρούσεως, ιδιαίτερα σε περιοχές όπου επικρατούν συνθήκες περιορισμένης ορατότητας. Με την ανάπτυξη των πλοίων και την αύξηση της ταχύτητάς τους, η χρησιμοποίηση αυτού καθίσταται ιδιαίτερα σημαντική ή απαραίτητη και σε συνθήκες καλής ορατότητας, ως ένα επιπρόσθετο μέσο για την εκτέλεση της απαιτούμενης κατάλληλης επιτηρήσεως.</p>\n<p><b>β)</b>Σε συνθήκες περιορισμένης, αλλά και καλής ορατότητας και για την κατάλληλη επιτήρηση (ειδικά το βράδυ).</p>","ty":"ap"},{"id":"26825-4.2","th":"26825","part":"4.2","k":"calc","secs":["6"],"p":5,"q":"<p>Να προσδιορίσετε τις ενέργειες που προβλέπονται σύμφωνα με το ΔΚΑΣ, ώστε να εξασφαλιστεί η αποτελεσματικότητα των χειρισμών κατά την χρήση του ραντάρ και της Automatic Radar Plotting-Aids (ARPA).</p>","sol":"<p>Για την εξασφάλιση της αποτελεσματικότητας των χειρισμών πρέπει να εκτελούνται συνεχώς :</p>\n<p>1. Εκτέλεση υποτυπώσεως και ελέγχου της σχετικής κινήσεως.</p>\n<p>2. Εκτέλεση συνεχούς παρακολουθήσεως των αλλαγών των στοιχείων των στόχων στην αληθή κίνηση ως προς το νερό.</p>","ty":"ap"},{"id":"26826-4.1","th":"26826","part":"4.1","k":"calc","secs":["5β"],"p":10,"q":"<p>Να εντοπίσετε τον προσανατολισμό της εικόνας του ραντάρ. Και να εντοπίσετε το πλεονέκτημα αυτού του προσανατολισμού σύμφωνα με το σχήμα.</p>\n<img class=\"fig\" src=\"img/26826_f1.png\" alt=\"\">","sol":"<p>Στο σχήμα το είδος προσανατολισμού της εικόνας του ραντάρ είναι αληθής βορράς true North up. Το πλεονέκτημα του προσανατολισμού true north up, είναι ότι η εικόνα ταυτίζεται με την εικόνα του ναυτιλιακού χάρτη της περιοχής και για αυτό το λόγο προτιμάται από ορισμένους ναυτιλλόμενους.</p>","ty":"ap"},{"id":"26826-4.2","th":"26826","part":"4.2","k":"calc","secs":["5β"],"p":15,"q":"<p>Να περιγράψετε όλα τα πλεονεκτήματα του προσανατολισμού αληθή βορρά (<b>true north </b> <b>up)</b>.</p>","sol":"<p>Τα πλεονεκτήματα του προσανατολισμού αληθή βορρά είναι:</p>\n<p>- Εξαλείφει τα προβλήματα που δημιουργεί ο προσανατολισμός head-up με τις γωνιακές μετατοπίσεις της εικόνας του ραντάρ.</p>\n<p>- Η εικόνα ταυτίζεται με την εικόνα του ναυτιλιακού χάρτη της περιοχής και για αυτό το λόγο ο προσανατολισμός αυτός προτιμάται από ορισμένους ναυτιλλόμενους.</p>\n<p>- Δεν μετακινούνται οι ακτές και οι στόχοι σε κάθε αλλαγή της αναπρωρήσεως του πλοίου ιδιαίτερα σε θαλασσοταραχή ή κακές καιρικές συνθήκες και έτσι είναι εύκολη και άμεση η εύρεση της αληθούς διοπτεύσεως οποιουδήποτε στόχου όσον αφορά στην επίδραση του προσανατολισμού north-up στην παρουσίαση της σχετικής κινήσεως.</p>\n<p>Ο αναφερόμενος προσανατολισμός εξαλείφει το πρόβλημα της ασυνέχειας και σχετικής κινήσεως που υφίσταται στον προσανατολισμό head-up όταν αλλάζει το πλοίο αναπρώρηση.</p>","ty":"ap"},{"id":"26827-4.1","th":"26827","part":"4.1","k":"calc","secs":["4"],"p":10,"q":"<p>Να προσδιορίσετε σύμφωνα με την περιγραφή των βασικών αρχών-διαδικασιών λειτουργίας της ομάδας γέφυρας τι προβλέπετε για την σύσταση της.</p>","sol":"<p>Όλο το προσωπικό, στο οποίο ανατίθενται καθήκοντα εκτελέσεως φυλακής γεφύρας αποτελούν μέλη της ομάδας γεφύρας. Ο πλοίαρχος και ο πλοηγός(οι), όπως απαιτείται, θα υποστηρίζονται από την ομάδα γέφυρας, η οποία αποτελείται από τον ΑΦ, τον πηδαλιούχο και τον οπτήρα ή και από οποιοδήποτε άλλο μέλος απαιτηθεί. Η επάνδρωση της ομάδας γεφύρας θα πρέπει να γίνεται με αποτελεσματικό τρόπο από το διαθέσιμο προσωπικό, ώστε όταν τηρούνται οι καθορισθείσες διαδικασίες εργασίας, να ελαχιστοποιούνται οι κίνδυνοι και τα πλοία να ναυσιπλοούν ασφαλώς.</p>","ty":"ap"},{"id":"26827-4.2","th":"26827","part":"4.2","k":"calc","secs":["4"],"p":15,"q":"<p>Να καταγράψετε σύμφωνα με την περιγραφή των βασικών αρχών-διαδικασιών λειτουργίας της ομάδας γέφυρας τι προβλέπετε ως προς τον καθορισμό των καθηκόντων της.</p>","sol":"<p>Ο ΑΦ είναι ο υπεύθυνος της γέφυρας και τα μέλη της ομάδας γέφυρας είναι υπεύθυνα για την τήρηση φυλακής, μέχρι να αντικατασταθούν. Η ανάθεση των καθηκόντων θα πρέπει να είναι σαφής, να περιορίζεται μόνο σ’ αυτά που είναι εφικτό να πραγματοποιούνται αποτελεσματικά και επίσης να προσδιορίζεται με σαφήνεια, η προτεραιότητα εκτελέσεώς τους. Τα μέλη της ομάδας γεφύρας θα πρέπει να επιβεβαιώνουν ότι κατανοούν τα έργα και τα καθήκοντα που τους ανατίθενται. Η θετική αναφορά εκτελέσεως των αναλαμβανομένων έργων και καθηκόντων, είναι ένας τρόπος του ελέγχου της αποδόσεως των μελών της ομάδας γεφύρας και του εντοπισμού της τυχόν μειώσεως της αποδόσεως τους, για την εκτέλεση φυλακής.</p>","ty":"ap"},{"id":"26828-Θ","th":"26828","part":"","k":"calc","secs":["4"],"p":25,"q":"<p>Παραπλέον πλοίο το οποίο φέρει φανούς αγκυροβολίας παρατηρήθηκε από τον ΑΦ ότι κινείται με μεγάλη ταχύτητα. Τι θα πρέπει να λάβει υπόψη του ο ΑΦ σύμφωνα με τα οριζόμενα από την τήρηση φυλακής για την αναγνώριση των σχημάτων και ηχητικών σημάτων;</p>","sol":"<p>Ο ΑΦ οφείλει να συμμορφώνεται με τα προβλεπόμενα στους ΔΚΑΣ 72. Η συμμόρφωση αυτή δεν αφορά μόνο στους κανόνες χειρισμού και πλεύσεως, αλλά και στην αναγνώριση και στην επίδειξη των προβλεπόμενων φανών και σχημάτων, όπως και στη σήμανση των κατάλληλων ηχητικών και φωτεινών σημάτων. Πάντοτε θα πρέπει να επιτηρούνται τα προσεγγίζοντα παραπλέοντα πλοία και ο ΑΦ να έχει κατά νου ότι ενδεχομένως κάποια πλοία να επιδεικνύουν μη ορθά σχήματα και φανούς ή τα επιδεικνυόμενα σχήματα να επαίρονται σε τέτοια θέση που να αποκρύπτονται από τις υπερκατασκευές τους, όταν αυτά προσεγγίζουν από συγκεκριμένες κατευθύνσεις.</p>","ty":"pr"},{"id":"28359-Θ","th":"28359","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Με δεδομένο ότι είστε παραλαμβάνων Αξιωματικός, να αναπτύξετε τα στοιχεία, τα οποία οφείλετε να ενημερωθείτε προσωπικά κατά την παραλαβή φυλακής γεφύρας.</p>","sol":"<p>Ως παραλαμβάνων Αξιωματικός οφείλω να ενημερωθώ προσωπικά κατά την παραλαβή φυλακής γεφύρας, για τα εξής:</p>\n<p class=in>- Τις μόνιμες και ειδικές οδηγίες του πλοιάρχου που αφορούν στην ναυσιπλοΐα του πλοίου</p>\n<p class=in>- Το στίγμα, την αναπρώρηση-πορεία προς το βυθό (COG), την ταχύτητα (STW και SOG) και το βύθισμα του πλοίου.</p>\n<p class=in>- Τις επικρατούσες και τις αναμενόμενες συνθήκες, όσον αφορά την παλίρροια, τα ρεύματα, τις καιρικές συνθήκες, την ορατότητα και την επίδραση αυτών των παραγόντων στην τηρούμενη πορεία ως προς το βυθό (COG) και ταχύτητα (SOG) ως προς το βυθό.</p>\n<p class=in>- Τις διαδικασίες για τη χρήση των κυρίων μηχανών προς εκτέλεση χειρισμών, όταν ο έλεγχος των κυρίων μηχανών πραγματοποιείται από τη γέφυρα.</p>\n<p class=in>- Τη ναυτιλιακή κατάσταση, στην οποία περιλαμβάνονται χωρίς να περιορίζονται μόνο σε αυτά, τα ακόλουθα:</p>\n<p class=in>• Η λειτουργική κατάσταση όλο του ναυτιλιακού εξοπλισμού και του εξοπλισμού ασφαλείας, ο οποίος χρησιμοποιείται είναι πιθανό να χρησιμοποιηθεί, κατά τη διάρκεια της φυλακής.</p>\n<p class=in>• Τα σφάλματα της γυροσκοπικής και μαγνητικής πυξίδας (απόκλιση και παρεκτροπή δηλαδή την παραλλαγή).</p>\n<p class=in>• Η θέση και η κίνηση των πλοίων των ευρισκομένων «ενόψει» ή αυτών που είναι γνωστό ότι ευρίσκονται στην γειτνιάζουσα περιοχή.</p>\n<p class=in>• Οι συνθήκες και οι κίνδυνοι, που είναι πιθανόν να συναντήσει το πλοίο κατά διάρκεια της φυλακής.</p>\n<p class=in>• Οι πιθανές συνέπειες λόγω της εγκάρσιας κλίσεως, της διαγωγής, της πυκνότητας του νερού και της επιβυθίσεως του πλοίου.</p>","ty":"ap"},{"id":"28360-Θ","th":"28360","part":"","k":"calc","secs":["2α"],"p":25,"q":"<p>Κάθε σύστημα, το οποίο καθορίζει σε μια θαλάσσια περιοχή, μία ή περισσότερες πορείες προς το βυθό (COG) κυκλοφοριακής ροής ή μέτρα πορειογραφήσεως, με σκοπό τη μείωση των ναυτικών ατυχημάτων και απωλειών, ονομάζεται σύστημα πορειογραφήσεως (routeing system).</p>\n<p>Να αναφέρετε πέντε (5) παραδείγματα που είναι δυνατόν να περιλαμβάνονται στα συστήματα πορειογραφήσεως.</p>","sol":"<p>Πέντε από τα εξής:</p>\n<p class=in>1. Συστήματα διαχωρισμού θαλάσσιας κυκλοφορίας (traffic separation schemes).</p>\n<p class=in>2. Διάδρομους κυκλοφορίας διπλής κατευθύνσεως (two-way routes).</p>\n<p class=in>3. Συνιστώμενες πορείες ως προς το βυθό (COG) κυκλοφοριακής ροής(recommended tracks).</p>\n<p class=in>4. Περιοχές που πρέπει να αποφευχθούν (areas to be avoided).</p>\n<p class=in>5. Περιοχές, στις οποίες πρέπει να αποφεύγεται η αγκυροβολία (no anchoring areas).</p>\n<p class=in>6. Ζώνες παράκτιας κυκλοφορίας (inshore traffic zones).</p>\n<p class=in>7. Κόμβος-διασταυρώσεις κυκλοστρεφούς κυκλοφορίας (roundabouts).</p>\n<p class=in>8. Περιοχές προφυλάξεως (precautionary areas).</p>\n<p class=in>9. Θαλάσσιους διαδρόμους-οδούς βαθέων υδάτων (deep water routes).</p>","ty":"ap"},{"id":"28361-Θ","th":"28361","part":"","k":"calc","secs":["2α"],"p":25,"q":"<p>Σύμφωνα με το σκοπό της πορειογραφήσεως, των πλοίων για την επαύξηση της ασφάλειας της ναυσιπλοΐας, οι αντικειμενικοί στόχοι κάθε συγκεκριμένου συστήματος πορειογραφήσεως πλοίων εξαρτώνται από τις ιδιαίτερες επικίνδυνες περιστάσεις, τις οποίες καλείται να εξομαλύνει.</p>\n<p>Να προσδιορίσετε πέντε (5) στόχους που μπορεί να περιλαμβάνονται.</p>","sol":"<p>Πέντε από τους ακόλουθους στόχους:</p>\n<p>1)Διαχωρισμός των αντίθετων ρευμάτων κυκλοφορίας</p>\n<p>2)Μείωση των κίνδυνων συγκρούσεων των πλοίων</p>\n<p>3)Απλοποίηση των διαφόρων κατευθύνσεων των κυκλοφοριακών ροών</p>\n<p>4)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές εκτελέσεως έρευνας ή εκμεταλλεύσεως των υποθαλασσίων πηγών έρευνας</p>\n<p>5)Οργάνωση ασφαλούς κυκλοφοριακής ροής όντος ή γύρω από τις περιοχές</p>\n<p>6)Οργάνωση ασφαλούς κυκλοφοριακής ροής σε περιοχές που είναι ευαίσθητες περιβαλλοντολογικά ή γύρω σε ασφαλή απόσταση απ’ αυτές</p>\n<p>7)Μείωση του κίνδυνου προσαράξεως</p>\n<p>8)Καθοδήγηση της κυκλοφορίας μακριά από περιοχές αλιείας</p>","ty":"ap"},{"id":"28362-Θ","th":"28362","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Με δεδομένο ότι είστε ο Αξιωματικός φυλακής γεφύρας, να αναπτύξετε τους λειτουργικούς και τους περιοδικούς ελέγχους που οφείλετε να προβείτε κατά την εκτέλεση φυλακής γέφυρας.</p>","sol":"<p>Οι λειτουργικοί έλεγχοι του διαθέσιμου επί του πλοίου ναυτιλιακού εξοπλισμού, θα πρέπει να εκτελούνται εν πλω, όσο συχνά είναι πρακτικά εφικτό και όταν οι περιστάσεις το επιτρέπουν, ιδιαίτερα δε πριν το πλοίο πλεύσει σε περιοχές όπου αναμένονται κίνδυνοι, που επηρεάζουν τη ναυσιπλοΐα. Οποτεδήποτε είναι πρακτικό, τα αποτελέσματα των εν λόγω έλεγχων πρέπει να καταγράφονται. Επίσης οι προβλεπόμενοι έλεγχοι θα εκτελούνται πριν τον κατάπλου και απόπλου από το λιμάνι.</p>\n<p>Περιοδικοί έλεγχοι:</p>\n<p class=in>- Ο πηδαλιούχος ή το αυτόματο πηδάλιο τηρεί την ορθή αναπρώρηση.</p>\n<p class=in>- Η παραλλαγή (παρεκτροπή και απόκλιση) της μαγνητικής πυξίδας υπολογίζεται τουλάχιστον μια φορά για κάθε φυλακή και όταν είναι αυτό εφικτό μετά από κάθε μεγάλη μεταβολή της πορείας ως προς το βυθό (COG). Οι ενδείξεις της μαγνητικής και της γυροσκοπικής πυξίδας πρέπει συχνά να συγκρίνονται, όπως επίσης και οι επαναλήπτες της γυροπυξίδας να συγχρονίζονται με την κύρια γυροπυξίδα.</p>\n<p class=in>- Είναι δυνατή η απρόσκοπτη ανάληψη του πηδαλίου σε χειροκίνητη λειτουργία όταν κατά τη διάρκεια της φυλακής τούτο συνεχώς λειτουργεί αυτόματα. Γι’ αυτό λοιπόν απαιτείται ο έλεγχος χειροκίνητης λειτουργίας να εκτελείται τουλάχιστον μια φορά σε κάθε φυλακή.</p>\n<p class=in>- Οι φανοί ναυσιπλοΐας, οι φανοί σημάνσεως και ο υπόλοιπος ναυτιλιακός εξοπλισμός λειτουργούν κανονικά.</p>\n<p class=in>- Ο επικοινωνιακός εξοπλισμός του λειτουργεί κανονικά.</p>\n<p class=in>- Τα χειριστήρια του ελέγχου του μη επανδρωμένου προωστήριου σκεύους (UMS), τα συστήματα προειδοποιήσεως κινδύνου και οι ενδείκτες λειτουργούν κανονικά.</p>","ty":"ap"},{"id":"28363-Θ","th":"28363","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Με δεδομένο ότι είστε ο παραλαμβάνων Αξιωματικός φυλακής καταστρώματος, πέρα από εκείνα που οφείλετε να ενημερωθείτε από τον παραδίδοντα Αξιωματικό, να προσδιορίσετε τι θα πρέπει να ελέγξετε-επιβεβαιώσετε πριν την ανάληψη φυλακής καταστρώματος.</p>","sol":"<p>1. Η στερέωση των αγόμενων προσδέσεως και της αλυσίδας είναι επαρκής.</p>\n<p>2. Επιδεικνύονται οι προβλεπόμενοι φανοί ή σημαίνονται τα προβλεπόμενα ηχητικά σήματα.</p>\n<p>3. Τηρούνται τα μέτρα ασφαλείας και οι κανόνες πυροπροστασίας.</p>\n<p>4. Είναι ενημερωμένοι για το είδος οποιουδήποτε επικίνδυνου ή επιβλαβούς φορτίου το οποίο φορτώνεται ή εκφορτώνεται, όπως επίσης και για τις κατάλληλες ενέργειες που πρέπει να αναληφθούν σε περίπτωση διαρροής ή πυρκαγιάς.</p>\n<p>5. Το πλοίο δεν διακινδυνεύει από καμία εξωτερική συνθήκη ή περίσταση, όπως και ότι αυτό δεν θέτει σε κίνδυνο άλλα.</p>","ty":"ap"},{"id":"28619-Θ","th":"28619","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Έχετε ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως με προσανατολισμό τον βορρά άνω (north-up) και κλίμακα 12 ν.μ.. Το πλοίο έχει αναπρώρηση 000° και διατηρεί ταχύτητα διά μέσου του νερού 20 κόμβους (knots). Στη συνέχεια εντοπίζεται ένας στόχος, στις ακόλουθες θέσεις - χρόνους:</p>\n<p>α) 18:50: Δ = 056° R (σχετική) - Α (απόσταση) = 11,9 ν.μ..</p>\n<p>β) 18:56: Δ = 048° R - Α = 4,7 ν.μ..</p>\n<p>Ζητείται να βρεθεί αν ο προσανατολισμός είναι σταθεροποιημένος ή όχι.</p>","sol":"<p>Είναι σταθεροποιημένος, διότι το ραντάρ λαμβάνει από τη γυροπυξίδα την αναπρώρηση του πλοίου και έτσι σταθεροποιείται η εικόνα του [παράγρ. 5.5.2(2)].</p>","ty":"pr"},{"id":"28620-Θ","th":"28620","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Έχετε ενεργοποιήσει το ραντάρ σε παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το νερό και με προσανατολισμό τον βορρά άνω (north-up) σε κλίμακα 12 ν.μ.. Το πλοίο έχει αναπρώρηση 001° και διατηρεί ταχύτητα διά μέσου του νερού 21 κόμβους (knots). Στη συνέχεια εντοπίζεται ένας στόχος, στις ακόλουθες θέσεις - χρόνους:</p>\n<p>α) 11:22: Δ = 048° T (αληθής) - Α (απόσταση) = 11,8 ν.μ..</p>\n<p>β) 11:28: Δ = 041° T (αληθής) - Α (απόσταση) = 4,1 ν.μ..</p>\n<p>Ζητείται να βρεθεί αν ο προσανατολισμός είναι σταθεροποιημένος ή όχι.</p>","sol":"<p>Είναι σταθεροποιημένος, διότι το ραντάρ λαμβάνει από τη γυροπυξίδα την αναπρώρηση του πλοίου και έτσι σταθεροποιείται η εικόνα του [παράγρ. 5.5.2(2)].</p>","ty":"pr"},{"id":"28621-Θ","th":"28621","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Έχετε ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως με προσανατολισμό τον βορρά άνω (north-up). Η αναπρώρηση και η ταχύτητα διά μέσου του νερού είναι 156° και 9 κόμβους (knots) αντίστοιχα. Στη συνέχεια εντοπίζονται οι ακόλουθοι στόχοι, στις κατωτέρω θέσεις - χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th></tr><tr><td>12.50</td><td>156° Τ - 7,3 ν.μ</td><td>325° Τ - 4,5 ν.μ.</td></tr><tr><td>12.56</td><td>155° Τ - 5,2 ν.μ.</td><td>320° Τ - 3,7 ν.μ.</td></tr><tr><td>13.03</td><td>155° Τ - 3,8 ν.μ</td><td>312° Τ - 3,1 ν.μ.</td></tr></table>\n<p>Από την παρατήρηση και μόνο των θέσεων των στόχων, ζητείται να προσδιορισθεί ποιος από αυτούς είναι ο πλέον επικίνδυνος και να αιτιολογήσετε την απάντησή σας.</p>","sol":"<p>Ο στόχος Α είναι ο πλέον επικίνδυνος, διότι ξέρουμε ότι όταν η διόπτευση (αληθής ή σχετική) του προσεγγίζοντος στόχου παραμένει σταθερή ή δεν μεταβάλλεται αισθητά και η απόσταση πλοίου - στόχου μειώνεται, τότε τα πλοία πλέουν προς σύγκρουση ή πλησιάζουν σε επικίνδυνη απόσταση.</p>","ty":"pr"},{"id":"28622-Θ","th":"28622","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Έχετε ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως με προσανατολισμό τον βορρά άνω (north-up). Η αναπρώρηση και η ταχύτητα διά μέσου του νερού είναι 185° και 11 κόμβους (knots) αντίστοιχα. Η ορατότητα που επικρατεί στην περιοχή είναι περιορισμένη και εντοπίζονται από το ραντάρ οι ακόλουθοι στόχοι στις κατωτέρω θέσεις – χρόνους:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th><th>Στόχος Γ</th></tr><tr><td>09:10</td><td>195° Τ - 10,5 ν.μ</td><td>183,5° Τ - 10,6 ν.μ.</td><td>174° Τ - 11,1 ν.μ.</td></tr><tr><td>09:15</td><td>195,5° Τ - 9,2 ν.μ.</td><td>184°Τ - 9 ν.μ.</td><td>175° Τ - 10 ν.μ.</td></tr><tr><td>09:20</td><td>195° Τ - 8 ν.μ.</td><td>184,5° Τ - 7,1 ν.μ.</td><td>176° Τ - 8,7 ν.μ.</td></tr><tr><td>09:25</td><td>195° Τ – 6,9 ν.μ.</td><td>184,5° Τ - 5,1 ν.μ.</td><td>177° Τ - 7,3 ν.μ.</td></tr></table>\n<p>Στην περιοχή υφίσταται ρεύμα με ανατολική διεύθυνση. Επίσης, ο στόχος Α ενημερώνει από το ραδιοτηλέφωνο ότι είναι αγκυροβολημένος λόγω προβλήματος που παρουσιάζει στις μηχανές. Η πληροφορία αυτή επιβεβαιώνεται από τις εκπεμπόμενες πληροφορίες για το στόχο, μέσω του Αυτόματου Συστήματος Αναγνώρισης-Προσδιορισμού θέσης (Automatic Identification System- AIS). Στις 09:30, ο ΑΦ αποφασίζει να εκτελέσει στροφή προς τα ΑΡ κατά 90° (θεωρείται ότι η αλλαγή αναπρωρήσεως θα εκτελεσθεί άμεσα).</p>\n<p>Να αναφέρετε, αν ο ΑΦ ορθά αποφάσισε τη στροφή προς τα ΑΡ. Να αιτιολογήσετε την απάντησή σας σύμφωνα με τις αντίστοιχες διατάξεις των Διεθνών Κανονισμών Αποφυγής Συγκρούσεων (ΔΚΑΣ).</p>","sol":"<p>Σε συνθήκες περιορισμένης ορατότητας, στις παραγράφους 1.19(7) και στον κανόνα 8 (ενότητα 6.4- Χειρισμός για την αποφυγή συγκρούσεως) αναφέρει ότι όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου, αυτοί θα πρέπει να είναι ουσιώδεις – δραστικοί – σαφείς – διακριτοί σε όλες τις συνθήκες ορατότητας αλλά ο ΑΦ αποφάσισε λάθος για τον χειρισμό της στροφή προς τα ΑΡ γιατί σύμφωνα με τη διάταξη 19(δ)(ι) ο συνιστώμενος χειρισμός είναι η αλλαγή αναπρωρήσεως προς τα δεξιά.</p>","ty":"pr"},{"id":"28626-Θ","th":"28626","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Έχετε ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως με προσανατολισμό τον βορρά άνω (north-up). Η αναπρώρηση και η ταχύτητα διά μέσου του νερού είναι 229° και 11 κόμβους (knots) αντίστοιχα. Στη συνέχεια εντοπίζεται στόχος, στις ακόλουθες θέσεις – χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<p>α) 17:30: Δ = 256° Τ - Α = 11,1 ν.μ.</p>\n<p>β) 17:36: Δ = 258° Τ - Α = 10,2 ν.μ.</p>\n<p>γ) 17:42: Δ = 261° Τ - Α = 9,3 ν.μ.</p>\n<p>δ) 17:48: Δ = 266° Τ - Α = 8,4 ν.μ.</p>\n<p>ε) 17:54: Δ = 266° Τ - Α = 7,3 ν.μ.</p>\n<p>στ) 18:00: Δ = 266° Τ - Α = 6 ν.μ.</p>\n<p>Ο ΑΦ αποφασίζει στις 18:00 να αλλάξει την αναπρώρηση και να στρέψει προς τα ΑΡ μέχρι 030°. Μετά τη στροφή αυτή και σε χρόνο 18:12, αναλαμβάνει ξανά την αρχική αναπρώρηση το πλοίο. Επίσης, μετά την ανάληψη της αρχικής αναπρωρήσεως, ο στόχος βρίσκεται επί της γραμμής της πλώρης και σε απόσταση 3,6 ν.μ.. Στην περιοχή υφίστανται συνθήκες περιορισμένης ορατότητας.</p>\n<p>Συμφωνείτε με την εκτέλεση του χειρισμού; Επεξηγήστε την απάντησή σας.</p>","sol":"<p>Λάθος αποφάσισε τη στροφή προς τα ΑΡ ο ΑΦ, γιατί σύμφωνα με τη διάταξη 19(δ)(ι), ο συνιστώμενος χειρισμός είναι η αλλαγή αναπρωρήσεως προς τα δεξιά, και η στροφή θα έπρεπε να είναι μεγαλύτερη και πιο ουσιώδης διότι ο κανόνας 8 (ενότητα 6.4 - Χειρισμός για την αποφυγή συγκρούσεως) αναφέρει ότι όταν εκτελούνται χειρισμοί για την αποφυγή ενός άλλου πλοίου, αυτοί θα πρέπει να είναι ουσιώδεις – δραστικοί – σαφείς – διακριτοί σε όλες τις συνθήκες ορατότητας.</p>","ty":"pr"},{"id":"28629-Θ","th":"28629","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως και έχει επιλεγεί προσανατολισμός north-up και κλίμακα 12 ν.μ.. Στη συνέχεια εντοπίζεται ένας στόχος, στις ακόλουθες θέσεις - χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ ή ανακλαστικό υποτυπωτή:</p>\n<p>α) 10:30: Δ = 274° Τ (αληθή) – Α (απόσταση) = 12 ν.μ..</p>\n<p>β) 10:35 : Δ = 269° Τ - Α = 10,7 ν.μ..</p>\n<p>γ) 10:38 : Δ = 265,5° Τ - Α = 10 ν.μ..</p>\n<p>δ) 10:42 : Δ = 259° Τ - Α = 9 ν.μ..</p>\n<p>Ο ΑΦ αποφασίζει στις 11:00 να αλλάξει την αναπρώρηση και να στρέψει προς τα ΔΕ μέχρι 030°. Μετά τη στροφή αυτή και στο χρόνο 11:12, αναλαμβάνει ξανά την αρχική αναπρώρηση το πλοίο. Επίσης μετά την ανάληψη της αρχικής αναπρωρήσεως, ο στόχος βρίσκεται επί της γραμμής της πλώρης και σε απόσταση 3,1 ν.μ.. Στην περιοχή υφίστανται συνθήκες περιορισμένης ορατότητας.</p>\n<p>Να απαντήσετε αν απαιτείται ή όχι στην επίλυση, η αναπρώρηση και η ταχύτητα διά μέσου του νερού του πλοίου μας.</p>","sol":"<p>Όχι, διότι στην παρουσίαση της σχετικής κινήσεως για τους υπολογισμούς των στοιχειών σχετικής κινήσεως του στόχου και του CPA, δεν απαιτείται η γνώση της αναπρωρήσεως και της ταχύτητας διά μέσου του νερού του πλοίου μας.</p>","ty":"pr"},{"id":"33285-Θ","th":"33285","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Έστω ότι φορτηγό πλοίο βρίσκεται σε λιμάνι εκφόρτωσης και ενημερώνεται ο πλοίαρχος για νέο ταξίδι. Σύμφωνα μ’ αυτά που ορίζονται κατά τις ρυθμίσεις-διαδικασίες τηρήσεως φυλακής και αρχές που πρέπει να τηρούνται, να αναφέρετε τις ενέργειες που πρέπει να ακολουθηθούν πριν τη σχεδίαση του νέου ταξιδίου.</p>","sol":"<p>Πριν από κάθε ταξίδι ο πλοίαρχος κάθε πλοίου οφείλει να εξασφαλίζει ότι το δρομολόγιο που πρόκειται να ακολουθηθεί, από το λιμένα απόπλου στον πρώτο λιμένα κατάπλου, σχεδιάζεται χρησιμοποιώντας επαρκείς και κατάλληλους ναυτικούς χάρτες και οποιεσδήποτε άλλες ναυτιλιακές γνώσεις, οι οποίες περιλαμβάνουν ακριβείς, πλήρεις και επικαιροποιημένες πληροφορίες, που αφορούν σε εκείνους τους ναυτιλιακούς περιορισμούς και κινδύνους, οι οποίοι είναι μονίμου ή προβλέψιμης φύσεως και είναι σχετικοί με την ασφαλή ναυσιπλοΐα του πλοίου.</p>","ty":"pr"},{"id":"33286-Θ","th":"33286","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Να αναφέρετε πέντε (5) περιπτώσεις, κατά τη εκτέλεση φυλακής γέφυρας, που οφείλει ο ΑΦ να ειδοποιεί τον πλοίαρχο άμεσα.</p>","sol":"<p>- Αν το πλοίο συναντήσει συνθήκες περιορισμένη ορατότητα η όταν αναμένονται τέτοιες συνθήκες</p>\n<p>- Αν η πυκνότητα της κυκλοφορίας ή η κίνηση άλλων παραπλεόντων πλοίων προκαλούν ανησυχία όσον αφορά στην ασφάλεια του πλοίου</p>\n<p>- Αν αντιμετωπίζει δυσκολίες στη διατήρηση της πορείας ως προς το βυθό ή και της αναπρωρήσεως</p>\n<p>- Αν στο προβλεπόμενο χρόνο, δεν εντοπίζει ακτές, ναυτιλιακό σημείο ή ηχητικό σήμα</p>\n<p>- Αν απροσδόκητα εντοπίσει ακτές, ναυτιλιακό σημείο ή μεταβληθούν τα βάθη</p>\n<p>- Σε περίπτωση βλάβης των μηχανών, του συστήματος ελέγχου (χειριστήρα) του προωστήριου σκεύους, του μηχανισμού πηδαλιουχήσεως ή οποιουδήποτε απαραίτητου ναυτιλιακού οργάνου, συστήματος προειδοποιήσεως κινδύνου ή ενδείκτη</p>\n<p>- Αν προξενηθεί βλάβη στον επικοινωνιακό εξοπλισμό του πλοίου</p>\n<p>- Σε περίπτωση κακοκαιρίας αν υπάρχουν αμφιβολίες, όσον αφορά στο ενδεχόμενο προκλήσεως ζημιών λόγω του καιρού</p>\n<p>- Αν το πλοίο συνάντηση οποιοδήποτε κίνδυνο στην ναυσιπλοΐα όπως πάγους ή εγκαταλελειμμένο πλοίο ή συντρίμμια ναυαγίου</p>\n<p>- Σε οποιαδήποτε άλλη περίπτωση ανάγκης η οποτεδήποτε βρίσκεται σε αμφιβολία</p>","ty":"ap"},{"id":"33287-Θ","th":"33287","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Έστω ότι δεξαμενόπλοιο βρίσκεται αγκυροβολημένο στο λιμάνι της Νάξου. Σύμφωνα μ’ αυτά που ορίζονται κατά τη τήρηση φυλακής κάτω από διαφορετικές συνθήκες και σε διαφορετικές περιοχές, να αναφέρετε πέντε (5) ενέργειες που πρέπει να ακολουθηθούν.</p>","sol":"<p>1) προσδιορίζει και να υποτυπώνει τη θέση του πλοίου σε κατάλληλο χάρτη όσο συχνότερα τούτο είναι δυνατό</p>\n<p>2) ελέγχει σε επαρκώς συχνά χρονικά διαστήματα, όσο οι περιστάσεις το επιτρέπουν αν το πλοίο παραμένει ασφαλώς στο αγκυροβόλιο, λαμβάνοντας διοπτεύσεις από σταθερά ναυτιλιακά γεωγραφικά σημεία ή από καταφανή σημεία της ξηράς, εύκολα αναγνωρίσιμα</p>\n<p>3) εξασφαλίζει ότι τηρείται κατάλληλη επιτήρηση</p>\n<p>4) εξασφαλίζει ότι πραγματοποιούνται περιοδικά επιθεωρήσει- εφοδείες από πλώρα μέχρι πρίμα</p>\n<p>5) παρακολουθεί τις μετεωρολογικές και τις παλιρροιακές συνθήκες και την κατάσταση θαλάσσης</p>\n<p>6) ειδοποιεί τον πλοίαρχο και να αναλαμβάνει όλα τα απαραίτητα μέτρα, αν το πλοίο ξεσέρνει</p>\n<p>7) εξασφαλίζει την ετοιμότητα των μηχανών και των άλλων μηχανημάτων, σύμφωνα με τις οδηγίες του πλοιάρχου</p>\n<p>8) ειδοποιεί τον πλοίαρχο, αν η ορατότητα μειώνεται</p>\n<p>9) εξασφαλίζει ότι το πλοίο επιδεικνύει τους προβλεπόμενους φανούς και σχήματα όπως επίσης ότι σημαίνει τα προβλεπόμενα από τους ΔΚΑΣ ηχητικά σήματα</p>\n<p>10) λαμβάνει μέτρα για την προστασία του περιβάλλοντος από ρύπανση εκ του πλοίου και να συμμορφώνεται με τους προβλεπόμενους κανονισμούς αποφυγής ρυπάνσεως</p>","ty":"pr"},{"id":"33288-Θ","th":"33288","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Έστω ότι οχηματαγωγό πλοίο βρίσκεται εν πλω στη Σιγκαπούρη στο στενό Μαλάκκα με πολύ πυκνή κυκλοφορία. Σύμφωνα μ’ αυτά που ορίζονται κατά τη τήρηση φυλακής κάτω από διαφορετικές συνθήκες και σε διαφορετικές περιοχές, να αναφέρετε τις ενέργειες που πρέπει να ακολουθηθούν.</p>","sol":"<p>Κατά την ναυσιπλοΐα σε παράκτια-περιορισμένα ύδατα και σε ύδατα με πυκνή κυκλοφορία, θα πρέπει να χρησιμοποιούνται οι διαθέσιμοι χάρτες στο πλοίο με τη μεγαλύτερη φυσική κλίμακα, να είναι κατάλληλοι για την περιοχή πλου και διορθωμένοι, σύμφωνα με τις τελευταίες διαθέσιμες πληροφορίες.</p>\n<p>Τα στίγματα θα πρέπει να προσδιορίζονται κατά επαρκώς συχνά διαλείμματα και όποτε οι περιστάσεις το επιτρέπουν, θα πρέπει να χρησιμοποιούνται περισσότερες από μία μέθοδοι για τον προσδιορισμό.</p>\n<p>Όταν χρησιμοποιείται το ECDIS θα πρέπει να επιλέγεται αντίστοιχα η κατάλληλη φυσική κλίμακα στους ηλεκτρονικούς χάρτες και η θέση του πλοίου να ελέγχεται κατά κατάλληλα χρονικά διαστήματα μέσω ενός ανεξάρτητου συστήματος ευρέσεως της θέσεως του πλοίου.</p>\n<p>Ο ΑΦ οφείλει να αναγνωρίζει θετικά όλα τα ναυτιλιακά γεωγραφικά σημεία της περιοχής.</p>","ty":"pr"},{"id":"33289-Θ","th":"33289","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Με δεδομένο ότι είστε παραλαμβάνων Αξιωματικός, να αναπτύξετε τα στοιχεία στη ναυτιλιακή κατάσταση, για τα οποία οφείλετε να ενημερωθείτε προσωπικά κατά την παραλαβή φυλακής γεφύρας.</p>","sol":"<p>Στη ναυτιλιακή κατάσταση, στην οποία περιλαμβάνονται χωρίς να περιορίζονται μόνο σε αυτά, τα ακόλουθα:</p>\n<p class=in>• Η λειτουργική κατάσταση όλο του ναυτιλιακού εξοπλισμού και του εξοπλισμού ασφαλείας, ο οποίος χρησιμοποιείται είναι πιθανό να χρησιμοποιηθεί, κατά τη διάρκεια της φυλακής.</p>\n<p class=in>• Τα σφάλματα της γυροσκοπικής και μαγνητικής πυξίδας (απόκλιση και παρεκτροπή δηλαδή την παραλλαγή).</p>\n<p class=in>• Η θέση και η κίνηση των πλοίων των ευρισκομένων «ενόψει» ή αυτών που είναι γνωστό ότι ευρίσκονται στην γειτνιάζουσα περιοχή.</p>\n<p class=in>• Οι συνθήκες και οι κίνδυνοι, που είναι πιθανόν να συναντήσει το πλοίο κατά διάρκεια της φυλακής.</p>\n<p class=in>• Οι πιθανές συνέπειες λόγω της εγκάρσιας κλίσεως, της διαγωγής, της πυκνότητας του νερού και της επιβυθίσεως του πλοίου.</p>","ty":"ap"},{"id":"33290-Θ","th":"33290","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Με δεδομένο ότι είστε ο Αξιωματικός φυλακής γεφύρας, να αναπτύξετε τους πέντε (5) περιοδικούς ελέγχους που οφείλετε να προβείτε κατά την εκτέλεση φυλακής γέφυρας.</p>","sol":"<p>Περιοδικοί έλεγχοι:</p>\n<p>- Ο πηδαλιούχος ή το αυτόματο πηδάλιο τηρεί την ορθή αναπρώρηση.</p>\n<p>- Η παραλλαγή (παρεκτροπή και απόκλιση) της μαγνητικής πυξίδας υπολογίζεται τουλάχιστον μια φορά για κάθε φυλακή και όταν είναι αυτό εφικτό μετά από κάθε μεγάλη μεταβολή της πορείας ως προς το βυθό (COG). Οι ενδείξεις της μαγνητικής και της γυροσκοπικής πυξίδας πρέπει συχνά να συγκρίνονται, όπως επίσης και οι επαναλήπτες της γυροπυξίδας να συγχρονίζονται με την κύρια γυροπυξίδα.</p>\n<p>- Είναι δυνατή η απρόσκοπτη ανάληψη του πηδαλίου σε χειροκίνητη λειτουργία όταν κατά τη διάρκεια της φυλακής τούτο συνεχώς λειτουργεί αυτόματα. Γι’ αυτό λοιπόν απαιτείται ο έλεγχος χειροκίνητης λειτουργίας να εκτελείται τουλάχιστον μια φορά σε κάθε φυλακή.</p>\n<p>- Οι φανοί ναυσιπλοΐας, οι φανοί σημάνσεως και ο υπόλοιπος ναυτιλιακός εξοπλισμός λειτουργούν κανονικά.</p>\n<p>- Ο επικοινωνιακός εξοπλισμός του λειτουργεί κανονικά.</p>\n<p>- Τα χειριστήρια του ελέγχου του μη επανδρωμένου προωστήριου σκεύους (UMS), τα συστήματα προειδοποιήσεως κινδύνου και οι ενδείκτες λειτουργούν κανονικά.</p>","ty":"ap"},{"id":"33291-Θ","th":"33291","part":"","k":"calc","secs":["4"],"p":25,"q":"<p>Να προσδιορίσετε τα καθήκοντα που περιλαμβάνονται στην τήρηση φυλακής του ΑΦ.</p>","sol":"<p>Στα καθήκοντά τηρήσεως φυλακής του ΑΦ περιλαμβάνονται η διατήρηση κατάλληλης επιτήρησης της περιοχής πλου του πλοίου, η γενική επιτήρηση του πλοίου, η αποφυγή παραπλεόντων στόχων σύμφωνα με τους ΔΚΑΣ 72 όπως και κάθε ναυτιλιακού κινδύνου- εμποδίου, η καταγραφή των δραστηριοτήτων της γέφυρας και ο περιοδικός έλεγχος της λειτουργικής καταστάσεως του ναυτιλιακού εξοπλισμού της γέφυρας.</p>","ty":"ap"},{"id":"33292-Θ","th":"33292","part":"","k":"calc","secs":["3β"],"p":25,"q":"<p>Να προσδιορίσετε πέντε (5) παράγοντες τους οποίους ο πλοίαρχος οφείλει να λαμβάνει υπόψη για τον καθορισμό της επάρκειας της συνθέσεως της φυλακής γεφύρας.</p>","sol":"<p>Α) την ορατότητα και την κατάσταση καιρού και θαλάσσης.</p>\n<p>Β) την πυκνότητα κυκλοφορίας και τις άλλες δραστηριότητες που πραγματοποιούνται στην περιοχή, στην οποία ναυσιπλοεί το πλοίο.</p>\n<p>Γ) την απαίτηση επιδείξεως της αναγκαίας προσοχής, όταν το πλοίο ναυσιπλοεί εντός ή πλησίον ΣΔΘΚ ή σε άλλα συστήματα πορειογραφήσεως.</p>\n<p>Δ) τον επί πλέον φόρτο εργασίας τον οφειλόμενο στη φύση των λειτουργιών του πλοίου, τις άμεσες λειτουργικές ανάγκες και τους αναμενόμενους χειρισμούς.</p>\n<p>Ε) την ικανότητα εκτελέσεως υπηρεσίας κάθε διατιθέμενου μέλους του πληρώματος, το οποίο έχει καθορισθεί ως μέλος φυλακής.</p>\n<p>Στ) τις κατεχόμενες γνώσεις των αξιωματικών και του πληρώματος του πλοίου, όπως και την εμπιστοσύνη για την επαγγελματική τους ικανότητα.</p>\n<p>Ζ) την εμπειρία κάθε ΑΦ και την εξοικείωση του με τον εξοπλισμό-συσκευές, τις διαδικασίες και τη δυνατότητα χειρισμού του πλοίου.</p>\n<p>Η) τις δραστηριότητες που πραγματοποιούνται στο πλοίο σε κάθε συγκεκριμένο χρόνο, συμπεριλαμβανομένων των απασχολήσεων στην ραδιοεπικοινωνία, όπως επίσης τη διαθεσιμότητα βοήθειας που θα κληθεί άμεσα στην γέφυρα, όταν απαιτηθεί.</p>\n<p>Θ) τη λειτουργική ετοιμότητα των οργάνων στην γέφυρα, των συστημάτων ελέγχου, συμπεριλαμβανομένων και των συστημάτων προειδοποιήσεως κινδύνου.</p>\n<p>Ι) τη μέθοδο-τρόπο ελέγχου του πηδαλίου και τον προπελών, όπως και τα ελικτικά στοιχεία του πλοίου.</p>\n<p>Ια) το μέγεθος του πλοίου και το οπτικό πεδίο από τη θέση χειρισμού αυτού.</p>\n<p>Ιβ) τη διαμόρφωση της γέφυρας και την επίδραση αυτής στην παρεμπόδιση της εκτελέσεως της οπτικής ή ηχητικής επιτηρήσεως, από ένα μέλος της φυλακής γέφυρας.</p>\n<p>Ιγ) οποιοδήποτε άλλο σχετικό πρότυπο, διαδικασία ή οδηγία σχετικά με τη ρύθμιση των φυλακών και την ικανότητα προς υπηρεσία, τα οποία έχει υιοθετήσει ο ΙΜΟ.</p>","ty":"ap"},{"id":"33293-Θ","th":"33293","part":"","k":"calc","secs":["3γ"],"p":25,"q":"<p>Με δεδομένο ότι είστε ο παραλαμβάνων Αξιωματικός φυλακής καταστρώματος, να προσδιορίσετε πέντε (5) πληροφορίες, για τις οποίες οφείλετε να ενημερωθείτε από τον παραδίδοντα Αξιωματικό πριν την ανάληψη φυλακής καταστρώματος.</p>","sol":"<p>1) Το βάθος των υδάτων στη θέση παραβολής/αγκυροβολίου, το βύθισμα του πλοίου και το ύψος των υδάτων, το χρόνο κατά τη ρηχία και την άμπωτη, τη στερέωση των αγόμενων (κάβους, άλυσο), τη διευθέτηση των αγκυρών, το έκταμα της αλύσου και τον άλλων παρελκομένων της προσδέσεως/αγκυροβολίας, τα οποία είναι σημαντικά για την ασφάλεια του πλοίου. Επίσης την ετοιμότητα των μηχανών και την διαθεσιμότητα σε περίπτωση ανάγκης.</p>\n<p>2) Όλες τις εργασίες που εκτελούνται επί του πλοίου, όπως επίσης για το είδος, το ποσό και τη διάταξη του φορτίου που έχει φορτωθεί ή παραμένει προς φόρτωση. Επίσης, το υπολειπόμενο φορτίο μετά την εκφόρτωση του πλοίου.</p>\n<p>3) Τη στάθμη του νερού στους υδροσυλλέκτες (σεντίνες) και στις δεξαμενές έρματος.</p>\n<p>4) Τους φανούς που επιδεικνύονται ή τα ηχητικά σήματα που σημαίνονται.</p>\n<p>5) Τον αριθμό των μελών του πληρώματος που απαιτούνται να βρίσκονται εντός του πλοίου, όπως και κάθε άλλου ατόμου εντός του πλοίου.</p>\n<p>6) Την κατάσταση των συσκευών πυροσβέσεώς.</p>\n<p>7) Τους ισχύοντες ειδικούς κανονισμούς του λιμένος.</p>\n<p>8) Τις μόνιμες και ειδικές οδηγίες του πλοιάρχου.</p>\n<p>9) Τις διαθέσιμες γραμμές επικοινωνίας πλοίου και ξηράς, συμπεριλαμβανομένων και αυτών για την επικοινωνία με τις αρχές του λιμένα σε περίπτωση ανάγκης ή σε περίπτωση που απαιτηθεί βοήθεια.</p>\n<p>10) Οποιοδήποτε στοιχείο/συμβάν σημαντικό για την ασφάλεια του πλοίου, του πληρώματος του φορτίου ή την προστασία περιβάλλοντος από ρύπανση. 11) Τις διαδικασίες για την ειδοποίηση των αρμοδίων αρχών, για οποιαδήποτε ρύπανση του περιβάλλοντος που θα προκληθεί από τις δραστηριότητες του πλοίου.</p>","ty":"ap"},{"id":"33294-Θ","th":"33294","part":"","k":"calc","secs":["3α"],"p":25,"q":"<p>Να αναφέρετε πότε ο πλοίαρχος έχει το δικαίωμα να αναστείλει την περίοδο αναπαύσεως ενός μέλους του πληρώματος.</p>","sol":"<p>Καμία από τις αναφερόμενες διατάξεις για τις περιόδους αναπαύσεως δεν δύναται να θεωρηθεί ότι θίγει το δικαίωμα του πλοιάρχου του πλοίου να απαιτήσει σε οποιοδήποτε μέλος του πληρώματος να εκτελέσει όσες ώρες εργασίας απαιτούνται για την παροχή άμεσης ασφάλειας στο πλοίο, στα άτομα που επιβαίνουν επί του πλοίου ή στο φορτίο, όπως επίσης και για σκοπούς παροχής βοήθειας σε άλλα πλοία ή άτομα που κινδυνεύουν στη θάλασσα. Ως εκ τούτου, ο πλοίαρχος δύναται να αναστείλει την περίοδο αναπαύσεως ενός μέλους του πληρώματος και να απαιτήσει την εκτέλεση εργασίας για όσες ώρες απαιτούνται μέχρις ότου η κανονική κατάσταση στο πλοίο αποκατασταθεί. Το συντομότερο δυνατόν μετά την αναφερόμενη αποκατάσταση, ο πλοίαρχος απαιτείται να μεριμνήσει ώστε να παρασχεθεί επαρκής περίοδος αναπαύσεως σε κάθε μέλος που εργάσθηκε σε προγραμματισμένη περίοδο αναπαύσεως.</p>","ty":"ap"},{"id":"33295-Θ","th":"33295","part":"","k":"calc","secs":["5α"],"p":25,"q":"<p>Κατά τη χρησιμοποίηση του ραντάρ, στη λειτουργιά της αποφυγής συγκρούσεως, οι παρεχόμενες υπό αυτές πληροφορίες της διοπτεύσεως και της αποστάσεις είναι επαρκείς; (Αιτιολογήστε την απάντηση σας).</p>","sol":"<p>Η απάντηση στο ερώτημα αυτό είναι όχι διότι για να εκτελέσει κατά τον ασφαλέστερο τρόπο η ομάδα γέφυρα τους χειρισμούς για την αποφυγή στόχου, εκτός από την διόπτευση-απόσταση, αρκετά υποβοηθητικά είναι κι άλλα στοιχεία όπως η αναπρώρηση, η ταχύτητα (STW) του στόχου, η πλησιέστερη-ελάχιστη απόσταση προσεγγίσεως σε αυτόν κ.λπ..</p>","ty":"ap"},{"id":"33589-Θ","th":"33589","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Με βάση όλα τα χαρακτηριστικά και τις δυνατότητες-αδυναμίες των τριών προσανατολισμών της εικόνας του ραντάρ (Head-up, True-north-up &amp; Course-up), να προσδιορίσετε τι συμβαίνει:</p>\n<p class=in><b>α)</b>στη μέτρηση αληθούς διοπτεύσεως <span class=pt>(Μονάδες 12)</span></p>\n<p class=in><b>β)</b>στη ταύτιση εικόνας ραντάρ, με οπτική εικόνα της γεφύρας για κάθε προσανατολισμό εικόνας ραντάρ. <span class=pt>(Μονάδες 13)</span></p>","sol":"<p><b>α) </b>Μέτρηση αληθούς διοπτεύσεως:</p>\n<p class=in>• Head-up: Απαιτείται διαδικασία, δύσχρηστη και αργή</p>\n<p class=in>• True-north-up: Εύκολη-άμεση</p>\n<p class=in>• Course-up: Εύκολη-άμεση</p>\n<p><b>β) </b>Ταύτιση εικόνας ραντάρ, με οπτική εικόνα της γέφυρας:</p>\n<p class=in>• Head-up: Τέλεια</p>\n<p class=in>• True-north-up: Όχι προφανής</p>\n<p class=in>• Course-up: Τέλεια, στην περίπτωση που δεν εκτελούνται μεγάλες αλλαγές αναπρωρήσεως.</p>","ty":"ap"},{"id":"33591-Θ","th":"33591","part":"","k":"calc","secs":["6"],"p":25,"q":"<p>Σύμφωνα με τη χρήση ραντάρ και Automatic Radar Plotting-Aids (ARPA) στην εφαρμογή κανόνων προς αποφυγή συγκρούσεως να αναφέρετε τους τρόπους χρησιμοποιήσεως:</p>\n<p class=in><b>α)</b> για εξασφάλιση της αποτελεσματικότητας των χειρισμών <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> για ανάληψη της αρχικής αναπρωρήσεως ή και ταχύτητας διά μέσου του νερού του πλοίου μας <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) </b>Εκτέλεση συνεχούς: α) υποτυπώσεως και ελέγχου της σχετικής κινήσεως και β) παρακολουθήσεως των αλλαγών των στοιχείων των στόχων στην αληθή κίνηση ως προς το νερό.</p>\n<p><b>β) </b>Απαιτείται να: α) μην παρεμποδίζονται οι στόχοι, β) εκτελείται δοκιμαστικός χειρισμός (μόνο ARPA) και να ελέγχονται οι πιθανοί χειρισμοί των στόχων και γ) εκτελείται ένας χειρισμός και όχι μικροί διαδοχικοί χειρισμοί.</p>","ty":"ap"},{"id":"33595-Θ","th":"33595","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως και έχει επιλεγεί προσανατολισμός με τον βορρά άνω (north-up) και κλίμακα 12 ν.μ.. Στη συνέχεια εντοπίζεται ένας στόχος, στις ακόλουθες θέσεις –χρόνους:</p>\n<p class=in>α) 19:07: Δ = 175° Τ (αληθή) – Α = 12 ν.μ..</p>\n<p class=in>β) 19:12: Δ = 170° Τ – Α = 10,7 ν.μ..</p>\n<p class=in>γ) 19:15: Δ = 166,5° Τ – Α = 10 ν.μ..</p>\n<p class=in>δ) 19:19: Δ = 160° Τ – Α = 9 ν.μ..</p>\n<p class=in><b>α)</b> Απαιτείται στην επίλυση η αναπρώρηση και η ταχύτητα διά μέσου του νερού; <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> Να αιτιολογήσετε την απάντησή σας. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b>Όχι</p>\n<p><b>β)</b>Διότι στην παρουσίαση της σχετικής κινήσεως για τους υπολογισμούς των στοιχειών σχετικής κινήσεως του στόχου και του CPA, δεν απαιτείται η γνώση της αναπρωρήσεως και της ταχύτητας διά μέσου του νερού του πλοίου μας.</p>","ty":"pr"},{"id":"33599-Θ","th":"33599","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός με τον βορρά άνω (north-up) και κλίμακα 12 ν.μ.. Η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 275° και 12 κόμβους (knots) αντίστοιχα. Στη συνέχεια εντοπίζεται ένα καραβοφάναρο, στις ακόλουθες θέσεις – χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<p class=in>α) 10:00: Δ = 235° Τ – Α = 7,5 ν.μ..</p>\n<p class=in>β) 10:07 30&#x27;&#x27;: Δ = 227° Τ – Α = 7,9 ν.μ..</p>\n<p class=in>γ) 10:15: Δ = 218° Τ – Α = 5,2 ν.μ..</p>\n<p>Μετά τη σχετική υποτύπωση ο ΑΦ υπολόγισε και βρήκε τη διεύθυνση και την ταχύτητα του ρεύματος που επικρατεί.</p>\n<p>Ποια άλλη παρουσίαση είναι δυνατόν να επιλεγεί στο ραντάρ, προκειμένου να εξαχθούν τα στοιχεία ρεύματος με τον αναφερόμενο στόχο;</p>","sol":"<p>Μπορούμε να χρησιμοποιήσουμε την επιλογή παρουσιάσεως της αληθούς κινήσεως ως προς το νερό.</p>","ty":"pr"},{"id":"33601-Θ","th":"33601","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Ο ΑΦ έχει ενεργοποιήσει το ραντάρ, σε παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το βυθό και έχει επιλέξει προσανατολισμό με τον βορρά άνω (north-up).</p>\n<p class=in><b>α)</b> Είναι κατάλληλη η παρουσίαση αυτή για αποφυγή συγκρούσεων; <span class=pt>(Μονάδες 15)</span></p>\n<p class=in><b>β)</b> Να αιτιολογήσετε την απάντησή σας. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p><b>α)</b>Όχι, δεν είναι κατάλληλη, ενώ είναι χρήσιμη για την ασφαλή ναυτιλία, διότι είναι εύκολη η αναγνώριση της ξηράς των ναυτιλιακών κινδύνων και των αγκυροβολημένων στόχων.</p>\n<p><b>β) </b>Κυρίως όμως είναι σημαντική στην εξαγωγή στίγματος του πλοίου και στην παρακολούθηση της θέσεως αυτού στο ακολουθούμενο δρομολόγιο (route monitoring).</p>","ty":"pr"},{"id":"33602-Θ","th":"33602","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Ο ΑΦ έχει ενεργοποιήσει το ραντάρ, σε παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το νερό και έχει επιλέξει προσανατολισμό με τον βορρά άνω (north-up).</p>\n<p class=in><b>α) </b>Είναι κατάλληλη η παρουσίαση αυτή για αποφυγή συγκρούσεων; <span class=pt>(Μονάδες 15)</span></p>\n<p class=in><b>β) </b>Να αιτιολογήσετε την απάντησή σας. <span class=pt>(Μονάδες 10)</span></p>","sol":"<p><b>α) </b>Ναι</p>\n<p><b>β)</b>Διότι είναι η μόνη κατάλληλη παρουσίαση και απαραίτητη για τη λειτουργία της αποφυγής συγκρούσεως. Ο χειρισμός προς αποφυγή συγκρούσεως βασίζεται στη γνώση της αναπρωρήσεως των άλλων στόχων [της όψεως (aspect) την οποία παρουσιάζουν].</p>","ty":"pr"},{"id":"33603-Θ","th":"33603","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός με τον βορρά άνω (north-up) και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 251° και 11 κόμβοι (knots) αντίστοιχα. Στη συνέχεια εντοπίζεται ο ακόλουθος στόχος, στις ακόλουθες θέσεις – χρόνους:</p>\n<p>α) 11:20: Δ = 291° Τ - Α = 10,2 ν.μ..</p>\n<p>β) 11:26: Δ = 291° Τ - Α = 7,8 ν.μ..</p>\n<p>γ) 11:32: Δ = 291° Τ - Α = 6,2 ν.μ..</p>\n<p>Ο ΑΦ αποφασίζει να μεταβάλλει την αναπρώρηση προς τα ΔΕ μέχρι 310° και να μειώσει την ταχύτητα διά μέσου του νερού του πλοίου στους 6 κόμβους (knots).</p>\n<p class=in><b>α)</b> Έπρεπε ο ΑΦ να εκτελέσει κάποιον χειρισμό; <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b> Να αιτιολογήσετε την απάντησή σας. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) </b>Ο ΑΦ αποφάσισε σωστά.</p>\n<p><b>β) </b>Διότι για τη θέση του πλοίου στις 11:32 το προβλεπόμενο CPA για το στόχο είναι 0 και υπάρχει κίνδυνος συγκρούσεως.</p>","ty":"pr"},{"id":"33604-Θ","th":"33604","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το νερό, έχει επιλεγεί προσανατολισμός με τον βορρά άνω (north-up) και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 329° και 11 κόμβοι (knots) αντίστοιχα. Στη συνέχεια εντοπίζεται ο ακόλουθος στόχος, στις ακόλουθες θέσεις – χρόνους:</p>\n<p>α) 16:30: Δ = 356° Τ - Α = 10,1 ν.μ.</p>\n<p>β) 16:36: Δ = 358° Τ - Α = 9,2 ν.μ.</p>\n<p>γ) 16:42: Δ = 001° Τ - Α = 8,3 ν.μ.</p>\n<p>δ) 16:48: Δ = 006° Τ - Α = 7,2 ν.μ.</p>\n<p>Ο ΑΦ αποφασίζει στις 16:48 να αλλάξει την παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το νερό και να χρησιμοποιήσει την παρουσίαση αληθούς κινήσεως με σταθεροποίηση ως προς το βυθό για να κάνει την αποφυγή συγκρούσεως.</p>\n<p class=in><b>α)</b> Συμφωνείτε με την απόφαση του ΑΦ; <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β) </b>Να επεξηγήσετε την απάντησή σας. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α)</b>Όχι.</p>\n<p><b>β)</b>Διότι η μόνη κατάλληλη παρουσίαση και απαραίτητη για τη λειτουργία της αποφυγής συγκρούσεως, διότι ο χειρισμός προς αποφυγή συγκρούσεως βασίζεται στη γνώση της αναπρωρήσεως των άλλων στόχων [της όψεως (aspect) την οποία παρουσιάζουν] είναιη παρουσίαση της αληθούς κινήσεως με σταθεροποίηση ως προς το νερό. Η παρουσίαση της αληθούς κινήσεως με σταθεροποίηση ως προς το βυθό είναι χρήσιμη για την ασφαλή ναυτιλία, διότι είναι εύκολη η αναγνώριση της ξηράς των ναυτιλιακών κινδύνων και των αγκυροβολημένων στόχων. Κυρίως όμως είναι σημαντική στην εξαγωγή στίγματος του πλοίου και στην παρακολούθηση της θέσεως αυτού στο ακολουθούμενο δρομολόγιο (route monitoring).</p>","ty":"pr"},{"id":"33605-Θ","th":"33605","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός με τον βορρά άνω (north-up) και η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 221° και 9 κόμβοι (knots) αντίστοιχα. Στη συνέχεια εντοπίζονται οι ακόλουθοι στόχοι, στις κατωτέρω θέσεις - χρόνους:</p>\n<table class=\"tb\"><tr><th>Χρόνος</th><th>Στόχος Α</th><th>Στόχος Β</th><th>Στόχος Γ</th><th>Στόχος Δ</th></tr><tr><td>06.50</td><td>255° Τ - 4,5ν.μ.</td><td>022° Τ - 7,6 ν.μ</td><td>125° Τ - 5,6 ν.μ.</td><td>358° Τ - 6,6 ν.μ.</td></tr><tr><td>06.56</td><td>250° Τ - 3,8ν.μ..</td><td>022° Τ - 5,8ν.μ.</td><td>120° Τ - 4,9 ν.μ..</td><td>003° Τ - 5,9 ν.μ..</td></tr><tr><td>07.05</td><td>240° Τ - 3,1ν.μ.</td><td>022° Τ - 4 ν.μ</td><td>113° Τ - 3,2 ν.μ.</td><td>010° Τ -4,2 ν.μ.</td></tr></table>\n<p>Από την παρατήρηση και μόνο των θέσεων των στόχων, ζητείται:</p>\n<p class=in><b>α)</b>Να προσδιορισθεί ποιος από αυτούς είναι ο πλέον επικίνδυνος. <span class=pt>(Μονάδες 10)</span></p>\n<p class=in><b>β)</b>Να αιτιολογήσετε την απάντησή σας. <span class=pt>(Μονάδες 15)</span></p>","sol":"<p><b>α) </b>Ο στόχος Β είναι ο πλέον επικίνδυνος.</p>\n<p><b>β) </b>διότι ξέρουμε ότι όταν η διόπτευση (αληθής ή σχετική) του προσεγγίζοντος στόχου παραμένει σταθερή ή δεν μεταβάλλεται αισθητά και η απόσταση πλοίου - στόχου μειώνεται, τότε τα πλοία πλέουν προς σύγκρουση ή πλησιάζουν σε επικίνδυνη απόσταση.</p>","ty":"pr"},{"id":"33606-Θ","th":"33606","part":"","k":"calc","secs":["5β"],"p":25,"q":"<p>Το πλοίο μας έχει ενεργοποιήσει το ραντάρ σε παρουσίαση σχετικής κινήσεως, έχει επιλεγεί προσανατολισμός με τον βορρά (north-up) και κλίμακα 12 ν.μ.. Η αναπρώρηση και ταχύτητα διά μέσου του νερού είναι 173° και 11 κόμβους (knots) αντίστοιχα. Στη συνέχεια εντοπίζεται ένα καραβοφάναρο, στις ακόλουθες θέσεις – χρόνους και εκτελείται σχετική υποτύπωση σε ΦΥ:</p>\n<p class=in>α) 19:34 : Δ = 133° Τ – Α = 7,4 ν.μ..</p>\n<p class=in>β) 19:41 : Δ = 125° Τ – Α = 6,9 ν.μ..</p>\n<p class=in>γ) 19:49 : Δ = 116° Τ – Α = 5,2 ν.μ..</p>\n<p>Μετά τη σχετική υποτύπωση ο ΑΦ υπολόγισε και βρήκε τη διεύθυνση και την ταχύτητα του ρεύματος που επικρατεί.</p>\n<p>Ποια άλλη παρουσίαση είναι δυνατόν να επιλεγεί στο ραντάρ, προκειμένου να εξαχθούν τα στοιχεία ρεύματος με τον αναφερόμενο στόχο;</p>","sol":"<p>Μπορούμε να χρησιμοποιήσουμε την επιλογή παρουσιάσεως της αληθούς κινήσεως ως προς το νερό.</p>","ty":"pr"}]}; const IMG = {"n":{"26651_colB":"8413b1a967","26653_colB":"bfbe830629","26720_colB":"9eddc6ecda","26729_f1":"8859cbefe8","26826_f1":"4086cfb1bf","33608_f1":"9365639e3c","33609_f1":"1eb0fbbfdf","33610_f1":"174a5b7a91","33611_f1":"feed26a8de","33612_f1":"b2ab59ebce"},"d":{"8413b1a967":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtUAAAR1BAMAAACHUSSMAAAAMFBMVEX///////z9//3z//Lz//Dy//H+/v7++v7z8/PZx9C8s7XIpnnKpHK7nXiKeGwTDxGsMkOzAACA4ElEQVR42u19e3xT5f3/+zltT9KizXPq5OIcpEXBy9Qizgu6WSe6r5evVr+CCkyD03Bx08CUFrdh9DuhRcXgFGjdIPqdCKil7qfOC2p13rYJVLepoLSnqNAWyHlShSZpe57fHydJc23TQktKnvfrpU1yTk7CO5/zeT6fz/O5EAwOKgBgDb8GHbWzHS9QQFMAFAFd9ROBzbSwkQCMSh5qnM8sxDgFYBaQNt14nVubAEh68KrWreBP3lbKq/W5trW2Pn6lagwysgfpcxQAfBsemfYX2pAlFRGOBhSpCqBNVICJqjQWxMKgaIAuAYRDz7IwqFaAWDwS4cbroFkgFsY8RYySoz/ZeXHXiy9p6+vMKys+tw06d+nKNQCgqJQDk7mXqYUALdABcHU0GKXWRisIV61MlyABABrHMK5BUa2eY3QAKsZInBELNOrN5/wYDRrhVv35i23bz12wymH7fO00e7rLNRmkz6kCwD90K+Cs7FyPlVINRR6igGuQAKo3ccIplxhXoDQYd4IGQpVGixcWr6aAUymfMQp4wYGiBgBtHW0X0/9zOBqtgHOJt0LIdQRk++tMskOdsZMzAEwBZwUNpBAsHwCYlXFohACAojQAXCOcEc4KOCdgku4FWAE44WAAofv2X9exod6xwm+TPOUtLrvQ1wY0AAi4FeiAlm8hGtAAAkJBAFgYJ5xwpVHxWpgHANEUYmGABgovQMGAfAZ4CW0o5ET1WkC/HDdmp/vxmS447gfuWOl0prtcD5YOsRuSpIBcp0j3N3nziZdTCZw2QqGEdYF4ucULyryw0CYLZSCcepmFWJiXArB4OQgHZYRhDAiArndLN2xRKgEAt6zGEIB0GD7T99ULFqkIxGuhiuZVGr3EUoBGpVCCoqHQSrzWAoUoVPEWnaFQ77fFYDQfSqECWlCgWMaMITtHqzqtt1V9qLRgCGGQufYSGgB9O580aBbKvADR1TGNnOiSFbrKUOAFOOMMHBqzNDJVg8VDR2MngcYsDLwR8GoWr3Xnppw9S9cNe8e4OTcOCa4jdU
