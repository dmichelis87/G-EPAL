<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2b45">
<title>Τράπεζα θεμάτων · Ναυτικό Δίκαιο</title>
<style>
:root{
  --navy:#0d2b45; --navy2:#173e5f; --sea:#1b6f8a; --foam:#e8f1f5; --sand:#f5f2ea;
  --ink:#1d2733; --mute:#5d6b78; --line:#d9dee3; --card:#fff;
  --ok:#2e8b57; --okbg:#e6f4ec; --bad:#c0392b; --badbg:#fbeaea; --half:#c98a00; --halfbg:#fdf3dc;
  --ab:#4e7a3f; --gold:#e3b23c;
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--sand);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
#bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.55rem .75rem;min-height:3.1rem;box-shadow:0 2px 6px rgba(0,0,0,.18)}
#bar .t{flex:1;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:transparent;border:0;color:#fff;min-width:2.4rem;height:2.4rem;border-radius:.5rem;cursor:pointer;font-size:1.05rem}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar .tm{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.14);padding:.15rem .55rem;border-radius:1rem;font-size:.9rem}
#bar .tm.low{background:var(--bad)}
main{max-width:46rem;margin:0 auto;padding:1rem .8rem 5rem}
h1{font-size:1.45rem;margin:.2rem 0 .1rem;line-height:1.25}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem}
.sub{color:var(--mute);font-size:.92rem}
.hero{background:linear-gradient(135deg,var(--navy),var(--sea));color:#fff;border-radius:1rem;padding:1.2rem 1.1rem 1rem;margin-bottom:1rem;position:relative;overflow:hidden}
.hero .k{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{color:#fff;font-size:1.6rem}
.hero .who{margin-top:.6rem;font-weight:700;color:#bfe3ff;font-size:.95rem}
.hero .info{position:relative;z-index:1;margin-top:.75rem;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:2rem;padding:.4rem .9rem;font-size:.85rem;font-weight:600;cursor:pointer;min-height:2.3rem}
.hero .info:hover{background:rgba(255,255,255,.26)}
#modal .dlg a{color:var(--sea);word-break:break-all}
.hero svg{position:absolute;right:-.6rem;bottom:-.8rem;opacity:.16;width:7.5rem;height:7.5rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.9rem .85rem;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;min-height:5.6rem;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile:hover{border-color:var(--sea)}
.tile b{font-size:1.02rem}
.tile span{color:var(--mute);font-size:.83rem;line-height:1.35}
.tile i{font-style:normal;font-size:1.35rem}
.tile .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:1rem;padding:0 .5rem;font-size:.8rem;font-weight:700}
.foot{color:var(--mute);font-size:.82rem;text-align:center;margin-top:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin-bottom:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:.7rem;padding:.75rem 1.1rem;min-height:3rem;font-weight:600;cursor:pointer;background:var(--sea);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--foam);color:var(--navy)}
.btn.ghost{background:transparent;color:var(--sea);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:#fff;border-radius:2rem;padding:.45rem .85rem;cursor:pointer;font-size:.92rem;min-height:2.5rem}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* επιλογή ενοτήτων */
.chap{border:1px solid var(--line);border-radius:.8rem;background:#fff;margin-bottom:.5rem;overflow:hidden}
.chap>.h{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;cursor:pointer}
.chap>.h .n{flex:1;font-weight:600}
.chap>.h .c{color:var(--mute);font-size:.85rem}
.chap .secs{border-top:1px solid var(--line);padding:.3rem .5rem .5rem}
.sec{display:flex;align-items:center;gap:.6rem;padding:.45rem .3rem;border-radius:.5rem;cursor:pointer}
.sec:hover{background:var(--foam)}
.sec .n{flex:1;font-size:.93rem}
.sec .n b{font-weight:600;margin-right:.35rem}
.sec .c{color:var(--mute);font-size:.82rem;white-space:nowrap}
.box{width:1.35rem;height:1.35rem;border:2px solid var(--sea);border-radius:.35rem;flex:none;display:grid;place-items:center;color:#fff;font-size:.85rem;line-height:1}
.box.on{background:var(--sea)}
.box.part{background:linear-gradient(var(--sea),var(--sea)) center/60% 3px no-repeat}
.arrow{transition:transform .15s;color:var(--mute)}
.open .arrow{transform:rotate(90deg)}
/* ερώτηση */
.qhead{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:.6rem}
.tag{font-size:.78rem;border-radius:1rem;padding:.12rem .55rem;background:var(--foam);color:var(--navy);font-weight:600}
.tag.code{background:#eef0f2;color:var(--mute);font-weight:500}
.tag.pt{background:#fff6dd;color:#7a5600}
.prog{height:.35rem;background:#dfe5ea;border-radius:1rem;overflow:hidden;margin:.2rem 0 .8rem}
.prog>div{height:100%;background:var(--sea)}
.kind{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.3rem}
.ctx{color:var(--mute);font-size:.93rem;margin-bottom:.5rem}
.q{font-size:1.06rem}
.q p{margin:.35rem 0}
.q p.in{padding-left:1.1rem}
.q .pt,.sol .pt{color:var(--mute);font-size:.85em;white-space:nowrap}
.gap{display:inline-block;min-width:5.5rem;border-bottom:2px solid var(--sea);margin:0 .15rem;padding:0 .3rem;text-align:center;color:var(--sea);font-weight:600;cursor:pointer;line-height:1.3}
.gap.sel{background:var(--foam);border-radius:.3rem .3rem 0 0}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.fig{display:block;max-width:100%;height:auto;margin:.6rem auto;border-radius:.4rem;background:#fff;cursor:zoom-in}
img.eq{max-width:100%;height:auto;display:block;margin:.2rem 0}
.opts{display:flex;flex-direction:column;gap:.5rem;margin-top:.8rem}
.opt{display:flex;gap:.65rem;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:.75rem;padding:.7rem .8rem;cursor:pointer;min-height:3rem}
.opt:hover{border-color:var(--sea)}
.opt .l{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--foam);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt.pick{border-color:var(--sea);background:#f2f8fb}
.opt.pick .l{background:var(--sea);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem}
.words{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.9rem}
.word{border:1.5px solid var(--line);background:#fff;border-radius:.6rem;padding:.45rem .7rem;cursor:pointer;min-height:2.6rem}
.word b{color:var(--sea);margin-right:.25rem}
.word.used{opacity:.45}
.word.ok{border-color:var(--ok);background:var(--okbg)}
.word.bad{border-color:var(--bad);background:var(--badbg)}
/* αντιστοίχιση */
.colb{background:#f7f9fa;border:1px solid var(--line);border-radius:.7rem;padding:.6rem .75rem;margin:.7rem 0;font-size:.93rem}
.colb div{padding:.18rem 0;display:flex;gap:.5rem}
.colb div b{flex:none;width:1.7rem;color:var(--sea)}
.mrow{border:1px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;margin-bottom:.5rem;background:#fff}
.mrow .lt{font-weight:600;margin-bottom:.35rem}
.mrow .lt b{color:var(--sea);margin-right:.35rem}
.letters{display:flex;flex-wrap:wrap;gap:.35rem}
.letter{min-width:2.6rem;height:2.6rem;border:1.5px solid var(--line);background:#fff;border-radius:.55rem;cursor:pointer;font-weight:700;padding:0 .5rem}
.letter.pick{background:var(--sea);color:#fff;border-color:var(--sea)}
.letter.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.letter.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.letter.want{border:2px dashed var(--ok);color:var(--ok)}
.mrow.ok{border-color:var(--ok)}
.mrow.bad{border-color:var(--bad)}
/* απαντήσεις */
.fb{border-radius:.8rem;padding:.75rem .9rem;margin-top:.9rem;font-size:.97rem}
.fb.ok{background:var(--okbg);border:1px solid #b9dfc9}
.fb.bad{background:var(--badbg);border:1px solid #efc4c0}
.fb.half{background:var(--halfbg);border:1px solid #efd9a0}
.fb.info{background:#f2f6f9;border:1px solid var(--line)}
.fb .h{font-weight:700;margin-bottom:.15rem}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)} .fb.half .h{color:var(--half)}
.sol{background:#fbfcfd;border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:.6rem;padding:.7rem .85rem;margin-top:.9rem}
.sol .lab{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sea);font-weight:700;margin-bottom:.25rem}
.sol p{margin:.25rem 0}
.sol p.in{padding-left:1.1rem}
.note{font-size:.88rem;color:#7a5600;background:#fff8e6;border-radius:.5rem;padding:.45rem .65rem;margin-top:.6rem}
.self{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.45rem;margin-top:.8rem}
.self button{border:1.5px solid var(--line);background:#fff;border-radius:.7rem;padding:.6rem .3rem;cursor:pointer;font-weight:600;font-size:.9rem;min-height:3.2rem}
.self .g1{border-color:#9fd3b5;color:var(--ok)} .self .g5{border-color:#ecd18f;color:var(--half)} .self .g0{border-color:#eab2ac;color:var(--bad)}
.self button.on{color:#fff}
.self .g1.on{background:var(--ok)} .self .g5.on{background:var(--half)} .self .g0.on{background:var(--bad)}
.ask{color:var(--mute);font-size:.88rem;margin-top:.5rem}
.navq{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom));z-index:15}
.navq .in{max-width:46rem;margin:0 auto;display:flex;gap:.5rem}
.navq .btn{flex:1}
.ab{color:var(--ab);font-size:.82em;font-weight:400}
.pal{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0 .8rem}
.pal button{min-width:2.2rem;height:2.2rem;padding:0 .3rem;border-radius:.45rem;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.8rem}
.pal .pgap{width:.7rem}
.thm{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:baseline;background:var(--navy);color:#fff;border-radius:.6rem;padding:.45rem .8rem;margin-bottom:.6rem;font-size:.9rem}
.thm b{letter-spacing:.06em}
.thm .pts{margin-left:auto;opacity:.85;font-size:.82rem}
.tag.lab{background:var(--navy);color:#fff}
.struct{margin:.2rem 0 0;padding-left:1.1rem}
.struct li{margin:.25rem 0}
table.parts{margin:.9rem auto 0;border-collapse:collapse;font-size:.92rem;text-align:left}
table.parts td{padding:.25rem .6rem;border-bottom:1px solid var(--line)}
table.parts td:last-child{text-align:right;font-weight:700;white-space:nowrap}
table.parts td:first-child{white-space:nowrap}
table.tb{border-collapse:collapse;margin:.6rem 0;font-size:.82em;max-width:100%;display:block;overflow-x:auto}
table.tb th,table.tb td{border:1px solid var(--line);padding:.25rem .35rem;text-align:center}
table.tb td:first-child{text-align:left;font-weight:600}
.sol table.tb{font-size:.72em}
.pal button.done{background:var(--foam);border-color:var(--sea)}
.pal button.cur{outline:2px solid var(--navy)}
.pal button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pal button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.pal button.half{background:var(--half);color:#fff;border-color:var(--half)}
/* αποτελέσματα */
.score{text-align:center;padding:1.2rem 1rem}
.score .big{font-size:2.6rem;font-weight:800;color:var(--navy);line-height:1.1}
.score .who{margin-top:.9rem;font-weight:700;color:var(--sea)}
.ring{width:8.5rem;height:8.5rem;margin:0 auto .6rem}
.list .li{display:flex;gap:.6rem;align-items:center;padding:.55rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.list .li:last-child{border-bottom:0}
.list .li .d{width:1.5rem;height:1.5rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none;font-weight:700}
.d.ok{background:var(--ok)} .d.bad{background:var(--bad)} .d.half{background:var(--half)} .d.no{background:#b8c2cb}
.list .li .x{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bar{height:.55rem;border-radius:1rem;background:#e4e9ee;overflow:hidden;display:flex}
.bar .a{background:var(--ok)} .bar .b{background:var(--gold)}
.pr{padding:.5rem .3rem;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .r{display:flex;justify-content:space-between;gap:.5rem;font-size:.92rem;margin-bottom:.25rem}
.pr .r span{color:var(--mute);white-space:nowrap}
.legend{display:flex;gap:1rem;font-size:.82rem;color:var(--mute);margin:.3rem 0 .6rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:.2rem;margin-right:.3rem;vertical-align:-.1rem}
input[type=search]{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:.7rem;font:inherit;background:#fff}
.th{display:flex;gap:.6rem;align-items:center;padding:.6rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.th:last-child{border-bottom:0}
.th .cd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy);min-width:3.6rem}
.th .ss{flex:1;display:flex;flex-wrap:wrap;gap:.25rem}
.th .ss .tag{font-weight:500;font-size:.74rem}
.th .pc{font-size:.8rem;color:var(--mute);white-space:nowrap}
/* παράθυρα */
#modal{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
#modal[hidden]{display:none}
#modal .dlg{background:#fff;border-radius:1rem;max-width:26rem;width:100%;padding:1.1rem}
#modal .dlg h3{margin:.1rem 0 .4rem}
#modal .dlg .row{justify-content:flex-end;margin-top:1rem}
#zoom{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto}
#zoom[hidden]{display:none}
#zoom img{display:block;margin:auto;transform-origin:0 0}
#zoom .zb{position:fixed;right:.7rem;top:.7rem;display:flex;gap:.4rem;z-index:61}
#zoom .zb button{width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;cursor:pointer}
/* προβολέας */
body.proj{background:#fff}
body.proj main{max-width:52rem;padding:1rem 2vw 5rem}
body.proj .card{border:0;padding:0}
body.proj .q{font-size:1.15rem}
body.proj.dark{background:#0b1621;color:#eef3f7}
body.proj.dark .card,body.proj.dark .opt,body.proj.dark .mrow,body.proj.dark .colb,body.proj.dark .sol,body.proj.dark .word,body.proj.dark .letter{background:#13222f;color:#eef3f7;border-color:#2b4255}
body.proj.dark .fig{background:#fff}
body.proj.dark .navq{background:#0b1621;border-color:#2b4255}
body.proj.dark .ctx,body.proj.dark .sub{color:#a9b9c6}
body.proj.dark .ab{color:#9fd08a}
body.proj.dark .tag{background:#1d3448;color:#cfe3f1}
.kbd{font-size:.8rem;color:var(--mute);text-align:center;margin-top:.6rem}
@media (max-width:420px){ .tiles{grid-template-columns:1fr 1fr} .tile{min-height:5.2rem;padding:.75rem .7rem} h1{font-size:1.3rem} }
@media print{ #bar,.navq{display:none} }
</style>
</head>

<main id="app"></main>
<div id="modal" hidden></div>

<script>const DATA = {"chapters":[["Α1","Ναυτικό Δίκαιο · Κεφ. 1 Ναυτικό δίκαιο"],["Α5","Ναυτικό Δίκαιο · Κεφ. 5 Ο Πλοίαρχος"],["Α6","Ναυτικό Δίκαιο · Κεφ. 6 Το πλήρωμα"],["Α8","Ναυτικό Δίκαιο · Κεφ. 8 Κανονισμοί εργασίας"],["Α14","Ναυτικό Δίκαιο · Κεφ. 14 Ναυτικά αδικήματα"],["Α15","Ναυτικό Δίκαιο · Κεφ. 15 Πειθαρχικό δίκαιο"],["Α16","Ναυτικό Δίκαιο · Κεφ. 16 Το ναυτικό ατύχημα"],["Α19","Ναυτικό Δίκαιο · Κεφ. 19–20 Ναυτικός πράκτορας, πλοηγός"],["Α28","Ναυτικό Δίκαιο · Κεφ. 28 Τρομοκρατία – πειρατεία"],["Β2","Διεθνείς Κανονισμοί · Κεφ. 2 SOLAS"],["Β3","Διεθνείς Κανονισμοί · Κεφ. 3 STCW"],["Β4","Διεθνείς Κανονισμοί · Κεφ. 4 MARPOL – OPA"],["Β5","Διεθνείς Κανονισμοί · Κεφ. 5 Κώδικας ISM"],["Β6","Διεθνείς Κανονισμοί · Κεφ. 6 Κώδικας ISPS"],["Β8","Διεθνείς Κανονισμοί · Κεφ. 8 Σύμβαση BWM"]],"sections":[["Α1.1","Α1","Έννοια – διαίρεση ναυτικού δικαίου"],["Α1.2","Α1","Ιστορική εξέλιξη του ναυτικού δικαίου"],["Α5.1","Α5","Αρμοδιότητες και ευθύνες του Πλοιάρχου"],["Α5.2","Α5","Ο Πλοίαρχος ως δημόσιος λειτουργός"],["Α5.3","Α5","Σχέσεις του Πλοιάρχου με τις αρχές"],["Α6.6","Α6","Καθήκοντα πληρώματος κατά βαθμό και ειδικότητα"],["Α6.7","Α6","Οργάνωση της εργασίας εν πλω"],["Α8.1","Α8","Κανονισμοί εργασίας: έννοια – περιεχόμενο"],["Α8.4","Α8","Οργάνωση της εσωτερικής υπηρεσίας"],["Α14.1","Α14","Έννοια ναυτικού αδικήματος"],["Α14.2","Α14","Κατηγορίες ναυτικών αδικημάτων"],["Α14.3","Α14","Αδικήματα κατά της υπηρεσίας και της πειθαρχίας"],["Α15.1","Α15","Έννοια πειθαρχικού παραπτώματος"],["Α15.2","Α15","Πειθαρχικά παραπτώματα του ΚΔΝΔ"],["Α15.3","Α15","Πειθαρχικές ποινές"],["Α16.1","Α16","Ναυτικό ατύχημα: ορισμός – στοιχεία"],["Α16.2","Α16","Διοικητικός έλεγχος ναυτικού ατυχήματος"],["Α19","Α19","Ο ναυτικός πράκτορας"],["Α20","Α19","Ο πλοηγός"],["Α28.1","Α28","Η τρομοκρατία στη θάλασσα – πειρατεία"],["Α28.2","Α28","Επικίνδυνες περιοχές"],["Β2.1","Β2","SOLAS: ιστορική αναδρομή"],["Β2.2","Β2","Οι βασικοί σκοποί της SOLAS"],["Β2.3","Β2","Η δομή της SOLAS"],["Β2.5","Β2","Ασφάλεια επιβατηγών πλοίων"],["Β2.6","Β2","Ασφάλεια φορτηγών χύδην ξηρού φορτίου"],["Β3.1","Β3","STCW 1978: ιστορική εξέλιξη"],["Β3.2","Β3","Βασικά στοιχεία της STCW 1995"],["Β3.3","Β3","Η δομή της STCW 1995 – πιστοποιητικά"],["Β4.7.1","Β4","MARPOL: ιστορική αναδρομή"],["Β4.7.2","Β4","MARPOL: κυριότερες διατάξεις"],["Β4.7.3","Β4","Το Πρωτόκολλο της MARPOL"],["Β4.8","Β4","Ο νόμος OPA 1990"],["Β5.5.2","Β5","ISM: ιστορική αναδρομή"],["Β5.5.3","Β5","ISM: ορισμοί και σκοποί"],["Β5.5.5","Β5","Λειτουργικές απαιτήσεις του ΣΑΔ"],["Β5.5.6","Β5","Οι διατάξεις του ΣΑΔ"],["Β6.1","Β6","ISPS: γενικές παρατηρήσεις"],["Β6.2","Β6","Οι στόχοι του Κώδικα ISPS"],["Β6.8","Β6","Πειρατικές επιθέσεις – μελέτες περιπτώσεων"],["Β8.1","Β8","Διαχείριση έρματος: γενικά"],["Β8.2","Β8","Η Διεθνής Σύμβαση BWM"]],"items":[{"id":"26224-2.1","th":"26224","part":"2.1","k":"mc","secs":["Α8.4"],"p":10,"q":"Κατά τις εργασίες «εν πλω», στις εργασίες γέφυρας που διεξάγονται κατά φυλακές, κάθε φυλακή αποτελείται από:","opts":["ένα αξιωματικό","έναν αξιωματικό και έναν ναύτη-πηδαλιούχο","έναν αξιωματικό έναν ναύτη-πηδαλιούχο και έναν οπτήρα","έναν αξιωματικό και έναν οπτήρα","ένα αξιωματικό και έναν υπαξιωματικό"],"a":2},{"id":"26224-2.2","th":"26224","part":"2.2","k":"open","secs":["Β3.3"],"p":15,"q":"Να αναφέρατε με συντομία τα επίπεδα ιεραρχίας στο πλοίο, βάσει της ΔΣ για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών STCW.","sol":"Διοικητικό (Πλοίαρχος-Υποπλοίαρχος Α΄ και Β΄ Μηχανικός). Επιχειρησιακό-Λειτουργικό (Λοιποί Αξιωματικοί). Υποστηρικτικό (Κατώτερο Πλήρωμα)."},{"id":"26225-2.1α","th":"26225","part":"2.1","lab":"α","k":"tf","secs":["Α14.3"],"p":3,"q":"Το αδίκημα της επιβουλής κατά του πλοιάρχου συντελείται, ακόμα και αν δεν έχει εκδηλωθεί απειλή ή προειδοποίησή του Πλοιάρχου.","a":true},{"id":"26225-2.1β","th":"26225","part":"2.1","lab":"β","k":"tf","secs":["Β4.7.1"],"p":3,"q":"Οι διαδικασίες Υπογραφής της MARPOL είναι κλειστές για τα κράτη της Αφρικής.","a":false,"why":"Οι διαδικασίες υπογραφής, επικυρώσεως και αποδοχής της MARPOL είναι ανοιχτές για οποιοδήποτε κράτος."},{"id":"26225-2.1γ","th":"26225","part":"2.1","lab":"γ","k":"tf","secs":["Α6.6"],"p":3,"q":"Ο αντλιωρός υπηρετεί μόνο στα επιβατικά πλοία.","a":false,"why":"Ο αντλιωρός υπηρετεί μόνο στα δεξαμενόπλοια."},{"id":"26225-2.1δ","th":"26225","part":"2.1","lab":"δ","k":"tf","secs":["Β3.3"],"p":3,"q":"Οι ναυτικοί μπορούν να φέρουν επί του πλοίου θεωρημένα αντίγραφα των πιστοποιητικών τους.","a":false,"why":"Οι ναυτικοί υποχρεούνται να φέρουν επί του πλοίου τα πρωτότυπα πιστοποιητικά τους."},{"id":"26225-2.1ε","th":"26225","part":"2.1","lab":"ε","k":"tf","secs":["Α6.6"],"p":3,"q":"Όταν στο επιβατικό πλοίο δεν υπηρετεί ύπαρχος, τα καθήκοντά του εκτελεί ο μηχανικός.","a":false,"why":"Όταν στο επιβατικό πλοίο δεν υπηρετεί ύπαρχος, τα καθήκοντά του εκτελεί ο υποπλοίαρχος."},{"id":"26225-2.2","th":"26225","part":"2.2","k":"open","secs":["Β6.2"],"p":10,"q":"Να αναφέρετε δύο απαιτήσεις του Διεθνή Κώδικα για την Ασφάλεια των Πλοίων και των Λιμενικών Εγκαταστάσεων (ISPS) από το προσωπικό του πλοίου και της λιμενικής εγκαταστάσεως.","sol":"Δύο από:<br>1) Συλλογή και αξιολόγηση των πληροφοριών.<br>2) Διατήρηση των πρωτοκόλλων επικοινωνίας.<br>3) Περιορισμένη πρόσβαση. Εμποδίζει την εισαγωγή μη εξουσιοδοτημένων όπλων κ.λ.π.<br>4) Παροχή των μέσων για να ενεργοποιηθούν οι συναγερμοί.<br>5) Θέτει σε εφαρμογή τα σχέδια ασφαλείας για το πλοίο και την λιμενική εγκατάσταση και εξασφαλίζει ότι εκτελούνται η εκπαίδευση και οι ασκήσεις πάνω στο πλοίο."},{"id":"26226-2.1","th":"26226","part":"2.1","k":"match","secs":["Α14.3","Β4.7.2","Β8.2"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Διαχείριση του έρματος","Φυλάκιση μέχρι ενός έτους","Ρύπανση από απορρίμματα","Φυλάκιση μέχρι τριών μηνών","Φυλάκιση τουλάχιστον έξι μηνών","Φυλάκιση τουλάχιστον τριών ετών"],"rows":[{"t":"BWM","a":[0],"s":"Β8.2"},{"t":"MARPOL","a":[2],"s":"Β4.7.2"},{"t":"Παράνομη απουσία","a":[3],"s":"Α14.3"},{"t":"Λιποταξία","a":[1],"s":"Α14.3"},{"t":"Στάση","a":[5],"s":"Α14.3"}],"filt":true},{"id":"26226-2.2","th":"26226","part":"2.2","k":"open","secs":["Α20"],"p":10,"q":"Ποιοι διορίζονται ως πλοηγοί;","sol":"Ως πλοηγοί διορίζονται, μετά από διαγωνισμό, διπλωματούχοι Πλοίαρχοι του Εμπορικού Ναυτικού που συγκεντρώνουν τα απαιτούμενα από τις ισχύουσες διατάξεις προσόντα κ αι τοποθετούνται στους πλοηγικούς σταθμούς που λειτουργούν στον Πειραιά και στα άλλα μεγάλα ελληνικά λιμάνια."},{"id":"26227-2.1α","th":"26227","part":"2.1","lab":"α","k":"tf","secs":["Α1.1"],"p":3,"q":"Το δημόσιο ναυτικό δίκαιο περιλαμβάνει διατάξεις που ρυθμίζουν σχέσεις θαλάσσιας ασφαλίσεως.","a":false,"why":"Η θαλάσσια ασφάλιση ρυθμίζεται από το ιδιωτικό ναυτικό δίκαιο."},{"id":"26227-2.1β","th":"26227","part":"2.1","lab":"β","k":"tf","secs":["Α5.2"],"p":3,"q":"Σύμφωνα με τον κανονισμό εργασίας η άσκηση της αστυνομίας στο πλοίο έχει ανατεθεί στον Πλοίαρχο.","a":false,"why":"Σύμφωνα με τον κανονισμό εργασίας, η άσκηση της αστυνομίας στο πλοίο έχει ανατεθεί στον υποπλοίαρχο, ο οποίος ενημερώνει τον Πλοίαρχο."},{"id":"26227-2.1γ","th":"26227","part":"2.1","lab":"γ","k":"tf","secs":["Α5.2"],"p":3,"q":"Ο Πλοίαρχος έχει εξουσία να επιβάλλει ποινές προστίμου.","a":true},{"id":"26227-2.1δ","th":"26227","part":"2.1","lab":"δ","k":"tf","secs":["Α6.6"],"p":3,"q":"Οι Γ΄ μηχανικοί έχουν την επιμέλεια συντηρήσεως των βοηθητικών μηχανημάτων κατά τις οδηγίες του Α΄ μηχανικού.","a":false,"why":"Οι Γ΄ μηχανικοί συντηρούν τα βοηθητικά μηχανήματα κατά τις οδηγίες του Β΄ μηχανικού και την εποπτεία του Α΄ μηχανικού."},{"id":"26227-2.1ε","th":"26227","part":"2.1","lab":"ε","k":"tf","secs":["Α6.6"],"p":3,"q":"Ο ναύκληρος είναι ο υπόλογος αξιωματικός για την υπηρεσία καταστρώματος.","a":false,"why":"Ο ναύκληρος είναι ο υπόλογος υπαξιωματικός (όχι αξιωματικός) για την υπηρεσία καταστρώματος."},{"id":"26227-2.2","th":"26227","part":"2.2","k":"open","secs":["Β4.7.1"],"p":10,"q":"Ποιοι είναι οι δύο λόγοι που η Διεθνής Σύμβαση για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα πλοία (MARPOL) είναι παγκόσμιας εμβέλειας;","sol":"1) Εφαρμόζεται σε όλες τις θαλάσσιες περιοχές δίχως γεωγραφικούς περιορισμούς.<br>2) Οι διαδικασίες υπογραφής επικυρώσεως και αποδοχής της Συμβάσεως είναι ανοιχτές για οποιοδήποτε κράτος."},{"id":"26228-2.1","th":"26228","part":"2.1","k":"match","secs":["Α6.6"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Χειρίζεται τις αντλίες κατά τη φορτοεκφόρτωση του φορτίου","Φυλάττει τα είδη ιματισμού","Είναι υπόλογος για την υπηρεσία μαγειρείου","Φροντίζει για την ασφαλή τοποθέτηση και συντήρηση των σωσιβίων λέμβων","Υπάγεται στις άμεσες διαταγές του Α΄ μηχανικού","Είναι υπεύθυνος για τη φορτοεκφόρτωση του φορτίου"],"rows":[{"t":"Ηλεκτρολόγος","a":[4],"s":"Α6.6"},{"t":"Ναύκληρος","a":[3],"s":"Α6.6"},{"t":"Αντλιωρός","a":[0],"s":"Α6.6"},{"t":"Θαλαμηπόλος","a":[1],"s":"Α6.6"},{"t":"Μάγειρας","a":[2],"s":"Α6.6"}]},{"id":"26228-2.2","th":"26228","part":"2.2","k":"open","secs":["Β5.5.5"],"p":10,"q":"Τι πρέπει να εξασφαλίζει το Σύστημα Ασφαλούς Διαχείρισης (ΣΑΔ);","sol":"1) Συμμόρφωση με τους υποχρεωτικούς κανόνες και κανονισμούς.<br>2) Αυτοί οι εφαρμόσιμοι κώδικες, οδηγίες και πρότυπα που προτείνονται από τον Οργανισμό, τη Διοίκηση, τους Νηογνώμονες και τους Οργανισμούς της ναυτιλιακής βιομηχανίας πρέπει να ληφθούν υπόψη."},{"id":"26230-2.1","th":"26230","part":"2.1","k":"mc","secs":["Α16.1"],"p":10,"q":"Πραγματική απώλεια του πλοίου θεωρείται:","opts":["όταν το πλοίο χάνεται ολοσχερώς","όταν το πλοίο δεν έχει τελείως καταστραφεί αλλά τα έξοδα για την επαναφορά του ξεπερνούν τα τρία τέταρτα της ασφαλιστικής του αξίας","όταν η επισκευή δεν είναι δυνατή στον τόπο του ατυχήματος και ούτε μπορεί να γίνει ρυμούλκηση του πλοίου","όλα τα παραπάνω","τίποτα από τα παραπάνω"],"a":0},{"id":"26230-2.2","th":"26230","part":"2.2","k":"open","secs":["Α14.2"],"p":15,"q":"Αναφέρατε τρεις από τις έξι κατηγορίες ναυτικών αδικημάτων που προβλέπονται από τον Κώδικα Δημοσίου Ναυτικού Δικαίου(ΚΔΝΔ).","sol":"Τρεις από: α) Σε αυτά που αφορούν την υπηρεσία στο πλοίο και είναι, η παράνομη απουσία, η εγκατάλειψη θέσεως, η λιποταξία, η μη προσέλευση προς ανάληψη υπηρεσίας και εγκατάλειψη κινδυνεύοντας πλοίου. β) Σε εκείνα που έχουν σχέση με την πειθαρχία στο πλοίο και είναι η ανυπακοή, εξύβριση, απειλή κατά ανώτερου, στάση, βιαιοπραγία, επιβουλή κατά του πλοιάρχου, παράνομη εισκόμιση ναρκωτικών. γ) Σε εκείνα που στρέφονται κατά της ιδιοκτησίας του πλοίου ή του φορτίου και είναι η πειρατεία, κλοπή και φθορά φορτίου ή εξοπλισμού του πλοίου. δ) Σε εκείνα που στρέφονται κατά της ασφάλειας του πλοίου και των επιβαινόντων και είναι η μία αυτοπρόσωπη διεύθυνση του πλοίου, η παράνομη ανάθεση διοικήσεως του πλοίου, οι παραβάσεις του Πλοιάρχου σε ώρα κινδύνου, οι παραβάσεις του Πλοιάρχου επί συγκρούσεως και οι παραβάσεις του κανονισμού προς αποφυγή συγκρούσεως. ε) Σε εκείνα που αφορούν υπηρεσιακές παραβάσεις του Πλοιάρχου και είναι η ανυπακοή Πλοιάρχου, η άρνηση εκτελέσεως διαταγών στην αλλοδαπή, η παράνομη εκτροπή πορείας, η παράλειψη παροχής βοήθειας σε κινδυνεύοντα πρόσωπα, η εγκατάλειψη ασθενών στην αλλοδαπή, ο πλους με ελλιπή σύνθεση, η παράνομη ναυτολόγηση λιποτάκτη, η φυγάδευση και τέλος ο απόπλους χωρίς έλεγχο της αρχής. στ) Σε εκείνα που διαπράττονται από πρόσωπα ξένα προς το πλήρωμα και είναι η απιστία επιβάτη, η αποστολή πληρώματος σε άλλο πλοίο και σε ορισμένες περιπτώσεις η πειρατεία."},{"id":"26231-2.1α","th":"26231","part":"2.1","lab":"α","k":"tf","secs":["Α1.1"],"p":3,"q":"Ναυτικό Δίκαιο είναι το σύνολο κανόνων δικαίου, οι οποίοι ρυθμίζουν τις σχέσεις που ανάγονται στο ναυτικό εμπόριο και στην ναυτιλία γενικότερα.","a":true},{"id":"26231-2.1β","th":"26231","part":"2.1","lab":"β","k":"tf","secs":["Α5.1"],"p":3,"q":"Στον τομέα της ενδιαιτήσεως του πληρώματος, ο Πλοίαρχος έχει χρέος να μεριμνά ο ίδιος αλλά και με τους αρμόδιους αξιωματικούς του για τους απαιτούμενους όρους υγιεινής και καθαριότητας.","a":true},{"id":"26231-2.1γ","th":"26231","part":"2.1","lab":"γ","k":"tf","secs":["Α5.2"],"p":3,"q":"Την ληξιαρχική πράξη θανάτου ο Πλοίαρχος οφείλει να την παραδώσει στην ελληνική λιμενική αρχή του τελευταίου λιμανιού κατάπλου του πλοίου.","a":false,"why":"Την παραδίδει στην ελληνική λιμενική ή προξενική αρχή του πρώτου λιμανιού κατάπλου του πλοίου."},{"id":"26231-2.1δ","th":"26231","part":"2.1","lab":"δ","k":"tf","secs":["Α14.3"],"p":3,"q":"Ο ναυτικός που ναυτολογήθηκε και δεν προσέρχεται αδικαιολόγητα να αναλάβει υπηρεσία στο πλοίο, τιμωρείται με φυλάκιση μέχρι έξη μηνών ή με χρηματική ποινή.","a":true},{"id":"26231-2.1ε","th":"26231","part":"2.1","lab":"ε","k":"tf","secs":["Α14.3"],"p":3,"q":"Η κατάχρηση εξουσίας τιμωρείται με φυλάκιση τουλάχιστον ενός έτους ή με χρηματική ποινή.","a":false,"why":"Η κατάχρηση εξουσίας τιμωρείται με φυλάκιση μέχρι ενός έτους και με χρηματική ποινή."},{"id":"26231-2.2","th":"26231","part":"2.2","k":"open","secs":["Α14.3"],"p":10,"q":"Να αναφέρετε ονομαστικά δύο από τα τέσσερα ναυτικά αδικήματα που στρέφονται κατά της υπηρεσίας του πλοίου και δύο από τα πέντε ναυτικά αδικήματα που στρέφονται κατά της πειθαρχίας.","sol":"Δύο από:<br>1) Η παράνομη απουσία<br>2) Η εγκατάλειψη θέσεως<br>3) Η λιποταξία<br>4) Μη προσέλευση για ανάληψη υπηρεσίας. Δύο από:<br>1) Ανυπακοή<br>2) Εξύβριση ή απειλή ανώτερου<br>3) Στάση<br>4) Επιβουλή κατά του πλοιάρχου<br>5) Κατάχρηση εξουσίας."},{"id":"26232-2.1","th":"26232","part":"2.1","k":"match","secs":["Α14.3","Β3.2","Β4.7.2"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["STCW 1995","MARPOL","Φυλάκιση μέχρις ενός έτους","SOLAS","Φυλάκιση τουλάχιστον τριών μηνών","Φυλάκιση μέχρι τριών μηνών"],"rows":[{"t":"Παράνομη απουσία","a":[5],"s":"Α14.3"},{"t":"Ανυπακοή","a":[4],"s":"Α14.3"},{"t":"Λιποταξία","a":[2],"s":"Α14.3"},{"t":"Αυξημένες απαιτήσεις για γνώσεις αγγλικής γλώσσας","a":[0],"s":"Β3.2"},{"t":"Βιβλίο πετρελαίου","a":[1],"s":"Β4.7.2"}],"filt":true},{"id":"26232-2.2α","th":"26232","part":"2.2","lab":"α","k":"open","secs":["Β6.2"],"p":5,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Να αναφέρετε έναν ειδικό στόχο που περιέχει ο Διεθνής Κώδικας για την Ασφάλεια των Πλοίων και των Λιμενικών Εγκαταστάσεων (ISPS).","sol":"Ένα από:<br>1. Επιτρέπει την ανίχνευση και την αποτροπή των απειλών για την ασφάλεια εντός του διεθνούς πλαισίου<br>2. Καθιερώνει ρόλους και ευθύνες<br>3. επιτρέπει την συλλογή και ανταλλαγή πληροφοριών για την ασφάλεια<br>4. Παρέχει μία μεθοδολογία για την αξιολόγηση της ασφάλειας<br>5. Εξασφαλίζει ότι υπάρχουν επαρκή μέτρα ασφαλείας."},{"id":"26232-2.2β","th":"26232","part":"2.2","lab":"β","k":"open","secs":["Β5.5.6"],"p":5,"ctx":"Να απαντήσετε με συντομία στα εξής:","q":"Να αναφέρετε ένα παράδειγμα κρίσιμης εργασίας στο πλοίο που περιλαμβάνεται σε γραπτές διαδικασίες, οδηγίες ή σχέδια του Συστήματος Ασφαλούς Διαχείρισης (ΣΑΔ).","sol":"Ένα από:<br>1. Ναυσιπλοΐα σε περιορισμένες θαλάσσιες περιοχές ή περιοχές με μεγάλη πυκνότητα κυκλοφορίας.<br>2. Ναυσιπλοΐα σε συνθήκες μειωμένης ορατότητας.<br>3. Εργασίες που είναι δυνατόν να προκαλέσουν αιφνίδια απώλεια της ικανότητας ελιγμών σε κλειστές ή μεγάλης κυκλοφορίας περιοχές.<br>4. Εργασίες με πολύ δυσμενείς καιρικές συνθήκες.<br>5. Χειρισμός και στοιβασία επικίνδυνων φορτίων και επιβλαβών ουσιών.<br>6. Πετρέλευση και μετάγγιση πετρελαίου στη θάλασσα.<br>7. Εργασίες φορτίου σε υγραεριοφόρα, χημικά Δ/Ξ και Δ/Ξ μεταφοράς αργού πετρελαίου.<br>8. Κρίσιμες εργασίες στο μηχανοστάσιο."},{"id":"26233-2.1α","th":"26233","part":"2.1","lab":"α","k":"tf","secs":["Α6.6"],"p":3,"q":"Ο αντλιωρός υπηρετεί μόνο στα επιβατικά πλοία.","a":false,"why":"Ο αντλιωρός υπηρετεί μόνο στα δεξαμενόπλοια."},{"id":"26233-2.1β","th":"26233","part":"2.1","lab":"β","k":"tf","secs":["Α14.3"],"p":3,"q":"Το αδίκημα της επιβουλής κατά του πλοιάρχου συντελείται, ακόμα και αν δεν έχει εκδηλωθεί απειλή ή προειδοποίησή του.","a":true},{"id":"26233-2.1γ","th":"26233","part":"2.1","lab":"γ","k":"tf","secs":["Β2.2"],"p":3,"q":"Οι αρμόδιες αρχές του παράκτιου κράτους μπορούν να απαγορεύσουν τον απόπλου πλοίου, το οποίο δεν τηρεί τις προϋποθέσεις της SOLAS.","a":true},{"id":"26233-2.1δ","th":"26233","part":"2.1","lab":"δ","k":"tf","secs":["Α6.6"],"p":3,"q":"Όταν στο επιβατικό πλοίο δεν υπηρετεί ύπαρχος, τα καθήκοντά του εκτελεί ο μηχανικός.","a":false,"why":"Όταν στο επιβατικό πλοίο δεν υπηρετεί ύπαρχος, τα καθήκοντά του εκτελεί ο υποπλοίαρχος."},{"id":"26233-2.1ε","th":"26233","part":"2.1","lab":"ε","k":"tf","secs":["Α15.3"],"p":3,"q":"Η διάρκεια της προσωρινής στέρησης του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος δεν μπορεί να είναι μικρότερη από ένα (1) έτος και μεγαλύτερη από πέντε (5) έτη.","a":false,"why":"Η προσωρινή στέρηση δεν μπορεί να είναι μικρότερη από ένα μήνα ούτε μεγαλύτερη από πέντε χρόνια."},{"id":"26233-2.2","th":"26233","part":"2.2","k":"open","secs":["Α20"],"p":10,"q":"Ποια πλοία εξαιρούνται από την υποχρεωτική πλοήγηση στα ελληνικά λιμάνια ;","sol":"α) Τα ελληνικά ακτοπλοϊκά επιβατικά πλοία που εκτελούν τακτικά δρομολόγια. β) Τα κάτω από 1000 κ.ο.χ. ελληνικά ακτοπλοϊκά φορτηγά πλοία. γ) Τα ελληνικά πολεμικά πλοία και τα βοηθητικά σκάφη του πολεμικού ναυτικού καθώς και τα ξένα πολεμικά και βοηθητικά του πολεμικού ναυτικού σκάφη, υπό τον όρο της αμοιβαιότητας, εφόσον δηλαδή και στη χώρα του ξένου πολεμικού πλοίου δεν είναι υποχρεωτική η πλοήγηση των ελληνικών πολεμικών."},{"id":"26234-2.1","th":"26234","part":"2.1","k":"match","secs":["Α1.1","Α5.2","Α6.6","Β2.1"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Δόκιμος Πλοίαρχος","Κώδικας Ιδιωτικού Ναυτικού Δικαίου","Αστυνομικά καθήκοντα του Πλοιάρχου","ΔΣ SOLAS","ΔΣ COLREG","Ληξιαρχική πράξη γέννησης"],"rows":[{"t":"Διατάξεις ενδοτικού δικαίου","a":[1],"s":"Α1.1"},{"t":"Τοκετός εν πλω","a":[5],"s":"Α5.2"},{"t":"Κύριο και βοηθητικό σύστημα πλοήγησης στα Δ/Ξ","a":[3],"s":"Β2.1"},{"t":"Μετέχει στις φυλακές γέφυρας ως βοηθός του αξιωματικού φυλακής","a":[0],"s":"Α6.6"},{"t":"Κατασταλτικά μέτρα","a":[2],"s":"Α5.2"}],"filt":true},{"id":"26234-2.2","th":"26234","part":"2.2","k":"open","secs":["Α14.3"],"p":10,"q":"Πως τιμωρείται το αδίκημα της Στάσης;","sol":"Η στάση τιμωρείται με φυλάκιση τουλάχιστον τριών ετών. Αν κάποιος από τους συμμετέχοντες στη στάση είναι αξιωματικός του πλοίου, τιμωρείται αυστηρότερα, με ποινή καθείρξεως μέχρι δέκα ετών."},{"id":"26235-2.1α","th":"26235","part":"2.1","lab":"α","k":"tf","secs":["Β2.5"],"p":3,"q":"Σύμφωνα με τη Διεθνή Σύμβαση SOLAS είναι υποχρεωτικό για όλους τους επιβάτες να εκκενώσουν ο πλοίο εντός εξήντα (60) λεπτών από την οδηγία εγκαταλείψεώς του.","a":false,"why":"Η SOLAS ορίζει την εκκένωση του πλοίου από όλους τους επιβάτες εντός 30 λεπτών από την οδηγία εγκαταλείψεως."},{"id":"26235-2.1β","th":"26235","part":"2.1","lab":"β","k":"tf","secs":["Α16.1"],"p":3,"q":"Για να θεωρηθεί ότι επήλθε διαρκής ακυβερνησία του πλοίου, πρέπει να χρησιμοποιήθηκαν ρυμουλκά ή να ζητήθηκε η βοήθειά τους.","a":true},{"id":"26235-2.1γ","th":"26235","part":"2.1","lab":"γ","k":"tf","secs":["Α1.1"],"p":3,"q":"Οι περισσότερες από τις διατάξεις του δημοσίου ναυτικού δικαίου είναι ενδοτικού δικαίου.","a":false,"why":"Οι περισσότερες διατάξεις του δημόσιου ναυτικού δικαίου είναι αναγκαστικού δικαίου."},{"id":"26235-2.1δ","th":"26235","part":"2.1","lab":"δ","k":"tf","secs":["Α28.1"],"p":3,"q":"Κάθε κράτος δύναται να προβεί σε κατάσχεση πειρατικού πλοίου είτε στην ανοιχτή θάλασσα, είτε σε ποιο άλλο μέρος εκτός της δικαιοδοσίας άλλου κράτους.","a":true},{"id":"26235-2.1ε","th":"26235","part":"2.1","lab":"ε","k":"tf","secs":["Α20"],"p":3,"q":"Ο πλοηγός κατά τη διάρκεια της πλοήγησης, φέρει την ευθύνη για τη διακυβέρνηση του πλοίου.","a":false,"why":"Ο Πλοίαρχος εξακολουθεί να φέρει ακέραια την ευθύνη για τη διακυβέρνηση· ο πλοηγός είναι σύμβουλός του."},{"id":"26235-2.2","th":"26235","part":"2.2","k":"open","secs":["Β3.2"],"p":10,"q":"Να περιγράψετε τις αυξημένες απαιτήσεις που προβλέπει η Διεθνής Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών STCW 1995 για γνώση της αγγλικής γλώσσας από τους αξιωματικούς μηχανής.","sol":"Οι αξιωματικοί μηχανής πρέπει να είναι σε θέση να μελετούν τις διάφορες εκδόσεις στην αγγλική που αφορούν σε Τεχνικές Οδηγίες και να μπορούν να επικοινωνούν με το υπόλοιπο προσωπικό που εποπτεύουν, εξασφαλίζοντας ότι οι εντολές και οι κατευθύνσεις που δίδουν γίνονται κατανοητές."},{"id":"26236-2.1","th":"26236","part":"2.1","k":"match","secs":["Α6.6"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Χειρίζεται τις αντλίες κατά τη φορτοεκφόρτωση του φορτίου","Φυλάττει τα είδη ιματισμού","Είναι υπόλογος για την υπηρεσία μαγειρείου","Φροντίζει για την ασφαλή τοποθέτηση και συντήρηση των σωσίβιων λέμβων","Βρίσκεται στο μηχανοστάσιο και παρακολουθεί τα μέσα φορτοεκφόρτωσης του πλοίου","Ασκεί την αστυνομία στο πλοίο"],"rows":[{"t":"Ηλεκτρολόγος","a":[4],"s":"Α6.6"},{"t":"Ναύκληρος","a":[3],"s":"Α6.6"},{"t":"Αντλιωρός","a":[0],"s":"Α6.6"},{"t":"Υποπλοίαρχος","a":[5],"s":"Α6.6"},{"t":"Μάγειρος","a":[2],"s":"Α6.6"}],"note":"Η λύση της τράπεζας δίνει 2στ, 4δ. Κατά το βιβλίο (6.6) την αστυνομία ασκεί ο υποπλοίαρχος και για τις σωσίβιες λέμβους φροντίζει ο ναύκληρος· εδώ 2δ, 4στ."},{"id":"26236-2.2","th":"26236","part":"2.2","k":"open","secs":["Β3.1"],"p":10,"q":"Ποιος είναι ο σκοπός κατάρτισης της Διεθνούς Σύμβασης για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών STCW 1978;","sol":"Ο σκοπός της κατάρτισης της Διεθνούς Σύμβασης STCW 1978 ήταν η καθιέρωση διεθνώς υποχρεωτικών απαιτήσεων για τη χορήγηση πιστοποιητικών (ελάχιστα όρια) σε πλοιάρχους, αξιωματικούς και πληρώματα, ιδίως γι’ αυτά των αναπτυσσόμενων χωρών που βρίσκονταν στο στάδιο της αναπτύξεως των στόλων τους."},{"id":"26237-2.1α","th":"26237","part":"2.1","lab":"α","k":"tf","secs":["Β4.7.1"],"p":3,"q":"Η MARPOL είναι η Διεθνής Σύμβαση που αφορά στα μέτρα για την αποφυγή συγκρούσεων στη θάλασσα.","a":false,"why":"Η MARPOL αφορά την πρόληψη της θαλάσσιας ρυπάνσεως από τα πλοία· για την αποφυγή συγκρούσεων είναι η COLREG (ΔΚΑΣ).","note":"Η λύση της τράπεζας δεν δίνει τις απαντήσεις· συμπληρώθηκαν από τα βιβλία."},{"id":"26237-2.1β","th":"26237","part":"2.1","lab":"β","k":"tf","secs":["Α15.1"],"p":3,"q":"Τα πειθαρχικά παραπτώματα δικάζονται και τιμωρούνται από τα ποινικά δικαστήρια.","a":false,"why":"Τα πειθαρχικά παραπτώματα κρίνονται από διοικητικούς υπαλλήλους (αξιωματικούς) και εκπροσώπους των ναυτεργατικών σωματείων· τα ποινικά δικαστήρια δικάζουν τα ποινικά αδικήματα.","note":"Η λύση της τράπεζας δεν δίνει τις απαντήσεις· συμπληρώθηκαν από τα βιβλία."},{"id":"26237-2.1γ","th":"26237","part":"2.1","lab":"γ","k":"tf","secs":["Β3.1"],"p":3,"q":"Η Διεθνής Σύμβαση STCW 1978 ασχολείται με τα επίπεδα επανδρώσεως.","a":false,"why":"Η STCW 1978 δεν ασχολείται με τα επίπεδα επανδρώσεως· αυτά καλύπτονται από το Κεφάλαιο V της SOLAS.","note":"Η λύση της τράπεζας δεν δίνει τις απαντήσεις· συμπληρώθηκαν από τα βιβλία."},{"id":"26237-2.1δ","th":"26237","part":"2.1","lab":"δ","k":"tf","secs":["Β5.5.6"],"p":3,"q":"Ο έλεγχος των εντύπων του ΣΑΔ (Σύστημα Ασφαλούς Διαχείρισης) στο πλοίο είναι ευθύνη του Πλοιάρχου.","a":true,"note":"Η λύση της τράπεζας δεν δίνει τις απαντήσεις· συμπληρώθηκαν από τα βιβλία (ο έλεγχος των εντύπων στο πλοίο είναι ευθύνη του πλοιάρχου)."},{"id":"26237-2.1ε","th":"26237","part":"2.1","lab":"ε","k":"tf","secs":["Α6.6"],"p":3,"q":"Οι διαταγές του Πλοιάρχου, που αφορούν το σήμα κινδύνου, πρέπει να δίνονται εγγράφως προς τον αξιωματικό τηλεπικοινωνιών.","a":true,"note":"Η λύση της τράπεζας δεν δίνει τις απαντήσεις· συμπληρώθηκαν από τα βιβλία."},{"id":"26237-2.2","th":"26237","part":"2.2","k":"open","secs":["Α8.4"],"p":10,"q":"Να αναφέρετε δύο εργασίες που απαγορεύεται από τον κανονισμό εργασίας να ανατίθενται στο πλήρωμα, εκτός αν συντρέχει περίπτωση έκτακτης ανάγκης.","sol":"Δύο από: α) Η χρησιμοποίηση των αξιωματικών καταστρώματος σε χειρωνακτικές εργασίες. β) Η χρησιμοποίηση των ραδιοτηλεγραφητών σε εργασίες, εκτός της ειδικότητάς τους. γ) Η εκτέλεση εν πλω εργασιών χρωματισμού και αποσκωριάσεως, με τη χρησιμοποίηση ικριωμάτων (σκαλωσιών). δ) Ο χρωματισμός και η αποσκωρίαση των εξωτερικών πλευρών του πλοίου, όταν αυτό βρίσκεται μέσα σε δεξαμενή ή σε ποταμούς ή διαύλους με ισχυρά ρεύματα. ε) Κάθε εργασία επάνω σε ιστούς όταν το αντίστοιχο βαρούλκο βρίσκεται σε λειτουργία. στ) Η πλύση και ο χρωματισμός των χωρών που βρίσκονται επάνω από λέβητα σε λειτουργία."},{"id":"26238-2.1","th":"26238","part":"2.1","k":"match","secs":["Β2.2","Β3.1","Β4.7.1","Β5.5.2","Β8.1"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Διεθνής Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών","Διεθνής Σύμβαση για την Πρόληψη της Θαλάσσιας Ρύπανσης από τα Πλοία","Διεθνής Σύμβαση για την Ασφάλεια της Ανθρώπινης Ζωής στη Θάλασσα","Διεθνής Κώδικας για την Ασφάλεια των Πλοίων και των Λιμενικών Εγκαταστάσεων","Διεθνής Κώδικας Ασφαλούς Διαχειρίσεως","Διεθνής Σύμβαση για τον Έλεγχο και τη Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων"],"rows":[{"t":"SOLAS","a":[2],"s":"Β2.2"},{"t":"STCW","a":[0],"s":"Β3.1"},{"t":"MARPOL","a":[1],"s":"Β4.7.1"},{"t":"ISM Code","a":[4],"s":"Β5.5.2"},{"t":"BWM","a":[5],"s":"Β8.1"}],"filt":true},{"id":"26238-2.2","th":"26238","part":"2.2","k":"open","secs":["Α15.2"],"p":10,"q":"Να αναφέρετε τρία πειθαρχικά παραπτώματα μελών του πληρώματος.","sol":"Τρία από: 1 Η υπαίτια μέθη, εκτός διατεταγμένης υπηρεσίας, που διαταράσσει την επί του πλοίου ευταξία. 2 Ο ύπνος κατά την εκτέλεση της υπηρεσίας. 3 Η κατάχρηση του δικαιώματος υποβολής παραπόνων (π.χ. καταγγελία στις αρχές για παραβάσεις του εδεσματολογίου, που όμως δεν οφείλονται σε υπαιτιότητα του Πλοιάρχου αλλά σε έλλειψη ειδών στο λιμάνι που βρίσκεται το πλοίο και είναι γνωστή στο πλήρωμα). 4 Η απείθεια σε υπηρεσιακή διαταγή του Πλοιάρχου ή σε πρόσκληση ανωτέρου. 5 Η εκδήλωση ελλείψεως σεβασμού προς ανωτέρους. 6 Κάθε παράβαση που αναφέρεται σε κανονισμούς ή σε διαταγή Πλοιάρχου σχετικά με το κάπνισμα σε απαγορευμένους χώρους ή το άναμμα των φώτων. 7 Κάθε αδικαιολόγητη ή χωρίς άδεια απουσία σε ελληνικό λιμάνι ή σε λιμάνι του εξωτερικού. 8 Κάθε παράβαση των διατάξεων περί τυχερών παιχνιδιών στο πλοίο. 9 Κάθε πράξη για την οποία απειλείται από τον ποινικό κώδικα πταισματική ποινή."},{"id":"26239-2.1α","th":"26239","part":"2.1","lab":"α","k":"tf","secs":["Α5.1"],"p":3,"q":"Στον τομέα της ενδιαιτήσεως του πληρώματος, ο Πλοίαρχος έχει χρέος να μεριμνά ο ίδιος αλλά και με τους αρμόδιους αξιωματικούς, για την εξασφάλιση των όρων υγιεινής.","a":true},{"id":"26239-2.1β","th":"26239","part":"2.1","lab":"β","k":"tf","secs":["Α5.2"],"p":3,"q":"Την ληξιαρχική πράξη θανάτου ο Πλοίαρχος οφείλει να την παραδώσει στην ελληνική λιμενική ή προξενική του τελευταίου λιμανιού κατάπλου του πλοίου.","a":false,"why":"Την παραδίδει στην ελληνική λιμενική ή προξενική αρχή του πρώτου λιμανιού κατάπλου του πλοίου."},{"id":"26239-2.1γ","th":"26239","part":"2.1","lab":"γ","k":"tf","secs":["Α14.3"],"p":3,"q":"Ο ναυτικός που ναυτολογήθηκε και δεν προσέρχεται αδικαιολόγητα να αναλάβει υπηρεσία στο πλοίο, τιμωρείται με φυλάκιση μέχρι έξη μηνών ή με χρηματική ποινή.","a":true},{"id":"26239-2.1δ","th":"26239","part":"2.1","lab":"δ","k":"tf","secs":["Α14.3"],"p":3,"q":"Η κατάχρηση εξουσίας τιμωρείται με φυλάκιση μέχρι ενός έτους και με χρηματική ποινή.","a":true},{"id":"26239-2.1ε","th":"26239","part":"2.1","lab":"ε","k":"tf","secs":["Α15.1"],"p":3,"q":"Τα πειθαρχικά παραπτώματα δικάζονται και τιμωρούνται από τα ποινικά δικαστήρια.","a":false,"why":"Τα πειθαρχικά παραπτώματα κρίνονται από διοικητικούς υπαλλήλους (αξιωματικούς) και εκπροσώπους των ναυτεργατικών σωματείων."},{"id":"26239-2.2","th":"26239","part":"2.2","k":"open","secs":["Β6.1"],"p":10,"q":"Να αναφέρετε με συντομία τους κύριους στόχους των μέτρων ασφαλείας του Διεθνούς Κώδικα για την Ασφάλεια των Πλοίων και των Λιμενικών Εγκαταστάσεων.","sol":"1 Συνειδητοποίηση, 2 Μέτρα προλήψεως, 3 Αντιμετώπιση, 4 Διαχείριση των επακολούθων."},{"id":"26240-2.1α","th":"26240","part":"2.1","lab":"α","k":"tf","secs":["Β2.5"],"p":3,"q":"Σύμφωνα με τη Διεθνή Σύμβαση SOLAS είναι υποχρεωτικό για όλους τους επιβάτες να εκκενώσουν το πλοίο εντός εξήντα (60) λεπτών από την οδηγία εγκαταλείψεώς του.","a":false,"why":"Η SOLAS ορίζει την εκκένωση του πλοίου από όλους τους επιβάτες εντός 30 λεπτών από την οδηγία εγκαταλείψεως."},{"id":"26240-2.1β","th":"26240","part":"2.1","lab":"β","k":"tf","secs":["Α16.1"],"p":3,"q":"Για να θεωρηθεί ότι επήλθε διαρκής ακυβερνησία του πλοίου, πρέπει να χρησιμοποιήθηκαν ρυμουλκά ή να ζητήθηκε η βοήθειά τους.","a":true},{"id":"26240-2.1γ","th":"26240","part":"2.1","lab":"γ","k":"tf","secs":["Α1.1"],"p":3,"q":"Οι περισσότερες από τις διατάξεις του δημοσίου ναυτικού δικαίου είναι ενδοτικού δικαίου.","a":false,"why":"Οι περισσότερες διατάξεις του δημόσιου ναυτικού δικαίου είναι αναγκαστικού δικαίου."},{"id":"26240-2.1δ","th":"26240","part":"2.1","lab":"δ","k":"tf","secs":["Α28.1"],"p":3,"q":"Κάθε κράτος δύναται να προβεί σε κατάσχεση πειρατικού πλοίου είτε στην ανοιχτή θάλασσα, είτε σε όποιο άλλο μέρος εκτός της δικαιοδοσίας άλλου κράτους.","a":true},{"id":"26240-2.1ε","th":"26240","part":"2.1","lab":"ε","k":"tf","secs":["Α20"],"p":3,"q":"Ο πλοηγός κατά τη διάρκεια της πλοήγησης, φέρει την ευθύνη για τη διακυβέρνηση του πλοίου.","a":false,"why":"Ο Πλοίαρχος εξακολουθεί να φέρει ακέραια την ευθύνη για τη διακυβέρνηση· ο πλοηγός είναι σύμβουλός του."},{"id":"26240-2.2","th":"26240","part":"2.2","k":"open","secs":["Β2.2"],"p":10,"q":"Ποιος είναι ο κύριος σκοπός της Διεθνούς Σύμβασης για την Ασφάλεια της ναυσιπλοΐας και της ανθρώπινης ζωής στη θάλασσα (SOLAS);","sol":"Ο κύριος σκοπός της SOLAS είναι να καθορίζει τις ελάχιστες προδιαγραφές για την κατασκευή, τον εξοπλισμό και τη λειτουργία των πλοίων που είναι συμβατές με τα επίπεδα ασφάλειας."},{"id":"26242-2.1α","th":"26242","part":"2.1","lab":"α","k":"fill","secs":["Α6.6"],"p":3,"q":"Οι Γ' μηχανικοί εκτελούν φυλακές και κάθε άλλη εργασία της ειδικότητάς τους που τους αναθέτει ο ⟨⟩","opts":["Α΄ μηχανικός","Β΄ μηχανικός","λιπαντής","δόκιμος μηχανής","Πλοίαρχος"],"a":1},{"id":"26242-2.1β","th":"26242","part":"2.1","lab":"β","k":"fill","secs":["Α6.6"],"p":3,"q":"Ο ηλεκτρολόγος υπάγεται στις άμεσες διαταγές του ⟨⟩","opts":["Α΄ μηχανικός","Β΄ μηχανικός","λιπαντής","δόκιμος μηχανής","Πλοίαρχος"],"a":0},{"id":"26242-2.1γ","th":"26242","part":"2.1","lab":"γ","k":"fill","secs":["Α6.6"],"p":3,"q":"Ο ⟨⟩ μετέχει στις επισκευές και στις εργασίες παραλαβής καυσίμων σύμφωνα με τις εντολές του Α΄ μηχανικού.","opts":["Α΄ μηχανικός","Β΄ μηχανικός","λιπαντής","δόκιμος μηχανής","Πλοίαρχος"],"a":3},{"id":"26242-2.1δ","th":"26242","part":"2.1","lab":"δ","k":"fill","secs":["Α6.6"],"p":3,"q":"Ο Α΄ μηχανικός τηρεί υπό την εποπτεία του ⟨⟩ το ημερολόγιο της μηχανής.","opts":["Α΄ μηχανικός","Β΄ μηχανικός","λιπαντής","δόκιμος μηχανής","Πλοίαρχος"],"a":4},{"id":"26242-2.1ε","th":"26242","part":"2.1","lab":"ε","k":"fill","secs":["Α6.6"],"p":3,"q":"Οι καθαριστές-μαθητευόμενοι μηχανής βοηθούν τον ⟨⟩ στα καθήκοντά του.","opts":["Α΄ μηχανικός","Β΄ μηχανικός","λιπαντής","δόκιμος μηχανής","Πλοίαρχος"],"a":2},{"id":"26242-2.2","th":"26242","part":"2.2","k":"open","secs":["Α19"],"p":10,"q":"Τι αναλαμβάνει ο ναυλομεσίτης;","sol":"Ναυλομεσίτης είναι το πρόσωπο που αναλαμβάνει, έναντι αμοιβής, να φέρει σε επαφή τον πλοιοκτήτη με τον φορτωτή για την σύναψη συμβάσεως ναυλώσεως του πλοίου. Πολλές φορές ο ναυλομεσίτης ενεργεί και ως ναυτικός πράκτορας."},{"id":"26244-2.1α","th":"26244","part":"2.1","lab":"α","k":"tf","secs":["Α8.4"],"p":3,"q":"Οι φύλακες (βάρδιες) στη Γέφυρα και στο Μηχανοστάσιο είναι 3ωρες ή 6ωρες.","a":false,"why":"Οι φυλακές είναι τετράωρες· αν η σύνθεση του πληρώματος δεν επαρκεί, γίνονται δύο εξάωρες."},{"id":"26244-2.1β","th":"26244","part":"2.1","lab":"β","k":"tf","secs":["Β4.7.1"],"p":3,"q":"Οι διαδικασίες υπογραφής της MARPOL είναι ανοιχτές για οποιοδήποτε κράτος.","a":true},{"id":"26244-2.1γ","th":"26244","part":"2.1","lab":"γ","k":"tf","secs":["Β3.3"],"p":3,"q":"Οι ναυτικοί υποχρεούνται να φέρουν επί του πλοίου τα πρωτότυπα πιστοποιητικά τους.","a":true},{"id":"26244-2.1δ","th":"26244","part":"2.1","lab":"δ","k":"tf","secs":["Α6.6"],"p":3,"q":"Για παροχή πρώτων βοηθειών στο πλοίο υπεύθυνος είναι ο ανθυποπλοίαρχος.","a":false,"why":"Για την παροχή πρώτων βοηθειών φροντίζει ο υποπλοίαρχος."},{"id":"26244-2.1ε","th":"26244","part":"2.1","lab":"ε","k":"tf","secs":["Β4.7.2"],"p":3,"q":"Σύμφωνα με την MARPOL, όταν το πλοίο βρίσκεται έξω από ειδικές περιοχές επιτρέπεται η απόρριψη πετρελαίου στα 10 ναυτικά μίλια και πέρα.","a":false,"why":"Έξω από ειδικές περιοχές τα Δ/Ξ απορρίπτουν (υπό προϋποθέσεις) μόνο πέραν των 50 ν.μ. από την πλησιέστερη ακτή και τα άλλα πλοία πέραν των 12 ν.μ.· όχι 10 ν.μ."},{"id":"26244-2.2","th":"26244","part":"2.2","k":"open","secs":["Α15.3"],"p":10,"q":"Να αναφέρετε ονομαστικά τις Πειθαρχικές ποινές των ναυτικών κατά τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ).","sol":"Η επίπληξη, το πρόστιμο και η προσωρινή ή οριστική στέρηση ασκήσεως του ναυτικού επαγγέλματος."},{"id":"26245-2.1","th":"26245","part":"2.1","k":"mc","secs":["Α6.6"],"p":10,"q":"Κατανέμει το προσωπικό της μηχανής στις φυλακές και στις διάφορες εργασίες και παρακολουθεί την καλή εκτέλεση τους:","opts":["Β΄ μηχανικός","Πλοίαρχος","Α΄ μηχανικός","Γ΄ μηχανικός","Υποπλοίαρχος"],"a":2},{"id":"26245-2.2","th":"26245","part":"2.2","k":"open","secs":["Α1.1"],"p":15,"q":"Αναφέρατε τι διατάξεις περιλαμβάνει το Δημόσιο Ναυτικό Δίκαιο.","sol":"Περιλαμβάνει διατάξεις δημοσίου διεθνούς ναυτικού δικαίου, διοικητικού ναυτικού δικαίου (ασφάλειας ναυσιπλοΐας, ναυτικής εκπαιδεύσεως, ακτοπλοΐας, διοικητικού ελέγχου, ναυτικών ατυχημάτων) ποινικού και πειθαρχικού δικαίου και ναυτικού εργατικού δικαίου."},{"id":"26333-2.1","th":"26333","part":"2.1","k":"mc","secs":["Β8.1"],"p":10,"q":"Η Διεθνής σύμβαση για τον Έλεγχο και την Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων BWM υιοθετήθηκε για:","opts":["την αντιμετώπιση της θαλάσσιας ρύπανσης από πετρελαιοειδή","την αντιμετώπιση των προβλημάτων από την μεταφορά θαλασσινού έρματος","την ασφάλεια της ζωής στην θάλασσα","την αντιμετώπιση της ρύπανσης της ατμόσφαιρας από τα πλοία","τίποτα από τα παραπάνω"],"a":1},{"id":"26333-2.2","th":"26333","part":"2.2","k":"open","secs":["Β4.7.2"],"p":15,"q":"Να αναφέρετε τρεις από τις πέντε ειδικές περιοχές σύμφωνα με το Παράρτημα Ι της Διεθνούς Σύμβασης για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL).","sol":"Τρεις από:<br>1)Η Μεσόγειος από τον παράλληλο 41ο Β στα θαλάσσια όρια Μεσογείου και Μαύρης Θάλασσας μέχρι τον μεσημβρινό 5ο 36΄ Δ στα στενά του Γιβραλτάρ.<br>2) Η Βαλτική Θάλασσα από τον κόλπο της Βοθνίας στην Φιλανδία μέχρι την είσοδο της Βαλτικής, που ορίζεται από τον παράλληλο 57 ο 44,8΄.<br>3) Η Μαύρη Θάλασσα μέχρι τον παράλληλο 41ο Β στα θαλάσσια σύνορα Μεσογείου και Ευξείνου Πόντου.<br>4) Η Ερυθρά Θάλασσα περιλαμβάνοντας στους κόλπους του Σουέζ και της Άκαμπα.<br>5) Η θαλάσσια περιοχή των Κόλπων, δηλαδή του Περσικού και του Ομάν."},{"id":"29336-2.1α","th":"29336","part":"2.1","lab":"α","k":"fill","secs":["Β8.1"],"p":3,"q":"Η Διεθνής Σύμβαση για τον Έλεγχο και την Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων είναι η ⟨⟩","opts":["STCW","MARPOL","BWM","ISM","SOLAS","COLREG"],"a":2},{"id":"29336-2.1β","th":"29336","part":"2.1","lab":"β","k":"fill","secs":["Β5.5.2"],"p":3,"q":"Ο Διεθνής Κώδικας Ασφαλούς Διαχειρίσεως είναι ο ⟨⟩","opts":["STCW","MARPOL","BWM","ISM","SOLAS","COLREG"],"a":3},{"id":"29336-2.1γ","th":"29336","part":"2.1","lab":"γ","k":"fill","secs":["Β3.1"],"p":3,"q":"Η ⟨⟩ είναι η Διεθνής Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών.","opts":["STCW","MARPOL","BWM","ISM","SOLAS","COLREG"],"a":0},{"id":"29336-2.1δ","th":"29336","part":"2.1","lab":"δ","k":"fill","secs":["Β4.7.2"],"p":3,"q":"Η Διεθνής Σύμβαση ⟨⟩ καθιερώνει τις ειδικές θαλάσσιες περιοχές, που θεωρούνται αρκετά ευπαθείς στην θαλάσσια ρύπανση από πετρελαιοειδή.","opts":["STCW","MARPOL","BWM","ISM","SOLAS","COLREG"],"a":1},{"id":"29336-2.1ε","th":"29336","part":"2.1","lab":"ε","k":"fill","secs":["Β2.2"],"p":3,"q":"Η Διεθνής Σύμβαση ⟨⟩ καθορίζει τις ελάχιστες προδιαγραφές για την κατασκευή, τον εξοπλισμό και την λειτουργία των πλοίων που είναι συμβατές με τα επίπεδα ασφαλείας.","opts":["STCW","MARPOL","BWM","ISM","SOLAS","COLREG"],"a":4},{"id":"29336-2.2","th":"29336","part":"2.2","k":"open","secs":["Β4.8"],"p":10,"q":"Ποιο είναι το συγκεκριμένο σχέδιο που προβλέπει ο Νόμος για την Ρύπανση από Πετρέλαιο (Oil Pollution Act-OPA) για τα δεξαμενόπλοια;","sol":"Καθιστά υποχρεωτική την εφαρμογή των DH ή/και DB για όλα τα νέα δεξαμενόπλοια που καταπλέουν σε περιοχές δικαιοδοσίας των ΗΠΑ."},{"id":"29339-2.1α","th":"29339","part":"2.1","lab":"α","k":"fill","secs":["Β6.1"],"p":3,"q":"Σύμφωνα με τον κώδικα International Ship and Port Facility Security Code (ISPS) τα συμβαλλόμενα μέρη οφείλουν να ορίσουν ⟨⟩ για τα πλοία που φέρουν τη σημαία τους.","opts":["σχέδιο διαχειρίσεως του θαλασσίου έρματος","Κώδικας Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση","επίπεδο ασφάλειας","Πιστοποιητικό για την Αποφυγή της Ρυπάνσεως από Πετρέλαιο","τεχνικής υφής παράρτημα","φαινομενικό νηολόγιο"],"a":2},{"id":"29339-2.1β","th":"29339","part":"2.1","lab":"β","k":"fill","secs":["Β8.2"],"p":3,"q":"Σύμφωνα με τη σύμβαση BWM όλα τα πλοία σε διεθνή κυκλοφορία είναι υποχρεωμένα να διαχειριστούν το θαλάσσιο έρμα και τα ιζήματα με ένα ⟨⟩","opts":["σχέδιο διαχειρίσεως του θαλασσίου έρματος","Κώδικας Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση","επίπεδο ασφάλειας","Πιστοποιητικό για την Αποφυγή της Ρυπάνσεως από Πετ ,"q":"Η Ανυπακοή ⟨⟩","opts":["είναι πειθαρχικό παράπτωμα του πλοιάρχου","επιφέρει προσωρινή στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος","επιφέρει οριστική στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος","τιμωρείται με φυλάκιση τουλάχιστον τριών ετών","τιμωρείται με φυλάκιση τουλάχιστον τριών μηνών","τιμωρείται με φυλάκιση μέχρι τριών μηνών"],"a":4},{"id":"29342-2.2","th":"29342","part":"2.2","k":"open","secs":["Α5.1"],"p":10,"q":"Να αναφέρετε τι δύναμη έχει η έκθεση του Πλοιάρχου σε περιπτώσεις εκτάκτων συμβάντων και που αποσκοπεί.","sol":"Έχει αποδεικτική δύναμη και σκοπεί στην κατοχύρωση των δικαιωμάτων του πλοίου και στην νομική προστασία του Πλοιάρχου."},{"id":"29344-2.1α","th":"29344","part":"2.1","lab":"α","k":"tf","secs":["Β3.2"],"p":3,"q":"Ένα από τα κύρια χαρακτηριστικά της ΔΣ για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών STCW 1995, ήταν και ένας Κώδικας που περιελάμβανε τα προαιρετικά ελάχιστα όρια τεχνογνωσίας.","a":false,"why":"Ο Κώδικας της STCW 1995 περιλάμβανε στο πρώτο μέρος τα υποχρεωτικά ελάχιστα κριτήρια τεχνογνωσίας· στο δεύτερο μέρος δίνει οδηγίες."},{"id":"29344-2.1β","th":"29344","part":"2.1","lab":"β","k":"tf","secs":["Α16.1"],"p":3,"q":"Πραγματική απώλεια του πλοίου υπάρχει όταν η επισκευή δεν είναι δυνατή στον τόπο του ατυχήματος.","a":false,"why":"Αυτή είναι τεκμαρτή απώλεια· πραγματική απώλεια υπάρχει όταν το πλοίο χάνεται ολοσχερώς."},{"id":"29344-2.1γ","th":"29344","part":"2.1","lab":"γ","k":"tf","secs":["Α20"],"p":3,"q":"Από την υποχρεωτική πλοήγηση εξαιρούνται τα κάτω από 1000 κ.ο.χ. ελληνικά ακτοπλοϊκά φορτηγά πλοία.","a":true},{"id":"29344-2.1δ","th":"29344","part":"2.1","lab":"δ","k":"tf","secs":["Α8.1"],"p":3,"q":"ΟΙ κανονισμοί εργασίας για τους ναυτικούς καταρτίζονται από το Υπουργείο Εργασίας και Κοινωνικών Υποθέσεων.","a":false,"why":"Οι κανονισμοί εργασίας καταρτίζονται από το ΥΕΝ και εγκρίνονται με προεδρικά διατάγματα."},{"id":"29344-2.1ε","th":"29344","part":"2.1","lab":"ε","k":"tf","secs":["Β4.7.1"],"p":3,"q":"Η Διεθνής Σύμβαση για την πρόληψη της Ρύπανσης από πλοία (MARPOL) αναφέρεται περισσότερο στα πλοία αντί των θαλάσσιων περιοχών.","a":true},{"id":"29344-2.2","th":"29344","part":"2.2","k":"open","secs":["Β5.5.5"],"p":10,"q":"Γιατί σύμφωνα με τον Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ), κάθε εταιρεία πρέπει να ορίζει ένα εξουσιοδοτημένο πρόσωπο (Designated Person Ashore - DPA);","sol":"Για να εξασφαλίζεται η ασφαλής λειτουργία κάθε πλοίου και για την καθιέρωση ενός συνδέσμου μεταξύ της εταιρείας και εκείνων που βρίσκονται στο πλοίο, κάθε εταιρεία, ανάλογα με την περίπτωση θα ορίζει ένα πρόσωπο ή πρόσωπα στην ξηρά τα οποία έχουν απευθείας πρόσβαση στο υψηλότερο επίπεδο της διοίκησης."},{"id":"29345-2.1","th":"29345","part":"2.1","k":"mc","secs":["Β8.2"],"p":10,"q":"O κανονισμός Β-2, της ΔΣ για τον Έλεγχο και την Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων (BWM), αναφέρεται στην τήρηση του βιβλίου θαλασσέρματος για","opts":["κάθε φορά που το πλοίο παίρνει έρμα","κάθε φορά που το πλοίο παίρνει έρμα, όταν γίνεται χρήση αυτού και όταν απορρίπτεται στην θάλασσα","όταν απορρίπτεται στην θάλασσα","όταν γίνεται χρήση αυτού","όταν βρεθούν παθογόνοι μικροοργανισμοί στο έρμα"],"a":1},{"id":"29345-2.2","th":"29345","part":"2.2","k":"open","secs":["Α28.1"],"p":15,"q":"Ποιο πλοίο ή (αεροσκάφος) χαρακτηρίζεται ως πειρατικό;","sol":"Πειρατικό πλοίο ή (αεροσκάφος) χαρακτηρίζεται εκείνο του οποίου τα πρόσωπα που ασκούν τον πραγματικό έλεγχο του το χρησιμοποιούν προκειμένου να διαπράξουν πράξεις πειρατείας. Αυτό ισχύει και για πλοίο που έχει χρησιμοποιηθεί για να διαπραχθεί οποιαδήποτε τέτοια πράξη και για όσο χρόνο αυτή διαρκεί."},{"id":"29347-2.1α","th":"29347","part":"2.1","lab":"α","k":"tf","secs":["Α15.3"],"p":3,"q":"Η υπαίτια ρύπανση του θαλάσσιου περιβάλλοντος είναι λόγος για την επιβολή προσωρινής στέρησης του δικαιώματος άσκησης του ναυτικού επαγγέλματος.","a":true},{"id":"29347-2.1β","th":"29347","part":"2.1","lab":"β","k":"tf","secs":["Α15.3"],"p":3,"q":"Η επίπληξη αποτελεί απλή σύσταση, αν δεν καταγραφεί στο ποινολόγιο.","a":true},{"id":"29347-2.1γ","th":"29347","part":"2.1","lab":"γ","k":"tf","secs":["Α14.3"],"p":3,"q":"Η κατάχρηση εξουσίας τιμωρείται με φυλάκιση τουλάχιστον ενός έτους.","a":false,"why":"Η κατάχρηση εξουσίας τιμωρείται με φυλάκιση μέχρι ενός έτους και με χρηματική ποινή."},{"id":"29347-2.1δ","th":"29347","part":"2.1","lab":"δ","k":"tf","secs":["Β2.1"],"p":3,"q":"Σύμφωνα με τη Διεθνή Σύμβαση SOLAS, μόνο τα δεξαμενόπλοια είναι υποχρεωμένα να διαθέτουν κύριο και βοηθητικό σύστημα πλοήγησης.","a":false,"why":"Όλα τα πλοία είναι υποχρεωμένα να διαθέτουν κύριο και βοηθητικό σύστημα πλοηγήσεως· στα Δ/Ξ άνω των 10.000 τόνων το κύριο σύστημα έχει δύο ή περισσότερες μονάδες ισχύος."},{"id":"29347-2.1ε","th":"29347","part":"2.1","lab":"ε","k":"tf","secs":["Α19"],"p":3,"q":"Ναυτικοί πράκτορες είναι τα πρόσωπα που αναλαμβάνουν κατ’ επάγγελμα, κατόπιν διορισμού από τον πλοιοκτήτη, την πρακτόρευση του πλοίου.","a":true},{"id":"29347-2.2","th":"29347","part":"2.2","k":"open","secs":["Β2.6"],"p":10,"q":"Να αναφέρετε, ονομαστικά, τα πιο σημαντικά χαρακτηριστικά του Κώδικα Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση (BLU CODE).","sol":"Τα πιο σημαντικά χαρακτηριστικά του Κώδικα Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση (BLU CODE) είναι:<br>1) Πιο ανθεκτικά νέα πλοία.<br>2) Βελτίωση των πρακτικών χειρισμού των φορτίων.<br>3) Περιορισμοί στη μεταφορά των φορτίων.<br>4) Όργανα φορτώσεως.<br>5) Ενίσχυση των επιθεωρήσεων."},{"id":"29349-2.1","th":"29349","part":"2.1","k":"match","secs":["Β2.5","Β5.5.6","Β8.1"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Διεθνής Σύμβαση για τον Έλεγχο και τη Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων","Διεθνές Φόρουμ Ναυτιλιακών Εταιρειών Πετρελαίου","Διεθνές Ναυτιλιακό Επιμελητήριο","Επιτροπή Ναυτικής Ασφάλειας του ΙΜΟ","Διεθνής Εταιρεία Χειριστών Υγραεριοφόρων και Εγκαταστάσεων","Πιστοποιητικό για την Αποφυγή της Ρυπάνσεως από Πετρέλαιο"],"rows":[{"t":"MSC","a":[3],"s":"Β2.5"},{"t":"OCIMF","a":[1],"s":"Β5.5.6"},{"t":"BWM","a":[0],"s":"Β8.1"},{"t":"ICS","a":[2],"s":"Β5.5.6"},{"t":"SIGTTO","a":[4],"s":"Β5.5.6"}],"filt":true},{"id":"29349-2.2","th":"29349","part":"2.2","k":"open","secs":["Α14.3"],"p":10,"q":"Να αναφέρετε τις ποινές για την παράνομη απουσία και για την εγκατάλειψη θέσεως.","sol":"Στην παράνομη απουσία ο δράστης τιμωρείται με φυλάκιση μέχρι τριών μηνών. Στην εγκατάλειψη θέσεως ο δράστης τιμωρείται με φυλάκιση μέχρι έξι μηνών."},{"id":"29351-2.1","th":"29351","part":"2.1","k":"match","secs":["Α14.2"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Άρνηση εκτελέσεως διαταγών στην αλλοδαπή","Απείθεια επιβάτη","Μη αυτοπρόσωπη διεύθυνση του πλοίου","Λιποταξία","Στάση","Πειρατεία"],"rows":[{"t":"Ναυτικό αδίκημα που στρέφεται κατά της ασφάλειας του πλοίου και των επιβαινόντων","a":[2],"s":"Α14.2"},{"t":"Ναυτικό αδίκημα που στρέφεται κατά της ιδιοκτησίας του πλοίου ή του φορτίου","a":[5],"s":"Α14.2"},{"t":"Ναυτικό αδίκημα που αφορά στην υπηρεσία στο πλοίο","a":[3],"s":"Α14.2"},{"t":"Ναυτικό αδίκημα που αφορά υπηρεσιακές παραβάσεις του Πλοιάρχου","a":[0],"s":"Α14.2"},{"t":"Ναυτικό αδίκημα που έχει σχέση με την πειθαρχία στο πλοίο","a":[4],"s":"Α14.2"}]},{"id":"29351-2.2","th":"29351","part":"2.2","k":"open","secs":["Β2.1"],"p":10,"q":"Στα θέματα σχεδιασμού των πλοίων οι κύριες διατάξεις βρίσκονται πάλι στην Διεθνή Σύμβαση για την Ασφάλεια της Ζωής στην Θάλασσα (SOLAS 1974) με τις τροποποιήσεις της. Να προσδιορίσετε που αναφέρονται ειδικά.","sol":"Αναφέρονται ειδικά στην ευστάθεια, στις μηχανικές και ηλεκτρολογικές εγκαταστάσεις, στην υποδιαίρεση και στην προστασία από πυρκαγιά."},{"id":"29353-2.1α","th":"29353","part":"2.1","lab":"α","k":"tf","secs":["Β4.7.2"],"p":3,"q":"Σύμφωνα με την Διεθνή Σύμβαση για την πρόληψη της Ρύπανσης από πλοία (MARPOL) απαγορεύονται οι απορρίψεις πετρελαίου από τους χώρους δεξαμενών φορτίου και αντλιοστασίου τα Δ/Ξ όλων των μεγεθών εκτός από το καθαρό ή διαχωρισμένο έρμα μέσα σε ειδικές περιοχές ή έξω από ειδικές περιοχές αλλά μόνον εντός 100ν.μ. από την πλησιέστερη ακτή.","a":false,"why":"Η απαγόρευση ισχύει μέσα σε ειδικές περιοχές ή έξω από αυτές αλλά εντός 50 ν.μ. από την πλησιέστερη ακτή."},{"id":"29353-2.1β","th":"29353","part":"2.1","lab":"β","k":"tf","secs":["Α14.3"],"p":3,"q":"Το αδίκημα της λιποταξίας υφίσταται όταν μέλος του πληρώματος απουσιάζει αδικαιολόγητα στην ημεδαπή.","a":false,"why":"Η λιποταξία μπορεί να γίνει μόνο στην αλλοδαπή (στο εξωτερικό)."},{"id":"29353-2.1γ","th":"29353","part":"2.1","lab":"γ","k":"tf","secs":["Α8.4"],"p":3,"q":"Στις εργασίες «εν πλω», το προσωπικό καταστρώματος κατανέμεται σε εργασίες γέφυρας ή γενικές εργασίες σκάφους με τη αποκλειστική μέριμνα του Πλοιάρχου.","a":false,"why":"Το προσωπικό καταστρώματος κατανέμεται με τη φροντίδα του υποπλοιάρχου."},{"id":"29353-2.1δ","th":"29353","part":"2.1","lab":"δ","k":"tf","secs":["Α19"],"p":3,"q":"Ο ναυτικός πράκτορας μέριμνα και για τον εφοδιασμό του πλοίου με τα αναγκαία εφόδια και καύσιμα και την επισκευή του.","a":true},{"id":"29353-2.1ε","th":"29353","part":"2.1","lab":"ε","k":"tf","secs":["Β2.2"],"p":3,"q":"Σύμφωνα με τον κύριο σκοπό της Διεθνούς Συμβάσεως για την Ασφάλεια της Ανθρώπινης Ζωής στην Θάλασσα (SOLAS), τα κράτη της σημαίας είναι υπεύθυνα για να εξασφαλίσουν ότι τα πλοία υπό τη σημαία τους συμμορφώνονται με τις διατάξεις της.","a":true},{"id":"29353-2.2","th":"29353","part":"2.2","k":"open","secs":["Β5.5.6"],"p":10,"q":"Να αναφέρετε τι πρέπει να καλύπτουν τα σχέδια ελέγχων, σύμφωνα με την διάταξη του Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ) για την επαλήθευση, τον έλεγχο και την αξιολόγηση της εταιρείας.","sol":"1) Τους ειδικούς τομείς και δραστηριότητες που θα ελεγχθούν.<br>2) Τα προσόντα του προσωπικού που εκτελεί τους ελέγχους.<br>3) Τις διαδικασίες για την αναφορά των αποτελεσμάτων, τα συμπεράσματα και τις προτάσεις."},{"id":"29355-2.1","th":"29355","part":"2.1","k":"mc","secs":["Β5.5.5"],"p":10,"q":"Στους κύριους στόχους του Κώδικα Ασφαλούς Διαχειρίσεως συμπεριλαμβάνεται","opts":["η εξασφάλιση της ασφάλειας στη θάλασσα","η πρόληψη των τραυματισμών ή των απωλειών ανθρώπινων ζώων","η πρόληψη ζημιών στο περιβάλλον ιδίως στο θαλάσσιο περιβάλλον και στα περιουσιακά στοιχεία","όλα τα παραπάνω","τίποτα από τα παραπάνω"],"a":3},{"id":"29355-2.2","th":"29355","part":"2.2","k":"open","secs":["Α15.3"],"p":15,"q":"Να αναλύσετε την επίπληξη ως πειθαρχική ποινή των ναυτικών, κατά τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ).","sol":"Η ποινή αυτή μπορεί να είναι γραπτή ή μόνο προφορική. Και στις δύο όμως περιπτώσεις πρέπει να καταγράφεται στο ποινολόγιο του πλοίου από τον Πλοίαρχο. Επίπληξη που δεν καταγράφεται στο ποινολόγιο δεν αποτελεί ποινή αλλά απλή σύσταση. Στην ουσία δεν υπάρχει διαφορά μεταξύ προφορικής και έγγραφης επιπλήξεως εφόσον και οι δύο καταγράφονται στο ποινολόγιο."},{"id":"32263-2.1α–θ","th":"32263","part":"2.1","lab":"α–θ","k":"fillp","secs":["Α5.2"],"p":9,"q":"Για τα αδικήματα που διαπράττονται επάνω στο πλοίο κατά την διάρκεια του πλου ή σε λιμάνια της αλλοδαπής, όπου δεν εδρεύει ελληνική λιμενική ή ⟨α⟩, ανακριτικά καθήκοντα ασκεί ο ⟨β⟩. Αν στη διάπραξη της αξιόποινης πράξεως έχει λάβει μέρος και ο ίδιος ο ⟨γ⟩, τότε η τυχόν ενεργηθείσα από αυτόν ανάκριση θεωρείτε ότι δεν έγινε. Κατά την άσκηση ανακριτικών καθηκόντων ο πλοίαρχος προσλαμβάνει ως ⟨δ⟩ έναν από τους αξιωματικούς του πλοίου ή αν δεν υπάρχει, άλλο μέλος του ⟨ε⟩ Τα ⟨στ⟩ Αποσκοπούν στην αποτροπή κινδύνων που απειλούν την τάξη και την ⟨ζ⟩ του πλοίου, των επιβαινόντων και του ⟨η⟩ Σε περίπτωση διαπράξεως παράνομων πράξεων, ο πλοίαρχος λαμβάνει ⟨θ⟩, όπως είναι η διενέργεια έρευνας, κατάσχεση λαθραίων ειδών,η θέση σε περιορισμό του υπαίτιου κλπ.","labs":["α","β","γ","δ","ε","στ","ζ","η","θ"],"opts":["Πλοίαρχος","Γραμματέα","Πληρώματος","Προξενική Αρχή","Κατασταλτικά μέτρα","Προληπτικά μέτρα","Ασφάλεια","Φορτίο","Σχετικές διατάξεις","πράξη","Ναυτικού","Πειθαρχικό παράπτωμα","παράβαση","Υπηρεσιακών"],"a":[3,0,0,1,2,5,6,7,4],"note":"Στην τράπεζα το «Πλοίαρχος» υπάρχει δύο φορές (1 και 5)· εδώ μία φορά, για τα κενά β) και γ)."},{"id":"32263-2.1ι–ιε","th":"32263","part":"2.1","lab":"ι–ιε","k":"fillp","secs":["Α15.1"],"p":6,"q":"⟨ι⟩, σύμφωνα με το νόμο, είναι κάθε ⟨ια⟩ των ⟨ιβ⟩ καθηκόντων του ⟨ιγ⟩ και κάθε άλλη ⟨ιδ⟩ αυτού που ειδικά καθορίζεται με ⟨ιε⟩","labs":["ι","ια","ιβ","ιγ","ιδ","ιε"],"opts":["Πλοίαρχος","Γραμματέα","Πληρώματος","Προξενική Αρχή","Κατασταλτικά μέτρα","Προληπτικά μέτρα","Ασφάλεια","Φορτίο","Σχετικές διατάξεις","πράξη","Ναυτικού","Πειθαρχικό παράπτωμα","παράβαση","Υπηρεσιακών"],"a":[11,12,13,10,9,8],"note":"Στην τράπεζα το «Πλοίαρχος» υπάρχει δύο φορές (1 και 5)· εδώ μία φορά, για τα κενά β) και γ)."},{"id":"32263-2.2","th":"32263","part":"2.2","k":"open","secs":["Α1.1"],"p":10,"q":"Ποια είναι η έννοια του Ναυτικού Δικαίου;","sol":"Ναυτικό δίκαιο είναι το σύνολο κανόνων δικαίου, οι οποίοι ρυθμίζουν τις σχέσεις που ανάγονται στο ναυτικό εμπόριο και στη ναυτιλία γενικότερα. Η ρύθμιση των θεμάτων της ναυτιλίας με ειδικούς κανόνες επιβάλλεται λόγω των εξαιρετικών συνθηκών που επικρατούν στο θαλάσσιο εμπόριο και στη ναυτική εργασία και διαφέρουν από τις συνθήκες που επικρατούν στην ξηρά."},{"id":"32264-2.1α","th":"32264","part":"2.1","lab":"α","k":"tf","secs":["Α15.3"],"p":3,"q":"Η ποινή του προστίμου μπορεί να φθάνει μέχρι το ένα τέταρτο του μηνιαίου μισθού που αναγράφετε στο ναυτολόγιο.","a":false,"why":"Το πρόστιμο φθάνει μέχρι το ένα πέμπτο του μηνιαίου μισθού που αναγράφεται στο ναυτολόγιο."},{"id":"32264-2.1β","th":"32264","part":"2.1","lab":"β","k":"tf","secs":["Α15.3"],"p":3,"q":"Επίπληξη που δεν καταγράφετε στο ποινολόγιο δεν αποτελεί ποινή, άλλα απλή σύσταση.","a":true},{"id":"32264-2.1γ","th":"32264","part":"2.1","lab":"γ","k":"tf","secs":["Α15.3"],"p":3,"q":"Ο ναυτικός που τιμωρείται με την ποινή της προσωρινής στέρησης ασκήσεως του ναυτικού επαγγέλματος δεν διαγράφετε από τα μητρώα, αλλά καταγράφεται στους πίνακες απαγόρευσης ναυτολόγησης.","a":true},{"id":"32264-2.1δ","th":"32264","part":"2.1","lab":"δ","k":"tf","secs":["Α15.3"],"p":3,"q":"Τιμωρία για δεύτερη φορά με προσωρινή στέρηση τουλάχιστον έξι μηνών και διάπραξη για τρίτη φορά του ίδιου παραπτώματος μέσα στην πενταετία τιμωρείται με οριστική στέρηση άσκησης του ναυτικού επαγγέλματος.","a":true},{"id":"32264-2.1ε","th":"32264","part":"2.1","lab":"ε","k":"tf","secs":["Α15.2"],"p":3,"q":"Κάθε παράβαση των διατάξεων περί τυχερών παιχνιδιών στο πλοίο θεωρείτε πειθαρχικό παράπτωμα του πλοιάρχου.","a":false,"why":"Είναι πειθαρχικό παράπτωμα μελών του πληρώματος."},{"id":"32264-2.2","th":"32264","part":"2.2","k":"open","secs":["Α15.1"],"p":10,"q":"Ποιες είναι οι βασικές διαφορές μεταξύ των ποινικών παραβάσεων και των πειθαρχικών παραπτωμάτων;","sol":"Βασική διαφορά των πειθαρχικών παραπτωμάτων από τα ποινικά αδικήματα είναι ότι ούτε τα υπηρεσιακά καθήκοντα ούτε τα πειθαρχικά παραπτώματα προσδιορίζονται με πλήρη ακρίβεια από τις διάφορες διατάξεις, όπως συμβαίνει πάντοτε με τα ποινικά αδικήματα. Άλλη βασική διαφορά μεταξύ των ποινικών παραβάσεων και των πειθαρχικών παραπτωμάτων είναι ότι τα πρώτα δικάζονται και τιμωρούνται από τα ποινικά δικαστήρια που συγκροτούνται από επαγγελματίες (τακτικούς )δικαστές, ενώ τα δεύτερα από διοικητικούς υπαλλήλους (αξιωματικούς) και εκπροσώπους των ναυτεργατικών σωματείων."},{"id":"32266-2.1α","th":"32266","part":"2.1","lab":"α","k":"fill","secs":["Α6.6"],"p":3,"q":"Είναι ο άμεσος συνεργάτης του Πλοιάρχου για κάθε τι που αφορά στο πλοίο ⟨⟩","opts":["Ανθυποπλοίαρχος","Αξιωματικού","Υποπλοίαρχος","Δόκιμος Μηχανής","Ναύκληρος","Ηλεκτρολόγος"],"a":2},{"id":"32266-2.1β","th":"32266","part":"2.1","lab":"β","k":"fill","secs":["Α6.6"],"p":3,"q":"Έχει τον αποκλειστικό έλεγχο και επιμέλεια της πρύμνης ⟨⟩","opts":["Ανθυποπλοίαρχος","Αξιωματικού","Υποπλοίαρχος","Δόκιμος Μηχανής","Ναύκληρος","Ηλεκτρολόγος"],"a":0},{"id":"32266-2.1γ","th":"32266","part":"2.1","lab":"γ","k":"fill","secs":["Α6.6"],"p":3,"q":"Ο Δόκιμος Πλοίαρχος μετέχει στις φυλακές ως βοηθός του ⟨⟩ φυλακής γέφυρας, απαγορεύεται όμως η ανάθεση σε αυτόν υπεύθυνης εργασίας γέφυρας.","opts":["Ανθυποπλοίαρχος","Αξιωματικού","Υποπλοίαρχος","Δόκιμος Μηχανής","Ναύκληρος","Ηλεκτρολόγος"],"a":1},{"id":"32266-2.1δ","th":"32266","part":"2.1","lab":"δ","k":"fill","secs":["Α6.6"],"p":3,"q":"Εξασφαλίζει υπεύθυνα την ομαλή συντήρηση και λειτουργία όλων των ηλεκτρολογικών εγκαταστάσεων του πλοίου ⟨⟩","opts":["Ανθυποπλοίαρχος","Αξιωματικού","Υποπλοίαρχος","Δόκιμος Μηχανής","Ναύκληρος","Ηλεκτρολόγος"],"a":5},{"id":"32266-2.1ε","th":"32266","part":"2.1","lab":"ε","k":"fill","secs":["Α6.6"],"p":3,"q":"Είναι υπόλογος αξιωματικός για την υπηρεσία καταστρώματος και για το κατώτερο προσωπικό της ⟨⟩","opts":["Ανθυποπλοίαρχος","Αξιωματικού","Υποπλοίαρχος","Δόκιμος Μηχανής","Ναύκληρος","Ηλεκτρολόγος"],"a":4},{"id":"32266-2.2","th":"32266","part":"2.2","k":"open","secs":["Α6.7"],"p":10,"q":"Τι γνωρίζετε για τον αξιωματικό φυλακής γέφυρας;","sol":"Κατά την διάρκεια της φυλακής του, τελεί υπό τον έλεγχο του πλοιάρχου και έχει την γενική φροντίδα του πλοίου, επαγρυπνώντας για την ασφαλή διακυβέρνηση του. Κατά τη διάρκεια της φυλακής του παραμένει συνεχώς στη γέφυρα και μεριμνά για την εξασφάλιση της ναυσιπλοΐας, τηρώντας τους σχετικούς κανονισμούς και παρακολουθώντας όλα τα ηλεκτρονικά ή άλλα όργανα που βρίσκονται στη γέφυρα. Επιβλέπει επίσης την κίνηση επάνω στο πλοίο και τις εργασίες στο κατάστρωμα. Για κάθε έκτακτο περιστατικό, ειδοποιεί αμέσως τον πλοίαρχο."},{"id":"32268-2.1α","th":"32268","part":"2.1","lab":"α","k":"tf","secs":["Α16.1"],"p":3,"q":"Σύγκρουση και βύθιση του πλοίου.","a":true,"ctx":"Σύμφωνα με το ΝΔ 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος»: είναι το συμβάν ναυτικό ατύχημα; (Σωστό = είναι ναυτικό ατύχημα, Λάθος = δεν είναι)"},{"id":"32268-2.1β","th":"32268","part":"2.1","lab":"β","k":"tf","secs":["Α16.1"],"p":3,"q":"Δολοφονική ενέργεια του Πλοιάρχου.","a":false,"why":"Θάνατος από εγκληματική ενέργεια δεν είναι ναυτικό ατύχημα· ο θάνατος πρέπει να προέρχεται από γεγονός που έχει σχέση με το πλοίο (σύγκρουση, προσάραξη, πυρκαγιά).","ctx":"Σύμφωνα με το ΝΔ 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος»: είναι το συμβάν ναυτικό ατύχημα; (Σωστό = είναι ναυτικό ατύχημα, Λάθος = δεν είναι)"},{"id":"32268-2.1γ","th":"32268","part":"2.1","lab":"γ","k":"tf","secs":["Α16.1"],"p":3,"q":"Εγκατάλειψη πλοίου Κυπριακής εθνικότητας στους ασφαλιστές.","a":false,"why":"Το ΝΔ 712/1970 αφορά ελληνικά πλοία.","ctx":"Σύμφωνα με το ΝΔ 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος»: είναι το συμβάν ναυτικό ατύχημα; (Σωστό = είναι ναυτικό ατύχημα, Λάθος = δεν είναι)"},{"id":"32268-2.1δ","th":"32268","part":"2.1","lab":"δ","k":"tf","secs":["Α16.1"],"p":3,"q":"Πλοίο που μετέφερε 400 τόνους ζάχαρης μετά από λάθος χειρισμούς του πληρώματος, κατά την διάρκεια της μεταφοράς της εντοπίστηκε βλάβη στους 101 τόνους ζάχαρης.","a":true,"ctx":"Σύμφωνα με το ΝΔ 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος»: είναι το συμβάν ναυτικό ατύχημα; (Σωστό = είναι ναυτικό ατύχημα, Λάθος = δεν είναι)"},{"id":"32268-2.1ε","th":"32268","part":"2.1","lab":"ε","k":"tf","secs":["Α16.1"],"p":3,"q":"Σοβαρή βλάβη στο τιμόνι του πλοίου με αποτέλεσμα να χρησιμοποιείται προσωρινά για την ναυσιπλοΐα του πλοίου το εφεδρικό τιμονάκι.","a":false,"why":"Η βλάβη αντιμετωπίστηκε χωρίς ρυμουλκά (προσωρινή, όχι διαρκής ακυβερνησία).","ctx":"Σύμφωνα με το ΝΔ 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος»: είναι το συμβάν ναυτικό ατύχημα; (Σωστό = είναι ναυτικό ατύχημα, Λάθος = δεν είναι)"},{"id":"32268-2.2","th":"32268","part":"2.2","k":"open","secs":["Α19"],"p":10,"q":"Να προσδιορίσετε τέσσερα καθήκοντα του Ναυτικού Πράκτορα.","sol":"α) Για την πλοήγηση και ελευθεροκοινωνία του πλοίου που καταπλέει στο λιμάνι του και συνεννοείται με τις λιμενικές και τελωνιακές αρχές για την καλύτερη και ταχύτερη εξυπηρέτηση του πλοίου. β) Για την τακτοποίηση των διαφόρων διατυπώσεων (λιμενικών, τελωνιακών, υγειονομικών) και την πληρωμή των ναυτικών τελών. γ) Για την παράδοση του φορτίου στον παραλήπτη ή την αποθήκευση του σε περίπτωση αρνήσεως παραλαβής ή μη εμφανίσεως του παραλήπτη. δ) Για τη ναύλωση του πλοίου και τη σύναψη των σχετικών ναυλοσυμφώνων, την είσπραξη του ναύλου, την έκδοση εισιτηρίων, προκειμένου για επιβατηγά πλοία και την ασφάλιση του πλοίου, του φορτίου και του ναύλου. ε) Για τον εφοδιασμό του πλοίου με τα αναγκαία εφόδια και καύσιμα και την επισκευή του. στ) Για την εκπροσώπηση δικαστικώς και εξωδίκως του πλοιοκτήτη σε κάθε ζήτημα που ανάγετε στον κύκλο της εντολής που δίνετε στον πλοιοκτήτη."},{"id":"32269-2.1","th":"32269","part":"2.1","k":"open","secs":["Α28.1"],"p":15,"q":"Τι νοείται ως πειρατεία σύμφωνα με το άρθρο 101 της Συμβάσεως για το Δίκαιο της Θάλασσας;","sol":"Σύμφωνα με το άρθρο 101 της συμβάσεως ΔΘ, ως πειρατεία νοείται: α) Κάθε παράνομη πράξη βίας ή κρατήσεως ή κάθε πράξη διαρπαγής που διαπράττεται για ιδιωτικούς σκοπούς από το πλήρωμα ή τους επιβάτες ιδιωτικού πλοίου ( ή αεροσκάφους) και που κατευθύνετε πρώτον στην ανοιχτή θάλασσα, εναντίον άλλου πλοίου (ή αεροσκάφους) αυτό και δεύτερον σε τόπο έκτος κρατικής δικαιοδοσίας, εναντίον πλοίου (ή αεροσκάφους), προσώπων ή περιουσιακών στοιχείων. β) Κάθε πράξη εκούσιας συμμετοχής στη λειτουργία ενός πλοίου ή αεροσκάφους με γνώση των γεγονότων που καθιστούν το πλοίο ή το αεροσκάφος αυτό πειρατικό. γ) Κάθε πράξη υποκινήσεως ή σκόπιμης διευκολύνσεως πράξεως, που συνιστά πειρατεία."},{"id":"32269-2.2","th":"32269","part":"2.2","k":"open","secs":["Α28.2"],"p":10,"q":"Να αναφέρετε ονομαστικά πέντε επικίνδυνες περιοχές πειρατείας.","sol":"1. Σομαλία<br>2. Νιγηρία<br>3. Στενό Μαλάκκα<br>4. Κόλπος του Άντεν<br>5. Τανζανία<br>6. Μπανγκλαντές<br>7. Μαλαισία<br>8. Περού"},{"id":"32272-Θα","th":"32272","lab":"α","k":"mc","secs":["Β3.2"],"p":5,"q":"Η Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW 1995) αφορά σε ναυτικούς που υπηρετούν σε θαλασσοπλοούντα πλοία έκτος από αυτούς που υπηρετούν σε:","opts":["Δεξαμενόπλοια","Φορτηγά πλοία","Αλιευτικά πλοία","Πλοία με εμπορευματοκιβώτια","Κανένα από τα παραπάνω"],"a":2},{"id":"32272-Θβ","th":"32272","lab":"β","k":"mc","secs":["Β3.3"],"p":5,"q":"Η δομή της Διεθνούς Σύμβασης για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW 1995) αποτελείται από:","opts":["ΙΙΙ Κεφάλαια","V Κεφάλαια","VI Κεφάλαια","VII Κεφάλαια","VIIΙ Κεφάλαια"],"a":4},{"id":"32272-Θγ","th":"32272","lab":"γ","k":"mc","secs":["Β5.5.3"],"p":5,"q":"Σκοπός του Διεθνή Κώδικα Ασφαλούς Διαχείρισης είναι:","opts":["η εξασφάλιση ενός διεθνούς προτύπου για την ασφαλή διαχείριση των πλοίων","η εξασφάλιση ενός διεθνούς προτύπου για την ασφαλή λειτουργία των πλοίων","η εξασφάλιση ενός διεθνούς προτύπου για την πρόληψη της θαλάσσιας ρυπάνσεως","η εξασφάλιση ενός διεθνούς προτύπου για την ασφαλή διαχείριση και λειτουργία των πλοίων","όλα τα παραπάνω"],"a":4},{"id":"32272-Θδ","th":"32272","lab":"δ","k":"mc","secs":["Β8.2"],"p":5,"q":"Σύμφωνα με τη Διεθνή Σύμβαση για τον Έλεγχο και τη Διαχείριση του Έρματος και των Ιζημάτων των Πλοίων, όλα τα πλοία σε διεθνή κυκλοφορία είναι υποχρεωμένα να διαχειριστούν το θαλάσσιο έρμα και τα ιζήματα με βάση:","opts":["τον τύπο του πλοίου","ένα σχέδιο διαχειρίσεως του θαλάσσιου έρματος","την περιοχή του πλου","το σύστημα κατεργασίας του θαλασσινού έρματος","τη βιοποικιλότητα"],"a":1},{"id":"32272-Θε","th":"32272","lab":"ε","k":"mc","secs":["Α28.1"],"p":5,"q":"Σύμφωνα με τη Σύμβαση Δικαίου της Θάλασσας, όλα τα πλοία έχουν την υποχρέωση να συνεργάζονται με σκοπό:","opts":["την καταστολή της πειρατείας σε οποιοδήποτε άλλο μέρος βρίσκεται εντός της δικαιοδοσίας οποιουδήποτε κράτους","την καταστολή της πειρατείας σε οποιοδήποτε άλλο μέρος βρίσκεται εκτός της δικαιοδοσίας οποιουδήποτε κράτους","την καταστολή της πειρατείας στην ανοικτή θάλασσα ή σε οποιοδήποτε άλλο μέρος βρίσκεται εντός της δικαιοδοσίας οποιουδήποτε κράτους","την καταστολή της πειρατείας στην ανοικτή θάλασσα ή σε οποιοδήποτε άλλο μέρος βρίσκεται εκτός της δικαιοδοσίας οποιουδήποτε κράτους","την καταστολή της πειρατείας στην ανοικτή θάλασσα"],"a":3},{"id":"32273-2.1","th":"32273","part":"2.1","k":"open","secs":["Β2.2"],"p":7,"q":"Ποιος είναι ο κύριος σκοπός της Διεθνούς Σύμβασης για την Ασφάλεια της Ανθρώπινης Ζωής στη Θάλασσα (SOLAS);","sol":"Ο κύριος σκοπός της Διεθνούς Σύμβασης για την Ασφάλεια της Ανθρώπινης Ζωής στη Θάλασσα (SOLAS) είναι να καθορίζει τις ελάχιστες προδιαγραφές για την κατασκευή, τον εξοπλισμό και την λειτουργία των πλοίων που είναι συμβατές με τα επίπεδα ασφάλειας. Τα κράτη της σημαίας είναι υπεύθυνα για να εξασφαλίσουν ότι τα πλοία υπό τη σημαία τους συμμορφώνονται με τις διατάξεις της, και ένας αριθμός πιστοποιητικών περιγράφονται στη σύμβαση ως απόδειξη ότι αυτό έχει ήδη γίνει. Οι διατάξεις που αφορούν σε θέματα ελέγχου, επιτρέπουν στα κράτημέλη της συμβάσεως να επιθεωρούν τα πλοία που ανήκουν σε άλλα κράτη-μέλη, με την προϋπόθεση ότι υπάρχουν υπόνοιες ότι το πλοίο και ο εξοπλισμός του δεν συμμορφώνονται ουσιαστικά με τις απαιτήσεις της συμβάσεως (το γνωστό port state control)."},{"id":"32273-2.2","th":"32273","part":"2.2","k":"open","secs":["Β2.3"],"p":18,"q":"Να αναφέρετε ονομαστικά τα Κεφάλαια της Διεθνούς Σύμβασης για την Ασφάλεια της Ανθρώπινης Ζωής στη Θάλασσα (SOLAS).","sol":"Κεφάλαιο Ι: Γενικές διατάξεις<br>Κεφάλαιο ΙΙ: Η κατασκευή του πλοίου<br>Κεφάλαιο ΙΙΙ: Τα σωστικά μέσα και η διάταξή τους<br>Κεφάλαιο ΙV: Ραδιοεπικοινωνίες<br>Κεφάλαιο V: Ασφάλεια της ναυσιπλοΐας<br>Κεφάλαιο VΙ: Μεταφορά φορτίων<br>Κεφάλαιο VIΙ: Μεταφορά επικίνδυνων εμπορευμάτων<br>Κεφάλαιο VIIΙ: Πυρηνοκίνητα πλοία<br>Κεφάλαιο ΙΧ: Διαχείριση για την ασφαλή λειτουργία των πλοίων<br>Κεφάλαιο Χ: Μέτρα ασφαλείας Για τα υψηλής ταχύτητας πλοία<br>Κεφάλαιο ΧΙΙ: Πρόσθετα μέτρα ασφάλειας για τα πλοία μεταφοράς χύδην φορτίων"},{"id":"32277-2.1","
