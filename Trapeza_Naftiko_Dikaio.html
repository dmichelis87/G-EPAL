990 σαφώς προβλέπει στο σχέδιο για τα Δ/Ξ, τα οποία καταπλέουν σε περιοχές δικαιοδοσίας των ΗΠΑ :<br>1) Σχετικά με την κατασκευή των Δ/Ξ, η καθιέρωση του σχεδίου-προτύπου DH/DB ήταν άμεσης προτεραιότητας.<br>2) Σχετικά με τις λειτουργικές διαδικασίες των Δ/Ξ, αφορά στα πληρώματα και στην κατανάλωση ναρκωτικών και αλκοόλ.<br>3) Σχετικά με την ασφάλεια της ναυσιπλοΐας, αναφέρεται στη ρυμούλκηση και την πλοήγηση.<br>4) Η πρόληψη της ρυπάνσεως όταν ένα Δ/Ξ μεταφέρει φορτίο στις ΗΠΑ, ανεξάρτητα από τη νηολόγησή του, πρέπει να διαθέτει ένα σχέδιο ανταποκρίσεως (Vessel Response Plan –VRP) και να είναι εφοδιασμένο με εξοπλισμό ανακτήσεως.<br>5) Η ευθύνη και αποζημίωση, όπου τίθεται το ζήτημα της ευθύνης του πλοιοκτήτη."},{"id":"32414-Θβ","th":"32414","lab":"β","k":"calc","secs":["Β4.8"],"p":15,"ctx":"Οι Ηνωμένες Πολιτείες (ΗΠΑ), δυσαρεστημένες από την αδυναμία των διεθνών προτύπων στην πρόληψη της ρύπανσης από τα πλοία, εξέδωσαν το 1990 την \"Oil Pollution Act\" (OPA 90). Ο ΟΡΑ 1990, ο οποίος έγινε Νόμος του κράτους το 1991 και τέθηκε επίσημα σε ισχύ το 1994, είναι αναμφίβολα η πιο σημαντική μονομερής νομοθεσία (unilateral legislation) από την άποψη των λεπτομερέστατων διατάξεων της αλλά περισσότερο για τις επιπτώσεις στη ναυτιλιακή βιομηχανία.","q":"Εκτός των παραπάνω επίμαχων σημείων, να προσδιορίσετε αναλυτικά τρεις (3) διατάξεις του που συμβάλλουν αναμφίβολα στη βελτίωση των συνθηκών για την προστασία του θαλάσσιου περιβάλλοντος.","sol":"Ο OPA 1990 περιέχει ορισμένες διατάξεις που αναμφίβολα συμβάλλουν σε βελτίωση των συνθηκών για την προστασία του θαλάσσιου περιβάλλοντος, όπως:<br>1) Θεσπίζοντας κανονισμούς για το σύστημα ελέγχου κυκλοφορίας των πλοίων (Vessel Traffic Services), έτσι ώστε να ελέγχονται οι παράνομες απορρίψεις αποβλήτων στη θάλασσα και να εντοπίζονται οι παραβάτες που προκαλούν τη ρύπανση από πετρελαιοειδή.<br>2) Βελτίωση των μέσων τηλεπικοινωνίας μεταξύ του πλοίου και της ακτής.<br>3) Καθορισμός μέσω του ΙΜΟ των ελαχίστων αποδεκτών προδιαγραφών εκπαιδεύσεως των ναυτικών σε συνδυασμό με την άσκηση ελέγχου της USCG για τα πιστοποιητικά ικανότητας πλοιάρχου και πληρώματος και της εν γένει επανδρώσεως αλλοδαπών πλοίων που προσεγγίζουν τα αμερικανικά λιμάνια, ενώ σχετικά με τη συντήρηση των πλοίων προβλέπονται αυστηρότεροι αλλά κοινά αποδεκτοί κανονισμοί ελέγχου και επιθεωρήσεων από την πλευρά των νηογνωμόνων."},{"id":"32415-Θ","th":"32415","k":"calc","ty":"pr","secs":["Α5.1"],"p":25,"q":"Σήμερα και περί ώρα 06:30 με 15μελές πλήρωμα το Φ/Γ πλοίο ”ELENΙ” απέπλευσε από το λιμάνι του Πειραιά, με προορισμό τη Μυτιλήνη. Περί ώρα 06:50 έπλεε δυτικά της νήσου Ψυττάλειας και με το πέρασμα της νήσου έφτασε την ασφαλή υπηρεσιακή ταχύτητα του πλοίου, δηλαδή 10,5-11 κόμβους. Έχοντας απομακρυνθεί από την Ψυττάλεια, περί τα 4 ναυτικά μίλια, ο Πλοίαρχος του Φ/Γ πλοίου ”ELENΙ” διαπίστωσε αριστερά και πρύμα το εμπορικό πλοίο “Maersk” προερχόμενο από ανατολικά της νήσου με κατεύθυνση επίσης τον δίαυλο. Ο Πλοίαρχος του Φ/Γ πλοίου ”ELENΙ” κάλεσε το εμπορικό πλοίο “Maersk” μέσω VHF (κανάλι 16), προκειμένου να ειδοποιήσει ότι τον προσεγγίζει επικίνδυνα με αυξανόμενη ταχύτητα, χωρίς όμως να λάβει απάντηση. Η σύγκρουση ήταν αναπόφευκτη. Το εμπορικό πλοίο «Maersk» προσέκρουσε πάνω στο Φ/Γ “ELENI”, προκαλώντας σοβαρές ζημιές στην πρύμνη του, ενώ μέλη του πληρώματος έπεσαν στη θάλασσα. Πως θα αντιμετωπίσει ο Πλοίαρχος την έκτακτη ανάγκη του Φ/Γ πλοίου ”ELENΙ” από τη συγκεκριμένη αιτία;","sol":"Σε περίπτωση που το πλοίο αντιμετωπίζει έκτακτη ανάγκη από οποιαδήποτε αιτία, ο Πλοίαρχος οφείλει να χρησιμοποιήσει όλα τα δυνατά μέσα για τη διάσωση του πλοίου, των επιβαινόντων και του φορτίου. Οφείλει επίσης να δώσει το παράδειγμα της ψυχραιμίας και γενναιότητας, εμψυχώνοντας το πλήρωμα και τους επιβαίνοντες. Αν οι περιστάσεις επιβάλλουν την εγκατάλειψη του πλοίου, το εγκαταλείπει τελευταίος και αφού βεβαιωθεί ότι έχει εκλείψει κάθε ελπίδα σωτηρίας του και ότι δεν έχει απομείνει κανείς άλλος σ’αυτό. Διασώζει αν είναι δυνατό το ημερολόγιο και τα άλλα ναυτιλιακά έγγραφα του πλοίου, τα χρήματα και τα πολυτιμότερα αντικείμενα. Δεν απομακρύνεται από τον τόπο του ατυχήματος, πριν βεβαιωθεί για την απώλεια του πλοίου και ότι η παρουσία του είναι πλέον ανώφελη. Αν μετά την εγκατάλειψη του πλοίου και πριν από την βύθισή του, αντιληφθεί ότι κάποιο άλλο πλοίο σπεύδει προς βοήθεια και θα μπορούσε να καταστεί δυνατή η σωτηρία του πλοίου, οφείλει να επιβιβασθεί και πάλι σ’ αυτό, πριν επιβιβασθούν οι άνδρες του άλλου πλοίου."},{"id":"32416-Θ","th":"32416","k":"calc","secs":["Α5.1"],"p":25,"q":"Να περιγράψετε τις ευθύνες και τις αρμοδιότητες του Πλοιάρχου σύμφωνα με την ισχύουσα ναυτική νομοθεσία και τους κανονισμούς (άρθρα 104-129 του Κώδικα Δημοσίου ναυτικού Δικαίου, άρθρα 39-52 του Κώδικα Ιδιωτικού Ναυτικού Δικαίου ).","sol":"Ο Πλοίαρχος, σύμφωνα με την ισχύουσα ναυτική νομοθεσία και τους κανονισμούς, είναι ο κυβερνήτης και διοικητής του πλοίου και έχει εξουσία σε όλους όσους επιβαίνουν σ’ αυτό. Είναι υπεύθυνος για την καλή διοίκηση του πλοίου και την ασφάλεια αυτού, του φορτίου και των επιβαινόντων, καθώς και για την τήρηση της τάξεως. Σε περίπτωση ανάγκης, για την ασφάλεια του πλοίου, δικαιούται να διατάξει και να επιβάλλει κάθε τι που κρίνει αναγκαίο, σύμφωνα με τους κανόνες της ναυτικής τέχνης και τις διατάξεις των νόμων και των κανονισμών. Αν κρίνει σκόπιμο μπορεί να ζητήσει τη γνώμη του Α ́ μηχανικού και του υποπλοιάρχου. Ο Πλοίαρχος είναι υπεύθυνος απέναντι στο κράτος για την ακριβή εφαρμογή των νόμων και την εκτέλεση των διαταγών των αρμοδίων αρχών και απέναντι στον πλοιοκτήτη και κάθε ενδιαφερόμενο, για οτιδήποτε συμβαίνει στο πλοίο και αφορά στα συμφέροντά τους. Ο Πλοίαρχος οφείλει να δίνει πάντα το καλό παράδειγμα των ναυτικών αρετών, δηλαδή της τιμής, της αξιοπρέπειας, της καλής συμπεριφοράς, της δικαιοσύνης, της συνέσεως, της ετοιμότητας, της αποφασιστικότητας, της αφοσιώσεως στο καθήκον, του θάρρους και της αυτοθυσίας. Έχει επίσης την υποχρέωση να φροντίζει για τη βελτίωση της καταρτίσεως των αξιωματικών του και να επωφελείται από κάθε ευκαιρία για να τους κατατοπίζει και να τους επεξηγεί διάφορα επαγγελματικά θέματα. Σε ό,τι αφορά στον τομέα της πειθαρχίας και συμπεριφοράς του πληρώματος, ο Πλοίαρχος έχει υποχρέωση να εξασφαλίζει την ευταξία στο πλοίο, επιβλέποντας την εμφάνιση, συμπεριφορά και διαγωγή γενικά των μελών του πληρώματος. Οφείλει να ακούει με προθυμία και να θεραπεύει κατά το δυνατόν, κάθε εύλογο παράπονο που του υποβάλλεται και να εκδηλώνει σε κάθε ευκαιρία πατρική μέριμνα προς το πλήρωμα, στο οποίο πρέπει να συμπεριφέρεται με διακριτικότητα. Αν στο πλοίο συμβεί διατάραξη της τάξεως, ο Πλοίαρχος λαμβάνει αμέσως κάθε επιβαλλόμενο μέτρο για την αποκατάστασή της και ασκεί πειθαρχική εξουσία, σύμφωνα με τις ισχύουσες διατάξεις. Σε ό,τι αφορά στον τομέα της ενδιαιτήσεως του πληρώματος και των επιβατών, ο Πλοίαρχος έχει χρέος να μεριμνά ο ίδιος αλλά και με τους αρμόδιους αξιωματικούς του, για την εξασφάλιση των απαιτουμένων όρων υγιεινής και καθαριότητας."},{"id":"32417-Θα","th":"32417","lab":"α","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης να προσδιορίσετε τους παρακάτω βασικούς ορισμούς:","q":"Μη συμμόρφωση","sol":"Μη συμμόρφωση ονομάζεται μία απόκλιση από τις απαιτήσεις που προδιαγράφονται στο Σύστημα Ασφαλούς Διαχειρίσεως (SMS) ή ένα λάθος, το οποίο θα ήταν δυνατό να θέσει σε κίνδυνο την ασφάλεια των ανθρώπων, του περιβάλλοντος, του πλοίου ή του μεταφερόμενου φορτίου."},{"id":"32417-Θβ","th":"32417","lab":"β","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης να προσδιορίσετε τους παρακάτω βασικούς ορισμούς:","q":"Επιβεβαίωση","sol":"Επιβεβαίωση ονομάζεται η έρευνα και επαλήθευση ότι μία δραστηριότητα ή εργασία γίνεται σύμφωνα με την προδιαγραφόμενη απαίτηση."},{"id":"32417-Θγ","th":"32417","lab":"γ","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης να προσδιορίσετε τους παρακάτω βασικούς ορισμούς:","q":"Επικίνδυνα περιστατικά","sol":"Επικίνδυνα περιστατικά ονομάζονται οι καταστάσεις που μπορούν να οδηγήσουν σε ένα ατύχημα αν εξελιχθούν δυσμενώς, όπως η απώλεια ελέγχου του πλοίου κατά τη διάρκεια ενός συμβάντος στη θάλασσα."},{"id":"32417-Θδ","th":"32417","lab":"δ","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης να προσδιορίσετε τους παρακάτω βασικούς ορισμούς:","q":"Ατυχήματα","sol":"Ατυχήματα καλούνται τα περιστατικά που περιλαμβάνουν τραυματισμό ή βλάβη στη ζωή ενός ανθρώπου, το περιβάλλον, το πλοίο ή το φορτίο."},{"id":"32417-Θε","th":"32417","lab":"ε","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης να προσδιορίσετε τους παρακάτω βασικούς ορισμούς:","q":"Αρχή","sol":"Αρχή ονομάζεται η κυβέρνηση της χώρας, τη σημαία της οποίας φέρει το πλοίο."},{"id":"32418-Θα","th":"32418","lab":"α","k":"calc","secs":["Β5.5.5"],"p":16,"ctx":"Με δεδομένο ότι εργάζεστε στο Τμήμα με λειτουργίες περί διοίκησης ασφάλειας, ποιότητας και περιβαλλοντικής ευθύνης (HSQE Department) μίας ναυτιλιακής εταιρείας,","q":"Για ποιους λόγους πιστεύετε ότι είναι απαραίτητο ένα Σύστημα Ασφαλούς Διαχείρισης (SMS)","sol":"Ένα Σύστημα Ασφαλούς Διαχείρισης είναι απαραίτητο για τους παρακάτω λόγους:<br>1) Τα περισσότερα ατυχήματα συμβαίνουν εξαιτίας των παραβιάσεων των βασικών αρχών ασφάλειας.<br>2) Η αποτυχία να ακολουθηθούν καθιερωμένες οδηγίες ή διαδικασίες.<br>3) Η έλλειψη κατάλληλης εκπαιδεύσεως και εξοικειώσεως.<br>4) Με την παρουσία ενός γραπτού συστήματος στο πλοίο, με το οποίο εξασφαλίζεται ότι όλο το πλήρωμα είναι εφοδιασμένο με επαρκείς οδηγίες και την κατάλληλη εκπαίδευση να διαχειρίζεται το πλοίο με τον τρόπο που επιθυμεί η εταιρεία, δεν υπάρχει χώρος για ευελιξία."},{"id":"32418-Θβ","th":"32418","lab":"β","k":"calc","secs":["Β5.5.3"],"p":9,"ctx":"Με δεδομένο ότι εργάζεστε στο Τμήμα με λειτουργίες περί διοίκησης ασφάλειας, ποιότητας και περιβαλλοντικής ευθύνης (HSQE Department) μίας ναυτιλιακής εταιρείας,","q":"Ποιοι είναι οι στόχοι της ασφαλούς διαχείρισης της εταιρείας;","sol":"Οι στόχοι της ασφαλούς διαχειρίσεως της εταιρείας θα πρέπει να είναι:<br>1) Η παροχή ασφαλών πρακτικών λειτουργίας του πλοίου και ασφαλούς περιβάλλοντος εργασίας.<br>2) Η καθιέρωση εξασφαλίσεων έναντι όλων των αναγνωρισμένων κινδύνων.<br>3) Η συνεχής βελτίωση της εκπαιδεύσεως ασφαλούς διαχειρίσεως του προσωπικού της ξηράς και των πλοίων, που περιλαμβάνει την προετοιμασία για αντιμετώπιση εκτάκτων περιστατικών, τα οποία σχετίζονται άμεσα με την ασφάλεια και την περιβαλλοντική προστασία."},{"id":"32419-Θα","th":"32419","lab":"α","k":"calc","secs":["Β5.5.5"],"p":18,"ctx":"Με δεδομένο ότι εργάζεστε σε μία ναυτιλιακή εταιρεία και είστε στέλεχος κορυφής (top level manager), όσον αφορά τον κύριο σκοπό του Διεθνή Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ) για την εξασφάλιση της κατάλληλης διαχείρισης της ναυτιλιακής επιχείρησης που απασχολείστε,","q":"Ποιες πτυχές της λειτουργικής διαχείρισης καλύπτονται;","sol":"Ο κύριος σκοπός του ΚΑΔ είναι να εξασφαλίσει την κατάλληλη διαχείριση των ναυτιλιακών επιχειρήσεων, καλύπτοντας όλες τις πτυχές της λειτουργικής διαχειρίσεως, όπως:<br>1) Διαχείριση φορτίου.<br>2) Ναυσιπλοΐα.<br>3) Μηχανή του πλοίου και λειτουργίες του μηχανοστασίου.<br>4) Συντηρήσεις.<br>5) Δοκιμές και επιθεώρηση του εξοπλισμού της μηχανής.<br>6) Προμήθεια εφοδίων και ανταλλακτικών.<br>7) Προετοιμασία έκτακτης ανάγκης και σχεδιασμός.<br>8) Προσλήψεις, επιλογές και περαιτέρω επιμορφώσεις του πληρώματος.<br>9) Έλεγχος τεκμηριώσεως."},{"id":"32419-Θβ","th":"32419","lab":"β","k":"calc","secs":["Β5.5.5"],"p":7,"ctx":"Με δεδομένο ότι εργάζεστε σε μία ναυτιλιακή εταιρεία και είστε στέλεχος κορυφής (top level manager), όσον αφορά τον κύριο σκοπό του Διεθνή Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ) για την εξασφάλιση της κατάλληλης διαχείρισης της ναυτιλιακής επιχείρησης που απασχολείστε,","q":"Να αναφέρετε δύο λόγους που επιλέγονται τα εγχειρίδια ή τα ηλεκτρονικά συστήματα κατά την εφαρμογή του (ΚΑΔ)","sol":"Τέτοιοι είναι ότι:<br>1) Ο ΚΑΔ δίνει μόνο οδηγίες, ενώ δεν προτείνει ή δεν περιγράφει στην εταιρεία με ποιον τρόπο θα διαχειριστεί τα πλοία της.<br>2) Με σκοπό τη συμμόρφωση προς τους κανονισμούς, η εταιρεία χρησιμοποιώντας την ειδική γνώση και εμπειρία, έχει ήδη δημιουργήσει το δικό της εγχειρίδιο ασφαλούς και ποιοτικής διαχειρίσεως για τους στόλους της.<br>3) Αυτά τα εγχειρίδια καλύπτουν όλες τις πτυχές της διαχειρίσεως στο πλοίο και την υποστήριξη από την ξηρά, και ρητά καθορίζουν τον τρόπο διαχειρίσεως των στόλων.<br>4) Με την εφαρμογή τους στα πλοία και στην ξηρά, το σύστημα ελέγχεται για τον βαθμό συμμορφώσεώς του με τις απαιτήσεις του ΚΑΔ και εκδίδεται ένα πιστοποιητικό."},{"id":"33748-Θ","th":"33748","k":"calc","secs":["Β2.6"],"p":25,"q":"Μετά από μια σειρά ατυχημάτων των bulk carriers ο Διεθνής Οργανισμός Ναυσιπλοΐας (International Maritime Organization - IMO) υιοθέτησε κάποιες αναθεωρημένες οδηγίες για την ενίσχυση των επιθεωρήσεων των συγκεκριμένων πλοίων, και έναν Κώδικα Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση (BLU Code). Ποια είναι τα πιο σημαντικά χαρακτηριστικά του Κώδικα αυτού;","sol":"Τα πιο σημαντικά χαρακτηριστικά του Κώδικα είναι τα εξής:<br>1) Πιο ανθεκτικά νέα πλοία: αύξηση της αντοχής των διαφραγμάτων (bulkheads) και των διπύθμενων (double bottoms), ώστε να αντέξουν συνθήκες υπερχειλίσεως των δεξαμενών. Για τα υπάρχοντα πλοία, το διάφραγμα ανάμεσα στις δεξαμενές 1 και 2 και ο διπλός πυθμένας της δεξαμενής 1 πρέπει να ενισχυθούν, προκειμένου να αντέξουν φαινόμενα πλημμύρας στη δεξαμενή 1, εκτός αν έχουν επιβληθεί περιορισμοί στη φόρτωση.<br>2) Βελτίωση των πρακτικών χειρισμού των φορτίων: οι ιμάντες μεταφοράς (conveyor belts) συχνά υπερφορτώνουν τα πλοία και μεγάλες δαγκάνες, μπουλντόζες και υδραυλικά σφυριά που χρησιμοποιούνται στην εκφόρτωση, μπορεί να προκαλέσουν ζημιές.<br>3) Περιορισμοί στη μεταφορά των φορτίων: τα υπάρχοντα bulk carriers που συναντούν τις νέες απαιτήσεις μέσω των περιορισμών φορτώσεως, πρέπει να επισημαίνονται με ένα στερεό ισόπλευρο τρίγωνο στο μέσο του κύτους (on the hull amidships) κάτω από την γραμμή καταστρώματος.<br>4) Όργανα φορτώσεως: το πλοίο πρέπει να είναι εφοδιασμένο με κατάλληλο εξοπλισμό, ώστε να ελέγχονται οι τάσεις (stresses) κατά τη διάρκεια των φορτώσεων και εκφορτώσεων (ροπές κάμψεως).<br>5) Ενίσχυση των επιθεωρήσεων: ένα πρόγραμμα επιθεωρήσεων με σκοπό να εντοπίσει πιθανές αδυναμίες στη δομή του πλοίου και περιοχές διαβρώσεως."},{"id":"33749-Θα","th":"33749","lab":"α","k":"calc","secs":["Β3.2"],"p":10,"ctx":"Η Διεθνής Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW) 1978 τροποποιήθηκε και αναθεωρήθηκε (STCW 1995) με τέτοιον τρόπο, ώστε να θεωρείται σχετικά ως μία νέα Σύμβαση, που στοχεύει με εκσυγχρονισμένο τρόπο στην προαγωγή της ασφάλειας της ανθρώπινης ζωής και της περιουσίας στη θάλασσα αλλά και στην προστασία του θαλάσσιου περιβάλλοντος.","q":"Πόσες και ποιες τροποποιήσεις της αναθεωρημένης Σύμβασης είχαν πραγματοποιηθεί έως το 2001;","sol":"Μέχρι το 2001 είχαν πραγματοποιηθεί οι εξής δύο τροποποιήσεις της αναθεωρημένης Συμβάσεως: Οι τροποποιήσεις του 1997, που τέθηκαν σε ισχύ την 1/1/1999 και αφορούν στις απαιτήσεις εκπαιδεύσεως για πλοιάρχους, αξιωματικούς και όλες τις ειδικότητες Ε/Γ και Ε/Γ-Ο/Γ (Rο-Rο) πλοίων και οι τροποποιήσεις του 1998, οι οποίες τέθηκαν σε ισχύ την 1/1/2003 και αφορούν στα θέματα χειρισμού και στοιβασίας του φορτίου στα πλοία."},{"id":"33749-Θβ","th":"33749","lab":"β","k":"calc","secs":["Β3.2"],"p":15,"ctx":"Η Διεθνής Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW) 1978 τροποποιήθηκε και αναθεωρήθηκε (STCW 1995) με τέτοιον τρόπο, ώστε να θεωρείται σχετικά ως μία νέα Σύμβαση, που στοχεύει με εκσυγχρονισμένο τρόπο στην προαγωγή της ασφάλειας της ανθρώπινης ζωής και της περιουσίας στη θάλασσα αλλά και στην προστασία του θαλάσσιου περιβάλλοντος.","q":"Πως χωρίζεται και τι περιλαμβάνονται στα μέρη της STCW του 1995;","sol":"Ένα από τα κύρια χαρακτηριστικά της STCW 1995 ήταν ένα τεχνικής υφής παράρτημα, που εμπεριείχε τους νέους κανονισμούς, οι οποίοι διαχωρίζονταν σε κεφάλαια όπως η προηγούμενη σύμβαση του 1978, και έναν Κώδικα, ο οποίος χωρίζεται σε δύο μέρη. Στο πρώτο περιλαμβάνονται τα υποχρεωτικά ελάχιστα κριτήρια τεχνογνωσίας και στο δεύτερο παρέχονται οδηγίες για την αρωγή των ατόμων-φορέων που εμπλέκονται στη διαδικασία εκπαιδεύσεως και αξιολογήσεως της ικανότητας των ναυτικών (και γενικότερα αυτών που εμπλέκονται στην εφαρμογή των διατάξεων της STCW 1995)."},{"id":"33750-Θα","th":"33750","lab":"α","k":"calc","ty":"pr","secs":["Α20"],"p":7,"ctx":"Ο Γ.Β. έχει αποκτήσει το δίπλωμα του Πλοιάρχου Α΄ Τάξης Ε.Ν. και ενδιαφέρεται να τοποθετηθεί πλοηγός σε πλοηγικό σταθμό που λειτουργεί στον Πειραιά ή σε κάποιο άλλο μεγάλο ελληνικό λιμάνι.","q":"Με ποιο τρόπο ο Γ.Β. θα μπορέσει να διοριστεί;","sol":"Ως πλοηγοί διορίζονται, μετά από διαγωνισμό, διπλωματούχοι πλοίαρχοι του εμπορικού ναυτικού που συγκεντρώνουν τα απαιτούμενα από τις ισχύουσες διατάξεις προσόντα και τοποθετούνται στους πλοηγικούς σταθμούς που λειτουργούν στον Πειραιά και στα άλλα μεγάλα ελληνικά λιμάνια."},{"id":"33750-Θβ","th":"33750","lab":"β","k":"calc","ty":"pr","secs":["Α20"],"p":18,"ctx":"Ο Γ.Β. έχει αποκτήσει το δίπλωμα του Πλοιάρχου Α΄ Τάξης Ε.Ν. και ενδιαφέρεται να τοποθετηθεί πλοηγός σε πλοηγικό σταθμό που λειτουργεί στον Πειραιά ή σε κάποιο άλλο μεγάλο ελληνικό λιμάνι.","q":"Ποιες είναι οι υποχρεώσεις του πλοιάρχου ενός πλοίου, το οποίο είναι υποχρεωμένο να προσλάβει πλοηγό, όταν το πλοίο προσεγγίζει την περιοχή του πλοηγικού σταθμού ;","sol":"Ο Πλοίαρχος κάθε πλοίου, που είναι υποχρεωμένο να προσλάβει πλοηγό, υποχρεούται, όταν το πλοίο προσεγγίζει στην περιοχή του πλοηγικού σταθμού, να επάρει το σήμα αιτήσεως πλοηγού που προβλέπεται από το Διεθνή Κώδικα Σημάτων (ΔΚΣ) και να έχει στη διάθεση του πλοηγού τα σήματα, που είναι αναγκαία σύμφωνα με τον ΔΚΣ. Επίσης οφείλει να λάβει όλα τα απαιτούμενα μέτρα για τη διευκόλυνση ανόδου και καθόδου του πλοηγού (διάθεση κατάλληλης κλίμακας κ.λπ.). Σε περίπτωση παραμονής του πλοηγού στο πλοίο για λόγους ανωτέρας βίας ή μετά από αίτηση του Πλοιάρχου, πρέπει να του παρασχεθεί κατάλληλη ενδιαίτηση και τροφή. Κατά τη διάρκεια της πλοηγήσεως ο Πλοίαρχος οφείλει να συμπεριφέρεται με ευγένεια στον πλοηγό και να συμμορφώνεται με τις υποδείξεις του. Μεταξύ των υποχρεώσεων του Πλοιάρχου είναι και η ενημέρωση του πλοηγού για κάθε ναυάγιο ή αντικείμενο που έχει υποπέσει στην αντίληψή του, κοντά στην περιοχή του πλοηγικού σταθμού, το οποίο δημιουργεί κινδύνους για τη ναυσιπλοΐα. Ο Πλοίαρχος δεν καταβάλει στον πλοηγό καμία άλλη αμοιβή, εκτός από τα προβλεπόμενα πλοηγικά δικαιώματα, τα οποία εισπράττονται σύμφωνα με τις κείμενες διατάξεις και κατά τη νόμιμη διαδικασία. Παραβάσεις του Πλοιάρχου ως προς τις υποχρεώσεις του προς την πλοηγική υπηρεσία τιμωρούνται πειθαρχικά. Ο πλοηγός αποτελεί τον τεχνικό σύμβουλο του Πλοιάρχου και υποχρεούται να εκτελεί με προθυμία και ακρίβεια την υπηρεσία του, να μην είναι σε κατάσταση μέθης, να μην δέχεται ή ζητεί δώρα ή αμοιβή για τις υπηρεσίες που παρέχει στο πλοίο και να τηρεί τους ισχύοντες κανονισμούς."},{"id":"33751-Θα","th":"33751","lab":"α","k":"calc","ty":"pr","secs":["Α19"],"p":15,"ctx":"Ο Σ.Τ. εργάζεται τα τελευταία 30 χρόνια ως ναυτικός πράκτορας στο λιμάνι του Πειραιά.","q":"Ποια είναι τα καθήκοντα του Σ.Τ. ως ναυτικός πράκτορας; (απαιτούνται 5).","sol":"Ο ναυτικός πράκτορας θεωρείται ότι έχει από τον πλοιοκτήτη γενική εντολή διαχειρίσεως του πλοίου και του φορτίου, εκτός αν ρητώς ο πλοιοκτήτης περιόρισε την εξουσία του, και μεριμνά:<br>α) Για την πλοήγηση και ελευθεροκοινωνία του πλοίου που καταπλέει στο λιμάνι του και συνεννοείται με τις λιμενικές και τελωνειακές αρχές για την καλύτερη και ταχύτερη εξυπηρέτηση του πλοίου.<br>β) Για την τακτοποίηση των διαφόρων διατυπώσεων (λιμενικών, τελωνειακών, υγειονομικών) και την πληρωμή των ναυτιλιακών τελών.<br>γ) Για την παράδοση του φορτίου στον παραλήπτη ή την αποθήκευσή του σε περίπτωση αρνήσεως παραλαβής ή μη εμφανίσεως του παραλήπτη.<br>δ) Για τη ναύλωση του πλοίου και τη σύναψη των σχετικών ναυλοσυμφώνων, την είσπραξη του ναύλου, την έκδοση εισιτηρίων, προκειμένου για επιβατηγά πλοία και την ασφάλιση του πλοίου, του φορτίου και του ναύλου.<br>ε) Για τον εφοδιασμό του πλοίου με τα αναγκαία εφόδια και καύσιμα και την επισκευή του.<br>στ) Για την εκπροσώπηση δικαστικώς και εξωδίκως του πλοιοκτήτη σε κάθε ζήτημα που ανάγεται στον κύκλο της εντολής που δίνεται από τον πλοιοκτήτη."},{"id":"33751-Θβ","th":"33751","lab":"β","k":"calc","ty":"pr","secs":["Α19"],"p":10,"ctx":"Ο Σ.Τ. εργάζεται τα τελευταία 30 χρόνια ως ναυτικός πράκτορας στο λιμάνι του Πειραιά.","q":"Θα μπορούσε ο Σ.Τ να ενεργήσει και ως ναυλομεσίτης;","sol":"Ναυλομεσίτης (chartering agent - ship broker), είναι το πρόσωπο που αναλαμβάνει, έναντι αμοιβής, να φέρει σε επαφή τον πλοιοκτήτη με το φορτωτή για τη σύναψη συμβάσεως ναυλώσεως του πλοίου. Πολλές φορές ο ναυλομεσίτης ενεργεί και ως ναυτικός πράκτορας."},{"id":"33752-Θα","th":"33752","lab":"α","k":"calc","secs":["Β4.7.2"],"p":13,"ctx":"Όσον αφορά στις κύριες διατάξεις της Διεθνούς Συμβάσεως για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL), σύμφωνα με τους κανονισμούς 9-10 του Παραρτήματος Ι για τη ρύπανση από πετρέλαιο, απαγορεύονται οι απορρίψεις πετρελαίου, εκτός εάν πληρούνται ορισμένες προϋποθέσεις.","q":"Να αναφέρετε τις προϋποθέσεις αυτές.","sol":"Σύμφωνα με τους κανονισμούς 9-10, απαγορεύονται οι απορρίψεις πετρελαίου, εκτός εάν πληρούνται ορισμένες προϋποθέσεις, όπως ο τύπος και το μέγεθος του πλοίου, οι θαλάσσιες περιοχές, η απόσταση από τις ακτές και η κίνηση του πλοίου, ο εξοπλισμός του πλοίου για τον έλεγχο της ρυπάνσεως, τα είδη και η προέλευση των μειγμάτων νερούπετρελαίου, ο ρυθμός και οι ποσότητες του απορριπτόμενου πετρελαίου."},{"id":"33752-Θβ","th":"33752","lab":"β","k":"calc","secs":["Β4.7.2"],"p":12,"ctx":"Όσον αφορά στις κύριες διατάξεις της Διεθνούς Συμβάσεως για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL), σύμφωνα με τους κανονισμούς 9-10 του Παραρτήματος Ι για τη ρύπανση από πετρέλαιο, απαγορεύονται οι απορρίψεις πετρελαίου, εκτός εάν πληρούνται ορισμένες προϋποθέσεις.","q":"Σύμφωνα με την παραπάνω απάντησή σας, πότε δεν ισχύουν οι απαιτήσεις για απόρριψη πετρελαίου;","sol":"Δεν ισχύουν οι παραπάνω απαιτήσεις για απόρριψη πετρελαίου, όταν η απόρριψη έγινε με σκοπό την ασφάλεια του πλοίου ή τη διάσωση ανθρώπινης ζωής στη θάλασσα ή ήταν αποτέλεσμα βλάβης με την προϋπόθεση ότι ελήφθησαν όλα τα απαραίτητα μέτρα και ο πλοίαρχος δεν ενήργησε σκόπιμα ή αδιαφόρησε."},{"id":"33753-Θα","th":"33753","lab":"α","k":"calc","ty":"pr","secs":["Α6.6"],"p":15,"ctx":"Το Δεξαμενόπλοιο «LESBOS» αφίχθη στο λιμάνι του Ρότερνταμ της Ολλανδίας. Εκεί επιβιβάστηκαν δύο νέα μέλη του πληρώματος και βάσει των ισχυόντων κανονισμών, ο Ν.Β. ναυτολογήθηκε με την ειδικότητα του ναυκλήρου και ο Π.Γ. του αντλιωρού. Να περιγράψετε:","q":"Τα καθήκοντα του Ν.Β..","sol":"Είναι ο υπόλογος υπαξιωματικός για την υπηρεσία καταστρώματος και για το κατώτερο προσωπικό της. Τελεί υπό τον άμεσο έλεγχο του υποπλοιάρχου και τον βοηθεί στην άσκηση αστυνομίας στο πλοίο, στη διατήρηση πειθαρχίας του πληρώματος καταστρώματος, στην εξασφάλιση καθαριότητας, συντήρηση κ.λπ. Κατανέμει το προσωπικό στις διάφορες εργασίες και επιβλέπει για την κανονική εκτέλεσή τους. Βοηθά τους αξιωματικούς καταστρώματος κατά την παραλαβή, στοιβασία και παράδοση του φορτίου και επιβλέπει ιδιαίτερα τα μηχανήματα αγκυροβολίας και εξαρτισμού γενικά. Φροντίζει για την ασφαλή τοποθέτηση, συντήρηση και στεγανότητα των σωσιβίων λέμβων και έχει την ευθύνη φυλάξεως και διατηρήσεως σε καλή κατάσταση των αποθηκών υλικού συντηρήσεως του σκάφους."},{"id":"33753-Θβ","th":"33753","lab":"β","k":"calc","ty":"pr","secs":["Α6.6"],"p":10,"ctx":"Το Δεξαμενόπλοιο «LESBOS» αφίχθη στο λιμάνι του Ρότερνταμ της Ολλανδίας. Εκεί επιβιβάστηκαν δύο νέα μέλη του πληρώματος και βάσει των ισχυόντων κανονισμών, ο Ν.Β. ναυτολογήθηκε με την ειδικότητα του ναυκλήρου και ο Π.Γ. του αντλιωρού. Να περιγράψετε:","q":"Τα καθήκοντα του Π.Γ..","sol":"Υπηρετεί μόνο στα δεξαμενόπλοια και είναι υπεύθυνος για τα θέματα συντηρήσεως των συστημάτων αντλήσεως, θερμάνσεως, εξαερισμού και πιέσεως. Χειρίζεται τις αντλίες κατά τη φορτοεκφόρτωση του φορτίου ή έρματος."},{"id":"33755-Θα","th":"33755","lab":"α","k":"calc","secs":["Β4.7.2"],"p":15,"ctx":"Σύμφωνα με τον κανονισμό 16 του Παραρτήματος Ι της Διεθνούς Συμβάσεως για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL):","q":"Ποιος είναι ο εξοπλισμός με τον οποίο ελέγχεται η λειτουργική ρύπανση από πετρέλαιο και με τον οποίο θα πρέπει να είναι εφοδιασμένα όλα τα νέα και υπάρχοντα Δεξαμενόπλοια;","sol":"Σύμφωνα με τον κανονισμό 16, όλα τα νέα και υπάρχοντα Δ/Ξ πρέπει να εφοδιάζονται με τον ακόλουθο εξοπλισμό που ελέγχει τη λειτουργική ρύπανση από πετρέλαιο:<br>1) Σύστημα παρακολουθήσεως και ελέγχου απορρίψεως πετρελαίου.<br>2) Ελαιοδιαχωριστήρα των 100 ppm (parts per million).<br>3) Σύστημα φιλτραρίσματος των 15 ppm."},{"id":"33755-Θβ","th":"33755","lab":"β","k":"calc","secs":["Β4.7.2"],"p":10,"ctx":"Σύμφωνα με τον κανονισμό 16 του Παραρτήματος Ι της Διεθνούς Συμβάσεως για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL):","q":"Σε ποιες επιθεωρήσεις θα πρέπει να υπόκεινται τα Δ/Ξ από 150 GRT και άνω και τα άλλα εμπορικά πλοία από 400 GRT και άνω;","sol":"Τα Δ/Ξ από 150 GRT και άνω και τα άλλα εμπορικά πλοία από 400 GRT και άνω, υπόκεινται στις εξής επιθεωρήσεις:<br>1) Αρχική επιθεώρηση, πριν το πλοίο ξεκινήσει τη λειτουργία του με σκοπό να εξασφαλισθεί ότι χορηγείται το Πιστοποιητικό για την Αποφυγή της Ρυπάνσεως από Πετρέλαιο (ΙΟPCC), του οποίου η διάρκεια δεν μπορεί να υπερβαίνει τα 5 έτη.<br>2) Ενδιάμεση επιθεώρηση, κατά τη διάρκεια της περιόδου που ισχύει το IOPPC.<br>3) Υποχρεωτική ετήσια επιθεώρηση ή έκτακτες επιθεωρήσεις.<br>4) Περιοδική επιθεώρηση, σε διαστήματα που δεν υπερβαίνουν τα 5 έτη, για να διαπιστωθεί ότι το IOPP μπορεί να επανεκδοθεί."},{"id":"33756-4.1","th":"33756","part":"4.1","k":"calc","secs":["Β4.8"],"p":10,"q":"Ποια ήταν τα αμφιλεγόμενα σημεία, για τα οποία δέχτηκε σκληρή κριτική μόλις ψηφίστηκε ο Νόμος για τη Ρύπανση από πετρέλαιο (Oil Pollution Act – OPA) 1990;","sol":"Μόλις ψηφίστηκε ο OPA, δέχτηκε αυτόματα σκληρή κριτική για τα εξής δύο αμφιλεγόμενα σημεία του:<br>1) Για τον σχεδιασμό DH ή DB, δηλαδή για τα διπλά κελύφη και διπύθμενα και<br>2) για το καθεστώς απεριόριστης ευθύνης του πλοιοκτήτη."},{"id":"33756-4.2","th":"33756","part":"4.2","k":"calc","secs":["Β4.8"],"p":15,"q":"Τι προβλέπει ο Νόμος για τη Ρύπανση από πετρέλαιο (Oil Pollution Act – OPA) 1990 σχετικά με τις λειτουργικές διαδικασίες των Δεξαμενοπλοίων;","sol":"Σχετικά με τις λειτουργικές διαδικασίες των Δ/Ξ, αφορά στα πληρώματα και στην κατανάλωση ναρκωτικών και αλκοόλ. Γενικότερα η USCG περιοδικά ελέγχει τους κανονισμούς του κράτους της σημαίας που σχετίζονται με την επάνδρωση, εκπαίδευση, τις ικανότητες και την τήρηση φυλακών. Αυτό γίνεται με σκοπό, σε περίπτωση ατυχήματος, να εξετάσει εάν οι κανονισμοί που εφαρμόζει το πλοίο είναι με παρόμοιους όρους με τους κανόνες των ΗΠΑ ή τους διεθνείς κανονισμούς που αποδέχονται οι ΗΠΑ, π.χ. οι κώδικες ISM και ISPS. Για τα ναρκωτικά και το αλκοόλ ο Νόμος προβλέπει ότι, εάν 2 αξιωματικοί ανακαλύψουν ότι ο πλοίαρχος βρίσκεται υπό την επήρεια αυτών των ουσιών και δεν μπορεί να ασκήσει τα καθήκοντά του, ο ύπαρχος (first mate) μπορεί να τον αντικαταστήσει (τα πιστοποιητικά ικανότητας θα αναστέλλονται)."},{"id":"33757-Θα","th":"33757","lab":"α","k":"calc","secs":["Β5.5.6"],"p":13,"ctx":"Υπηρετείτε ως Αρχιπλοίαρχος στο γραφείο της εταιρείας «AIGAIO SHIPPING”.","q":"Σύμφωνα με τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ), ποιες λειτουργικές απαιτήσεις πρέπει να περιλαμβάνονται στο Σύστημα Ασφαλούς Διαχείρισης (ΣΑΔ) της εταιρείας σας (απαιτούνται πέντε);","sol":"Σχετικά με το ΣΑΔ ισχύουν τα εξής, με βάση τον ΚΑΔ: «Κάθε εταιρεία θα πρέπει να αναπτύσσει, εφαρμόζει και να τηρεί ΣΑΔ», το οποίο θα περιλαμβάνει τις παρακάτω λειτουργικές απαιτήσεις (πέντε από τα παρακάτω):<br>1) Πολιτική ασφάλειας και περιβαλλοντικής προστασίας.<br>2) Οδηγίες και διαδικασίες για την εξασφάλιση της ασφαλούς λειτουργίας των πλοίων και της προστασίας του θαλάσσιου περιβάλλοντος σε συμμόρφωση με τη σχετική διεθνή νομοθεσία, καθώς και με εκείνη του κράτους της σημαίας.<br>3) Καθορισμένα επίπεδα εξουσιοδοτήσεως και γραμμές επικοινωνίας μεταξύ του προσωπικού του πλοίου και της ξηράς.<br>4) Διαδικασίες για την αναφορά ατυχημάτων και περιπτώσεων μη συμμορφώσεως με τις διατάξεις αυτού του Κώδικα.<br>5) Διαδικασίες προετοιμασίας για επέμβαση σε έκτακτες καταστάσεις.<br>6) Διαδικασίες για εσωτερικούς ελέγχους."},{"id":"33757-Θβ","th":"33757","lab":"β","k":"calc","secs":["Β5.5.5"],"p":12,"ctx":"Υπηρετείτε ως Αρχιπλοίαρχος στο γραφείο της εταιρείας «AIGAIO SHIPPING”.","q":"Ποια είναι τα σημεία, που επισημαίνονται από τον Διεθνή Κώδικα Ασφαλούς Διαχείρισης (ISM) σχετικά με την ευθύνη του πλοιάρχου, η οποία θα πρέπει να καθορίζεται σαφώς και να τεκμηριώνεται από την εταιρεία (απαιτούνται τρία);","sol":"Η εταιρεία θα πρέπει να καθορίζει σαφώς και να τεκμηριώνει την ευθύνη του πλοιάρχου σχετικά με την (τρία από τα παρακάτω):<br>1) Εφαρμογή της πολιτικής ασφάλειας και περιβαλλοντικής προστασίας της εταιρείας.<br>2) Παρακίνηση του πληρώματος στην τήρηση αυτής της πολιτικής.<br>3) Έκδοση κατάλληλων εντολών και οδηγιών κατά σαφή και απλό τρόπο.<br>4) Επαλήθευση ότι τηρούνται οι καθορισμένες απαιτήσεις.<br>5) Αναθεώρηση του ΣΑΔ και αναφορά των ελλείψεών του προς τη διοίκηση της εταιρείας στην ξηρά."},{"id":"33759-Θα","th":"33759","lab":"α","k":"calc","secs":["Β5.5.6"],"p":12,"ctx":"Εργάζεστε ως Αρχιπλοίαρχος στην εταιρεία “HELLAS SHIPPING”. Η υποχρέωση να εκτελούνται οι σωστές διαδικασίες πρέπει να διδαχθεί στο προσωπικό των πλοίων της εταιρείας, αφού από αυτό εξαρτάται η αποτελεσματικότητα του συστήματος. Να αναφέρετε:","q":"Ποια στοιχεία θα πρέπει να εξετάζει η εταιρεία σας όταν προβαίνει στην επάνδρωση σε σχέση με το Σύστημα Ασφαλούς Διαχείρισης (ΣΑΔ) ;","sol":"Η εταιρεία θα πρέπει να εξετάζει τα ακόλουθα στοιχεία, όταν προβαίνει στην επάνδρωση σε σχέση με το ΣΑΔ:<br>1) Το εμπόριο στο οποίο απασχολείται το πλοίο και ο φόρτος εργασίας του πληρώματος.<br>2) Η επιδεξιότητα που απαιτείται από το πλήρωμα για την ασφαλή εκτέλεση των καθηκόντων που αυτό αναμένεται να εκτελέσει σε συνήθεις εργασίες και κατά τη διάρκεια εκτάκτων αναγκών.<br>3) Η συναίσθηση του πληρώματος σε σχέση με τα καθήκοντά του στο ΣΑΔ, και<br>4) η ύπαρξη των καταλλήλων πιστοποιητικών, των προσόντων και της ιατρικής ικανότητας."},{"id":"33759-Θβ","th":"33759","lab":"β","k":"calc","secs":["Β5.5.6"],"p":13,"ctx":"Εργάζεστε ως Αρχιπλοίαρχος στην εταιρεία “HELLAS SHIPPING”. Η υποχρέωση να εκτελούνται οι σωστές διαδικασίες πρέπει να διδαχθεί στο προσωπικό των πλοίων της εταιρείας, αφού από αυτό εξαρτάται η αποτελεσματικότητα του συστήματος. Να αναφέρετε:","q":"Πώς πρέπει να διεξάγονται τα εκπαιδευτικά γυμνάσια για την ασφάλεια στη θάλασσα ώστε να ικανοποιούνται οι απαιτήσεις του Συστήματος Ασφαλούς Διαχείρισης (ΣΑΔ);","sol":"Εκπαιδευτικά γυμνάσια για την ασφάλεια στη θάλασσα πρέπει να εκτελούνται σύμφωνα με τις διαδικασίες και απαιτήσεις που παρατίθενται στο ΣΑΔ. Τα γυμνάσια πρέπει να καλύπτουν πιθανές καταστάσεις έκτακτης ανάγκης και να αποσκοπούν στην εξασφάλιση ότι τα μέλη του πληρώματος ικανοποιούν τα πρότυπα του ΣΑΔ της εταιρείας και αποκτούν εμπειρία στον έλεγχο καταστάσεων, οι οποίες πιθανόν να ανακύψουν σε μία κατάσταση έκτακτης ανάγκης. Τα αποτελέσματα των ελέγχων ασφάλειας, των γυμνασίων και η ανάλυση των ατυχημάτων, των επικινδύνων συμβάντων και των περιστατικών μη συμμορφώσεως βοηθούν στον εντοπισμό προσθέτων απαιτήσεων εκπαιδεύσεως της εταιρείας ή αναγκαίων βελτιώσεων στις διαδικασίες του ΣΑΔ."},{"id":"33760-Θα","th":"33760","lab":"α","k":"calc","secs":["Β5.5.6"],"p":10,"ctx":"Σύμφωνα με τον Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ) να αναφέρετε:","q":"Εργασίες που χαρακτηρίζονται ως «Ειδικές εργασίες».","sol":"Ειδικές εργασίες στο πλοίο χαρακτηρίζονται εκείνες, όπου τα σφάλματα πιθανόν να καταστούν εμφανή μόνο μετά την πρόκληση επικινδύνων καταστάσεων ή όταν συμβούν ατυχήματα. Οι διαδικασίες και οι οδηγίες για ειδικές εργασίες στο πλοίο θα καλύπτουν τα μέτρα προφυλάξεως και τους ελέγχους που στοχεύουν στη διόρθωση μη ασφαλών πρακτικών πριν συμβούν ατυχήματα."},{"id":"33760-Θβ","th":"33760","lab":"β","k":"calc","secs":["Β5.5.6"],"p":15,"ctx":"Σύμφωνα με τον Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ) να αναφέρετε:","q":"Πέντε (5) παραδείγματα ειδικών εργασιών.","sol":"Παραδείγματα ειδικών εργασιών είναι τα εξής:<br>1) Ασφάλεια του πλοίου, τρομοκρατία και πειρατεία.<br>2) Εργασίες συντηρήσεως.<br>3) Εξασφάλιση υδατοστεγούς ακεραιότητας.<br>4) Ασφαλής ναυσιπλοΐα, περιλαμβανομένης της διορθώσεως των χαρτών και των εκδόσεων.<br>5) Εργασίες που επηρεάζουν την αξιοπιστία του εξοπλισμού, όπως του μηχανισμού πηδαλιουχήσεως και του συνδεδεμένου μηχανισμού ετοιμότητας του μηχανοστασίου.<br>6) Εργασίες πετρελεύσεως και μεταγγίσεις πετρελαίου στο λιμάνι.<br>7) Διατήρηση της ευστάθειας και αποφυγή της υπερφορτώσεως και υπερκοπώσεως.<br>8) Πρόσδεση φορτίων και άλλων δεμάτων."},{"id":"33762-Θα","th":"33762","lab":"α","k":"calc","secs":["Β5.5.6"],"p":10,"ctx":"Σύμφωνα με τον Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ) να αναφέρετε:","q":"Εργασίες που χαρακτηρίζονται ως «Κρίσιμες εργασίες».","sol":"Κρίσιμες εργασίες στο πλοίο χαρακτηρίζονται εκείνες όπου ένα σφάλμα δύναται αμέσως να προκαλέσει ένα ατύχημα ή μία κατάσταση η οποία μπορεί να απειλήσει τους ανθρώπους, το περιβάλλον ή το πλοίο. Ειδικότερη προσοχή πρέπει να δίνεται στην ανάγκη αυστηρής προσηλώσεως στις οδηγίες κατά την εκτέλεση των κρισίμων εργασιών και πρέπει να παρακολουθείται προσεκτικά η ικανοποιητική απόδοσή τους."},{"id":"33762-Θβ","th":"33762","lab":"β","k":"calc","secs":["Β5.5.6"],"p":15,"ctx":"Σύμφωνα με τον Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ) να αναφέρετε:","q":"Πέντε (5) παραδείγματα κρίσιμων εργασιών.","sol":"Παραδείγματα κρισίμων εργασιών είναι τα εξής:<br>1) Ναυσιπλοΐα σε περιορισμένες θαλάσσιες περιοχές ή σε περιοχές με μεγάλη πυκνότητα κυκλοφορίας.<br>2) Ναυσιπλοΐα σε συνθήκες μειωμένης ορατότητας.<br>3) Εργασίες που είναι δυνατόν να προκαλέσουν αιφνίδια απώλεια της ικανότητας ελιγμών σε κλειστές ή μεγάλης κυκλοφορίας περιοχές.<br>4) Εργασίες με πολύ δυσμενείς καιρικές συνθήκες.<br>5) Χειρισμός και στοιβασία επικινδύνων φορτίων και επιβλαβών ουσιών.<br>6) Πετρέλευση και μετάγγιση πετρελαίου στη θάλασσα.<br>7) Εργασίες φορτίου σε υγραεριοφόρα, χημικά Δ/Ξ και Δ/Ξ μεταφοράς αργού πετρελαίου.<br>8) Κρίσιμες εργασίες στο μηχανοστάσιο"},{"id":"33770-Θ","th":"33770","k":"calc","ty":"pr","secs":["Α6.6"],"p":25,"q":"Ο Δ.Μ. υπηρετεί με το βαθμό του Ανθυποπλοιάρχου στο Φ/Γ πλοίο «ΣΤΥΛΙΑΝΟΣ». Ο πλοίαρχος Γ.Ν. του αναθέτει τα καθήκοντα του αξιωματικού ραδιοεπικοινωνιών. Ποιες είναι οι αρμοδιότητες του Δ.Μ. ως αξιωματικός ραδιοεπικοινωνιών;","sol":"Είναι ο προϊστάμενος και υπεύθυνος της υπηρεσίας ραδιοτηλεπικοινωνιών του πλοίου και τελεί υπό τις άμεσες διαταγές του Πλοιάρχου. Συμμορφώνεται επακριβώς με τις υποχρεώσεις που έχει από τις διεθνείς συμβάσεις και τους ειδικούς κανονισμούς για τα ελληνικά πλοία, που αφορούν στην εκτέλεση φυλακής, στην κανονική διεξαγωγή ανταποκρίσεως, στην τήρηση ημερολογίου και άλλων βιβλίων και εντύπων, στη συντήρηση των μηχανημάτων και στην επισκευή των βλαβών κ.λπ. Ευθύνεται για το απόρρητο της ανταποκρίσεως και ενημερώνει το ταχύτερο τον Πλοίαρχο για όλα τα ραδιοτηλεγραφήματα που παίρνει και για όσα πρόκειται να αποστείλει. Λαμβάνει καθημερινά το δελτίο ειδήσεων του Υ.Ε.Ν., το οποίο ανακοινώνει στον Πλοίαρχο και στο πλήρωμα. Κατά την παραμονή του πλοίου σε όρμο, ο ραδιοτηλεγραφητής ασχολείται με γραφική υπηρεσία του σταθμού ασυρμάτου και με εργασίες συντηρήσεως. Σε περίπτωση εγκαταλείψεως του πλοίου, ο ραδιοτηλεγραφητής παραμένει και εκπέμπει συνεχώς το σήμα κινδύνου, το στίγμα του πλοίου και κάθε άλλο που διατάζει ο Πλοίαρχος. Οι διαταγές του Πλοιάρχου, που αφορούν το σήμα κινδύνου, πρέπει να δίνονται εγγράφως προς τον αξιωματικό τηλεπικοινωνιών. Τα καθήκοντα του ραδιοτηλεγραφητή σήμερα ασκούνται από αξιωματικούς γέφυρας, ανάλογα με τη χωρητικότητα του πλοίου, οι οποίοι υποχρεούνται σε ειδική προς τούτο εκπαίδευση και εφοδιασμό τους με αντίστοιχο πιστοποιητικό."}],"themes":{"26224":{"t":2,"items":["26224-2.1","26224-2.2"]},"26225":{"t":2,"items":["26225-2.1α","26225-2.1β","26225-2.1γ","26225-2.1δ","26225-2.1ε","26225-2.2"]},"26226":{"t":2,"items":["26226-2.1","26226-2.2"]},"26227":{"t":2,"items":["26227-2.1α","26227-2.1β","26227-2.1γ","26227-2.1δ","26227-2.1ε","26227-2.2"]},"26228":{"t":2,"items":["26228-2.1","26228-2.2"]},"26230":{"t":2,"items":["26230-2.1","26230-2.2"]},"26231":{"t":2,"items":["26231-2.1α","26231-2.1β","26231-2.1γ","26231-2.1δ","26231-2.1ε","26231-2.2"]},"26232":{"t":2,"items":["26232-2.1","26232-2.2α","26232-2.2β"]},"26233":{"t":2,"items":["26233-2.1α","26233-2.1β","26233-2.1γ","26233-2.1δ","26233-2.1ε","26233-2.2"]},"26234":{"t":2,"items":["26234-2.1","26234-2.2"]},"26235":{"t":2,"items":["26235-2.1α","26235-2.1β","26235-2.1γ","26235-2.1δ","26235-2.1ε","26235-2.2"]},"26236":{"t":2,"items":["26236-2.1","26236-2.2"]},"26237":{"t":2,"items":["26237-2.1α","26237-2.1β","26237-2.1γ","26237-2.1δ","26237-2.1ε","26237-2.2"]},"26238":{"t":2,"items":["26238-2.1","26238-2.2"]},"26239":{"t":2,"items":["26239-2.1α","26239-2.1β","26239-2.1γ","26239-2.1δ","26239-2.1ε","26239-2.2"]},"26240":{"t":2,"items":["26240-2.1α","26240-2.1β","26240-2.1γ","26240-2.1δ","26240-2.1ε","26240-2.2"]},"26242":{"t":2,"items":["26242-2.1α","26242-2.1β","26242-2.1γ","26242-2.1δ","26242-2.1ε","26242-2.2"]},"26244":{"t":2,"items":["26244-2.1α","26244-2.1β","26244-2.1γ","26244-2.1δ","26244-2.1ε","26244-2.2"]},"26245":{"t":2,"items":["26245-2.1","26245-2.2"]},"26333":{"t":2,"items":["26333-2.1","26333-2.2"]},"29336":{"t":2,"items":["29336-2.1α","29336-2.1β","29336-2.1γ","29336-2.1δ","29336-2.1ε","29336-2.2"]},"29339":{"t":2,"items":["29339-2.1α","29339-2.1β","29339-2.1γ","29     parts.push({ key, name: PARTS[key], ids, total: 25 });

  return { parts, items: parts.flatMap(p => p.ids), w, lab, part, full: parts.length * 25 };
