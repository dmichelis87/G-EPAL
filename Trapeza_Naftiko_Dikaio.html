th":"32277","part":"2.1","k":"match","secs":["Α5.1","Α6.6","Α16.1","Α19","Α20"],"p":10,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["μεριμνά για την πλοήγηση και ελευθεροκοινωνία του πλοίου που καταπλέει στο λιμάνι","φροντίζει για την παροχή πρώτων βοηθειών στους αρρώστους ή τραυματίες που επιβαίνουν στο πλοίο","εγκατάλειψή του πλοίου στους ασφαλιστές","ειδικευμένο πρόσωπο που προσλαμβάνεται για την οδήγηση του πλοίου κατά τον είσπλου ή έκπλου και κατά τη διέλευση από διώρυγες","κυβερνά αυτοπροσώπως το πλοίο, κατά τον είσπλου και έκπλου στα λιμάνια, όρμους, διώρυγες, διαύλους και άλλα επικίνδυνα σημεία","κατά την άπαρση και αγκυροβολία διευθύνει την εργασία στην πρύμνη και βρίσκεται σε συνεχή επαφή με τη γέφυρα"],"rows":[{"t":"Ναυτικό ατύχημα","a":[2],"s":"Α16.1"},{"t":"Πλοηγός","a":[3],"s":"Α20"},{"t":"Υποπλοίαρχος","a":[1],"s":"Α6.6"},{"t":"Πλοίαρχος","a":[4],"s":"Α5.1"},{"t":"Ναυτικός πράκτορας","a":[0],"s":"Α19"}],"filt":true},{"id":"32277-2.2","th":"32277","part":"2.2","k":"open","secs":["Α19"],"p":15,"q":"Τι αναλαμβάνει ο Ναυλομεσίτης;","sol":"Ναυλομεσίτης είναι το πρόσωπο, που αναλαμβάνει έναντι αμοιβής, να φέρει σε επαφή τον Πλοιοκτήτη με το φορτωτή για τη σύναψη συμβάσεως ναυλώσεως του πλοίου. Πολλές φορές ο Ναυλομεσίτης ενεργεί και ως Ναυτικός Πράκτορας."},{"id":"32279-2.1","th":"32279","part":"2.1","k":"mc","secs":["Α20"],"p":10,"q":"Έχει ειδικές γνώσεις για τη θαλάσσια περιοχή όπου ασκεί τα καθήκοντα του και είναι πολύτιμος σύμβουλος του Πλοιάρχου.","opts":["Ανθυποπλοίαρχος","Β’ Μηχανικός","Ναυτικός πράκτορας","Πλοηγός","Πλοιοκτήτης"],"a":3},{"id":"32279-2.2","th":"32279","part":"2.2","k":"open","secs":["Α8.4"],"p":15,"q":"Σύμφωνα με την Οργάνωση της εσωτερικής υπηρεσίας στα πλοία, ποιες είναι οι εργασίες που γίνονται όταν το πλοίο βρίσκεται «εν όρμω»;","sol":"Στα λιμάνια ή στους όρμους που αγκυροβολεί το πλοίο, οι φυλακές γέφυρας και μηχανής διατηρούνται ή διαλύονται κατά τις περιστάσεις και την κρίση του Πλοιάρχου. Όταν οι φυλακές διαλυθούν, το προσωπικό ασχολείται υπό την εποπτεία και τον έλεγχο του υποπλοιάρχου ή του Α΄ Μηχανικού, ανάλογα με τη φύση της εργασίας, σε γενικές εργασίες σκάφους ή μηχανής, σύμφωνα με το ωρολόγιο πρόγραμμα. Για τη φύλαξη του πλοίου πρέπει να παραμένει «ένδον», μέρος του πληρώματος, κατά τα προβλεπόμενα από το κανονισμό και την ισχύουσα συλλογική σύμβαση. Το προσωπικό γενικών υπηρεσιών ασχολείται, στο λιμάνι ή στον όρμο, με διάφορες εργασίες της ειδικότητας του, υπό την εποπτεία και τον έλεγχο του υποπλοιάρχου."},{"id":"32280-2.1","th":"32280","part":"2.1","k":"open","secs":["Β3.2"],"p":10,"q":"Να αναφέρετε τους δύο κύριους λόγους ώστε να κρατηθεί ένα πλοίο στο λιμάνι, σύμφωνα με την Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW).","sol":"Σύμφωνα με την Σύμβαση για τα πρότυπα πιστοποιητικών εκπαιδεύσεως και τηρήσεως φυλακών των ναυτικών (STCW) 1995 υπάρχουν δύο κύριοι λόγοι για να κρατηθεί το πλοίο σε ένα λιμάνι : πρώτον η αποτυχία να επιλυθούν προβλήματα σχετικά με την σωστή επάνδρωση και την τήρηση φυλακών γέφυρας και δεύτερον εφόσον υπάρχει κίνδυνος απειλής ανθρώπινης ζωής, της περιουσίας και του περιβάλλοντος."},{"id":"32280-2.2","th":"32280","part":"2.2","k":"open","secs":["Β3.2"],"p":15,"q":"Σε τι αφορούν οι διατάξεις της Σύμβασης για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW) 1995 σχετικά με την έκλειψη «πλαστών» πιστοποιητικών, αλλά και με τους τρόπους που αποκτήθηκαν; (απαιτούνται τρία από τα επτά)","sol":"Οι διατάξεις της Σύμβασης για τα πρότυπα πιστοποιητικών εκπαιδεύσεως και τηρήσεως φυλακών των ναυτικών (STCW) 1995 αφορούν κυρίως στα ακόλουθα:<br>1) Ορισμός των ενοποιημένων προτύπων ικανότητας.<br>2) Ειδική αναφορά στις μεθόδους εγκρίσεως εθνικών και αλλοδαπών πιστοποιητικών.<br>3) Ειδική αναφορά στις πληροφορίες για τους κανονισμούς παράκτιου εμπορίου.<br>4) Καθορισμός των μεθόδων ελέγχου που πλέον αναφέρονται σε θέματα ασφάλειας.<br>5) Κατοχή ενός αρχείου πιστοποιητικών (από τη διοίκηση) σύμφωνα με τα κριτήρια ποιότητας.<br>6) Έλεγχος της εφαρμογής της Σύμβασης (από τον IMO), που θα οδηγήσει στην καθιέρωση ενός λευκού καταλόγου.<br>7) Καθορισμός των ευθυνών της επιχειρήσεως για τα πιστοποιητικά."},{"id":"32282-2.1","th":"32282","part":"2.1","k":"match","secs":["Α14.3"],"p":15,"q":"Αντιστοίχισε κάθε στοιχείο της στήλης Α με ένα στοιχείο της στήλης Β (ένα στοιχείο της στήλης Β περισσεύει).","opts":["Φυλάκιση μέχρις ενός έτους","Φυλάκιση τουλάχιστον ενός έτους","Φυλάκιση μέχρι τριών μηνών","Φυλάκιση τουλάχιστον έξι μηνών","Φυλάκιση τουλάχιστον τριών μηνών","Φυλάκιση τουλάχιστον τριών ετών"],"rows":[{"t":"Παράνομη απουσία","a":[2],"s":"Α14.3"},{"t":"Λιποταξία","a":[0],"s":"Α14.3"},{"t":"Στάση","a":[5],"s":"Α14.3"},{"t":"Επιβουλή κατά του Πλοιάρχου","a":[1],"s":"Α14.3"},{"t":"Ανυπακοή","a":[4],"s":"Α14.3"}]},{"id":"32282-2.2α","th":"32282","part":"2.2","lab":"α","k":"mc","secs":["Α1.1"],"p":5,"q":"Το Ναυτικό Δίκαιο διαιρείται σε:","opts":["Ιδιωτικό ναυτικό και Δημόσιο ναυτικό","Εμπορικό ναυτικό και Ιδιωτικό ναυτικό","Ενδοτικό ναυτικό και Δημόσιο ναυτικό","Διεθνές ναυτικό και Ιδιωτικό ναυτικό"],"a":0},{"id":"32282-2.2β","th":"32282","part":"2.2","lab":"β","k":"mc","secs":["Α1.2"],"p":5,"q":"Ο Κώδικας Δημοσίου Ναυτικού Δικαίου (Κ.Δ.Ν.Δ.) περιλαμβάνει διατάξεις που αναφέρονται:","opts":["Στα πλοία και βοηθητικά ναυπηγήματα","Σε θέματα προσωπικού πλοίων","Σε θέματα λιμενικής αστυνομίας και ειδικά ναυτιλιακά θέματα","Σε όλα τα παραπάνω"],"a":3},{"id":"32284-2.1","th":"32284","part":"2.1","k":"open","secs":["Α6.7"],"p":10,"q":"Όταν το πλοίο βρίσκεται εν πλω, με ποιο τρόπο γίνεται η οργάνωση της υπηρεσίας για το προσωπικό καταστρώματος;","sol":"Το προσωπικό καταστρώματος κατανέμεται με φροντίδα του υποπλοιάρχου σε εργασίες γέφυρας και γενικές εργασίες σκάφους. Η εργασία γέφυρας διεξάγεται κατά φυλακές που εναλλάσσονται κανονικά. Κάθε φυλακή αποτελείται από έναν αξιωματικό καταστρώματος, έναν ναύτη πηδαλιούχο και έναν οπτήρα. Οι φυλακές είναι τετράωρης διάρκειας η κάθε μια (8-12, 12-4, 4-8). Σε έκτακτες περιπτώσεις ή αν δεν επαρκεί το προσωπικό, οι φυλακές μπορεί να γίνουν εξάωρες."},{"id":"32284-2.2","th":"32284","part":"2.2","k":"open","secs":["Α14.3"],"p":15,"q":"Να αναφέρετε ονομαστικά ποια είναι τα ειδικά ναυτικά αδικήματα που στρέφονται κατά της υπηρεσίας του πλοίου και κατά της πειθαρχίας (απαιτούνται έξι από τα εννέα).","sol":"Τα αδικήματα που στρέφονται κατά της υπηρεσίας του πλοίου και κατά της πειθαρχίας είναι:<br>1. Παράνομη Απουσία<br>2. Εγκατάλειψη Θέσεως<br>3. Λιποταξία<br>4. Μη προσέλευση για ανάληψη υπηρεσίας<br>5. Ανυπακοή<br>6. Εξύβριση ή απειλή Ανωτέρου<br>7. Στάση<br>8. Επιβουλή κατά του Πλοίαρχου<br>9. Κατάχρηση Εξουσίας"},{"id":"32289-2.1","th":"32289","part":"2.1","k":"open","secs":["Β5.5.5"],"p":15,"q":"Ποιοι είναι οι κύριοι στόχοι του Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ);","sol":"Οι κύριοι στόχοι του Κώδικα Ασφαλούς Διαχωρίσεως (ΚΑΔ) είναι :<br>1. Να εξασφαλίσει την ασφάλεια στη θάλασσα.<br>2. Η πρόληψη των τραυματισμών ή των απωλειών ανθρωπίνων ζωών.<br>3. Η πρόληψη ζημιών στο περιβάλλον, ιδίως στο θαλάσσιο περιβάλλον και στα περιουσιακά στοιχεία."},{"id":"32289-2.2","th":"32289","part":"2.2","k":"open","secs":["Β5.5.3"],"p":10,"q":"Σύμφωνα με τον Κώδικα Ασφαλούς Διαχωρίσεως (ΚΑΔ), ποιοι είναι οι στόχοι της εταιρείας; (απαιτούνται τέσσερεις από τους έξι)","sol":"Οι στόχοι της ασφαλούς διαχωρίσεως της εταιρείας μεταξύ άλλων θα πρέπει να είναι:<br>1. Η παροχή ασφαλών πρακτικών λειτουργίας του πλοίου και ασφαλούς περιβάλλοντος εργασίας.<br>2. Η καθιέρωση εξασφαλίσεων έναντι όλων των αναγνωρισμένων κινδύνων.<br>3. Η συνεχής βελτίωση της εκπαιδεύσεως ασφαλούς διαχειρίσεως του προσωπικού της ξηράς και των πλοίων, που περιλαμβάνει την προετοιμασία για αντιμετώπιση εκτάκτων περιστατικών, τα οποία σχετίζονται άμεσα με την ασφάλεια και την περιβαλλοντική προστασία.<br>4. Παρέχει ασφαλείς πρακτικές στη λειτουργία του πλοίου και ένα ασφαλές εργασιακό περιβάλλον.<br>5. Καθιερώνει μέτρα προστασίας έναντι όλων των προσδιορισθέντων κινδύνων.<br>6. Βελτιώνει συνεχώς τις δεξιότητες διαχωρίσεως της ασφάλειας του προσωπικού στην ξηρά και στην θάλασσα."},{"id":"32291-2.1","th":"32291","part":"2.1","k":"fillp","secs":["Α15.1"],"p":15,"q":"Τα ⟨α⟩ Καθήκοντα του Πλοιάρχου και των μελών του πληρώματος καθορίζονται κυρίως από τους ⟨β⟩ φορτηγών και ⟨γ⟩ πλοίων. Πολλές όμως άλλες διατάξεις επιβάλουν επίσης ⟨δ⟩ στους Πλοίαρχους και τα μέλη του πληρώματος των πλοίων, όπως είναι οι νόμοι ⟨ε⟩, περί επιθεωρήσεως Εμπορικών Πλοίων, περί προστασίας του Θαλασσίου Περιβάλλοντος, κ.α.","labs":["α","β","γ","δ","ε"],"opts":["Νόμο","Κανονισμούς Εργασίας","Επιβατικών","Υποχρεώσεις","Περί Ακτοπλοΐας","Υπηρεσιακά"],"a":[5,1,2,3,4]},{"id":"32291-2.2","th":"32291","part":"2.2","k":"open","secs":["Α15.3"],"p":10,"q":"Τί γνωρίζετε για την πειθαρχική ποινή της επίπληξης;","sol":"Η ποινή αυτή μπορεί να είναι γραπτή ή μόνο προφορική. Και στις δυο όμως περιπτώσεις πρέπει να καταγράφεται στο ποινολόγιο του πλοίου από τον Πλοίαρχο. Επίπληξη που δεν καταγράφετε στο ποινολόγιο δεν αποτελεί ποινή αλλά απλή σύσταση. Στην ουσία δεν υπάρχει διαφορά μεταξύ προφορικής και έγγραφης επιπλήξεως, εφόσον και οι δυο καταγράφονται στο ποινολόγιο."},{"id":"32293-2.1α","th":"32293","part":"2.1","lab":"α","k":"tf","secs":["Β2.1"],"p":3,"q":"Η πρώτη έκδοση της Σύμβασης της ασφάλειας της ανθρώπινης ζωής στη θάλασσα (SOLAS) είχε ως κίνητρο το ναυάγιο του επιβατηγού πλοίου Τιτανικός.","a":true},{"id":"32293-2.1β","th":"32293","part":"2.1","lab":"β","k":"tf","secs":["Β2.3"],"p":3,"q":"Η μορφή της διεθνής σύμβασης της ασφάλειας της ανθρώπινης ζωής στη θάλασσα (SOLAS) αποτελείτε 13 κεφάλαια υποδιαιρούμενα σε μέρη και κανονισμούς.","a":false,"why":"Η SOLAS αποτελείται από XII κεφάλαια, υποδιαιρούμενα σε μέρη και κανονισμούς."},{"id":"32293-2.1γ","th":"32293","part":"2.1","lab":"γ","k":"tf","secs":["Β2.6"],"p":3,"q":"Ο κώδικας πρακτικής για ασφαλέστερη φόρτωση και εκφόρτωση (BLU Cargo) αποτελείται από 5 σημαντικά χαρακτηριστικά.","a":false,"why":"Ο κώδικας λέγεται BLU Code· τα 5 είναι τα πιο σημαντικά χαρακτηριστικά του, όχι όλο το περιεχόμενό του."},{"id":"32293-2.1δ","th":"32293","part":"2.1","lab":"δ","k":"tf","secs":["Β3.3"],"p":3,"q":"Σύμφωνα με την σύμβαση για τα πρότυπα πιστοποιητικών εκπαιδεύσεως και τηρήσεως φυλακών των ναυτικών (STCW), κάθε εταιρεία υποχρεούται να εξασφαλίζει ότι κάθε ναυτικός της κατέχει κατάλληλο Πιστοποιητικό Ικανότητας.","a":true},{"id":"32293-2.1ε","th":"32293","part":"2.1","lab":"ε","k":"tf","secs":["Β5.5.2"],"p":3,"q":"Ο Κώδικας ασφαλούς διαχειρίσεως (ΚΑΔ) είναι υποχρεωτικός και σε όλα τα κυβερνητικά πλοία που χρησιμοποιούνται για εμπορικούς σκοπούς.","a":true},{"id":"32293-2.2","th":"32293","part":"2.2","k":"open","secs":["Β5.5.3"],"p":10,"q":"Ποιος είναι ο σκοπός του Κώδικα Ασφαλούς Διαχειρίσεως (ΚΑΔ);","sol":"Σκοπός του Κώδικα ασφαλούς διαχωρίσεως (ΚΑΔ) είναι η εξασφάλιση ενός διεθνούς προτύπου για την ασφαλή διαχείριση και λειτουργία των πλοίων και την πρόληψη της θαλάσσιας ρυπάνσεως."},{"id":"32296-2.1","th":"32296","part":"2.1","k":"open","secs":["Α6.7"],"p":15,"q":"Ποια είναι τα καθήκοντα του αξιωματικού φυλακής γέφυρας;","sol":"Κατά τη διάρκεια της φυλακής του, τελεί υπό τον έλεγχο του Πλοιάρχου και έχει τη γενική φροντίδα του πλοίου, επαγρυπνώντας για την ασφαλή διακυβέρνησή του. Κατά τη διάρκεια της φυλακής του παραμένει συνεχώς στη γέφυρα και μεριμνά για την εξασφάλιση της ναυσιπλοΐας, τηρώντας τους σχετικούς κανονισμούς και παρακολουθώντας όλα τα ηλεκτρονικά ή άλλα όργανα που βρίσκονται στη γέφυρα. Επιβλέπει επίσης την κίνηση επάνω στο πλοίο και τις εργασίες στο κατάστρωμα. Για κάθε έκτακτο περιστατικό, ειδοποιεί αμέσως τον Πλοίαρχο. Οι άνδρες φυλακής γέφυρας (πηδαλιούχος-οπτήρας) εναλλάσσουν την υπηρεσία τους κάθε δίωρο στις εργάσιμες ώρες και κάθε μία ώρα στις μη εργάσιμες. Οι άνδρες που κατανέμονται στις γενικές εργασίες σκάφους εργάζονται με την επίβλεψη του ναυκλήρου σε καθαρισμούς, χρωματισμούς, προετοιμασία κυτών κλπ."},{"id":"32296-2.2","th":"32296","part":"2.2","k":"open","secs":["Α6.7"],"p":10,"q":"Κατά την οργάνωση της εργασίας εν πλω πως κατανέμεται το προσωπικό μηχανής;","sol":"Το προσωπικό μηχανής κατανέμεται επίσης σε φυλακές μηχανής και γενικές εργασίες, με τη μέριμνα του Α' μηχανικού. Κάθε φυλακή αποτελείται από έναν αξιωματικό, έναν δόκιμο ή υπαξιωματικό αν προβλέπεται από την οργανική σύνθεση πληρώματος και από έναν θερμαστή. Για τον αριθμό και τη διάρκεια των φυλακών ισχύουν τα ίδια με τις φυλακές γέφυρας."},{"id":"32298-2.1","th":"32298","part":"2.1","k":"open","secs":["Α5.2"],"p":15,"q":"Σύμφωνα με τα Συμβολαιογραφικά καθήκοντα του Πλοιάρχου, τι γνωρίζετε για τη διαδικασία της απογραφής των πραγμάτων;","sol":"Σε περίπτωση θανάτου, εξαφανίσεως ή λιποταξίας στο εξωτερικό μέλους πληρώματος, ο Πλοίαρχος οφείλει να συντάξει έκθεση απογραφής των πραγμάτων του, με τη συνδρομή δυο αξιωματικών ή αν δεν υπάρχουν, δυο μελών του πληρώματος. Τα πράγματα αυτά οφείλει να τα διαφυλάξει και να τα παραδώσει, μαζί με αντίγραφο της εκθέσεως απογραφής στη λιμενική ή προξενική αρχή του πρώτου λιμανιού κατάπλου του πλοίου. Αν τα πράγματα υπόκεινται σε φθορά ή υπάρχει άλλος σοβαρός λόγος, η αρχή τα εκποιεί υπέρ του δικαιούχου και παρακαταθέτει το τίμημα στο N.A.T.. Αν μέσα σε δύο χρόνια από την κατάθεση του τιμήματος, αυτό δεν αναζητηθεί από τους δικαιούχους, περιέρχεται στην περιουσία του N.A.T. Η ίδια διαδικασία απογραφής ακολουθείται και όταν ο αποθανών ή ο εξαφανισθείς είναι επιβάτης του πλοίου, εκτός αν συνοδεύεται από σύζυγο ή ανιόντες ή κατιόντες συγγενείς, οπότε τα πράγματα παραλαμβάνονται από αυτούς."},{"id":"32298-2.2","th":"32298","part":"2.2","k":"open","secs":["Α5.2"],"p":10,"q":"Τι γνωρίζετε για τα αστυνομικά καθήκοντα του Πλοιάρχου;","sol":"Ο Πλοίαρχος, σύμφωνα με το νόμο, έχει αστυνομική εξουσία επί του πλοίου και προς το σκοπό τηρήσεως της τάξεως, πειθαρχίας και υγιεινής και για την ασφάλεια του πλοίου, των επιβαινόντων και του φορτίου, λαμβάνει κάθε αναγκαίο μέτρο, σύμφωνα με τους ισχύοντες κανονισμούς. Η αστυνομική εξουσία του Πλοιάρχου ασκείται όχι μόνο κατά των μελών του πληρώματος, αλλά και κατά παντός επιβαίνοντος στο πλοίο. Τα μέτρα που δικαιούται και υποχρεούται να λαμβάνει ο Πλοίαρχος είναι προληπτικά και κατασταλτικά."},{"id":"32301-2.1α","th":"32301","part":"2.1","lab":"α","k":"tf","secs":["Α1.2"],"p":3,"q":"Το έτος 1958 με το νόμο 3816 κυρώθηκε και άρχισε να ισχύει ο Κώδικας Ιδιωτικού Ναυτικού Δικαίου.","a":true},{"id":"32301-2.1β","th":"32301","part":"2.1","lab":"β","k":"tf","secs":["Α1.2"],"p":3,"q":"Με το Νομοθετικό Διάταγμα 187/1973 κυρώθηκε ο Κώδικας Δημοσίου Ναυτικού Δικαίου.","a":true},{"id":"32301-2.1γ","th":"32301","part":"2.1","lab":"γ","k":"tf","secs":["Α1.2"],"p":3,"q":"Ο Κώδικας Δημοσίου Ναυτικού Δικαίου άρχισε να ισχύει από την 4η Απριλίου 1973.","a":false,"why":"Ο ΚΔΝΔ κυρώθηκε με το ΝΔ 187/1973 και άρχισε να ισχύει από την 4η Απριλίου 1974."},{"id":"32301-2.1δ","th":"32301","part":"2.1","lab":"δ","k":"tf","secs":["Α1.2"],"p":3,"q":"Ο Κώδικας Δημοσίου Ναυτικού Δικαίου περιλαμβάνει θέματα προσωπικού πλοίων, λιμενικής αστυνομίας κλπ.","a":true},{"id":"32301-2.1ε","th":"32301","part":"2.1","lab":"ε","k":"tf","secs":["Α1.1"],"p":3,"q":"Το Ναυτικό Δίκαιο χωρίζετε σε Ιδιωτικό Ναυτικό Δίκαιο και Δημόσιο Ναυτικό Δίκαιο.","a":true},{"id":"32301-2.2","th":"32301","part":"2.2","k":"open","secs":["Α1.1"],"p":10,"q":"Ποια είναι η διαφορά μεταξύ Αναγκαστικού και Ενδοτικού Δικαίου;","sol":"Οι διατάξεις του ενδοτικού δικαίου κατά κανόνα, δεν αποκλείουν διαφορετική ρύθμιση, μετά από συμφωνία των ενδιαφερομένων, ενώ στο αναγκαστικό δίκαιο οι περισσότερες διατάξεις δεν μπορούν δηλαδή να τροποποιηθούν με συμφωνία των ενδιαφερομένων, γιατί αφορούν στη δημόσια τάξη."},{"id":"32303-2.1","th":"32303","part":"2.1","k":"fillp","secs":["Α14.3"],"p":15,"q":"Η ⟨α⟩ είναι από τα βαρύτερα ειδικά ναυτικά αδικήματα. Προϋποθέτει τη συμμετοχή ⟨β⟩ του ενός προσώπων από αυτούς που επιβαίνουν στο πλοίο, δηλαδή μέλη του πληρώματος ή επιβάτες, τα οποία στρέφονται κατά της ⟨γ⟩ του Πλοιάρχου. Σκοπός της ⟨δ⟩ δεν πρέπει να είναι απαραίτητα η ⟨ε⟩ κατάλυση της Εξουσίας του Πλοιάρχου.","labs":["α","β","γ","δ","ε"],"opts":["Φυλάκιση","Εξεγέρσεως","Εξουσίας","Ολοσχερής","Στάση","Περισσοτέρων"],"a":[4,5,2,1,3]},{"id":"32303-2.2","th":"32303","part":"2.2","k":"open","secs":["Α15.2"],"p":10,"q":"Να γράψετε πέντε Πειθαρχικά Παραπτώματα του Πλοιάρχου, σύμφωνα με τον Κώδικα δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ).","sol":"α) Η πρόσληψη ναυτικού, στου οποίου το φυλλάδιο δεν έχει καταγραφεί η απόλυσή του από προηγούμενο πλοίο. β) Η πρόσληψη ή απόλυση μέλους πληρώματος, χωρίς ναυτολόγηση ή ναυτολόγηση ναυτικού, που δεν επιβαίνει στο πλοίο. γ) Η παράνομη πρόσληψη στο πλοίο μη απογεγραμμένου ναυτικού ή ναυτικού που έχει στερηθεί το δικαίωμα ασκήσεως του ναυτικού επαγγέλματος. δ) Η παράνομη πρόσληψη στο πλοίο προσώπου, που δεν έχει τα απαιτούμενα για τη θέση που προσλαμβάνεται προσόντα. ε) Η πρόσληψη αλλοδαπών στο πλοίο, πέραν από το επιτρεπόμενο ποσοστό. στ) Η μη έγκαιρη προσκόμιση των ναυτιλιακών εγγράφων στην προξενική ή λιμενική αρχή για θεώρηση. ζ) Η αποβίβαση στην αλλοδαπή εκτός του τόπου προορισμού, επιβάτη ασθενή ή τραυματία, έστω και δικαιολογημένα, αλλά χωρίς την ειδοποίηση της προξενικής ή τοπικής αρχής. η) Η μη πρόσληψη πλοηγού στις περιπτώσεις που η πλοήγηση είναι υποχρεωτική. θ) Η μη τήρηση του εδεσματολογίου. ι) Η αδικαιολόγητη μη συμμόρφωση με τις ισχύουσες διατάξεις, ως προς την εξόφληση και αντικατάσταση του ναυτολογίου. ια) Η κακόβουλη εγγραφή στο ναυτικό φυλλάδιο του ναυτικού που απολύεται «ελλείψει αρχής» χαρακτηρισμών, εκτός αυτών που προβλέπουν οι σχετικές διατάξεις ως αιτιολογικά απολύσεως (π.χ.λόγω ανικανότητας). ιβ) Η αδικαιολόγητη καθυστέρηση καταβολής οφειλομένων μισθών, εξόδων νοσηλείας και κάθε νόμιμης παροχής σε μέλος πληρώματος, η οποία οφείλεται σε παράλειψη του Πλοιάρχου. ιγ) Η συνειδητή ψευδής καταμήνυση μέλους του πληρώματος στις αρμόδιες αρχές. ιδ) Η μη απόδοση του ναυτικού φυλλαδίου ή του αποδεικτικού ναυτικής ικανότητας σε μέλος του πληρώματος που απολύεται κανονικά από το πλοίο. ιε) Η αδικαιολόγητη, κατ’ επανάληψη, επιβολή σε μέλος πληρώματος ποινής προστίμου που ακυρώθηκε κατόπιν από τις λιμενικές αρχές. ιστ) Η αδικαιολόγητη παρεμπόδιση υποβολής παραπόνων εκ μέρους μέλους πληρώματος ή επιβάτη, στις αρμόδιες ελληνικές αρχές."},{"id":"34306-2.1","th":"34306","part":"2.1","k":"open","secs":["Β2.6"],"p":15,"q":"Τα τελευταία χρόνια ασκείται σοβαρή κριτική στην ασφάλεια της απόδοσης των φορτηγών πλοίων χύδην ξηρού φορτίου (bulk carriers). Τι θα πρέπει να γνωρίζουν οι διαχειριστές τέτοιου τύπου πλοίων για τις ειδικές συνθήκες ασφάλειας;","sol":"Οι διαχειριστές τέτοιου τύπου πλοίων όπως τα φορτηγά πλοία χύδην ξηρού φορτίου (bulk carriers), θα πρέπει να γνωρίζουν τις ειδικές συνθήκες ασφάλειας, όπως ότι η φόρτωση του φορτίου πρέπει να γίνετε με ιδιαίτερη προσοχή, ώστε να εξασφαλιστεί ότι το φορτίο δεν πρόκειται να μετακινηθεί (shift) κατά την διάρκεια του ταξιδιού προκαλώντας ζητήματα σταθερότητας. Οι μεγάλες μπουκαπόρτες (hatch covers) πρέπει να είναι υδατοστεγής και ασφαλισμένες."},{"id":"34306-2.2α","th":"34306","part":"2.2","lab":"α","k":"open","secs":["Β3.1"],"p":5,"ctx":"Σχετικά με τη Διεθνή Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW), να απαντήσετε με συντομία στα εξής:","q":"Πότε υιοθετήθηκε;","sol":"υιοθετήθηκε στις 7 Ιουλίου 1978."},{"id":"34306-2.2β","th":"34306","part":"2.2","lab":"β","k":"open","secs":["Β3.1"],"p":5,"ctx":"Σχετικά με τη Διεθνή Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των ναυτικών (STCW), να απαντήσετε με συντομία στα εξής:","q":"Πότε τέθηκε σε ισχύ;","sol":"τέθηκε σε ισχύ το 1984."},{"id":"26307-4.1","th":"26307","part":"4.1","k":"calc","secs":["Α5.2"],"p":10,"q":"Να αναφέρετε ονομαστικά τις κατηγορίες τις οποίες μπορούν να καταταχθούν τα ειδικά καθήκοντα του Πλοιάρχου ως δημόσιου λειτουργού.","sol":"Τα ειδικά καθήκοντα του Πλοιάρχου ως δημόσιου λειτουργού είναι τα:<br>- Ληξιαρχικά.<br>- Συμβολαιογραφικα<br>- Ανακριτικά<br>- Αστυνομικά","note":"Το βιβλίο (5.2) τα κατατάσσει σε τρεις κατηγορίες: ληξιαρχικά, συμβολαιογραφικά και ανακριτικά – αστυνομικά."},{"id":"26307-4.2","th":"26307","part":"4.2","k":"calc","secs":["Α5.2"],"p":15,"q":"Να αναφέρετε τι προβλέπει ο Κώδικας Δημόσιου Ναυτικού Δικαίου (ΚΔΝΔ) και ο Αστικός Κώδικας για τη σύνταξη διαθήκης σε εμπορικά πλοία.","sol":"Για τη σύνταξη διαθήκης σε εμπορικά πλοία προβλέπει ο ΚΔΝΔ και ο Αστικός Κώδικας τα εξής: Όταν το πλοίο βρίσκεται «εν πλω» και κάποιος από τους επιβαίνοντες επιθυμεί να συντάξει διαθήκη, ο Πλοίαρχος οφείλει να εκτελέσει χρέη συμβολαιογράφου και να γράψει τη διαθήκη κατά την υπαγόρευση του διαθέτη, προσλαμβάνοντας δύο μάρτυρες που δεν πρέπει να έχουν συγγένεια με τον ίδιο ή τον διαθέτη. Η διαθήκη αυτή είναι «δημόσια έκτακτη διαθήκη» και ισχύει για τρεις μήνες από τον κατάπλου του πλοίου σε κάποιο λιμάνι, εκτός αν πεθάνει στο μεταξύ ο διαθέτης, οπότε ισχύει οριστικά. Στη διαθήκη πρέπει να αναφέρονται, η ημερομηνία και ο τόπος συντάξεως, τα πλήρη στοιχεία του διαθέτη, του Πλοιάρχου και των μαρτύρων και μνεία ότι ο διαθέτης εδήλωσε προφορικά τη θέλησή του και ότι δεν ήταν παρών άλλος εκτός από τους μάρτυρες. Τη διαθήκη ο Πλοίαρχος την παραδίδει στο πρώτο λιμάνι κατάπλου του πλοίου, σε συμβολαιογράφο, αν το λιμάνι είναι ελληνικό ή στην ελληνική προξενική αρχή αν το πλοίο έχει καταπλεύσει σε ξένο λιμάνι. Αν ο Πλοίαρχος αρνηθεί τη σύνταξη διαθήκης, υπέχει ποινική, πειθαρχική και ενδεχομένως και αστική ευθύνη."},{"id":"26308-Θα","th":"26308","lab":"α","k":"calc","secs":["Α14.3"],"p":20,"ctx":"Τα ειδικά ναυτικά αδικήματα που προβλέπονται από τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ) και αφορούν την υπηρεσία στο πλοίο είναι η παράνομη απουσία, η εγκατάλειψη θέσεως, η λιποταξία, η μη προσέλευση προς ανάληψη υπηρεσίας και η εγκατάλειψη κινδυνεύοντος πλοίου. Να απαντήσετε στα εξής:","q":"Πότε υφίσταται το κάθε ένα από τα ανωτέρω αδικήματα;","sol":"Παράνομη απουσία: όταν μέλος του πληρώματος απουσιάζει αδικαιολόγητα από το πλοίο, ενώ διεξάγεται η υπηρεσία κατά φυλακές.<br>Εγκατάλειψη θέσεως: όταν μέλος του πληρώματος απουσιάζει αδικαιολόγητα από το πλοίο κατά τον χρόνο που έχει υποχρέωση να εκτελέσει διατεταγμένη υπηρεσία που ανάγεται στη φύλαξη ή στην ασφάλεια του πλοίου, των επιβαινόντων ή του φορτίου.<br>Λιποταξία: όταν μέλος του πληρώματος απουσιάζει αδικαιολόγητα στην αλλοδαπή επί δύο συνεχείς ημέρες ή μέχρι τον απόπλου του πλοίου, αν αυτός γίνει νωρίτερα. Χαρακτηριστικό της λιποταξίας είναι ότι μπορεί να γίνει μόνο στο εξωτερικό.<br>Μη προσέλευση για ανάληψη υπηρεσίας: όταν ο ναυτικός που ναυτολογήθηκε δεν προσέρχεται αδικαιολόγητα να αναλάβει υπηρεσία στο πλοίο.","note":"Η λύση της τράπεζας γράφει μόνο τη λιποταξία· τα υπόλοιπα είναι από το βιβλίο (14.3)."},{"id":"26308-Θβ","th":"26308","lab":"β","k":"calc","secs":["Α14.3"],"p":5,"ctx":"Τα ειδικά ναυτικά αδικήματα που προβλέπονται από τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ) και αφορούν την υπηρεσία στο πλοίο είναι η παράνομη απουσία, η εγκατάλειψη θέσεως, η λιποταξία, η μη προσέλευση προς ανάληψη υπηρεσίας και η εγκατάλειψη κινδυνεύοντος πλοίου. Να απαντήσετε στα εξής:","q":"Γιατί η εγκατάλειψη θέσεως είναι βαρύτερο αδίκημα από την παράνομη απουσία;","sol":"Στην περίπτωση της εγκαταλείψεως θέσεως υπάρχει βαρύτερο αδίκημα από ότι στην παράνομη απουσία γιατί ο ναυτικός παραμελεί και εγκαταλείπει συγκεκριμένη υπεύθυνη υπηρεσία και έτσι θέτει σε άμεσο κίνδυνο την ασφάλεια του πλοίου, του φορτίου ή των επιβαινόντων."},{"id":"26309-Θα","th":"26309","lab":"α","k":"calc","ty":"pr","secs":["Α16.1"],"p":5,"ctx":"Την 10 Απριλίου 1978, Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων με προορισμό ελληνικό λιμάνι. Λίγο μετά τις 10:00 μ.μ. το πλοίο προσεγγίζει το λιμάνι άφιξης με ανέμους 8 μποφόρ. Δύο μίλια ανοιχτά του λιμανιού, προσέκρουσε με ταχύτητα 10 κόμβων σε ύφαλο. Το νερό κατέκλυσε το μηχανοστάσιο του πλοίου, το οποίο πήρε γρήγορα κλίση προς τα δεξιά και μετά από 25 λεπτά βυθίστηκε με την απώλεια 10 ανθρώπινων ζωών. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Σύμφωνα με το νομοθετικό διάταγμα 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος», το συμβάν θεωρείται ναυτικό ατύχημα;","sol":"Το περιστατικό είναι Ναυτικό Ατύχημα σύμφωνα με το νομοθετικό διάταγμα 712/1970."},{"id":"26309-Θβ","th":"26309","lab":"β","k":"calc","ty":"pr","secs":["Α16.1"],"p":20,"ctx":"Την 10 Απριλίου 1978, Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων με προορισμό ελληνικό λιμάνι. Λίγο μετά τις 10:00 μ.μ. το πλοίο προσεγγίζει το λιμάνι άφιξης με ανέμους 8 μποφόρ. Δύο μίλια ανοιχτά του λιμανιού, προσέκρουσε με ταχύτητα 10 κόμβων σε ύφαλο. Το νερό κατέκλυσε το μηχανοστάσιο του πλοίου, το οποίο πήρε γρήγορα κλίση προς τα δεξιά και μετά από 25 λεπτά βυθίστηκε με την απώλεια 10 ανθρώπινων ζωών. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Ποιες είναι οι καταστάσεις που επέφερε το συμβάν και τεκμηριώνουν την προηγούμενη απάντησή σας;","sol":"Επειδή το συμβάν επέφερε τις παρακάτω καταστάσεις:<br>1. Ολική πραγματική ή τεκμαρτή απώλεια πλοίου (Το πλοίο χάθηκε ολοσχερώς μετά από πρόσκρουση).<br>2. Απώλεια ζωής επιβάτη ή μέλους του πληρώματος. (Θάνατος που προήλθε από την σύγκρουση και την βύθιση του πλοίου)."},{"id":"26312-Θα","th":"26312","lab":"α","k":"calc","ty":"pr","secs":["Β6.8"],"p":10,"ctx":"Το Feisty Gas ήταν το πρώτο πλοίο που κρατήθηκε σε ομηρία για την καταβολή λύτρων. Ήταν ένα πλοίο τύπου LPG, το οποίο καταλήφθηκε ανοιχτά της Σομαλίας τον Απρίλιο του 2005 και αφέθηκε ελεύθερο 17 ημέρες αργότερα με την πληρωμή λύτρων ύψους 315.000 δολαρίων ΗΠΑ. Έπειτα από παρόμοια περιστατικά ο Διεθνής Ναυτιλιακός Οργανισμός ΙΜΟ προχώρησε σε κάποιες προτάσεις και οδηγίες για περιπτώσεις πειρατείας. Σύμφωνα με αυτές, ποια μέτρα πρέπει να λαμβάνονται:","q":"προληπτικά από την εταιρεία πριν το ταξίδι;","sol":"Προληπτικά μέτρα της εταιρείας πριν το ταξίδι. Θα ήταν σημαντικό η εταιρεία να πραγματοποιήσει μία πλήρη αξιολόγηση του ρίσκου, προκειμένου να εντοπίσει και να εκτιμήσει την πιθανότητα πειρατικής επιθέσεως, μετρώντας τις πιθανότητες συνεργασίας με το πολεμικό ναυτικό της κάθε χώρας."},{"id":"26312-Θβ","th":"26312","lab":"β","k":"calc","ty":"pr","secs":["Β6.8"],"p":15,"ctx":"Το Feisty Gas ήταν το πρώτο πλοίο που κρατήθηκε σε ομηρία για την καταβολή λύτρων. Ήταν ένα πλοίο τύπου LPG, το οποίο καταλήφθηκε ανοιχτά της Σομαλίας τον Απρίλιο του 2005 και αφέθηκε ελεύθερο 17 ημέρες αργότερα με την πληρωμή λύτρων ύψους 315.000 δολαρίων ΗΠΑ. Έπειτα από παρόμοια περιστατικά ο Διεθνής Ναυτιλιακός Οργανισμός ΙΜΟ προχώρησε σε κάποιες προτάσεις και οδηγίες για περιπτώσεις πειρατείας. Σύμφωνα με αυτές, ποια μέτρα πρέπει να λαμβάνονται:","q":"που αφορούν το πλοίο, όταν διέρχεται από περιοχές υψηλού κινδύνου;","sol":"Μέτρα που αφορούν στο πλοίο. Όταν τα πλοία διέρχονται από περιοχές υψηλού κινδύνου, οι κινήσεις του πληρώματος θα πρέπει να έχουν πάντα οπτική επαφή με τα περιβάλλοντα ύδατα, προκειμένου να προσδιορίσουν έγκαιρα ύποπτα σκάφη. Η ταχύτητα του πλοίου πρέπει να είναι τουλάχιστον 18knots, για να αντιμετωπιστεί η πιθανότητα προσεγγίσεως των πειρατικών σκαφών. Η ενισχυμένη προστασία της γέφυρας προτείνεται ανεπιφύλακτα. Η χρήση συρματοπλεγμάτων εμποδίζει την ανάβαση των πειρατών πάνω στο πλοίο. Τα σπρέι νερού και ο αφρός χρησιμοποιούνται διότι καθυστερούν τις επιθέσεις και εμποδίζουν τα πειρατικά σκάφη να πλησιάσουν πολύ κοντά στο πλοίο. Η πρόσληψη ένοπλων φρουρών συνιστάται δίχως αμφιβολία."},{"id":"26313-Θα","th":"26313","lab":"α","k":"calc","secs":["Β3.2"],"p":15,"ctx":"Σχετικά με τη Διεθνή Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW), να απαντήσετε στα εξής:","q":"Η Διεθνής Σύμβαση STCW 1995 αφορά σε ναυτικούς που υπηρετούν σε θαλασσοπλοούντα πλοία. Ποια πλοία εξαιρούνται;","sol":"Η STCW 1995 αφορά σε ναυτικούς που υπηρετούν σε θαλασσοπλοούντα πλοία εκτός αυτών που υπηρετούν σε:<br>1. Πολεμικά πλοία και βοηθητικά πλοία του πολεμικού ναυτικού.<br>2. Κρατικά πλοία, τα οποία απασχολούνται μόνο σε κυβερνητική (μη εμπορική) υπηρεσία.<br>3. Αλιευτικά σκάφη.<br>4. Θαλαμηγά πλοία αναψυχής, που δεν απασχολούνται σε εμπορικές επιχειρήσεις.<br>5. Ξύλινα πλοία πρωτόγονης κατασκευής."},{"id":"26313-Θβ","th":"26313","lab":"β","k":"calc","secs":["Β3.2"],"p":10,"ctx":"Σχετικά με τη Διεθνή Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW), να απαντήσετε στα εξής:","q":"Ο σκοπός της τροποποιημένης STCW 1995 είναι να καθιερώσει ενιαία εκπαίδευση, πιστοποίηση, επικύρωση και αξιολόγηση των γνώσεων. Που αφορούν οι διατάξεις της; (απαιτούνται τέσσερις)","sol":"Τέσσερις από:<br>1. Ορισμός των ενοποιημένων προτύπων ικανότητας.<br>2. Ειδική αναφορά στις μεθόδους εγκρίσεως εθνικών και αλλοδαπών πιστοποιητικών.<br>3. Ειδική αναφορά στις πληροφορίες παράκτιου εμπορίου.<br>4. Καθορισμός των μεθόδων ελέγχου που πλέον αναφέρονται σε θέματα ασφάλειας.<br>5. Κατοχή ενός αρχείου πιστοποιητικών σύμφωνα με τα κριτήρια ποιότητας<br>6.Έλεγχος εφαρμογής της Συμβάσεως που θα οδηγήσει στην καθιέρωση ενος λευκού καταλόγου.<br>7. Καθορισμός των ευθυνών της επιχειρήσεως για τα πιστοποιητικά."},{"id":"26315-Θ","th":"26315","k":"calc","ty":"pr","secs":["Α5.2"],"p":25,"q":"Στο κρουαζιερόπλοιο «PEGASUS», κατά τη διάρκεια του βραδινού μπουφέ, 75χρονος επιβάτης που δεν συνοδευόταν, αισθάνθηκε αδιαθεσία και κατέληξε. Ο γιατρός του πλοίου διέγνωσε καρδιακό επεισόδιο. Να καταγράψετε τις ενέργειες στις οποίες πρέπει να προβεί ο Πλοίαρχος ως δημόσιος λειτουργός.","sol":"Για το συγκεκριμένο συμβάν ο Πλοίαρχος καλείται να ασκήσει τα ληξιαρχικά του καθήκοντα. Ειδικότερα, σε περίπτωση θανάτου κατά τη διάρκεια του πλου, ο Πλοίαρχος οφείλει να συντάξει ληξιαρχική πράξη θανάτου. Η πράξη αυτή, που συντάσσεται σε χωριστό φύλλο χαρτιού, περιλαμβάνει την ημερομηνία συντάξεως, τα στοιχεία του δηλούντος ή των μαρτύρων, την ημερομηνία και την ώρα θανάτου, το στίγμα του πλοίου, τα στοιχεία των γονέων και συζύγου του, τη δήλωση ότι διαβάστηκε και υπογράφηκε από τους παριστάμενους και τις υπογραφές του Πλοιάρχου, του δηλούντος και των μαρτύρων. Επίσης οφείλει να προβεί σε εγγραφή και στο ημερολόγιο του πλοίου και να εκθέσει με λεπτομέρειες τις συνθήκες που έλαβε χώρα το περιστατικό. Στη συνέχεια οφείλει να την παραδώσει στην ελληνική λιμενική ή προξενική αρχή του πρώτου λιμανιου καταπλου του πλοίου. Αν ο Πλοίαρχος παραλείψει τη σύνταξη ληξιαρχικής πράξης θανάτου (ή γεννήσεως) ή την καταχώρηση σχετικής εγγραφής στο ημερολόγιο του πλοίου, τιμωρείται με φυλάκιση μέχρι έξι μηνών και με πειθαρχική ποινή. Επίσης ο Πλοίαρχος έχει αστική ευθύνη για τυχόν ζημιά που υπέστη κάποιος από την παράλειψη ή την εσφαλμένη ενέργειά του."},{"id":"26318-4.1","th":"26318","part":"4.1","k":"calc","secs":["Β2.6"],"p":15,"q":"Να αναφέρετε πέντε (5) αιτίες που έθεσαν σε κίνδυνο την ασφάλεια των φορτηγών πλοίων χύδην ξηρού φορτίου (bulk carriers), σύμφωνα με σχετικές μελέτες περιπτώσεων.","sol":"Οι πέντε (5) αιτίες που έθεσαν σε κίνδυνο την ασφάλεια των φορτηγών πλοίων χύδην ξηρού φορτίου είναι οι εξής:<br>1. Αστοχία στη δομή του πλοίου.<br>2. Κούραση και παραβίαση των όρων του κώδικα BLU.<br>3. Κακή λειτουργία της ομάδας στη γέφυρα (αμέλεια ανάματος φώτων κ.λπ.)<br>4. Έλλειψη ασκήσεων και διαδικασιών εκπαιδεύσεως στην περίπτωση που υπήρξε βλάβη στο σύστημα πλοηγήσεως.<br>5. Οι πλοίαρχοι μερικές φορές δεν παίρνουν τις κατάλληλες πληροφορίες (καθαρές, ακριβείς και αξιόπιστες) σχετικά με χαρακτηριστικά των φορτίων και τις απαιτούμενες συνθήκες για την ασφαλή μεταφορά και χειρισμό τους."},{"id":"26318-4.2","th":"26318","part":"4.2","k":"calc","secs":["Β2.6"],"p":10,"q":"Να αναφέρετε ονομαστικά τα πέντε (5) πιο σημαντικά χαρακτηριστικά του Κώδικα Πρακτικής για Ασφαλέστερη Φόρτωση και Εκφόρτωση (BLU Code).","sol":"1. Πιο ανθεκτικά πλοία.<br>2. Βελτίωση των πρακτικών χειρισμού των φορτίων.<br>3. Περιορισμοί στη μεταφορά φορτίων.<br>4. Όργανα φορτώσεως.<br>5. Ενίσχυση των επιθεωρήσεων."},{"id":"26319-Θα","th":"26319","lab":"α","k":"calc","secs":["Β2.5"],"p":15,"ctx":"Σχετικά με το ζήτημα της διαχείρισης και της ασφάλειας των μεγάλων επιβατηγών Ε/Γ πλοίων, να απαντήσετε στα εξής:","q":"Σε ποια προβλήματα επικεντρώνεται το μεγαλύτερο ενδιαφέρον;","sol":"Από την πρώτη στιγμή διαπιστώθηκε ότι το μεγαλύτερο ενδιαφέρον στο ζήτημα της διαχειρίσεως και της ασφάλειας των μεγάλων Ε/Γ πλοίων επικεντρώνεται στη δυσκολία εκκενώσεως με ασφάλεια ενός αριθμού επιβατών, π.χ. οι ηλικιωμένοι και οι τραυματίες από τις σωσίβιες λέμβους στα σκάφη διασώσεως. Αρκετοί άνθρωποι δεν είναι εξοικειωμένοι με τα πλοία, και το να συνωστίζονται σε σωσίβιες λέμβους και σωσίβιες σχεδίες, αποτελεί μεγάλο ρίσκο για την ίδια την ζωή τους. Επίσης, η πυρκαγιά αντιπροσωπεύει μια ιδιαίτερη αιτία της ευπάθειας των μεγάλων κρουαζιερόπλοιων. Κάθε επιβάτης αποτελεί μια πιθανή αιτία πυρκαγιάς για το πλοίο και οι ξενοδοχειακές υπηρεσίες έχουν εγγενείς κινδύνους."},{"id":"26319-Θβ","th":"26319","lab":"β","k":"calc","secs":["Β2.5"],"p":10,"ctx":"Σχετικά με το ζήτημα της διαχείρισης και της ασφάλειας των μεγάλων επιβατηγών Ε/Γ πλοίων, να απαντήσετε στα εξής:","q":"Που βασίζεται ο σκοπός της βελτιωμένης επιβιωσιμότητας;","sol":"Η Maritime Safety Committee (MSC) συμφώνησε ότι τα μελλοντικά μεγάλης χωρητικότητας Ε/Γ πλοία θα πρέπει να σχεδιαστούν με σκοπό τη βελτιωμένη επιβιωσιμότητα βασιζόμενη στην αρχή : το πλοίο είναι το ίδιο η καλύτερη λύση διασώσεως (time-honored principle).Αυτή η προσέγγιση προβλέπει οτι οι επιβάτες και το πλήρωμα θα μπορούν φυσιολογικά να προσφύγουν σε ενα ασφαλές σημείο στο πλοίο και να παραμείνουν εκεί.Αυτό προϋποθέτει ότι το πλοίο έχει πάντα τη δυνατότητα να προσεγγίσει το λιμάνι με την ελάχιστη ταχύτητα ασφάλειας."},{"id":"26320-Θα","th":"26320","lab":"α","k":"calc","ty":"pr","secs":["Α14.3"],"p":10,"ctx":"Ο Πλοίαρχος του δεξαμενόπλοιου Δ/Ξ «MARIA» με ελληνική σημαία, ενημέρωσε τις αρμόδιες Αρχές για περιστατικό εξέγερσης στο πλοίο. Συγκεκριμένα, κατά τη διάρκεια του πλου, ανοικτά των ακτών του Καμερούν στον κόλπο της Δυτικής Αφρικής, τρία (3) μέλη του πληρώματος, μεταξύ αυτών και ένας αξιωματικός, εξανάγκασαν τον Πλοίαρχο να αλλάξει την πορεία του πλοίου.","q":"Να περιγράψετε το ναυτικό αδίκημα στο οποίο υπέπεσαν τα τρία (3) μέλη του πληρώματος.","sol":"Τα 3 μέλη του πληρώματος διέπραξαν το αδίκημα της στάσης. Η στάση είναι ένα από τα βαρύτερα ειδικά ναυτικά αδικήματα. Προϋποθέτει την συμμετοχή περισσότερων του ενός προσώπων από αυτούς που επιβαίνουν στο πλοίο (μέλη του πληρώματος ή επιβάτες) που στρέφονται κατά της εξουσίας του Πλοιάρχου. Σκοπός της εξεγέρσεως δεν πρέπει να είναι απαραίτητα η ολοσχερής κατάλυση της εξουσίας του Πλοιάρχου. Η παρεμπόδισή του απλώς από την άσκηση ορισμένων μόνο καθηκόντων του, αποτελεί στάση κατά την έννοια του νόμου, όπως είχαμε εδώ με τον εξαναγκασμό του Πλοιάρχου να αλλάξει την πορεία του πλοίου."},{"id":"26320-Θβ","th":"26320","lab":"β","k":"calc","ty":"pr","secs":["Α14.3"],"p":15,"ctx":"Ο Πλοίαρχος του δεξαμενόπλοιου Δ/Ξ «MARIA» με ελληνική σημαία, ενημέρωσε τις αρμόδιες Αρχές για περιστατικό εξέγερσης στο πλοίο. Συγκεκριμένα, κατά τη διάρκεια του πλου, ανοικτά των ακτών του Καμερούν στον κόλπο της Δυτικής Αφρικής, τρία (3) μέλη του πληρώματος, μεταξύ αυτών και ένας αξιωματικός, εξανάγκασαν τον Πλοίαρχο να αλλάξει την πορεία του πλοίου.","q":"Να αναφέρετε τις ποινές που προβλέπονται για τα τρία (3) μέλη του πληρώματος.","sol":"Η στάση τιμωρείται με φυλάκιση τουλάχιστον τριών μηνών. Επειδή ένας από τους συμμετέχοντες είναι αξιωματικός του πλοίου, τιμωρείται αυστηρότερα, με ποινή καθείρξεως μέχρι δέκα ετών. Επίσης, ποινή καθείρξεως επιβάλλεται και όταν η πράξη τελεσθεί με βιαιοπραγίες ή με την χρήση όπλων.","note":"Η λύση της τράπεζας γράφει «τουλάχιστον τριών μηνών»· το βιβλίο (14.3) γράφει «τουλάχιστον τριών ετών»."},{"id":"26321-Θ","th":"26321","k":"calc","ty":"pr","secs":["Α5.1"],"p":25,"q":"Την 10 Μαΐου 2021 στις 20:00 προσέκρουσε το επιβατηγό – οχηματαγωγό ΕΓ/ΟΓ πλοίο «ΑΝΑΣΤΑΣΙΑ», ελληνικής σημαίας, κατά τη διαδικασία απόπλου και ενώ πραγματοποιούσε χειρισμούς μηχανής στον κυματοθραύστη του λιμένα Πατρών. Στην περιοχή επικρατούσαν δυσμενείς καιρικές συνθήκες. Το ανωτέρω πλοίο εκτελούσε προγραμματισμένο δρομολόγιο από Πάτρα για Μπάρι Ιταλίας. Από την πρόσκρουση προκλήθηκαν δύο (2) ρήγματα μήκους περίπου τριάντα (30) εκατοστών πάνω από την ίσαλο γραμμή, ενώ αναφέρθηκαν στρεβλώσεις εσωτερικά στην αριστερή πλευρά του πλοίου. Από το περιστατικό αναφέρθηκε ελαφρύς τραυματισμός στον ναύκληρο του πλοίου. Από το κεντρικό λιμεναρχείο Πάτρας απαγορεύτηκε προσωρινά ο απόπλους του ΕΓ/ΟΓ «ΑΝΑΣΤΑΣΙΑ». Με βάση το παραπάνω περιστατικό να συντάξετε, ως Πλοίαρχος του ΕΓ/ΟΓ «ΑΝΑΣΤΑΣΙΑ», περιεκτική έκθεση εκτάκτου συμβάντος.","sol":"Όταν λάβει χώρα κάποιο έκτακτο συμβάν που αφορά στο πλοίο, στους επιβαίνοντες ή στο φορτίο, ο Πλοίαρχος υποχρεούται, εκτός από την εγγραφή στο ημερολόγιο, να προβεί στη σύνταξη, μέσα σε 24 ώρες από τον κατάπλου του πλοίου σε λιμάνι, εκθέσεως, ενώπιων του προέδρου πρωτοδικών (εδώ της Πάτρας) και αν δεν υπάρχει, ενώπιων του ειρηνοδίκη. Στην έκθεση αυτή θα πρέπει να αναφέρονται το λιμάνι και ο χρόνος αναχωρήσεως του πλοίου, η τηρηθείσα πορεία, ποιοι κίνδυνοι αντιμετωπίστηκαν και όλα γενικά τα αξιοσημείωτα περιστατικά. Η έκθεση: Την 10 Μαΐου 2021 και ώρα 20.00, το επιβατηγό οχηματαγωγό ΕΓ/ΟΓ «ΑΝΑΣΤΑΣΙΑ», ελληνικής σημαίας, του οποίου είμαι Πλοίαρχος, κατά τη διαδικασία απόπλου και ενώ πραγματοποιούσα χειρισμούς μηχανής, προσέκρουσε στον κυματοθραύστη του λιμένα Πατρών. Στην περιοχή επικρατούσαν δυσμενείς καιρικές συνθήκες. Το πλοίο εκτελούσε προγραμματισμένο δρομολόγιο από Πάτρα για το Μπάρι της Ιταλίας. Από την πρόσκρουση προκλήθηκαν δύο (2) ρήγματα μήκους περίπου τριάντα (30) εκατοστών πάνω από την ίσαλο γραμμή, ενώ παρατηρήθηκαν στρεβλώσεις εσωτερικά στην αριστερή πλευρά του πλοίου. Από το περιστατικό προκλήθηκε ελαφρύς τραυματισμός του ναύκληρου του πλοίου. Κανένα άλλο περιστατικό ή συμβάν δεν μου αναφέρθηκε. Από το κεντρικό λιμεναρχείο Πάτρας απαγορεύτηκε προσωρινά ο απόπλους του πλοίου «ΑΝΑΣΤΑΣΙΑ»."},{"id":"26323-4.1","th":"26323","part":"4.1","k":"calc","secs":["Β4.7.1"],"p":10,"q":"Να αναφέρετε τους δύο (2) λόγους για τους οποίους η Διεθνούς Σύμβαση για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία(MARPOL) είναι Σύμβαση παγκόσμιας εμβέλειας.","sol":"Εφαρμόζεται σε όλες τις θαλάσσιες περιοχές χωρίς γεωγραφικούς περιορισμούς. Οι διαδικασίες υπογραφής, επικύρωσης και αποδοχής της Σύμβασης είναι ανοικτές σε οποιοδήποτε κράτος."},{"id":"26323-4.2α","th":"26323","part":"4.2","lab":"α","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με το Διεθνή Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ), να απαντήσετε στα εξής:","q":"Τι ονομάζεται εξουσιοδοτημένο πρόσωπο (Designated Person Ashore-DPA);","sol":"Ονομάζεται ένα πρόσωπο στην ξηρά με απευθείας πρόσβαση στο υψηλότερο κλιμάκιο της διευθύνσεως. Αυτό το πρόσωπο έχει την ευθύνη και εξουσιοδότηση να παρακολουθεί τα θέματα της ασφάλειας και της προλήψεως της ρυπάνσεως. Επίσης, πρέπει να εξασφαλίζει ότι παρέχονται επαρκείς πόροι, και εφόσον απαιτείται, επαρκής υποστήριξη από την ξηρά."},{"id":"26323-4.2β","th":"26323","part":"4.2","lab":"β","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με το Διεθνή Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ), να απαντήσετε στα εξής:","q":"Τι καλείται εταιρεία;","sol":"Εταιρεία καλείται ο ιδιοκτήτης του πλοίου ή οποιοδήποτε άλλος οργανισμός ή πρόσωπο, όπως είναι ο διαχειριστής ή ο ναυλωτής «γυμνού» πλοίου, που έχει από τον πλοιοκτήτη την ευθύνη για την λειτουργία του πλοίου και ο οποίος με την ανάληψη τέτοιας ευθύνης συμφώνησε να αναλάβει όλα τα καθήκοντα και την ευθύνη που επιβάλλεται από τον ΚΑΔ."},{"id":"26323-4.2γ","th":"26323","part":"4.2","lab":"γ","k":"calc","secs":["Β5.5.3"],"p":5,"ctx":"Σύμφωνα με το Διεθνή Κώδικα Ασφαλούς Διαχείρισης (ΚΑΔ), να απαντήσετε στα εξής:","q":"Τι ονομάζεται αρχή;","sol":"Αρχή ονομάζεται η κυβέρνηση της χώρας, τη σημαία της οποίας φέρει το πλοίο."},{"id":"26324-Θα","th":"26324","lab":"α","k":"calc","ty":"pr","secs":["Α28.1"],"p":15,"ctx":"Το ελληνικής σημαίας Φ/Γ πλοίο «ΕΥΣΤΡΑΤΙΟΣ.» κατευθυνόμενο από την ανοιχτή θάλασσα, μη έχοντας λάβει υπόψη τις προτάσεις και τις οδηγίες της επιτροπής ολογράφως (MSC) του (IMO) σχετικά με τις πειρατικές επιθέσεις, κατέπλευσε σε θαλάσσιο χώρο εντός της κρατικής δικαιοδοσίας της Νιγηρίας, όπου και δέχτηκε επίθεση από πλοιάριο, το πλήρωμα του οποίου απήγαγε τρεις (3) Έλληνες ναυτικούς.","q":"Να αιτιολογήσετε αν πρόκειται για πειρατεία ή όχι σύμφωνα με το άρθρο 101 της Διεθνούς Σύμβασης για το Δίκαιο της Θάλασσας.","sol":"ΔΕΝ πρόκειται για πειρατεία διότι η επίθεση από το πλοιάριο πραγματοποιήθηκε σε θάλασσα εντός κρατικής δικαιοδοσίας."},{"id":"26324-Θβ","th":"26324","lab":"β","k":"calc","ty":"pr","secs":["Β6.8"],"p":10,"ctx":"Το ελληνικής σημαίας Φ/Γ πλοίο «ΕΥΣΤΡΑΤΙΟΣ.» κατευθυνόμενο από την ανοιχτή θάλασσα, μη έχοντας λάβει υπόψη τις προτάσεις και τις οδηγίες της επιτροπής ολογράφως (MSC) του (IMO) σχετικά με τις πειρατικές επιθέσεις, κατέπλευσε σε θαλάσσιο χώρο εντός της κρατικής δικαιοδοσίας της Νιγηρίας, όπου και δέχτηκε επίθεση από πλοιάριο, το πλήρωμα του οποίου απήγαγε τρεις (3) Έλληνες ναυτικούς.","q":"Να αναφέρετε τέσσερα (4) μέτρα που αφορούν στο πλοίο και θα έπρεπε να είχαν ληφθεί σύμφωνα με τις προτάσεις και τις οδηγίες του Διεθνούς Ναυτιλιακού Οργανισμού (IMO) για τα πλοία που διέρχονται από περιοχές υψηλού κινδύνου.","sol":"Τέσσερα από τα παρακάτω: Οι κινήσεις του πληρώματος θα πρέπει να έχουν πάντα οπτική επαφή με τα περιβάλλοντα ύδατα, προκειμένου να εντοπίσουν και να προσδιορίσουν ύποπτα σκάφη. Η ταχύτητα του πλοίου πρέπει να είναι τουλάχιστο 18 knots. Η ενισχυμένη προστασία της γέφυρας. Η χρήση συρματοπλεγμάτων. Το σπρέι νερού και ο αφρός καθυστερούν τις επιθέσεις και εμποδίζουν να πλησιάσουν τα πειρατικά σκάφη πολύ κοντά στο πλοίο. Η πρόσληψη ενόπλων φρουρών."},{"id":"26325-Θα","th":"26325","lab":"α","k":"calc","ty":"pr","secs":["Α15.2"],"p":5,"ctx":"Στο ελληνικής σημαίας Δ/Ξ «ΧΡΥΣΗ» ο Πλοίαρχος ναυτολόγησε αντλιωρό, ο οποίος εξέτιε πειθαρχική ποινή προσωρινής στέρησης δικαιώματος ασκήσεως του ναυτικού επαγγέλματος, λόγω υπαίτιας ρύπανσης θαλάσσιου περιβάλλοντος για δεύτερη φορά την τελευταία τετραετία. Κατά τη βάρδια του αντλιωρού προκλήθηκε με υπαιτιότητά του ρύπανση του θαλάσσιου περιβάλλοντος.","q":"Σε ποιο πειθαρχικό παράπτωμα έχει υποπέσει ο Πλοίαρχος, σύμφωνα με τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ);","sol":"Ο Πλοίαρχος υπέπεσε στην παράνομη πρόσληψη στο πλοίο ναυτικού που έχει στερηθεί το δικαίωμα ασκήσεως του ναυτικού επαγγέλματος."},{"id":"26325-Θβ","th":"26325","lab":"β","k":"calc","ty":"pr","secs":["Α15.3"],"p":10,"ctx":"Στο ελληνικής σημαίας Δ/Ξ «ΧΡΥΣΗ» ο Πλοίαρχος ναυτολόγησε αντλιωρό, ο οποίος εξέτιε πειθαρχική ποινή προσωρινής στέρησης δικαιώματος ασκήσεως του ναυτικού επαγγέλματος, λόγω υπαίτιας ρύπανσης θαλάσσιου περιβάλλοντος για δεύτερη φορά την τελευταία τετραετία. Κατά τη βάρδια του αντλιωρού προκλήθηκε με υπαιτιότητά του ρύπανση του θαλάσσιου περιβάλλοντος.","q":"Να αναφέρετε και να αιτιολογήσετε ποια είναι η αντίστοιχη πειθαρχική ποινή.","sol":"Ο Πλοίαρχος θα αντιμετωπίσει την πειθαρχική ποινή της προσωρινής στερήσεως του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος, διότι ναυτολόγησε τον πειθαρχικώς τιμωρημένο αντλιωρό κατά το χρονικό διάστημα εκτίσεως της πειθαρχικής ποινής του."},{"id":"26325-Θγ","th":"26325","lab":"γ","k":"calc","ty":"pr","secs":["Α15.3"],"p":10,"ctx":"Στο ελληνικής σημαίας Δ/Ξ «ΧΡΥΣΗ» ο Πλοίαρχος ναυτολόγησε αντλιωρό, ο οποίος εξέτιε πειθαρχική ποινή προσωρινής στέρησης δικαιώματος ασκήσεως του ναυτικού επαγγέλματος, λόγω υπαίτιας ρύπανσης θαλάσσιου περιβάλλοντος για δεύτερη φορά την τελευταία τετραετία. Κατά τη βάρδια του αντλιωρού προκλήθηκε με υπαιτιότητά του ρύπανση του θαλάσσιου περιβάλλοντος.","q":"Να αναφέρετε και να αιτιολογήσετε ποια είναι η πειθαρχική ποινή του αντλιωρού, σύμφωνα με τον Κώδικα Δημοσίου Ναυτικού Δικαίου ΚΔΝΔ.","sol":"Ο αντλιωρός θα αντιμετωπίσει την πειθαρχική ποινή της οριστικής στερήσεως του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος. Ο λόγος είναι ότι είναι ήδη πειθαρχικώς τιμωρημένος για υπαίτια ρύπανση του θαλάσσιου περιβάλλοντος δύο φορές και διέπραξε για τρίτη φορά το ίδιο παράπτωμα μέσα στην πενταετία."},{"id":"26327-4.1","th":"26327","part":"4.1","k":"calc","ty":"pr","secs":["Α15.3"],"p":15,"q":"Ο ναυτικός «Σ.Π» έχει καταδικαστεί με αμετάκλητη δικαστική απόφαση σε φυλάκιση πέντε (5) μηνών για λαθρεμπόριο. Ποια πειθαρχική ποινή του επιβάλλεται και σε ποιο άρθρο του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ) αναφέρεται το συγκεκριμένο πειθαρχικό παράπτωμα;","sol":"Στο ναυτικό «Σ.Π» επιβάλλεται Προσωρινή στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος και το συγκεκριμένο πειθαρχικό παράπτωμα αναφέρεται περιοριστικά στο άρθρο 249 του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ)."},{"id":"26327-4.2","th":"26327","part":"4.2","k":"calc","ty":"pr","secs":["Α15.3"],"p":10,"q":"Ο ναυτικος «Σ.Π» εχει λάβει τιμωρία για δεύτερη φορά με προσωρινή στέρηση τουλάχιστον έξι (6) μηνών και διάπραξη για τρίτη φορά του ίδιου παραπτώματος μέσα σε δύο (2) χρόνια. Με ποιά πειθαρχική ποινή κινδυνεύει και σε ποιό άρθρο του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ) αναφέρεται το συγκεκριμένο πειθαρχικό παράπτωμα;","sol":"Στο ναυτικό «Σ.Π» επιβάλλεται Οριστική στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος και το συγκεκριμένο πειθαρχικό παράπτωμα αναφέρεται περιοριστικά στο άρθρο 250 του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ)."},{"id":"26328-4.1","th":"26328","part":"4.1","k":"calc","ty":"pr","secs":["Α16.1"],"p":12,"q":"Το Δεξαμενόπλοιο «AQUA» ελληνικής εθνικότητας,18 Ναυτικά Μίλια έξω από το λιμάνι της Τζέντα στην Σαουδική Αραβία παρουσίασε σοβαρή μηχανική βλάβη απ’ όπου προήλθε ακυβερνησία του πλοίου. Μετά από 3 ώρη προσπάθεια η βλάβη αποκαταστάθηκε. Σύμφωνα με το Νομοθετικό Διάταγμα 712/1970 “περί διοικητικού ελέγχου του ναυτικού ατυχήματος”, θεωρείτε ότι επρόκειτο για Ναυτικό Ατύχημα; (απαιτείται τεκμηρίωση)","sol":"Σύμφωνα με το Νομοθετικό Διάταγμα 712/1970 περί διοικητικού ελέγχου του ναυτικού ατυχήματος, δεν θεωρείται Ναυτικό Ατύχημα, διότι η βλάβη αποκαταστάθηκε σε σύντομο χρονικό διάστημα χωρίς να απαιτηθεί η χρησιμοποίηση ρυμουλκών."},{"id":"26328-4.2","th":"26328","part":"4.2","k":"calc","ty":"pr","secs":["Α16.1"],"p":13,"q":"Στο κρουαζιερόπλοιο «PEGASUS», κατά τη διάρκεια του βραδινού μπουφέ, 75χρόνος επιβάτης που δεν συνοδευόταν, αισθάνθηκε αδιαθεσία και κατέληξε. Ο γιατρός του πλοίου διέγνωσε καρδιακό επεισόδιο. Σύμφωνα με το Νομοθετικό Διάταγμα 712/1970 “περί διοικητικού ελέγχου του ναυτικού ατυχήματος”, θεωρείτε ότι επρόκειτο για Ναυτικό Ατύχημα; (απαιτείται τεκμηρίωση)","sol":"Σύμφωνα με το Νομοθετικό Διάταγμα 712/1970 περί διοικητικού ελέγχου του ναυτικού ατυχήματος, δεν θεωρείται Ναυτικό Ατύχημα, διοτι ο 75χρόνος κατέληξε από φυσικά αίτια σύμφωνα με τον Γιατρό του πλοίου."},{"id":"26329-Θα","th":"26329","lab":"α","k":"calc","ty":"pr","secs":["Α5.2"],"p":10,"ctx":"Στο επιβατηγό πλοίο «Νήσος Σάμος» μετά την αναχώρηση του από το λιμάνι της Χίου και με κατεύθυνση προς το λιμάνι του Πειραιά,πραγματοποιήθηκε Τοκετός από τον ίδιο τον Πλοίαρχο του πλοίου εν Πλω.","q":"Ποιες είναι οι ενέργειες που πρέπει να εκτελέσει ο Πλοίαρχος ως ληξίαρχος;","sol":"Σε περίπτωση τοκετού κατά τη διάρκεια του πλου, ο Πλοίαρχος οφείλει να συντάξει ληξιαρχική πράξη γεννήσεως, σύµφωνα µε τις ισχύουσες διατάξεις. Αν ο τοκετός πραγματοποιηθεί σε λιµάνι, τη ληξιαρχική πράξη γεννήσεως συντάσσει ο ληξίαρχος, αν πρόκειται για ελληνικό λιµάνι ή η ελληνική προξενική αρχή, σε λιµάνι του εξωτερικού<br>-Για τον τοκετό ο Πλοίαρχος οφείλει να προβεί σε εγγραφή και στο ημερολόγιο του πλοίου και να εκθέσει με λεπτομέρειες τις συνθήκες που έλαβε χώρα το περιστατικό.<br>-Την ληξιαρχική πράξη τοκετού ο Πλοίαρχος οφείλει να την παραδώσει στην Ελληνική λιμενική αρχή ή προξενική αρχή του πρώτου λιμανιού κατάπλου του πλοίου."},{"id":"26329-Θβ","th":"26329","lab":"β","k":"calc","ty":"pr","secs":["Α5.2"],"p":15,"ctx":"Στο επιβατηγό πλοίο «Νήσος Σάμος» μετά την αναχώρηση του από το λιμάνι της Χίου και με κατεύθυνση προς το λιμάνι του Πειραιά,πραγματοποιήθηκε Τοκετός από τον ίδιο τον Πλοίαρχο του πλοίου εν Πλω.","q":"Ποια είναι τα στοιχεία που πρέπει να περιλαμβάνει η ληξιαρχική πράξη του Πλοιάρχου;","sol":"Τα στοιχεία που περιλαμβάνει η ληξιαρχική πράξη του Πλοιάρχου είναι:<br>· Ημερομηνία Σύνταξης.<br>· Το όνομα και τα λοιπά στοιχεία αυτού που κάνει την δήλωση (πατέρα, μητέρας ή γιατρού).<br>· Την ημερομηνία και την ώρα του τοκετού.<br>· Το στίγμα του πλοίου.<br>· Το φύλο του νεογέννητου.<br>· Τα στοιχεία των γονέων.<br>· Δήλωση ότι διαβάσθηκε και βεβαιώθηκε από τους παριστάμενους.<br>· Υπογραφές του Πλοιάρχου,του δηλούντος και των μαρτύρων."},{"id":"26330-Θα","th":"26330","lab":"α","k":"calc","ty":"pr","secs":["Α16.1"],"p":10,"ctx":"Την 25 Απριλίου 2003, το Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων με προορισμό ελληνικό λιμάνι. Λίγο μετά τις 09:00 μ.μ. το πλοίο προσεγγίζει το λιμάνι άφιξης με ανέμους 8 μποφόρ. Ένα μίλι ανοικτά του λιμανιού, προσέκρουσε με ταχύτητα 10 κόμβων σε ύφαλο. Το νερό κατέκλυσε το μηχανοστάσιο του πλοίου, το οποίο πήρε γρήγορα κλίση προς τα δεξιά, αυτό είχε ως συνέπεια το πλοίο να μην μπορεί να κάνει χειρισμούς με αποτέλεσμα να σπεύσουν ρυμουλκά για βοήθεια. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Σύμφωνα με το νομοθετικό διάταγμα 712/1970 «περί διοικητικού ελέγχου του ναυτικού ατυχήματος», το συμβάν θεωρείται ναυτικό ατύχημα;","sol":"Το περιστατικό είναι Ναυτικό Ατύχημα σύμφωνα με το νομοθετικό διάταγμα 712/1970."},{"id":"26330-Θβ","th":"26330","lab":"β","k":"calc","ty":"pr","secs":["Α16.1"],"p":15,"ctx":"Την 25 Απριλίου 2003, το Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων με προορισμό ελληνικό λιμάνι. Λίγο μετά τις 09:00 μ.μ. το πλοίο προσεγγίζει το λιμάνι άφιξης με ανέμους 8 μποφόρ. Ένα μίλι ανοικτά του λιμανιού, προσέκρουσε με ταχύτητα 10 κόμβων σε ύφαλο. Το νερό κατέκλυσε το μηχανοστάσιο του πλοίου, το οποίο πήρε γρήγορα κλίση προς τα δεξιά, αυτό είχε ως συνέπεια το πλοίο να μην μπορεί να κάνει χειρισμούς με αποτέλεσμα να σπεύσουν ρυμουλκά για βοήθεια. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Ποια είναι η κατάσταση που επέφερε το συμβάν και τεκμηριώνει την προηγούμενη απάντησή σας;","sol":"Επειδή το συμβάν επέφερε την παρακάτω κατάσταση:<br>1. Σοβαρή βλάβη από την οποία επήλθε διαρκής ακυβερνησία του πλοίου, με αποτέλεσμα να χρειαστούν ρυμουλκά για την ρυμούλκηση του."},{"id":"26331-Θα","th":"26331","lab":"α","k":"calc","ty":"pr","secs":["Α14.3"],"p":15,"ctx":"Ο Πλοίαρχος του δεξαμενόπλοιου Δ/Ξ «Maria» με ελληνική σημαία, ενημέρωσε τις αρμόδιες Αρχές για περιστατικό αδικήματος κατα της ζωής του πλοιάρχου στο πλοίο. Συγκεκριμένα, κατά τη διάρκεια του πλου, ανοικτά των ακτών του Καμερούν στον κόλπο της Δυτικής Αφρικής, πέντε (5) μέλη του πληρώματος, μεταξύ αυτών και δυο αξιωματικοι, συμφώνησαν κατά της ζωής του Πλοιάρχου κατά την διάρκεια του βραδινού γεύματος. Στον μάγειρα του πλοίου υπέπεσε η συζήτηση και ενημέρωσε έγκαιρα τον πλοίαρχο ώστε να λάβει τα μέτρα του. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Ποιο είναι το ναυτικό αδίκημα που υπέπεσαν τα πέντε (5) μέλη του πληρώματος;","sol":"Το ναυτικό αδίκημα στο οποίο υπέπεσαν τα πέντε μέλη του πληρώματος είναι η Επιβουλή κατά του Πλοιάρχου και αποτελεί ένα από τα ναυτικά αδικήματα. Στην συγκεκριμένη περίπτωση τα πέντε μέλη του πληρώματος συναποφάσισαν αδίκημα κατα της ζωής του Πλοιάρχου. Το αδικημα της Επιβουλης συντελείται από την στιγμή που λαμβανεται η κοινή απόφαση τελέσεως των παράνομων πράξεων και δεν είναι απαραίτητο να εκδηλωθεί κάποια ενέργεια πρός το σκοπό αυτό."},{"id":"26331-Θβ","th":"26331","lab":"β","k":"calc","ty":"pr","secs":["Α14.3"],"p":10,"ctx":"Ο Πλοίαρχος του δεξαμενόπλοιου Δ/Ξ «Maria» με ελληνική σημαία, ενημέρωσε τις αρμόδιες Αρχές για περιστατικό αδικήματος κατα της ζωής του πλοιάρχου στο πλοίο. Συγκεκριμένα, κατά τη διάρκεια του πλου, ανοικτά των ακτών του Καμερούν στον κόλπο της Δυτικής Αφρικής, πέντε (5) μέλη του πληρώματος, μεταξύ αυτών και δυο αξιωματικοι, συμφώνησαν κατά της ζωής του Πλοιάρχου κατά την διάρκεια του βραδινού γεύματος. Στον μάγειρα του πλοίου υπέπεσε η συζήτηση και ενημέρωσε έγκαιρα τον πλοίαρχο ώστε να λάβει τα μέτρα του. Αφού μελετήσετε τα ανωτέρω, να απαντήσετε στα εξής:","q":"Ποιες είναι οι ποινές που προβλέπονται για τα πέντε (5) μέλη του πληρώματος;","sol":"Για τα πέντε μέλη του πληρώματος που διέπραξαν το αδίκημα της επιβουλής κατα του πλοιαρχού η ποινή φυλάκισης είναι τουλάχιστον ενός έτους. Ο μάγειρας απαλλάσεται από την ευθύνη και τις κατηγορίες διότι κατάγγειλε έγκαιρα την συμφωνία."},{"id":"26609-Θα","th":"26609","lab":"α","k":"calc","ty":"pr","secs":["Β3.2"],"p":10,"ctx":"Το φορτηγό πλοίο «ΑΘΑΝΑΣΙΟΣ Σ.» απέπλευσε από το λιμάνι της Ελευσίνας χωρίς έλεγχο από τις Αρχές. Στον δίαυλο μεταξύ Κυνοσούρας και Περάματος επιβιβάστηκαν οι Αρχές που διαπίστωσαν ότι στη Γέφυρα ήταν ο Δόκιμος Πλοίαρχος και ένας ναύτης. Ο Δόκιμος δε διέθετε τα προσόντα χειρισμού του εξοπλισμού για την ασφάλεια των ραδιοεπικοινωνιών. Ο Δόκιμος δήλωσε ότι ο Πλοίαρχος τού ανέθεσε καθήκοντα Τήρησης Φυλακής Γέφυρας, καθώς ο Ανθυποπλοίαρχος, που είχε ναυτολογηθεί, για να αντικαταστήσει τον προηγούμενο Ανθυποπλοίαρχο, ο οποίος νοσηλευόταν σε νοσοκομείο, δεν παρουσιάστηκε στο πλοίο.","q":"Σύμφωνα με την ολογράφως (STCW 1995), ποια έλλειψη διαπιστώνεται και ποια θα είναι η συνέπεια για το πλοίο λόγω της έλλειψης αυτής;","sol":"Σύμφωνα με την STCW 1995 διαπιστώνεται α) η έλλειψη ρυθμίσεων τηρήσεως φυλακής γέφυρας ή μηχανοστασίου σύμφωνα με τις απαιτήσεις που καθορίζονται από την Αρχή για το πλοίο και β) η απουσία κατά τη φυλακή ατόμου, το οποίο διαθέτει προσόντα χειρισμού του εξοπλισμού που είναι απαραίτητος για την ασφαλή ναυσιπλοΐα, ασφάλεια ραδιοεπικοινωνιών ή την πρόληψη θαλάσσιας ρυπάνσεως και αδυναμία τηρήσεως των φυλακών στο πλοίο από άτομα τα οποία έχουν αναπαυθεί επαρκώς και είναι ικανά να αναλάβουν καθήκοντα.<br>Συνεπώς τίθενται σε άμεσο κίνδυνο τα πρόσωπα, η περιουσία και το περιβάλλον και γι’ αυτό θα έπρεπε να απαγορευτεί ο απόπλους μέχρι τη ρύθμιση των προβλημάτων."},{"id":"26609-Θβ","th":"26609","lab":"β","k":"calc","ty":"pr","secs":["Α14.2"],"p":10,"ctx":"Το φορτηγό πλοίο «ΑΘΑΝΑΣΙΟΣ Σ.» απέπλευσε από το λιμάνι της Ελευσίνας χωρίς έλεγχο από τις Αρχές. Στον δίαυλο μεταξύ Κυνοσούρας και Περάματος επιβιβάστηκαν οι Αρχές που διαπίστωσαν ότι στη Γέφυρα ήταν ο Δόκιμος Πλοίαρχος και ένας ναύτης. Ο Δόκιμος δε διέθετε τα προσόντα χειρισμού του εξοπλισμού για την ασφάλεια των ραδιοεπικοινωνιών. Ο Δόκιμος δήλωσε ότι ο Πλοίαρχος τού ανέθεσε καθήκοντα Τήρησης Φυλακής Γέφυρας, καθώς ο Ανθυποπλοίαρχος, που είχε ναυτολογηθεί, για να αντικαταστήσει τον προηγούμενο Ανθυποπλοίαρχο, ο οποίος νοσηλευόταν σε νοσοκομείο, δεν παρουσιάστηκε στο πλοίο.","q":"Να αναφέρετε τα δύο ναυτικά αδικήματα στα οποία έχει υποπέσει ο Πλοίαρχος και να προσδιορίσετε την κατηγορία που υπάγεται καθένα απ’ αυτά.","sol":"Τα δύο ναυτικά αδικήματα στα οποία έχει υποπέσει ο Πλοίαρχος είναι:<br>1. Ο πλους με ελλιπή σύνθεση (λείπει ο ανθυποπλοίαρχος).<br>2. Απόπλους χωρίς έλεγχο της αρχής.<br>Και τα 2 αδικήματα ανήκουν στην κατηγορία των υπηρεσιακών παραβάσεων του Πλοιάρχου."},{"id":"26609-Θγ","th":"26609","lab":"γ","k":"calc","ty":"pr","secs":["Α14.3"],"p":5,"ctx":"Το φορτηγό πλοίο «ΑΘΑΝΑΣΙΟΣ Σ.» απέπλευσε από το λιμάνι της Ελευσίνας χωρίς έλεγχο από τις Αρχές. Στον δίαυλο μεταξύ Κυνοσούρας και Περάματος επιβιβάστηκαν οι Αρχές που διαπίστωσαν ότι στη Γέφυρα ήταν ο Δόκιμος Πλοίαρχος και ένας ναύτης. Ο Δόκιμος δε διέθετε τα προσόντα χειρισμού του εξοπλισμού για την ασφάλεια των ραδιοεπικοινωνιών. Ο Δόκιμος δήλωσε ότι ο Πλοίαρχος τού ανέθεσε καθήκοντα Τήρησης Φυλακής Γέφυρας, καθώς ο Ανθυποπλοίαρχος, που είχε ναυτολογηθεί, για να αντικαταστήσει τον προηγούμενο Ανθυποπλοίαρχο, ο οποίος νοσηλευόταν σε νοσοκομείο, δεν παρουσιάστηκε στο πλοίο.","q":"Να αναφέρετε το ναυτικό αδίκημα, το οποίο στρέφεται κατά της υπηρεσίας του πλοίου, που έχει υποπέσει ο Ανθυποπλοίαρχος και την προβλεπόμενη ποινή για το συγκεκριμένο αδίκημα.","sol":"Το αδίκημα στο οποίο υπέπεσε είναι αυτό της μη προσέλευσης για ανάληψη υπηρεσίας. Τιμωρείται με φυλάκιση μέχρι έξι μηνών ή χρηματική ποινή."},{"id":"26610-4.1","th":"26610","part":"4.1","k":"calc","secs":["Β4.7.1"],"p":15,"q":"Να αναφέρετε τρεις (3) από τις έξι (6) διαφορές της Διεθνούς Συμβάσεως για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία(MARPOL) με την πρώτη Σύμβαση για την Πρόληψη της Ρυπάνσεως της θάλασσας από Πετρέλαιο (OILPOL, 1954) και τις τροποποιήσεις των ετών 1962 και 1969.","sol":"Τρεις από τις παρακάτω διαφορές:<br>1) Στην επανακαθιέρωση ειδικών περιοχών (Μεσόγειος, Βαλτική, Μαύρη Θάλασσα, Ερυθρά Θάλασσα και Περσικός Κόλπος) σύμφωνα με το άρθρο 10 (βρίσκονται ήδη υπό καθεστώς προστασίας).<br>2) Καμία απόρριψη πετρελαίου δεν επιτρέπεται σε αυτές τις περιοχές ακόμη και για τα Δ/Ξ που λειτουργούν με το σύστημα LOT· καθιερώνει τα συστήματα SBT, COW, διαχωριστήρα νερού πετρελαίου, επαρκείς δεξαμενές καταλοίπων και αδρανούς αερίου (IGS).<br>3) Καλύπτει όλες τις μορφές ρυπάνσεως της θάλασσας από τα εμπορικά πλοία και δεν περιορίζεται μόνο στο πετρέλαιο.<br>4) Προβλέπει μέτρα για την αποφυγή ή τον περιορισμό της ρυπάνσεως, που είναι δυνατόν να προκληθεί από ατυχήματα πλοίων.<br>5) Τα Δ/Ξ από 150 GRT και πάνω, καθώς και όλα τα άλλα πλοία από 400 GRT υπόκεινται σε επιθεωρήσεις με σκοπό να τους χορηγηθεί το Πιστοποιητικό για την Αποφυγή της Ρυπάνσεως από Πετρέλαιο (IOPPC).<br>6) Υποχρεώνει τα παράκτια κράτη και ιδιαίτερα αυτά που βρίσκονται μέσα σε ειδικές περιοχές να εγκαταστήσουν στα λιμάνια τους ΕΥΚ.","note":"Η λύση της τράπεζας γράφει δύο φορές την ίδια διαφορά· εδώ οι έξι διαφορές όπως στο βιβλίο."},{"id":"26610-4.2","th":"26610","part":"4.2","k":"calc","secs":["Β4.7.2"],"p":10,"q":"Να αναφέρετε, ονομαστικά,τις πέντε (5) ειδικές περιοχές σύμφωνα με το παράρτημα I της Διεθνούς Σύμβασης για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL).","sol":"Πέντε από τις παρακάτω: Μεσόγειος, Βαλτική θάλασσα, Μαύρη θάλασσα, Ερυθρά θάλασσα, Θαλάσσια περιοχή Κόλπων (Περσικός και Ομάν). Μοναδες 10"},{"id":"28708-Θα","th":"28708","lab":"α","k":"calc","ty":"pr","secs":["Α14.3"],"p":15,"ctx":"Κατά την άφιξη του πλοίου \"AQUA\" στο αγκυροβόλιο του Πειραιά στη θαλάσσια περιοχή του Σαρωνικού Κόλπου, ο Πλοίαρχος απουσίαζε αδικαιολόγητα από τη γέφυρα για αδιευκρίνιστους λόγους, ενώ ο Ανθυποπλοίαρχος είχε τη διακυβέρνηση του πλοίου.","q":"Σύμφωνα με τα αδικήματα που αφορούν στην Υπηρεσία στο πλοίο, ο Πλοίαρχος διέπραξε το αδίκημα της εγκατάλειψης θέσεως; (απαιτείται τεκμηρίωση)","sol":"Σύμφωνα με την κατηγορία των αδικημάτων που αφορούν στην Υπηρεσία στο πλοίο ο Πλοίαρχος δεν έχει υποπέσει στο συγκεκριμένο ναυτικό αδίκημα διότι διαπράττετε από μέλος του πληρώματος άλλα όχι από τον Πλοίαρχο. Όχι, ο Πλοίαρχος δεν διέπραξε το αδίκημα της εγκαταλείψεως θέσεως, καθώς δεν αποτελεί μέλος πληρώματος."},{"id":"28708-Θβ","th":"28708","lab":"β","k":"calc","ty":"pr","secs":["Α14.2"],"p":10,"ctx":"Κατά την άφιξη του πλοίου \"AQUA\" στο αγκυροβόλιο του Πειραιά στη θαλάσσια περιοχή του Σαρωνικού Κόλπου, ο Πλοίαρχος απουσίαζε αδικαιολόγητα από τη γέφυρα για αδιευκρίνιστους λόγους, ενώ ο Ανθυποπλοίαρχος είχε τη διακυβέρνηση του πλοίου.","q":"Να προσδιορίσετε την κατηγορία του ναυτικού αδικήματος που διέπραξε ο Πλοίαρχος.","sol":"Η κατηγορία του ναυτικού αδικήματος που έχει υποπέσει ο Πλοίαρχος είναι σε αυτό που στρέφεται κατά της ασφάλειας του πλοίου και των επιβαινόντων. Ο Πλοίαρχος διέπραξε αδίκημα που στρέφεται κατά της ασφάλειας του πλοίου και των επιβαινόντων και συγκεκριμένα τη μη αυτοπρόσωπη διεύθυνση του πλοίου."},{"id":"28709-Θα","th":"28709","lab":"α","k":"calc","ty":"pr","secs":["Α14.3"],"p":10,"ctx":"Στο ΕΓ/ΟΓ πλοίο «DIAMOND», στη διάρκεια διεξαγωγής υπηρεσίας κατά φυλακές στο κατάστρωμα του πλοίου ένας ναύτης απουσίαζε από την υπεύθυνη υπηρεσία του. Ο ναύτης βρέθηκε στην καμπίνα του να κοιμάται, κατόπιν σχετικού ελέγχου.","q":"Ποιο ναυτικό αδίκημα διέπραξε ο δράστης και πως τιμωρείται;","sol":"Ο ναύτης διέπραξε το ναυτικό αδίκημα της παράνομης απουσίας και τιμωρείται με φυλάκιση μέχρι τριών μηνών."},{"id":"28709-Θβ","th":"28709","lab":"β","k":"calc","ty":"pr","secs":["Α14.2"],"p":5,"ctx":"Στο ΕΓ/ΟΓ πλοίο «DIAMOND», στη διάρκεια διεξαγωγής υπηρεσίας κατά φυλακές στο κατάστρωμα του πλοίου ένας ναύτης απουσίαζε από την υπεύθυνη υπηρεσία του. Ο ναύτης βρέθηκε στην καμπίνα του να κοιμάται, κατόπιν σχετικού ελέγχου.","q":"Σε ποια κατηγορία ναυτικών αδικημάτων κατατάσσεται το συγκεκριμένο αδίκημα;","sol":"Το συγκεκριμένο ναυτικό αδίκημα ανήκει στην κατηγορία αυτών που αφορούν στην υπηρεσία στο πλοίο."},{"id":"28709-Θγ","th":"28709","lab":"γ","k":"calc","ty":"pr","secs":["Α14.3"],"p":10,"ctx":"Στο ΕΓ/ΟΓ πλοίο «DIAMOND», στη διάρκεια διεξαγωγής υπηρεσίας κατά φυλακές στο κατάστρωμα του πλοίου ένας ναύτης απουσίαζε από την υπεύθυνη υπηρεσία του. Ο ναύτης βρέθηκε στην καμπίνα του να κοιμάται, κατόπιν σχετικού ελέγχου.","q":"Να αναφέρετε δύο ακόμη ναυτικά αδικήματα που στρέφονται κατά της υπηρεσίας του πλοίου με τις αντίστοιχες ποινές φυλάκισης.","sol":"Δύο από τα εξής:<br>1. Εγκατάλειψη θέσεως. Ο δράστης τιμωρείται με φυλάκιση μέχρι έξι μηνών.<br>2. Λιποταξία. Ο δράστης τιμωρείται με φυλάκιση μέχρι ενός έτους.<br>3. Μη προσέλευση για ανάληψη Υπηρεσίας. Ο δράστης τιμωρείται με φυλάκιση μέχρι έξι μηνών."},{"id":"28710-4.1","th":"28710","part":"4.1","k":"calc","secs":["Β4.7.3"],"p":15,"q":"Ποιοι ήταν οι κυριότεροι λόγοι που οδήγησαν στη σύγκληση της Συνδιασκέψεως για την Ασφάλεια των Δ/Ξ και την Πρόληψη της Ρυπάνσεως (TSPP);","sol":"Οι κυριότεροι λόγοι που οδήγησαν στη σύγκληση της Συνδιασκέψεως για την ασφάλεια των Δ/Ξ και την πρόληψη της ρυπάνσεως (TSPP) το 1978, δεν ήταν τόσο οι διαδικασίες επισπεύσεως του σταδίου επικυρώσεως της Διεθνούς Σύμβασης για την Πρόληψη της Θαλάσσιας Ρυπάνσεως από τα Πλοία (MARPOL), αλλά αυτό που ονομάζεται Μαύρη Περίοδος για την αγορά των Δ/Ξ. Σε περίοδο δυο μηνών (Δεκέμβριος 1976-Ιανουάριος 1977) συνέβησαν μια σειρά από τα σοβαρότερα ατυχήματα Δ/Ξ, τα περισσότερα πλησίον των ακτών των ΗΠΑ, εξαιτίας ανθρώπινου λάθους ή αμέλειας, τα οποία προκάλεσαν σοβαρή ρύπανση και τύχαν εκτεταμένης καλύψεως από τα μέσα ενημερώσεως."},{"id":"28710-4.2","th":"28710","part":"4.2","k":"calc","secs":["Β4.7.3"],"p":10,"q":"Η ενδεχόμενη απειλή ψηφίσεως νέου εθνικού νόμου από την πλευρά των ΗΠΑ (που τελικά έγινε με την εμφάνιση του ΟPA 1990) οδήγησε τον Διεθνή Ναυτιλιακό Οργανισμό (ΙΜΟ) στη σύγκληση της Συνδιασκέψεως για την Ασφάλεια των Δ/Ξ και την Πρόληψη της Ρυπάνσεως (TSPP). Τι αποφασίστηκε στην συνδιάσκεψη TSPP που συγκάλεσε ο IMO τον Φεβρουάριο του 1978;","sol":"Αποφασίστηκε τα νέα μέτρα να ενσωματωθούν στα Πρωτόκολλα των MARPOL και SOLAS. Έτσι εξηγείται η καθιέρωση της νέας ονομασίας των εν λόγω Συμβάσεων σε MARPL 1973/1978 και SOLAS 1974/1978."},{"id":"28711-Θα","th":"28711","lab":"α","k":"calc","ty":"pr","secs":["Α28.1"],"p":10,"ctx":"Στις 10 Απριλίου 2022, Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων και προορισμό ελληνικό λιμένα. Λίγο μετά τις 10:00 μ.μ. το πλοίο προσεγγίζει την Διώρυγα της Κορίνθου και 10ν.μ. πριν την άφιξη του πλοίου στο λιμάνι, εντός των χωρικών υδάτων της Ελλάδος, πέντε μέλη του πληρώματος, προκαλώντας φθορές σε εξοπλισμό, κατέλαβαν το πλοίο για ιδιωτικούς σκοπούς.","q":"Η συγκεκριμένη παράνομη πράξη νοείται ως πειρατεία; (απαιτείται τεκμηρίωση)","sol":"Σύμφωνα με το άρθρο 101 της Συμβάσεως Δικαίου της Θάλασσας (ΔΘ), η συγκεκριμένη παράνομη πράξη δεν θεωρείται πειρατεία, αφενός, επειδή το πλοίο δεν κατευθύνεται στην ανοιχτή θάλασσα, αφετέρου, επειδή το πλοίο βρίσκεται σε χώρο εντός χωρικών υδάτων."},{"id":"28711-Θβ","th":"28711","lab":"β","k":"calc","ty":"pr","secs":["Α14.2","Α14.3"],"p":15,"ctx":"Στις 10 Απριλίου 2022, Ε/Γ RoRo πλοίο με ελληνική σημαία αναχώρησε από λιμάνι της αλλοδαπής με μεγάλο αριθμό επιβαινόντων και προορισμό ελληνικό λιμένα. Λίγο μετά τις 10:00 μ.μ. το πλοίο προσεγγίζει την Διώρυγα της Κορίνθου και 10ν.μ. πριν την άφιξη του πλοίου στο λιμάνι, εντός των χωρικών υδάτων της Ελλάδος, πέντε μέλη του πληρώματος, προκαλώντας φθορές σε εξοπλισμό, κατέλαβαν το πλοίο για ιδιωτικούς σκοπούς.","q":"Έχουν διαπράξει τα συμμετέχοντα μέλη του πληρώματος κάποιο ναυτικό αδίκημα; (απαιτείται τεκμηρίωση)","sol":"Τα μέλη του πληρώματος διέπραξαν, αφενός, ναυτικό αδίκημα που στρέφεται κατά της ιδιοκτησίας του πλοίου, επειδή προκάλεσαν φθορά σε εξοπλισμό του πλοίου, αφετέρου, συμμετείχαν σε στάση, επειδή στράφηκαν κατά της εξουσίας του Πλοιάρχου."},{"id":"28712-4.1","th":"28712","part":"4.1","k":"calc","secs":["Β4.8"],"p":10,"q":"Το ατύχημα του EXXON VALDEZ ήταν η αφορμή να δημιουργηθεί και να τεθεί επίσημα σε ισχύ ένας συγκεκριμένος Νόμος. Να προσδιορίσετε τον Νόμο.","sol":"Το ατύχημα του EXXON VALDEZ ήταν η αφορμή ώστε να δημιουργηθεί και να υπογραφεί από τον Πρόεδρο Bush ο Νόμος περί πετρελαϊκής ρύπανσης (Oil Pollution Act-OPA) του 1990, ο οποίος έγινε Νόμος του κράτους των ΗΠΑ το 1991 και τέθηκε σε ισχύ το 1994."},{"id":"28712-4.2","th":"28712","part":"4.2","k":"calc","secs":["Β4.8"],"p":15,"q":"Να αναφέρετε τις κύριες αιτίες που θεωρήθηκαν οι πλέον κρίσιμες για το ατύχημα του EXXON VALDEZ.","sol":"Οι κύριες αιτίες ήταν οι εξής:<br>1. Ο τρίτος αξιωματικός απέτυχε να κάνει τους απαραίτητους ελέγχους,πιθανόν επειδή ήταν καταβεβλημένος από κούραση και υπερβολικό φόρτο εργασίας.<br>2. Ο πλοίαρχος απέτυχε να ασκήσει σωστά τα καθήκοντα του σχετικά με τη ναυσιπλοΐα λόγω προβλημάτων με το αλκοόλ.<br>3. Η εταιρεία (Exxon Shipping Company) απέτυχε να επιβλέψει τον πλοίαρχο και να προσφέρει ένα ξεκούραστο και επαρκές πλήρωμα για το Δ/Ξ.<br>4. Η Αμερικάνικη ακτοφυλακή (US coastguard) απέτυχε να παρέχει ένα αποτελεσματικό σύστημα κυκλοφορίας των πλοίων.<br>5. Αποτελεσματική πλοήγηση και παροχή συνοδείας δεν υπήρχαν."},{"id":"28713-4.1","th":"28713","part":"4.1","k":"calc","ty":"pr","secs":["Α15.2"],"p":10,"q":"Ο Πλοίαρχος του πλοίου «ΜARIA» ναυτολογεί τον «Μ.Κ» ως Γ΄ Μηχανικό, ο οποίος δεν έχει τα απαιτούμενα για τη θέση που προσλαμβάνεται προσόντα. Σύμφωνα με τα άρθρα 246 και 247 του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ), συνιστά η συγκεκριμένη πράξη πειθαρχικό παράπτωμα του Πλοιάρχου;","sol":"Ναι, σύμφωνα με τα άρθρα 246 και 247 του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ), η παράνομη πρόσληψη στο πλοίου προσώπου που δεν έχει τα απαιτούμενα για τη θέση του προσλαμβάνεται συνιστά πειθαρχικό παράπτωμα του Πλοιάρχου."},{"id":"28713-4.2α","th":"28713","part":"4.2","lab":"α","k":"calc","ty":"pr","secs":["Α15.3"],"p":6,"ctx":"Κατά τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ):","q":"Να αναφέρετε ονομαστικά τις πειθαρχικές ποινές των ναυτικών.","sol":"Συμφωνα με τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ) οι Πειθαρχικές ποινές είναι οι εξής:<br>1. Επίπληξη<br>2. Πρόστιμο<br>3. Προσωρινή ή οριστική στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος"},{"id":"28713-4.2β","th":"28713","part":"4.2","lab":"β","k":"calc","ty":"pr","secs":["Α15.3"],"p":9,"ctx":"Κατά τον Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ):","q":"Σύμφωνα με το άρθρο 250, να προσδιορίσετε την πειθαρχική ποινή που επιβάλλουν τα πειθαρχικά συμβούλια και να αναφέρετε δύο (2) λόγους για τους οποίους επιβάλλεται η συγκεκριμένη πειθαρχική ποινή.","sol":"Σύμφωνα με το άρθρο 250 του Κώδικα Δημοσίου Ναυτικού Δικαίου (ΚΔΝΔ), η πειθαρχική ποινή που επιβάλλουν τα πειθαρχικά συμβούλια και συνεπάγεται τη διαγραφή του τιμωρηθέντος ναυτικού από τα μητρώα των ναυτικών, όταν η απόφαση καταστεί αμετάκλητη, είναι η οριστική στέρηση του δικαιώματος ασκήσεως του ναυτικού επαγγέλματος. Οι λόγοι για τους οποίους και μόνο επιβάλλεται η οριστική στέρηση είναι (δύο από τους εξής):<br>1. Ναυτικό ατύχημα που κρίθηκε από το Ανακριτικό Συμβούλιο Ναυτικών Ατυχημάτων (ΑΣΝΑ) οτι οφείλεται σε δόλο ή σε βαριά αμέλεια, εφόσον εξαιτίας του ατυχήματος επήλθε ολική απώλεια του πλοίου, πραγματική ή τεκμαρτή, θάνατος ή βαριά σωματική βλάβη ανθρώπων.<br>2. Τιμωρία για δεύτερη φορά με προσωρινή στέρηση τουλάχιστον έξι μηνών και διάπραξη για τρίτη φορά του ίδιου παραπτώματος, μέσα στην πενταετία.<br>3. Καταδίκη του ναυτικού για αμετάκλητη δικαστική απόφαση για λαθρεμπόριο ή παράβαση του νόμου περί ναρκωτικών, σε ποινή άνω των έξι μηνών.<br>4. Αμετάκλητη καταδίκη σε ποινή φυλακίσεως τουλάχιστον ενός έτους, όταν τα αίτια της καταδίκης, το είδος, ο τρόπος και η φύση της πράξης μαρτυρούν διαστροφή χαρακτήρα.<br>5. Αμετάκλητη καταδίκη Πλοιάρχου λόγω μη αποχωρήσεως τελευταίου κατά την εγκατάλειψη κινδυνεύοντος πλοίου ή για άκαιρη απομάκρυνση από τον τόπο συγκρούσεως του πλοίου.<br>6. Κάθε περίπτωση που προβλέπεται από ειδική διάταξη."},{"id":"28714-Θα","th":"28714","lab":"α","k":"calc","ty":"pr","secs":["Β6.1"],"p":15,"ctx":"Το ελληνικό πλοίο CHIOS FREEDOM δέχθηκε επίθεση στη θαλάσσια περιοχή ανοιχτά της πόλης Fujaira, στα Ηνωμένα Αραβικά Εμιράτα, στον Κόλπο του Ομάν (2018).","q":"Να αναφέρετε τους κύριους στόχους των μέτρων ασφαλείας, σύμφωνα με τον Διεθνή Κώδικα για την ασφάλεια των πλοίων και των λιμενικών εγκαταστάσεων (ISPS).","sol":"Οι κύριοι στόχοι των μέτρων ασφαλείας σύμφωνα με τον Διεθνή Κώδικα για την ασφάλεια των πλοίων και των λιμενικών εγκαταστάσεων (ISPS) είναι οι εξής:<br>1. Συνειδητοποίηση: Είναι το πρώτο κρίσιμο βημα, ώστε να εμποδισθούν πράξεις που απειλούν το πλοίο και λιμενική εγκατάσταση, ενθαρρύνοντας το προσωπικό να συνειδητοποιήσει ότι πρέπει πλέον να είναι συνεχώς σε εγρήγορση στο περιβάλλον, μέσα στο οποίο λειτουργεί.<br>2. Μέτρα Προλήψεως: Έχουν σχεδιασθεί, ώστε να αποτρέπουν και να δυσκολεύουν κάθε παράνομη προσπάθεια ανόδου στο πλοίο ατόμων, όπλων και εκρηκτικών.<br>3. Αντιμετώπιση: Είναι η ετοιμότητα του προσωπικού του πλοίου και της λιμενικής εγκαταστάσεως να αποκρούση κάθε απειλή κατα της ασφάλειας του πλοίου, της λιμενικής εγκαταστάσεως και άλλων πλοίων στην περιοχή ελέγχου της.<br>4. Διαχείριση των επακολούθων: Είναι η ικανότητα του προσωπικού του πλοίου και της λιμενικής εγκαταστάσεως να διαχειρισθεί σωστά και να περιορίσει σε εύλογο χρονικό διάστημα τις επιπτώσεις ενεργειών κατά της ασφάλειας του πλοίου και της λιμενικής εγκαταστάσεως."},{"id":"28714-Θβ","th":"28714","lab":"β","k":"calc","ty":"pr","secs":["Β6.8"],"p":10,"ctx":"Το ελληνικό πλοίο CHIOS FREEDOM δέχθηκε επίθεση στη θαλάσσια περιοχή ανοιχτά της πόλης Fujaira, στα Ηνωμένα Αραβικά Εμιράτα, στον Κόλπο του Ομάν (2018).","q":"Να αναφέρετε ονομαστικά τις προτάσεις και τις οδηγίες του Διεθνή Ναυτιλιακού Οργανισμού (ΙΜΟ) για την πρόληψη τέτοιων ενεργειών.","sol":"Οι προτάσεις και οι οδηγίες του Διεθνή Ναυτιλιακού Οργανισμού (ΙΜΟ) για την πρόληψη τέτοιων ενεργειών είναι οι εξής:<br>1. Προληπτικά μέτρα της εταιρείας πριν το ταξίδι.<br>2. Μέτρα με την είσοδο στις περιοχές υψηλού κινδύνου.<br>3. Μέτρα που αφορούν στο πλοίο."},{"id":"28715-Θα","th":"28715","lab":"α","k":"calc","ty":"pr","secs":["Β5.5.5"],"p":15,"ctx":"Το ναυάγιο του Δ/Ξ «ΑΓΙΑ ΖΩΝΗ ΙΙ» τον Σεπτέμβριο του 2017 προκάλεσε πολύ σοβαρή θαλάσσια ρύπανση στον Αργοσαρωνικό. Σημειώνεται ότι Πλοίαρχος και ο Α΄ Μηχανικός του πλοίου συνελήφθησαν για πρόκληση ναυαγίου από αμέλεια και προσήχθησαν στο Κεντρικό Λιμεναρχείο Πειραιά, όπου τελικά αφέθηκαν προσωρινά ελεύθεροι με εντολή εισαγγελέα έως ότου οριστεί τακτική δικάσιμος. Σύμφωνα με το πόρισμα του Γ' Ανακριτικού Συμβουλίου Ναυτικών Ατυχημάτων (ΑΣΝΑ), το συμβάν δεν θεωρήθηκε ναυτικό ατύχημα.","q":"Τι προβλέπει ο Διεθνής Κώδικας Ασφαλούς Διαχειρίσεως (ISM Code) σχετικά με την ευθύνη και δικαιοδοσία του Πλοιάρχου;","sol":"Σχετικά με την ευθύνη και δικαιοδοσία του Πλοιάρχου επισημαίνεται από τον Κώδικα ISM ότι “Η εταιρεία θα πρέπει να καθορίζει σαφώς και να τεκμηριώνει την ευθύνη του Πλοιάρχου σχετικά με την”:<br>1. Εφαρμογή της πολιτικής ασφάλειας και περιβαλλοντικής προστασίας της εταιρείας.<br>2. Παρακίνηση του πληρώματος στην τήρηση αυτής της πολιτικής.<br>3. Έκδοση κατάλληλων εντολών και οδηγιών κατά σαφή και απλό τρόπο.<br>4. Επαλήθευση ότι τηρούνται οι καθορισμένες απαιτήσεις.<br>5. Αναθεώρηση του Συστήματος Ασφαλούς Διαχείρισης (ΣΑΔ) και αναφορά των ελλείψεων του προς τη διοίκηση της εταιρείας στην ξηρά."},{"id":"28715-Θβ","th":"28715","lab":"β","k":"calc","ty":"pr","secs":["Β3.2"],"p":10,"ctx":"Το ναυάγιο του Δ/Ξ «ΑΓΙΑ ΖΩΝΗ ΙΙ» τον Σεπτέμβριο του 2017 προκάλεσε πολύ σοβαρή θαλάσσια ρύπανση στον Αργοσαρωνικό. Σημειώνεται ότι Πλοίαρχος και ο Α΄ Μηχανικός του πλοίου συνελήφθησαν για πρόκληση ναυαγίου από αμέλεια και προσήχθησαν στο Κεντρικό Λιμεναρχείο Πειραιά, όπου τελικά αφέθηκαν προσωρινά ελεύθεροι με εντολή εισαγγελέα έως ότου οριστεί τακτική δικάσιμος. Σύμφωνα με το πόρισμα του Γ' Ανακριτικού Συμβουλίου Ναυτικών Ατυχημάτων (ΑΣΝΑ), το συμβάν δεν θεωρήθηκε ναυτικό ατύχημα.","q":"Ποιες διατάξεις περιλαμβάνονται ειδικά στο Κεφάλαιο 5 της Διεθνούς Σύμβασης για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW 1995), οι οποίες αφορούν στα πληρώματα που απασχολούνται σε Δ/Ξ;","sol":"Πλοίαρχοι ή άλλοι Αξιωματικοί με την ευθύνη της φορτώσεως,..άλλο πρόσωπο με την άμεση ευθύνη της φορτώσεως, εκφορτώσεως και μεταφοράς φορτίου πρέπει να διαθέτουν (α) σχετική εμπειρία σύμφωνα με τα καθήκοντα τους σε δεξαμενόπλοια (β) εκπλήρωση ειδικού εκπαιδευτικού προγράμματος που αναφέρεται σε θέματα ασφάλειας δεξαμενμοπλοίων, συστήματα προστασίας από την πυρκαγιά, πρόληψης και ελέγχου της ρύπανσης, λειτουργικές πρακτικές και υποχρεώσεις σύμφωνα με τους εφαρμοστέους κανονισμούς."},{"id":"28716-4.1","th":"28716","part":"4.1","k":"calc","secs":["Α28.1"],"p":10,"q":"Τι νοείται ως πειρατεία, σύμφωνα με το άρθρο 101 της Σύμβασης του Δικαίου της Θάλασσας;","sol":"Σύμφωνα με το άρθρο 101 της Σύμβασης του Δικαίου της Θάλασσας, ως πειρατεία νοείται: α) Κάθε παράνομη πράξη βίας ή κρατήσεως ή κάθε πράξη διαρπαγής που διαπράττεται για ιδιωτικούς σκοπούς από το πλήρωμα ή τους επιβάτες ιδιωτικού πλοίου και που κατευθύνεται πρώτον στην ανοιχτή θάλασσα, εναντίον άλλου πλοίου ή εναντίον προσώπου ή περιουσιακών στοιχείων πάνω στο πλοίο αυτό και δεύτερον σε τόπο εκτός κρατικής δικαιοδοσίας, εναντίον πλοίου, προσώπων ή περιουσιακών στοιχείων. β) Κάθε πράξης εκούσιας συμμετοχής στη λειτουργία ενός πλοίου ή αεροσκάφους με γνώση των γεγονότων που καθιστούν το πλοίο ή το αεροσκάφος αυτό πειρατικό. γ) Κάθε πράξη υποκινήσεως ή σκόπιμης διευκολύνσεως πράξεως, που συνιστά πειρατεία."},{"id":"28716-4.2","th":"28716","part":"4.2","k":"calc","secs":["Β3.1"],"p":15,"q":"Ποιος είναι ο σκοπός κατάρτισης της Διεθνούς Σύμβασης για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (STCW 1978).","sol":"Ο σκοπός της κατάρτισης της Σύμβαση για τα πρότυπα πιστοποιητικών εκπαιδεύσεως και τηρήσεως φυλακών των ναυτικών (STCW 1978) ήταν η καθιέρωση διεθνώς υποχρεωτικών απαιτήσεων για τη χορήγηση πιστοποιητικών (ελάχιστα όρια) σε πλοιάρχους, αξιωματικούς και πληρώματα, ιδίως γι’ αυτά των αναπτυσσόμενων χωρών που βρίσκονταν στο στάδιο της αναπτύξεως των στόλων τους. Η δικαιοδοσία παραμένει στο κράτος της σημαίας του πλοίου, αλλά και το παράκτιο κράτος έχει το δικαίωμα να ασκεί έλεγχο στο αλλοδαπό πλοίο για τα πιστοποιητικά ικανότητας του πληρώματος, όπως ορίζει η εν λόγω Σύμβαση."},{"id":"28717-4.1α","th":"28717","part":"4.1","lab":"α","k":"calc","secs":["Α20"],"p":6,"ctx":"Σχετικά με την υποχρεωτική πλοήγηση των πλοίων:","q":"Ποιος είναι ο ρόλος του πλοηγού;","sol":"Ο πλοηγός είναι ένα εξειδικευμένο πρόσωπο που προσλαμβάνεται από τον Πλοίαρχο, υποχρεωτικά ή προαιρετικά, ανάλογα με τι ισχύει σε κάθε λιμάνι, για την οδήγηση του πλοίου κατά τον είσπλου ή τον έκπλου και κατά τη διέλευση από διώρυγες, στενά ή άλλες επικίνδυνες για τη ναυσιπλοΐα περιοχές. Ο πλοηγός έχει ειδικές γνώσεις για την θαλάσσια περιοχή όπου ασκεί τα καθήκοντα του και είναι πολύτιμος σύμβουλος του Πλοιάρχου.Τυχόν όμως λανθασμένη συμβουλή του πλοηγού ή ενέργεια αυτού, δεν απαλλάσει από την ευθύνη τον Πλοίαρχο, ο οποίος εξακολουθεί να φέρει ακέραια την ευθύνη για την διακυβέρνηση του πλοίου του."},{"id":"28717-4.1β","th":"28717","part":"4.1","lab":"β","k":"calc","secs":["Α20"],"p":9,"ctx":"Σχετικά με την υποχρεωτική πλοήγηση των πλοίων:","q":"Ποια είναι τα πλοία που εξαιρούνται στα ελληνικά λιμάνια;","sol":"Από την υποχρεωτική πλοήγηση στα ελληνικά λιμάνια εξαιρούνται: α. τα ελληνικά ακτοπλοϊκά επιβατικά πλοία που εκτελούν τακτικά δρομολόγια β. τα κάτω από 1000 κ.ο.χ. ελληνικά ακτοπλοϊκά φορτηγά πλοία."},{"id":"28717-4.2","th":"28717","part":"4.2","k":"calc","secs":["Α15.2"],"p":10,"q":"Να αναφέρετε πέντε (5) πειθαρχικά παραπτώματα μελών του πληρώματος.","sol":"α) Η υπαίτια μέθη, εκτός διατεταγμένης υπηρεσίας, που διαταράσσει την επί του πλοίου ευταξία. β) Ο ύπνος κατά την εκτέλεση της υπηρεσίας. γ) Η κατάχρηση του δικαιώματος υποβολής παραπόνων. δ) Η απείθεια σε υπηρεσιακή διαταγή του Πλοιάρχου ή σε πρόσκληση ανωτέρου. ε) Η εκδήλωση ελλείψεως σεβασμού προς τους ανωτέρους. στ) Κάθε παράβαση που αναφέρεται σε κανονισμούς ή σε διαταγή Πλοιάρχου σχετικά με το κάπνισμα σε απαγορευμένους χώρους ή το άναμμα φώτων. ζ) Κάθε αδικαιολόγητη ή χωρίς άδεια απουσία σε ελληνικό λιμάνι ή σε λιμάνι του εξωτερικού. η) Κάθε παράβαση των διατάξεων περί τυχερών παιχνιδιών στο πλοίο. θ) Κάθε πράξη για την οποία απειλείται από τον ποινικό κώδικα πταισματική ποινή."},{"id":"32413-Θα","th":"32413","lab":"α","k":"calc","secs":["Β3.1"],"p":10,"ctx":"Η Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (Convention on the Standards of Training, Certification and Watchkeeping οf Seafarers –STCW) υιοθετήθηκε στις 7 Ιουλίου 1978 και τέθηκε σε ισχύ το 1984. Ένα σημαντικό στοιχείο της STCW 1978 είναι ότι εφαρμόζεται σε πλοία που φέρουν σημαία κράτους το οποίο δεν είναι μέλος της Συμβάσεως, όταν επισκέπτονται λιμάνια παρακτίων κρατών που είναι μέλη της.","q":"Ποιος ήταν ο σκοπός της καταρτίσεως της STCW 78;","sol":"Ο σκοπός της καταρτίσεως της STCW 1978 ήταν (και παραμένει) η καθιέρωση διεθνώς υποχρεωτικών απαιτήσεων για τη χορήγηση πιστοποιητικών (ελάχιστα όρια) σε πλοιάρχους, αξιωματικούς και πληρώματα, ιδίως γι’ αυτά των αναπτυσσομένων χωρών που βρίσκονταν στο στάδιο της αναπτύξεως των στόλων τους. Η δικαιοδοσία παραμένει στο κράτος της σημαίας του πλοίου, αλλά και το παράκτιο κράτος έχει το δικαίωμα να ασκεί έλεγχο στο αλλοδαπό πλοίο για τα πιστοποιητικά ικανότητας του πληρώματος, όπως ορίζει η εν λόγω Σύμβαση."},{"id":"32413-Θβ","th":"32413","lab":"β","k":"calc","secs":["Β3.1"],"p":15,"ctx":"Η Σύμβαση για τα Πρότυπα Πιστοποιητικών Εκπαιδεύσεως και Τηρήσεως Φυλακών των Ναυτικών (Convention on the Standards of Training, Certification and Watchkeeping οf Seafarers –STCW) υιοθετήθηκε στις 7 Ιουλίου 1978 και τέθηκε σε ισχύ το 1984. Ένα σημαντικό στοιχείο της STCW 1978 είναι ότι εφαρμόζεται σε πλοία που φέρουν σημαία κράτους το οποίο δεν είναι μέλος της Συμβάσεως, όταν επισκέπτονται λιμάνια παρακτίων κρατών που είναι μέλη της.","q":"Τι απαιτεί το άρθρο Χ από τα κράτη μέλη;","sol":"Το άρθρο Χ απαιτεί από τα κράτη-μέλη να εφαρμόσουν μέτρα ελέγχου στα πλοία όλων των σημαιών στον βαθμό που είναι αναγκαίο να εξασφαλιστεί ότι δεν θα υπάρξει ευνοϊκότερη μεταχείριση στα πλοία, τα οποία δικαιούνται να υψώνουν σημαία ενός κράτους που δεν ανήκει σε όσα έχουν υπογράψει και επικυρώσει τη Σύμβαση."},{"id":"32414-Θα","th":"32414","lab":"α","k":"calc","secs":["Β4.8"],"p":10,"ctx":"Οι Ηνωμένες Πολιτείες (ΗΠΑ), δυσαρεστημένες από την αδυναμία των διεθνών προτύπων στην πρόληψη της ρύπανσης από τα πλοία, εξέδωσαν το 1990 την \"Oil Pollution Act\" (OPA 90). Ο ΟΡΑ 1990, ο οποίος έγινε Νόμος του κράτους το 1991 και τέθηκε επίσημα σε ισχύ το 1994, είναι αναμφίβολα η πιο σημαντική μονομερής νομοθεσία (unilateral legislation) από την άποψη των λεπτομερέστατων διατάξεων της αλλά περισσότερο για τις επιπτώσεις στη ναυτιλιακή βιομηχανία.","q":"Να αναφέρετε ονομαστικά τα σημεία που ο ΟΡΑ 1990 σαφώς προβλέπει στο σχέδιο για τα Δ/Ξ, τα οποία καταπλέουν σε περιοχές δικαιοδοσίας των ΗΠΑ.","sol":"Τα σημεία που ο ΟΡΑ 1
